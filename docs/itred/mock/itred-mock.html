<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iTred wireframes</title>
<!-- Stage A wireframes only (docs/itred/itred-upgrade-design.md). Sample data is made up; no real customers or vendors. -->
<style>
  :root{--navy:#12243F;--navy-soft:#3A5378;--white:#fff;--offwhite:#F7F4EE;--gold:#C89A4B;--text:#232A35;--soft:#5B6472;--border:rgba(18,36,63,.14);}
  *{box-sizing:border-box}
  body{margin:0;background:#d9dde3;font-family:Inter,system-ui,sans-serif;color:var(--text);display:flex;flex-wrap:wrap;gap:24px;padding:24px}
  .frame{width:390px;height:844px;background:var(--offwhite);position:relative;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.15)}
  .label{position:absolute;top:-1px;left:0;right:0;display:none}
  header{position:absolute;top:0;left:0;right:0;height:56px;background:var(--white);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 4px;gap:4px;z-index:5}
  .logo{display:flex;align-items:center;gap:8px;font-family:Georgia,serif;font-weight:700;color:var(--navy);font-size:17px;flex:1}
  .logo i{width:28px;height:28px;background:var(--navy);color:var(--gold);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:13px}
  .search{position:absolute;top:56px;left:0;right:0;padding:8px 12px;background:rgba(247,244,238,.92);backdrop-filter:blur(6px);z-index:4;display:flex;gap:4px;align-items:center}
  .search .box{flex:1;height:40px;border:1px solid var(--border);background:var(--white);display:flex;align-items:center;gap:8px;padding:0 10px;color:var(--soft);font-size:14px}
  .ib{min-width:44px;min-height:44px;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;background:none;border:0;color:var(--navy);padding:2px 4px;font:inherit}
  .ib svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .ib small{font-size:10.5px;line-height:1.1;margin-top:2px;color:var(--navy-soft)}
  .ib.on{color:var(--gold)}
  .content{position:absolute;top:112px;left:0;right:0;bottom:0;overflow:hidden;padding:0 12px 80px}
  .row{display:flex;gap:10px;align-items:center;background:var(--white);border-bottom:1px solid var(--border);padding:8px 4px 8px 8px;height:72px}
  .row .th{width:56px;height:56px;background:#e9e5dc;flex:none;display:flex;align-items:center;justify-content:center;color:#b5ad9c}
  .row .th.img{background:linear-gradient(135deg,#c9d3e1,#8ea2bf)}
  .row .t{flex:1;min-width:0}
  .row b{display:block;font-size:14.5px;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row span{display:block;font-size:12px;color:var(--soft)}
  .row .p{font-weight:600;color:var(--navy);font-size:13.5px}
  .row.text{height:56px}
  .meta{font-size:12px;color:var(--soft);padding:8px 4px}
  nav.foot{position:absolute;left:8px;right:8px;bottom:10px;height:60px;background:rgba(255,255,255,.78);backdrop-filter:blur(10px);border:1px solid var(--border);border-radius:16px;display:flex;justify-content:space-around;align-items:center;z-index:6}
  .drawer{position:absolute;top:0;left:0;bottom:0;width:290px;background:var(--white);z-index:9;box-shadow:4px 0 18px rgba(0,0,0,.2);padding:12px 0}
  .scrim{position:absolute;inset:0;background:rgba(18,36,63,.35);z-index:8}
  .drawer a{display:flex;align-items:center;gap:14px;padding:0 20px;height:52px;color:var(--navy);font-size:15.5px;text-decoration:none}
  .drawer a svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6}
  .drawer a.on{background:var(--offwhite);border-left:3px solid var(--gold)}
  .drawer hr{border:0;border-top:1px solid var(--border);margin:8px 0}
  .card{background:var(--white);border:1px solid var(--border);padding:12px;margin-bottom:10px}
  .card h4{margin:0;font-size:15px;color:var(--navy)}
  .chip{font-size:11px;padding:2px 8px;border-radius:10px;display:inline-block}
  .ok{background:#e6f4ea;color:#1e6b35}.part{background:#fff4e0;color:#8a5a00}.out{background:#eef0f4;color:#3A5378}
  .line{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:1px dashed var(--border);gap:8px}
  .acts{display:flex;justify-content:flex-end;gap:2px;margin-top:6px}
  h3{font-family:Georgia,serif;color:var(--navy);margin:12px 4px 8px;font-size:19px}
  .app{display:flex;gap:12px;align-items:center}
  .app .ic{width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center;color:var(--navy)}
  .app .ic svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:1.5}
  .kbd{position:absolute;left:0;right:0;bottom:0;height:290px;background:#cfd4dc;z-index:7;display:flex;align-items:center;justify-content:center;color:#666;font-size:13px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></symbol>
  <symbol id="i-store" viewBox="0 0 24 24"><path d="M3 9l1.5-5h15L21 9M4 9v11h16V9M3 9h18M9 20v-6h6v6"/></symbol>
  <symbol id="i-orders" viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6"/></symbol>
  <symbol id="i-vendors" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3 3-5 6-5s6 2 6 5M16 5a3 3 0 010 6M18 15c2 .5 3 2.5 3 5"/></symbol>
  <symbol id="i-apps" viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6"/><rect x="14" y="4" width="6" height="6"/><rect x="4" y="14" width="6" height="6"/><rect x="14" y="14" width="6" height="6"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></symbol>
  <symbol id="i-pic" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-9 8"/></symbol>
  <symbol id="i-text" viewBox="0 0 24 24"><path d="M4 6h16M4 10h16M4 14h16M4 18h10"/></symbol>
  <symbol id="i-add" viewBox="0 0 24 24"><path d="M3 4h2l2 10h10l2-7H6M12 8v4M10 10h4"/><circle cx="9" cy="19" r="1.3"/><circle cx="17" cy="19" r="1.3"/></symbol>
  <symbol id="i-pdf" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></symbol>
  <symbol id="i-share" viewBox="0 0 24 24"><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.2 10.8l7.6-3.6M8.2 13.2l7.6 3.6"/></symbol>
  <symbol id="i-chat" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></symbol>
  <symbol id="i-open" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v6H4V6h6"/></symbol>
  <symbol id="i-install" viewBox="0 0 24 24"><rect x="7" y="2" width="10" height="20" rx="1"/><path d="M12 7v7M9 11l3 3 3-3"/></symbol>
  <symbol id="i-desktop" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12"/><path d="M8 20h8M12 16v4"/></symbol>
  <symbol id="i-phone" viewBox="0 0 24 24"><rect x="7" y="2" width="10" height="20" rx="1"/><path d="M11 18h2"/></symbol>
  <symbol id="i-doc" viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6zM14 3v5h5M9 13h6M9 17h6"/></symbol>
  <symbol id="i-leaf" viewBox="0 0 24 24"><path d="M5 19c0-9 6-14 15-14 0 9-5 15-14 15M5 19l7-7"/></symbol>
  <symbol id="i-place" viewBox="0 0 24 24"><path d="M12 21s7-7.5 7-12a7 7 0 10-14 0c0 4.5 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/></symbol>
</svg>

<template id="hdr"><header><button class="ib" aria-label="Menu"><svg><use href="#i-menu"/></svg></button><div class="logo"><i>iT</i>iTred Market Place</div><button class="ib" aria-label="Account"><svg><use href="#i-user"/></svg></button></header></template>
<template id="foot"><nav class="foot"><button class="ib on" aria-label="Market"><svg><use href="#i-store"/></svg><small>Market</small></button><button class="ib" aria-label="Your orders"><svg><use href="#i-orders"/></svg><small>Orders</small></button><button class="ib" aria-label="Vendors"><svg><use href="#i-vendors"/></svg><small>Vendors</small></button><button class="ib" aria-label="Our apps"><svg><use href="#i-apps"/></svg><small>Apps</small></button><button class="ib" aria-label="Account"><svg><use href="#i-user"/></svg><small>Account</small></button></nav></template>

<!-- 1. Landing: market search, Pictures -->
<div class="frame" id="f-landing"></div>
<!-- 2. Text only -->
<div class="frame" id="f-text"></div>
<!-- 3. Hamburger open -->
<div class="frame" id="f-menu"></div>
<!-- 4. Search typing: keyboard up, footer bar hidden -->
<div class="frame" id="f-keyboard"></div>
<!-- 5. Your Orders -->
<div class="frame" id="f-orders"></div>
<!-- 6. Products (our apps) -->
<div class="frame" id="f-apps"></div>

<script>
const H = document.getElementById("hdr").innerHTML, F = document.getElementById("foot").innerHTML;
const S = (q, view) => `<div class="search"><div class="box"><svg width="18" height="18" style="stroke:currentColor;fill:none;stroke-width:1.6"><use href="#i-search"/></svg>${q||"Search products, vendors, places"}</div>
  <button class="ib ${view==="pic"?"on":""}" aria-label="Pictures"><svg><use href="#i-pic"/></svg><small>Pictures</small></button>
  <button class="ib ${view==="text"?"on":""}" aria-label="Text only"><svg><use href="#i-text"/></svg><small>Text only</small></button></div>`;
const items = [["Ladies denim jacket","Sample Vendor A","Harare","USD 18.00",1],["Cotton T-shirt, plain","Sample Vendor A","Harare","USD 6.50",1],["Brake pads, front set","Sample Motor Spares","Bulawayo","USD 24.00",0],
  ["Tail lamp, left","Sample Motor Spares","Bulawayo","USD 65.00",1],["Cooking oil 2 L","Sample Wholesalers","Mutare","USD 3.90",1],["Sugar 2 kg","Sample Wholesalers","Mutare","USD 2.40",0],
  ["School shoes, size 5","Sample Vendor B","Gweru","USD 15.00",1],["Solar lamp","Sample Vendor C","Masvingo","USD 12.00",1],["Cement 50 kg","Sample Hardware","Chinhoyi","USD 9.80",0],
  ["Paint 5 L, white","Sample Hardware","Chinhoyi","USD 21.00",1],["Rice 5 kg","Sample Wholesalers","Mutare","USD 6.20",1],["Phone charger","Sample Vendor C","Masvingo","USD 4.00",0],["Bucket 20 L","Sample Hardware","Chinhoyi","USD 3.00",1]];
const addBtn = `<button class="ib" aria-label="Add to order"><svg><use href="#i-add"/></svg><small>Add</small></button>`;
const rowPic = ([n,v,c,p,img]) => `<div class="row"><div class="th ${img?"img":""}">${img?"":`<svg width="22" height="22" style="stroke:currentColor;fill:none;stroke-width:1.4"><use href="#i-pic"/></svg>`}</div><div class="t"><b>${n}</b><span>${v} · ${c}</span><span class="p">${p}</span></div>${addBtn}</div>`;
const rowText = ([n,v,c,p]) => `<div class="row text"><div class="t"><b>${n}</b><span>${v} · ${c} · <span class="p" style="display:inline">${p}</span></span></div>${addBtn}</div>`;
document.getElementById("f-landing").innerHTML = H + S("", "pic") + `<div class="content"><div class="meta">24 products from 6 vendors</div>${items.map(rowPic).join("")}</div>` + F;
document.getElementById("f-text").innerHTML = H + S("", "text") + `<div class="content"><div class="meta">Text only: no pictures are downloaded</div>${items.map(rowText).join("")}</div>` + F;
const drawerLinks = [["i-store","Market",1],["i-orders","Your Orders"],["i-vendors","Vendors"],["i-apps","Products (our apps)"],["i-user","Account"],["i-info","About & Privacy"]];
document.getElementById("f-menu").innerHTML = H + S("", "pic") + `<div class="content">${items.slice(0,8).map(rowPic).join("")}</div>` + F +
  `<div class="scrim"></div><div class="drawer"><div class="logo" style="padding:8px 20px 14px"><i>iT</i>iTred Market Place</div>${drawerLinks.map(([i,t,on])=>`<a class="${on?"on":""}"><svg><use href="#${i}"/></svg>${t}</a>`).join("")}<hr><a style="font-size:13px;color:var(--soft);height:40px">Help · Contact · Terms · Become an RPN</a></div>`;
document.getElementById("f-keyboard").innerHTML = H + S("brake front", "pic") + `<div class="content"><div class="meta">1 match · every word, any order</div>${rowPic(items[2])}</div><div class="kbd">on-screen keyboard (footer bar hidden while typing)</div>`;
const status = { ok:"Fulfilled", part:"Partly fulfilled", out:"Outstanding" };
const L = (n, q, amt, s, d) => `<div class="line"><span>${n} × ${q}${d?`<br><small style="color:var(--soft)">${d}</small>`:""}</span><span style="text-align:right">${amt}<br><span class="chip ${s}">${status[s]}</span></span></div>`;
document.getElementById("f-orders").innerHTML = H + `<div class="content" style="top:56px"><h3>Your Orders</h3>
  <div class="card"><div style="display:flex;justify-content:space-between"><div><h4>Sample Motor Spares</h4><span style="font-size:12px;color:var(--soft)">PO-3F9A21C0 · 14 Oct 2026 · Bulawayo</span></div><span class="chip part">Partly fulfilled</span></div>
  ${L("Brake pads, front set","2","USD 48.00","ok","2 of 2 supplied")}${L("Tail lamp, left","1","USD 65.00","out","Vendor: arrives Friday")}${L("Wiper blades (not listed)","2","To quote","part","1 of 2 supplied")}
  <div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px"><b style="color:var(--navy)">Total USD 113.00</b></div>
  <div class="acts"><button class="ib" aria-label="Download PDF"><svg><use href="#i-pdf"/></svg><small>PDF</small></button><button class="ib" aria-label="Share on WhatsApp"><svg><use href="#i-share"/></svg><small>Share</small></button><button class="ib" aria-label="Message the vendor"><svg><use href="#i-chat"/></svg><small>Message</small></button></div></div>
  <div class="card"><div style="display:flex;justify-content:space-between"><div><h4>Sample Vendor A</h4><span style="font-size:12px;color:var(--soft)">PO-77B0E412 · 9 Oct 2026 · Harare</span></div><span class="chip ok">Fulfilled</span></div>
  ${L("Ladies denim jacket","1","USD 18.00","ok")}<div class="acts"><button class="ib" aria-label="Download PDF"><svg><use href="#i-pdf"/></svg><small>PDF</small></button><button class="ib" aria-label="Share on WhatsApp"><svg><use href="#i-share"/></svg><small>Share</small></button><button class="ib" aria-label="Message the vendor"><svg><use href="#i-chat"/></svg><small>Message</small></button></div></div>
  </div>` + F.replace('class="ib on" aria-label="Market"','class="ib" aria-label="Market"').replace('class="ib" aria-label="Your orders"','class="ib on" aria-label="Your orders"');
const apps = [["i-desktop","Desktop App – seiGEN Commerce Lite","Point of sale for a shop, on a PC."],["i-phone","Mobile App – seiGEN Commerce Lite","Point of sale for a shop, on a phone."],["i-store","iTred Market Place","Find vendors' products and send orders."],
  ["i-doc","Invoice Retail","Quotations and invoices."],["i-doc","Invoice Contractors","Quotations and invoices for contractors."],["i-leaf","farmPLAN","Farm planning."]];
document.getElementById("f-apps").innerHTML = H + `<div class="content" style="top:56px"><h3>Our apps</h3>${apps.map(([i,n,d])=>`<div class="card app"><div class="ic"><svg><use href="#${i}"/></svg></div><div style="flex:1;min-width:0"><h4 style="font-size:14px">${n}</h4><span style="font-size:12px;color:var(--soft)">${d}</span></div><button class="ib" aria-label="Open ${n}"><svg><use href="#i-open"/></svg><small>Open</small></button><button class="ib" aria-label="Install ${n}"><svg><use href="#i-install"/></svg><small>Install</small></button></div>`).join("")}<p style="font-size:11.5px;color:var(--soft);margin:4px">Descriptions are placeholders until the owner gives one line each.</p></div>` + F.replace('class="ib on" aria-label="Market"','class="ib" aria-label="Market"').replace('class="ib" aria-label="Our apps"','class="ib on" aria-label="Our apps"');
</script>
</body>
</html>
