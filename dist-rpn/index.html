      return srItem(ICONS.book, c.title, "Chapter " + ch.n + (c.title === ch.title ? "" : " · " + ch.title), 'data-sact="read" data-ch="' + ch.id + '" data-block="' + c.blocks[0] + '"');
    }
    if (doc.kind === "question") {
      return srItem(ICONS.play, questionOf(doc.qid).q, "Practise this question · Chapter " + ch.n, 'data-sact="practise" data-q="' + doc.qid + '"');
    }
    if (doc.kind === "reflection") {
      return srItem(ICONS.pen, doc.fields.prompt, "Write your answer · Chapter " + ch.n, 'data-sact="reflect" data-ch="' + ch.id + '"');
    }
    // A kind added later brings its own way of opening; until then, shown only.
    const first = doc.fields[Object.keys(doc.fields)[0]];
    return '<div class="fg-sr-item"><span class="fg-sr-ic">' + ICONS.search + '</span><span class="fg-sr-txt"><span class="fg-sr-t">' + esc(first) + "</span></span></div>";
  }
  const srStatus = (text) => '<span class="fg-sr-only" role="status">' + esc(text) + "</span>";

  function renderSearchResults() {
    const body = document.getElementById("fgSearchBody");
    const r = searchUi.result;
    body.dataset.q = r ? searchInputEl().value : ""; // which query is on screen (also lets tests wait for it)
    if (!r) {
      body.innerHTML = '<p class="fg-sr-msg">Getting the manual ready…</p>';
      return;
    }
    if (r.state === "empty") {
      let html = "";
      const recent = (coach.progress && coach.progress.recent) || [];
      if (recent.length) {
        html += '<h3 class="fg-sr-h">Recent</h3>' + recent.map((q) => srItem(ICONS.clock, q, "", 'data-sact="query" data-q="' + esc(q) + '"')).join("");
      }
      html += '<h3 class="fg-sr-h">Try asking about</h3>' +
        searchExamples(Math.floor(coachNow() / DAY_MS), 4).map((q) => srItem(ICONS.search, q, "", 'data-sact="query" data-q="' + esc(q) + '"')).join("");
      html += '<p class="fg-sr-msg">Ask in your own words, in any order. Answers are quoted from the RPN Field Manual.</p>';
      body.innerHTML = html;
      return;
    }
    if (r.state === "nomatch") {
      const chapters = r.nearest.length ? r.nearest : COACH.order.slice(0, 3);
      const line = (r.partial ? COACH_LINES.searchNoMatch : COACH_LINES.searchNoWords)[0];
      body.innerHTML = srStatus("No answer in the manual") +
        '<div class="fg-sr-coach fg-sr-none">' + AVATAR + "<p>" + esc(line) + "</p></div>" +
        chapters.map((id) => {
          const ch = chapterOf(id);
          return srItem(chapterIcon(ch), ch.title, "Chapter " + ch.n + " · open the lesson", 'data-sact="lesson" data-ch="' + ch.id + '"');
        }).join("") +
        groupedHtml(r.more);
      return;
    }
    const a = r.answer;
    const ch = chapterOf(a.chapterId);
    const c = conceptOf(a.conceptId);
    const leads = COACH_LINES.searchLead;
    const lead = fillLine(leads[searchUi.leadTurn++ % leads.length], { lesson: conceptLabel(a.conceptId) });
    let html = srStatus("Answer from chapter " + ch.n + ", " + c.title) +
      '<div class="fg-sr-lead ' + trackClass(ch.track) + '">' +
        '<div class="fg-sr-coach">' + AVATAR + "<p>" + esc(lead) + "</p></div>" +
        '<blockquote class="fg-quote">' + a.lines.map((l) => "<p>" + esc(l) + "</p>").join("") + "</blockquote>" +
        '<div class="fg-sr-btns">' +
          '<button type="button" class="btn btn-outline btn-sm" data-sact="read" data-ch="' + ch.id + '" data-block="' + a.block + '">Read in the manual</button>' +
          '<button type="button" class="btn btn-primary btn-sm" data-sact="practise" data-q="' + a.practice.join(",") + '">Practise this (' + a.practice.length + ")</button>" +
        "</div></div>";
    body.innerHTML = html + groupedHtml(r.more);
  }
  // Further results under their group headings, in the order sources were
  // registered (Lessons, Questions, Reflections, then any added later).
  function groupedHtml(docs) {
    let html = "";
    for (const kind of Object.keys(searchUi.index.groups)) {
      const list = (docs || []).filter((d) => d.kind === kind);
      if (list.length) html += '<h3 class="fg-sr-h">' + esc(searchUi.index.groups[kind]) + "</h3>" + list.map(docItem).join("");
    }
    return html;
  }

  // ---------------- acting on a result ----------------
  function recordRecentSearch() {
    const q = searchInputEl().value.replace(/\s+/g, " ").trim();
    if (!q || !coach.progress) return;
    const list = (coach.progress.recent || []).filter((x) => x.toLowerCase() !== q.toLowerCase());
    list.unshift(q);
    coach.progress.recent = list.slice(0, SEARCH_RECENT_MAX);
    saveProgress();
  }
  function onSearchBodyClick(e) {
    const el = e.target.closest("[data-sact]");
    if (!el) return;
    const act = el.dataset.sact;
    if (act === "query") {
      searchInputEl().value = el.dataset.q;
      runSearchNow(false);
      searchInputEl().focus();
      return;
    }
    recordRecentSearch();
    closeSearch(false);
    if (act === "read") location.hash = "#/coach/read/" + el.dataset.ch + "/" + el.dataset.block;
    else if (act === "reflect") location.hash = "#/coach/read/" + el.dataset.ch + "/reflect";
    else if (act === "lesson") location.hash = "#/coach/lesson/" + el.dataset.ch;
    else if (act === "practise") {
      if (!coach.progress) location.hash = "#/coach"; // asks who's learning first
      else startPracticeSession(el.dataset.q.split(","));
    }
  }
  // Enter: the first thing on offer (the answer's "Read in the manual").
  // Arrow keys: move between the input and the results.
  function onSearchKeydown(e) {
    const input = searchInputEl();
    const items = [...document.querySelectorAll("#fgSearchBody [data-sact]")];
    if (e.key === "Enter" && e.target === input) {
      e.preventDefault();
      if (!input.value.trim()) return;
      clearTimeout(searchUi.timer);
      runSearchNow(false);
      const first = document.querySelector("#fgSearchBody [data-sact]");
      if (first && first.dataset.sact !== "query") first.click();
      return;
    }
    if (e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
    const at = e.target === input ? -1 : items.indexOf(e.target);
    const next = e.key === "ArrowDown" ? at + 1 : at - 1;
    e.preventDefault();
    if (next < 0) input.focus();
    else if (items[next]) items[next].focus();
  }

  // ================== RPN Field Guide — Field tab + Console sign-in (Phase 4) ==================
  // Screens:
  //   #/field              onboarding notes, each with its sending status
  //   #/field/new          the onboarding note form
  //   #/field/note/<id>    one note: what was written, where it is, Retry
  // plus the sign-in card on the Me tab (cl_login).
  //
  // Buttons carry data-act "f-…"; app.js sends clicks, submits and typing
  // on #fgMain here (fieldAction / fieldSubmit / fieldInput). What the RPN
  // types into the form lives in field.draft (and on the phone), not in the
  // page: going online or offline, a status change on another note, or
  // leaving the form and coming back never loses it.
  const DRAFT_SAVE_MS = 400;
  let draftTimer = null;

  const STATUS_TEXT = { saved: "Saved on phone", sending: "Sending…", sent: "Sent to Console", failed: "Failed - retry", signin: "Sign in to send" };
  const STATUS_CLASS = { saved: "fg-pill-grey", sending: "fg-pill-grey", sent: "ok", failed: "low", signin: "fg-pill-warn" };
  function noteStatus(note) { return field.sending.has(note.id) ? "sending" : note.status; }
  function statusPill(note) {
    const s = noteStatus(note);
    return '<span class="pill ' + STATUS_CLASS[s] + '">' + esc(STATUS_TEXT[s]) + "</span>";
  }
  const timeOf = (ms) => new Date(ms).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  const dateOf = (key) => { const d = new Date(key + "T00:00:00"); return isNaN(d) ? key : d.toLocaleDateString([], { day: "numeric", month: "short", year: "numeric" }); };

  // Redraw whatever shows notes or the sign-in, but never the form itself.
  // (Only runs after app.js has booted: fieldInit is started from there.)
  // Skipped while anything on the screen holds typing that isn't saved
  // (a box whose text differs from what was drawn, or one being typed in):
  // it catches up on the next change of screen.
  function screenHasTyping(main) {
    const active = document.activeElement;
    if (active && main.contains(active) && /^(INPUT|TEXTAREA|SELECT)$/.test(active.tagName)) return true;
    return [...main.querySelectorAll("input, textarea")].some((el) => el.type !== "hidden" && el.value !== el.defaultValue);
  }
  function refreshFieldScreens() {
    const main = document.getElementById("fgMain");
    if (!main || screenHasTyping(main)) return;
    if ((state.tab === "field" && state.sub[0] !== "new") || state.tab === "me") render(false);
  }
  // The sign-in button and its "needs internet" line, updated in place.
  function patchSignInOnline(online) {
    const btn = document.querySelector("#fgSignin form button[type=submit]");
    if (btn) btn.disabled = !online || field.signin.busy;
    const hint = document.getElementById("fgSigninOffline");
    if (hint) hint.hidden = online;
  }

  // ---------------- list ----------------
  function identityHtml() {
    const now = fieldNow();
    if (!field.identity) {
      return '<div class="card fg-callout-card"><p>Sign in once on this phone with your Console RPN account to start writing onboarding notes.</p>' +
        '<button type="button" class="btn btn-primary btn-sm" data-act="f-go-me">Sign in</button></div>';
    }
    if (!sessionValid(field.session, now)) {
      return '<div class="card fg-callout-card fg-callout-warn"><p><strong>' + esc(field.identity.name) + "</strong>, your sign-in has ended. Notes still save on this phone; sign in again to send them.</p>" +
        '<button type="button" class="btn btn-primary btn-sm" data-act="f-go-me">Sign in to send</button></div>';
    }
    return '<p class="fg-who">Sending as <strong>' + esc(field.identity.name) + "</strong> · signed in until " + esc(timeOf(field.session.exp)) + "</p>";
  }
  function fieldListHtml() {
    const offline = typeof navigator !== "undefined" && navigator.onLine === false;
    const rows = field.notes.map((n) =>
      '<button type="button" class="fg-note-row" data-act="f-open" data-id="' + n.id + '">' +
        '<span class="fg-note-main"><span class="fg-note-t">' + esc(n.fields.business_name) + "</span>" +
        '<span class="fg-note-s">' + esc(n.fields.city + " · " + dateOf(n.fields.visit_date)) + (n.rpnId !== (field.identity && field.identity.rpnId) ? " · " + esc(n.rpnName) : "") + "</span></span>" +
        statusPill(n) + "</button>").join("");
    return (
      '<h1 class="fg-h1" tabindex="-1">Field</h1>' +
      '<p class="fg-lead">Notes for the vendors you visit. They save on this phone first and go to the Console when you\'re online and signed in.</p>' +
      identityHtml() +
      (offline ? '<p class="fg-offline-note" role="status">Offline: new notes wait on this phone.</p>' : "") +
      '<button type="button" class="btn btn-primary fg-newnote" data-act="f-new"' + (field.identity ? "" : " disabled") + ">+ New onboarding note</button>" +
      '<h2 class="fg-sec">Onboarding notes</h2>' +
      (rows ? '<div class="fg-notes">' + rows + "</div>" : '<p class="muted">No notes yet.</p>') +
      '<h2 class="fg-sec">Coming later</h2>' +
      '<div class="card fg-tile"><div class="fg-tile-ic">' + ICONS.tasks + '</div><div class="fg-tile-body"><div class="fg-tile-title">Support tasks</div><div class="fg-tile-sub">Log support work and follow-ups.</div></div><span class="pill fg-pill-grey">Soon</span></div>'
    );
  }

  // ---------------- form ----------------
  function fieldInputHtml(def) {
    const id = "fgNote-" + def.name;
    const value = (field.draft && field.draft[def.name]) || "";
    const err = field.errors[def.name];
    const aria = ' aria-invalid="' + (err ? "true" : "false") + '" aria-describedby="' + id + "-help" + (err ? " " + id + "-err" : "") + '"';
    const common = ' id="' + id + '" name="' + def.name + '" data-act="note-field"' + (def.required ? " required" : "") + aria;
    let control;
    if (def.type === "textarea") {
      control = '<textarea class="field fg-ta"' + common + ' rows="4" maxlength="' + def.max + '">' + esc(value) + "</textarea>";
    } else if (def.type === "choice") {
      control = '<select class="field"' + common + ">" + def.options.map(([v, l]) => '<option value="' + v + '"' + (v === value ? " selected" : "") + ">" + esc(l) + "</option>").join("") + "</select>";
    } else if (def.type === "date") {
      control = '<input class="field" type="date"' + common + ' value="' + esc(value) + '" max="' + localDateKey(fieldNow()) + '">';
    } else if (def.type === "number") {
      control = '<input class="field" type="text" inputmode="numeric" autocomplete="off"' + common + ' value="' + esc(value) + '">';
    } else {
      control = '<input class="field" type="' + (def.type === "tel" ? "tel" : "text") + '"' + common + ' value="' + esc(value) + '"' + (def.max ? ' maxlength="' + def.max + '"' : "") +
        (def.name === "phone" ? ' autocomplete="tel" inputmode="tel"' : ' autocomplete="off"') + ">";
    }
    return '<div class="fg-fld' + (err ? " is-invalid" : "") + '">' +
      '<label class="fg-label" for="' + id + '">' + esc(def.label) + (def.required ? ' <span class="fg-req">required</span>' : "") + "</label>" +
      control +
      '<p class="fg-help" id="' + id + '-help">' + esc(def.hint || "") + "</p>" +
      (err ? '<p class="fg-err" id="' + id + '-err">' + esc(err) + "</p>" : "") + "</div>";
  }
  function fieldFormHtml() {
    if (!field.identity) return fieldListHtml();
    if (!field.draft) field.draft = emptyNoteFields(fieldNow());
    const errorCount = Object.keys(field.errors).length;
    return (
      '<div class="fg-subhead"><button type="button" class="fg-back" data-act="f-back">‹ Field</button></div>' +
      '<h1 class="fg-h1" tabindex="-1">New onboarding note</h1>' +
      '<p class="fg-lead">For a vendor you\'ve just visited. Saved on this phone; sent to the Console as <strong>' + esc(field.identity.name) + "</strong>.</p>" +
      (errorCount ? '<div class="fg-warn fg-errsum" role="alert">Check ' + (errorCount === 1 ? "the field" : "the " + errorCount + " fields") + " marked below.</div>" : "") +
      '<form class="fg-noteform" data-act="f-save" novalidate>' +
        NOTE_FIELDS.slice(0, 6).map(fieldInputHtml).join("") +
        '<h2 class="fg-sec">About the business</h2>' +
        NOTE_FIELDS.slice(6).map(fieldInputHtml).join("") +
        '<div class="fg-formbtns"><button type="button" class="btn btn-outline" data-act="f-clear">Clear form</button>' +
        '<button type="submit" class="btn btn-primary">Save on phone</button></div>' +
      "</form>"
    );
  }

  // ---------------- one note ----------------
  function fieldNoteHtml(id) {
    const n = field.notes.find((x) => x.id === id);
    if (!n) return fieldListHtml();
    const s = noteStatus(n);
    let status = "";
    if (s === "sent") status = "Sent to the Console at " + timeOf(n.sentAt) + ".";
    else if (s === "saved") status = typeof navigator !== "undefined" && navigator.onLine === false ? "Waiting for internet." : "Waiting to send.";
    else if (s === "sending") status = "Sending now…";
    else if (s === "signin") status = field.identity && field.identity.rpnId !== n.rpnId ? "Sign in as " + n.rpnName + " to send this note." : "Sign in to send this note.";
    else {
      const reason = /[.!?]$/.test(n.lastError) ? n.lastError : n.lastError + ".";
      status = reason + (n.permanent ? " It won't be sent again until you tap Retry." : n.nextAttemptAt ? " Trying again at " + timeOf(n.nextAttemptAt) + "." : "");
    }
    const rows = NOTE_FIELDS.filter((d) => n.fields[d.name]).map((d) => {
      let v = n.fields[d.name];
      if (d.type === "choice") v = (d.options.find((o) => o[0] === v) || [v, v])[1];
      if (d.type === "date") v = dateOf(v);
      return '<div class="fg-row"><dt>' + esc(d.label) + "</dt><dd>" + esc(v) + "</dd></div>";
    }).join("");
    return (
      '<div class="fg-subhead"><button type="button" class="fg-back" data-act="f-back">‹ Field</button>' + statusPill(n) + "</div>" +
      '<h1 class="fg-h1" tabindex="-1">' + esc(n.fields.business_name) + "</h1>" +
      '<div class="card fg-status fg-status-' + s + '" role="status"><p>' + esc(status) + "</p>" +
        (s === "failed" ? '<button type="button" class="btn btn-primary btn-sm" data-act="f-retry" data-id="' + n.id + '">Retry now</button>' : "") +
        (s === "signin" ? '<button type="button" class="btn btn-primary btn-sm" data-act="f-go-me">Sign in</button>' : "") +
      "</div>" +
      '<div class="card"><dl class="fg-rows fg-rows-wide">' + rows + "</dl></div>" +
      '<p class="muted">Saved ' + esc(new Date(n.savedAt).toLocaleString()) + " by " + esc(n.rpnName) + ". A sent note can't be changed; Digital Commerce adds the vendor to the Vendors Register from it.</p>"
    );
  }

  function fieldScreen(sub) {
    if (!field.loaded) return '<h1 class="fg-h1" tabindex="-1">Field</h1><p class="fg-lead">Loading…</p>';
    if (sub[0] === "new") return fieldFormHtml();
    if (sub[0] === "note") return fieldNoteHtml(sub[1]);
    return fieldListHtml();
  }

  // ---------------- Me: sign-in ----------------
  const SIGNIN_ERRORS = {
    invalid: "That name and passcode don't match an RPN account.",
    not_rpn: "That isn't an RPN account. The Field Guide is for RPNs.",
    network: "Can't reach the Console. Check the connection and try again.",
    server: "The Console had a problem. Try again in a moment.",
  };
  function signInCardHtml() {
    if (!field.loaded) return "";
    const now = fieldNow();
    if (sessionValid(field.session, now)) {
      return '<div class="card" id="fgSignin"><h2 class="fg-card-title">Console sign-in</h2>' +
        '<p style="margin:0 0 10px">Signed in as <strong>' + esc(field.session.name) + "</strong> until " + esc(timeOf(field.session.exp)) + ".</p>" +
        '<button type="button" class="btn btn-outline btn-sm" data-act="f-signout">Sign out</button></div>';
    }
    const offline = typeof navigator !== "undefined" && navigator.onLine === false;
    const err = field.signin.error ? SIGNIN_ERRORS[field.signin.error] || SIGNIN_ERRORS.server : "";
    return '<div class="card" id="fgSignin"><h2 class="fg-card-title">Console sign-in</h2>' +
      '<p class="muted" style="margin:0 0 8px">' + (field.identity ? "Your sign-in has ended. Sign in again to send notes." : "Your RPN name and passcode for the Commerce Lite Console. Needed to send onboarding notes; it lasts 12 hours.") + "</p>" +
      '<form data-act="f-signin" novalidate>' +
        '<label class="fg-label" for="fgSigninName">Name</label>' +
        '<input class="field" id="fgSigninName" name="name" autocomplete="username" value="' + esc(field.signin.name || (field.identity ? field.identity.name : "")) + '" required>' +
        '<label class="fg-label" for="fgSigninPass">Passcode</label>' +
        '<input class="field" id="fgSigninPass" name="passcode" type="password" autocomplete="current-password" required>' +
        (err ? '<p class="fg-err" role="alert">' + esc(err) + "</p>" : "") +
        '<p class="fg-help" id="fgSigninOffline"' + (offline ? "" : " hidden") + ">Signing in needs internet.</p>" +
        '<button type="submit" class="btn btn-primary" style="margin-top:12px"' + (field.signin.busy || offline ? " disabled" : "") + ">" + (field.signin.busy ? "Signing in…" : "Sign in") + "</button>" +
      "</form></div>";
  }

  // ---------------- events ----------------
  async function fieldAction(act, el) {
    switch (act) {
      case "f-go-me": location.hash = "#/me"; return;
      case "f-new": location.hash = "#/field/new"; return;
      case "f-back": location.hash = "#/field"; return;
      case "f-open": location.hash = "#/field/note/" + el.dataset.id; return;
      case "f-retry": await retryNote(el.dataset.id); render(false); return;
      case "f-clear": {
        const ok = await fgDialog({ title: "Clear the form?", text: "Everything typed into this note is removed. Notes already saved are not affected.", okLabel: "Clear", danger: true });
        if (!ok) return;
        field.draft = emptyNoteFields(fieldNow());
        field.errors = {};
        await storeDelete("meta", "noteDraft");
        render(false);
        return;
      }
      case "f-signout": {
        const waiting = field.notes.filter((n) => n.status !== "sent").length;
        const ok = await fgDialog({
          title: "Sign out?",
          text: waiting ? waiting + " note" + (waiting === 1 ? " is" : "s are") + " not sent yet. They stay on this phone and go when you sign in again." : "You can sign in again any time.",
          okLabel: "Sign out",
        });
        if (!ok) return;
        await signOut();
        render(false);
        return;
      }
    }
  }
  async function fieldSubmit(act, form) {
    if (act === "f-signin") {
      const name = form.elements.name.value.trim();
      const passcode = form.elements.passcode.value;
      if (!name || !passcode) { (name ? form.elements.passcode : form.elements.name).focus(); return; }
      field.signin = { busy: true, error: "", name };
      render(false);
      const r = await signIn(name, passcode);
      field.signin.name = name; // the redrawn form keeps the name typed
      render(false);
      if (!r.ok) { const p = document.getElementById("fgSigninPass"); if (p) p.focus(); }
      return;
    }
    if (act === "f-save") {
      const { fields, errors } = validateNote(field.draft || {}, fieldNow());
      field.errors = errors;
      if (Object.keys(errors).length) {
        render(false);
        const first = NOTE_FIELDS.find((d) => errors[d.name]);
        const el = document.getElementById("fgNote-" + first.name);
        if (el) { el.focus(); el.scrollIntoView({ block: "center" }); }
        return;
      }
      await saveNote(fields);
      field.draft = null;
      field.errors = {};
      clearTimeout(draftTimer);
      await storeDelete("meta", "noteDraft");
      location.hash = "#/field";
    }
  }
  function fieldInput(el) {
    if (el.dataset.act !== "note-field") return;
    if (!field.draft) field.draft = emptyNoteFields(fieldNow());
    field.draft[el.name] = el.value;
    clearTimeout(draftTimer);
    draftTimer = setTimeout(() => { storePut("meta", { key: "noteDraft", value: field.draft }).catch(() => {}); }, DRAFT_SAVE_MS);
  }

  // ================== RPN Field Guide — app shell ==================
  // dist-rpn/ only (build.js --rpn). A separate app for RPN agents, not a
  // package of the shop app: it shares styles.css with it at build time and
  // nothing else (no sql.js, no activation). It runs on its own origin with
  // its own service worker (sw-rpn.js), manifest and icons. build.js wraps
  // this file, store.js, coach-engine.js and coach-ui.js in one IIFE, after
  // the inlined MANUAL and COACH_LINES data; this file is last and boots.
  //

  // Coach is built (coach-ui.js). Field, Receipts and search still say
  // plainly that they aren't built yet; later phases replace them.

  const CACHE_NAME = "seigen-rpn-v1"; // must match sw-rpn.js

  // ---------------- icons (inline SVG, stroke = currentColor) ----------------
  const svg = (body) => '<svg class="fg-svg" viewBox="0 0 24 24" aria-hidden="true" focusable="false">' + body + "</svg>";
  const ICONS = {

    me: svg('<circle class="fg-ic-fill" cx="12" cy="8" r="3.5"/><path class="fg-ic-fill" d="M5 20c0-3.6 3.1-6 7-6s7 2.4 7 6z"/>'),
    search: svg('<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/>'),
    close: svg('<path d="M6 6l12 12M18 6L6 18"/>'),
    back: svg('<path d="M15 5l-7 7 7 7"/>'),

    book: svg('<path class="fg-ic-fill" d="M12 6.5C10 5 7 4.5 4 5v13c3-.5 6 0 8 1.5 2-1.5 5-2 8-1.5V5c-3-.5-6 0-8 1.5z"/><path d="M12 6.5v13"/>'),

    tasks: svg('<path d="M9 6.5h11M9 12h11M9 17.5h11"/><path d="M3.5 6.5l1.5 1.5 2.5-3M3.5 12l1.5 1.5 2.5-3M3.5 17.5l1.5 1.5 2.5-3"/>'),
  };
  const MARK =
    '<svg class="fg-mark" viewBox="0 0 512 512" aria-hidden="true" focusable="false">' +
    '<rect width="512" height="512" rx="104" style="fill:var(--orange)"/>' +
    '<path d="M176 144h160a40 40 0 0 1 40 40v96a40 40 0 0 1-40 40H236l-60 52v-52a40 40 0 0 1-40-40v-96a40 40 0 0 1 40-40z" style="fill:var(--paper)"/>' +
    '<path d="M200 232l40 40 76-80" fill="none" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--ink)"/>' +
    "</svg>";
  // Flat two-tone illustration, coloured from the core tokens.
  const ART_RECEIPT =
    '<svg viewBox="0 0 160 120" aria-hidden="true" focusable="false">' +
    '<circle cx="80" cy="62" r="54" style="fill:var(--orange-light)"/>' +
    '<path d="M56 18h48v86l-8-6-8 6-8-6-8 6-8-6-8 6z" stroke-width="3" stroke-linejoin="round" style="fill:var(--paper);stroke:var(--ink)"/>' +
    '<path d="M66 38h28M66 52h28M66 66h18" stroke-width="5" stroke-linecap="round" style="stroke:var(--orange)"/>' +
    "</svg>";

  const TABS = [
    { key: "coach", label: "Coach" },
    { key: "field", label: "Field" },
    { key: "receipts", label: "Receipts" },
    { key: "me", label: "Me" },
  ];
  const TAB_KEYS = TABS.map((t) => t.key);

  // ---------------- state ----------------
  const state = {
    tab: "coach",
    sub: [], // the rest of the route, e.g. ["lesson", "ch3"] under #/coach/lesson/ch3
    online: typeof navigator === "undefined" || navigator.onLine !== false,
    offlineReady: "checking", // checking | ready | pending | unsupported
    installPrompt: null, // the captured beforeinstallprompt event (single use)
    installed: false,
    updateWorker: null, // a waiting service worker, once one is found
  };
  let reloadRequested = false;

  function escapeHtml(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  function isStandalone() {
    return (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || window.navigator.standalone === true;
  }
  function isIOS() {
    return /iphone|ipad|ipod/i.test(navigator.userAgent || "");
  }
  // "#/coach/lesson/ch3" -> ["coach", "lesson", "ch3"]; anything unknown -> ["coach"].
  function routeParts() {
    const parts = (location.hash || "").replace(/^#\/?/, "").split("/").filter(Boolean);
    return TAB_KEYS.indexOf(parts[0]) !== -1 ? parts : ["coach"];
  }

  // ---------------- frame (mounted once) ----------------
  function mountFrame() {
    const root = document.getElementById("fg");
    root.innerHTML =
      '<header class="fg-top">' +
        MARK +
        '<button type="button" class="fg-searchbtn" id="fgSearchOpen" aria-haspopup="dialog">' + ICONS.search + "<span>Ask or search…</span></button>" +
        '<span class="fg-offline" id="fgOffline" hidden>Offline</span>' +
      "</header>" +
      '<main class="fg-main" id="fgMain" tabindex="-1"></main>' +
      '<nav class="fg-nav" aria-label="Main">' +
        TABS.map((t) => '<button type="button" data-tab="' + t.key + '" id="fgNav-' + t.key + '">' + ICONS[t.key] + "<span>" + t.label + "</span></button>").join("") +
      "</nav>" +
      '<div class="fg-update" id="fgUpdate" role="status" hidden><span>A new version is ready.</span>' +
        '<button type="button" class="btn btn-primary btn-sm" id="fgUpdateReload">Reload</button></div>' +
      '<div class="fg-search" id="fgSearch" role="dialog" aria-modal="true" aria-label="Search" hidden>' +
        '<div class="fg-search-panel">' +
          '<div class="fg-search-row">' +
            '<button type="button" class="fg-iconbtn" id="fgSearchClose" aria-label="Close search">' + ICONS.back + "</button>" +
            '<input id="fgSearchInput" type="search" autocomplete="off" enterkeyhint="search" placeholder="Ask or search…" aria-label="Ask or search" aria-controls="fgSearchBody">' +
            '<button type="button" class="fg-iconbtn" id="fgSearchClear" aria-label="Clear search" hidden>' + ICONS.close + "</button>" +
          "</div>" +
          '<div class="fg-search-body" id="fgSearchBody" aria-live="polite"></div>' +
        "</div>" +
      "</div>" +
      '<div class="fg-modal" id="fgModal" role="dialog" aria-modal="true" aria-labelledby="fgModalTitle" hidden>' +
        '<div class="fg-modal-card">' +
          '<h2 class="fg-modal-title" id="fgModalTitle"></h2>' +
          '<p class="fg-modal-text" id="fgModalText"></p>' +
          '<input class="field" id="fgModalInput" maxlength="40" aria-labelledby="fgModalTitle">' +
          '<div class="fg-modal-btns"><button type="button" class="btn btn-outline btn-sm" id="fgModalCancel">Cancel</button>' +
          '<button type="button" class="btn btn-primary btn-sm" id="fgModalOk">OK</button></div>' +
        "</div>" +
      "</div>";

    // Everything inside the screen area is wired once, here, by data-act:
    // screens are redrawn wholesale, so nothing inside them keeps handlers.
    const main = document.getElementById("fgMain");
    main.addEventListener("click", (e) => {
      const el = e.target.closest("[data-act]");
      if (!el || el.tagName !== "BUTTON" || el.disabled) return;
      if (el.dataset.act.startsWith("f-")) fieldAction(el.dataset.act, el);
      else coachAction(el.dataset.act, el);
    });
    main.addEventListener("submit", (e) => {
      const form = e.target.closest("form[data-act]");
      if (!form) return;
      e.preventDefault();
      if (form.dataset.act.startsWith("f-")) fieldSubmit(form.dataset.act, form);
      else coachSubmit(form.dataset.act, form);
    });
    main.addEventListener("input", (e) => {
      if (!e.target.dataset || !e.target.dataset.act) return;
      if (e.target.dataset.act === "note-field") fieldInput(e.target);
      else coachInput(e.target);
    });

    for (const t of TABS) {
      document.getElementById("fgNav-" + t.key).onclick = () => goTab(t.key);
    }
    document.getElementById("fgSearchOpen").onclick = openSearch;
    document.getElementById("fgSearchClose").onclick = closeSearch;
    document.getElementById("fgSearch").addEventListener("click", (e) => {
      if (e.target.id === "fgSearch") closeSearch(); // tap on the dimmed backdrop
    });
    const searchInput = document.getElementById("fgSearchInput");
    searchInput.addEventListener("input", onSearchInput);
    searchInput.addEventListener("keydown", onSearchKeydown);
    document.getElementById("fgSearchClear").onclick = clearSearch;
    document.getElementById("fgSearchBody").addEventListener("click", onSearchBodyClick);
    document.getElementById("fgSearchBody").addEventListener("keydown", onSearchKeydown);
    document.addEventListener("keydown", (e) => {
      if (e.key !== "Escape") return;
      if (!document.getElementById("fgModal").hidden) closeDialog(null);
      else if (!document.getElementById("fgSearch").hidden) {
        // First Escape clears what was typed (as a search field does), the next one closes.
        const input = document.getElementById("fgSearchInput");
        e.preventDefault();
        if (e.target === input && input.value) clearSearch();
        else closeSearch();
      }
    });
    document.getElementById("fgModalCancel").onclick = () => closeDialog(null);
    document.getElementById("fgModalOk").onclick = () => {
      const input = document.getElementById("fgModalInput");
      closeDialog(input.hidden ? true : input.value);
    };
    document.getElementById("fgModalInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") document.getElementById("fgModalOk").click();
    });
    document.getElementById("fgModal").addEventListener("click", (e) => {
      if (e.target.id === "fgModal") closeDialog(null);
    });
    document.getElementById("fgUpdateReload").onclick = applyUpdate;
  }

  // ---------------- navigation ----------------
  function goTab(key) {
    const parts = routeParts();
    if (parts[0] === key && parts.length === 1 && location.hash) return;
    location.hash = "#/" + key; // hashchange renders, so Back works too
  }
  function onHashChange() {
    const parts = routeParts();
    state.tab = parts[0];
    state.sub = parts.slice(1);
    render(true);
  }

  // ---------------- small dialog (core modal radius) ----------------
  // fgDialog({title, text?, input?, okLabel?, danger?}) resolves to the
  // typed text (with input), true (without), or null when cancelled.
  let dialogResolve = null;
  let dialogReturnFocus = null;
  function fgDialog(opts) {
    if (dialogResolve) closeDialog(null);
    dialogReturnFocus = document.activeElement;
    document.getElementById("fgModalTitle").textContent = opts.title;
    const text = document.getElementById("fgModalText");
    text.textContent = opts.text || "";
    text.hidden = !opts.text;
    const input = document.getElementById("fgModalInput");
    input.hidden = opts.input === undefined;
    input.value = opts.input || "";
    const ok = document.getElementById("fgModalOk");
    ok.textContent = opts.okLabel || "OK";
    ok.className = "btn btn-sm " + (opts.danger ? "btn-danger" : "btn-primary");
    document.getElementById("fgModal").hidden = false;
    (input.hidden ? ok : input).focus();
    return new Promise((resolve) => { dialogResolve = resolve; });
  }
  function closeDialog(value) {
    document.getElementById("fgModal").hidden = true;
    const resolve = dialogResolve;
    dialogResolve = null;
    if (dialogReturnFocus && dialogReturnFocus.isConnected) dialogReturnFocus.focus();
    if (resolve) resolve(value);
  }

  // ---------------- screens ----------------
  function screenCoach() {
    return coachScreen(state.sub);
  }
  function screenField() {
    return fieldScreen(state.sub);
  }
  function screenReceipts() {
    return (
      '<h1 class="fg-h1" tabindex="-1">Receipts</h1>' +
      '<p class="fg-lead">Receipts for subscriptions, stocktakes and other services you provide.</p>' +
      '<div class="fg-hero">' + ART_RECEIPT +
        "<h2>No receipts yet</h2>" +
        "<p>The receipt writer arrives in a later update.</p>" +
      "</div>"
    );
  }
  function offlineReadyText() {
    switch (state.offlineReady) {
      case "ready": return '<span class="pill ok">Ready</span>';
      case "pending": return '<span class="pill fg-pill-warn">Not yet</span>';
      case "unsupported": return '<span class="pill fg-pill-grey">Not available</span>';
      default: return '<span class="pill fg-pill-grey">Checking…</span>';
    }
  }
  function offlineReadyHint() {
    if (state.offlineReady === "pending") return '<p class="muted" style="margin:10px 0 0">Keep the app open while online for a moment, then it works without internet.</p>';
    if (state.offlineReady === "unsupported") return '<p class="muted" style="margin:10px 0 0">Open the app from its web address to use it offline.</p>';
    return "";
  }
  function installCard() {
    let body;
    if (state.installed || isStandalone()) {
      body = '<p class="muted" style="margin:0">Installed on this device.</p>';
    } else if (state.installPrompt) {
      body = '<button type="button" class="btn btn-primary" id="fgInstall">Install RPN Field Guide</button>';
    } else if (isIOS()) {
      body = '<p class="muted" style="margin:0">On iPhone: tap Share, then Add to Home Screen.</p>';
    } else if (location.protocol === "file:") {
      body = '<p class="muted" style="margin:0">Open the app from its web address to install it.</p>';
    } else {
      body = '<p class="muted" style="margin:0">Install isn\'t offered right now. In Chrome, open the ⋮ menu and choose Install app or Add to Home screen.</p>';
    }
    return '<div class="card"><h2 class="fg-card-title">Install</h2>' + body + "</div>";
  }
  function screenMe() {
    return (
      '<h1 class="fg-h1" tabindex="-1">Me</h1>' +
      '<p class="fg-lead">Your Console sign-in, who is learning on this phone, and this app.</p>' +
      signInCardHtml() +
      profilesCardHtml() +
      '<div class="card"><h2 class="fg-card-title">This app</h2><dl class="fg-rows">' +
        '<div class="fg-row"><dt>Connection</dt><dd id="fgConn">' + (state.online ? '<span class="pill ok">Online</span>' : '<span class="pill fg-pill-warn">Offline</span>') + "</dd></div>" +
        '<div class="fg-row"><dt>Works offline</dt><dd id="fgReady">' + offlineReadyText() + "</dd></div>" +
        '<div class="fg-row"><dt>Version</dt><dd>' + escapeHtml(APP_VERSION) + "</dd></div>" +
      "</dl>" + offlineReadyHint() + "</div>" +
      installCard()
    );
  }
  const SCREENS = { coach: screenCoach, field: screenField, receipts: screenReceipts, me: screenMe };

  // navigated: true when the route changed (start at the top, focus the
  // heading); false when the same screen is redrawn after an action.
  function render(navigated) {
    document.getElementById("fgMain").innerHTML = SCREENS[state.tab]();
    if (navigated) {
      window.scrollTo(0, 0);
      const h1 = document.querySelector("#fgMain .fg-h1");
      if (h1) h1.focus({ preventScroll: true });
    }
    if (state.tab === "coach") coachAfterRender(state.sub, !!navigated);
    for (const t of TABS) {
      const btn = document.getElementById("fgNav-" + t.key);
      if (t.key === state.tab) btn.setAttribute("aria-current", "page");
      else btn.removeAttribute("aria-current");
    }
    document.getElementById("fgOffline").hidden = state.online;
    document.getElementById("fgUpdate").hidden = !state.updateWorker;
    const install = document.getElementById("fgInstall");
    if (install) install.onclick = runInstall;
  }

  // (search: search-ui.js)

  // ---------------- install ----------------
  window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault(); // show our own button on Me instead of the browser's timed banner
    state.installPrompt = e;
    if (state.tab === "me") render();
  });
  window.addEventListener("appinstalled", () => {
    state.installPrompt = null;
    state.installed = true;
    if (state.tab === "me") render();
  });
  async function runInstall() {
    const prompt = state.installPrompt;
    if (!prompt) return;
    state.installPrompt = null; // a captured prompt can only be used once
    try {
      prompt.prompt();
      const choice = await prompt.userChoice;
      if (choice && choice.outcome === "accepted") state.installed = true;
    } catch (e) {
      /* dismissed, or no longer installable: the card falls back to the menu hint */
    }
    render();
  }

  // ---------------- offline readiness + updates ----------------
  async function checkOfflineReady() {
    if (location.protocol === "file:" || !("serviceWorker" in navigator) || !("caches" in window)) {
      state.offlineReady = "unsupported";
    } else {
      try {
        const cache = (await caches.has(CACHE_NAME)) ? await caches.open(CACHE_NAME) : null;
        const shell = cache ? await cache.match("./index.html") : null;
        state.offlineReady = navigator.serviceWorker.controller && shell ? "ready" : "pending";
      } catch (e) {
        state.offlineReady = "pending";
      }
    }
    if (state.tab === "me") render();
  }
  function showUpdate(worker) {
    state.updateWorker = worker;
    document.getElementById("fgUpdate").hidden = false;
  }
  function applyUpdate() {
    const worker = state.updateWorker;
    if (!worker) return;
    reloadRequested = true;
    worker.postMessage("SKIP_WAITING"); // controllerchange below does the reload
  }
  function registerWorker() {
    if (location.protocol === "file:" || !("serviceWorker" in navigator)) {
      checkOfflineReady();
      return;
    }
    navigator.serviceWorker.addEventListener("controllerchange", () => {
      // Only reload when the person asked for it. The first install also
      // fires this (clients.claim) and must not reload a page in use.
      if (reloadRequested) location.reload();
      else checkOfflineReady();
    });
    navigator.serviceWorker
      .register("./sw.js", { scope: "./" })
      .then((reg) => {
        if (reg.waiting && navigator.serviceWorker.controller) showUpdate(reg.waiting);
        reg.addEventListener("updatefound", () => {
          const worker = reg.installing;
          if (!worker) return;
          worker.addEventListener("statechange", () => {
            if (worker.state === "installed" && navigator.serviceWorker.controller) showUpdate(worker);
          });
        });
        return navigator.serviceWorker.ready;
      })
      .then(checkOfflineReady)
      .catch(() => {
        state.offlineReady = "pending";
        if (state.tab === "me") render();
      });
  }

  // ---------------- connectivity ----------------
  // Nothing is redrawn wholesale when the connection changes: the few
  // things that show it are updated in place, so a half-typed note,
  // reflection or sign-in is never lost. Then waiting notes get a go.
  function setOnline(online) {
    state.online = online;
    document.getElementById("fgOffline").hidden = online;
    const conn = document.getElementById("fgConn");
    if (conn) conn.innerHTML = online ? '<span class="pill ok">Online</span>' : '<span class="pill fg-pill-warn">Offline</span>';
    patchSignInOnline(online);
    refreshFieldScreens();
    if (online) kickOutbox();
  }
  window.addEventListener("online", () => setOnline(true));
  window.addEventListener("offline", () => setOnline(false));
  // Back to the app after a while: retries that came due, a sign-in that ran out.
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") kickOutbox();
  });

  // ---------------- boot ----------------
  mountFrame();
  {
    const parts = routeParts();
    state.tab = parts[0];
    state.sub = parts.slice(1);
  }
  render(true);
  window.addEventListener("hashchange", onHashChange);
  registerWorker();
  coachInit();
  fieldInit();

})();
</script>
</body>
</html>
