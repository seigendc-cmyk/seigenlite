  function dailyDoneToday(p, now) { return p.daily.last === dayKey(now); }
  function recordDaily(p, now) {
    const today = dayKey(now);
    if (p.daily.last === today) return;
    p.daily.streak = p.daily.last === dayKey(now - DAY_MS) ? p.daily.streak + 1 : 1;
    p.daily.best = Math.max(p.daily.best, p.daily.streak);
    p.daily.last = today;
  }

  // 0..1 for a lesson's ring: the best quiz score once it's done, otherwise
  // how much of it has been read.
  function lessonProgress(p, chapterId) {
    const ch = chapterOf(chapterId);
    const L = p.lessons[chapterId];
    if (L && L.done && L.total) return L.best / L.total;
    const read = ch.concepts.filter((c) => p.read[c.id]).length;
    return ch.concepts.length ? Math.min(0.99, read / ch.concepts.length) * (L ? 1 : 0) : 0;
  }

  // What the home screen suggests next.
  function suggestNext(p) {
    const lastDone = COACH.order
      .map((id) => ({ id, L: p.lessons[id] }))
      .filter((x) => x.L && x.L.done)
      .sort((a, b) => b.L.done - a.L.done)[0];
    if (lastDone && lastDone.L.missed.length && weakQuestions(p).length) return { kind: "review" };
    const next = COACH.order.find((id) => !(p.lessons[id] && p.lessons[id].done));
    if (next) return { kind: "lesson", chapterId: next, started: !!p.lessons[next] };
    return { kind: "daily" };
  }

  // ---------------- teaching content ----------------
  // An idea is shown as its section's blocks, minus the heading (shown as
  // the card title) and minus tips, which are held back as the first
  // "another way" for "I don't understand". A section that is only tips
  // shows them.
  function ideaBlocks(conceptId) {
    const c = conceptOf(conceptId);
    const blocks = c.blocks.map(blockOf).filter((b) => b.type !== "h2");
    const main = blocks.filter((b) => b.type !== "tip");
    return (main.length ? main : blocks).map((b) => b.id);
  }

  // "I don't understand", in order: (1) each tip from the same section not
  // already shown, (2) the section's shortest full sentence. Both are the
  // manual's own words. After that there is nothing simpler in the manual,
  // and the coach says so and points at the nearest other section.
  function simplerOptions(conceptId) {
    const c = conceptOf(conceptId);
    const shown = new Set(ideaBlocks(conceptId));
    const blocks = c.blocks.map(blockOf);
    const out = blocks
      .filter((b) => b.type === "tip" && !shown.has(b.id))
      .map((b) => ({ kind: "tip", block: b.id, parts: b.parts.map((_, i) => i) }));
    const sentences = [];
    for (const b of blocks) {
      if (b.type !== "p") continue;
      b.parts.forEach((s, i) => {
        if (s.length >= 30 && !/:$/.test(s)) sentences.push({ block: b.id, i, s });
      });
    }
    if (sentences.length > 1) {
      const best = sentences.reduce((a, b) => (b.s.length < a.s.length ? b : a));
      out.push({ kind: "line", block: best.block, parts: [best.i] });
    }
    return out;
  }

  const COACH_STOP = new Set("that this with your they their them what when which from have been will would should could about into than then there these those only also just more most much very does doesn while where after before because being other some every each such over under onto upon youre dont isnt thats its".split(" "));
  const conceptWordCache = new Map();
  function conceptWords(conceptId) {
    if (!conceptWordCache.has(conceptId)) {
      const text = conceptOf(conceptId).blocks.map(blockOf)
        .map((b) => b.parts.map((p) => (Array.isArray(p) ? p.join(" ") : p)).join(" ")).join(" ");
      const words = (text.toLowerCase().replace(/[’']/g, "").match(/[a-z0-9]{4,}/g) || []).filter((w) => !COACH_STOP.has(w));
      conceptWordCache.set(conceptId, new Set(words));
    }
    return conceptWordCache.get(conceptId);
  }
  // The other section sharing the most words with this one (at least 3),
  // or null.
  function nearestConcept(conceptId) {
    const mine = conceptWords(conceptId);
    let best = null, bestScore = 2;
    for (const id of COACH.concepts.keys()) {
      if (id === conceptId) continue;
      let score = 0;
      for (const w of conceptWords(id)) if (mine.has(w)) score++;
      if (score > bestScore) { best = id; bestScore = score; }
    }
    return best;
  }

  // ---------------- coach lines ----------------
  function fillLine(text, vars) {
    return text.replace(/\{(\w+)\}/g, (m, k) => (vars && vars[k] !== undefined ? String(vars[k]) : m));
  }
  function coachLine(session, key, vars) {
    const list = COACH_LINES[key];
    const i = session.lineTurns[key] || 0;
    session.lineTurns[key] = i + 1;
    return fillLine(list[i % list.length], vars);
  }
  function lessonLabel(chapterId) {
    const ch = chapterOf(chapterId);
    return "Chapter " + ch.n + ", " + ch.title;
  }
  function conceptLabel(conceptId) {
    const ch = chapterOfConcept(conceptId);
    const c = conceptOf(conceptId);
    return c.title === ch.title ? lessonLabel(ch.id) : lessonLabel(ch.id) + ": " + c.title;
  }

  // ---------------- sessions ----------------
  // A session is the conversation on screen: a list of steps to work
  // through, and a log of what has been said so far. The UI renders the log
  // and offers what `await` says is next: "continue", "answer" or "done".
  function lessonSteps(chapterId) {
    const ch = chapterOf(chapterId);
    const steps = [];
    const asked = new Set();
    for (const c of ch.concepts) {
      steps.push({ kind: "idea", conceptId: c.id });
      const q = ch.questions.find((x) => x.concept === c.id && !asked.has(x.id));
      if (q) { asked.add(q.id); steps.push({ kind: "check", qid: q.id }); }
    }
    steps.push({ kind: "quizIntro" });
    for (const q of ch.questions) steps.push({ kind: "quiz", qid: q.id });
    steps.push({ kind: "finish" });
    return steps;
  }

  function newSession(kind, chapterId) {
    return {
      kind, // "lesson" | "review" | "daily"
      chapterId: chapterId || null,
      steps: [],
      pos: -1,
      log: [],
      await: null,
      current: null, // {conceptId, qid?} the idea "I don't understand" is about
      runRight: 0,
      runWrong: 0,
      results: {}, // qid -> true/false, for the quiz (lesson) or the whole session
      simplerTurns: {},
      lineTurns: {},
    };
  }

  function startLesson(p, chapterId, now) {
    const s = newSession("lesson", chapterId);
    s.steps = lessonSteps(chapterId);
    const L = p.lessons[chapterId] || (p.lessons[chapterId] = { started: now, done: null, best: null, last: null, total: 0, missed: [] });
    if (!L.started) L.started = now;
    s.log.push({ type: "coach", text: coachLine(s, "open", { title: chapterOf(chapterId).title }) });
    advance(s, p, now);
    return s;
  }
  function startReview(p, chapterId, now) {
    const s = newSession("review", chapterId);
    const qids = weakQuestions(p, chapterId);
    s.steps = qids.map((qid) => ({ kind: "review", qid })).concat([{ kind: "finish" }]);
    s.log.push({ type: "coach", text: coachLine(s, qids.length ? "reviewStart" : "reviewEmpty") });
    if (qids.length) advance(s, p, now);
    else s.await = "done";
    return s;
  }
  function startDaily(p, now) {
    const s = newSession("daily");
    const qids = dailyQuestions(p, now);
    s.steps = qids.map((qid) => ({ kind: "daily", qid })).concat([{ kind: "finish" }]);
    const anyStarted = COACH.order.some((id) => p.lessons[id]);
    const opening = qids.length ? "dailyStart" : anyStarted ? "dailyNothingDue" : "dailyEmpty";
    s.log.push({ type: "coach", text: coachLine(s, opening, { n: qids.length }) });
    if (qids.length) advance(s, p, now);
    else s.await = "done";
    return s;
  }

  // A short run of chosen questions (search's "Practise this").
  function startPractice(p, qids, now) {
    const s = newSession("practice");
    const list = qids.filter((id) => COACH.questions.has(id));
    s.steps = list.map((qid) => ({ kind: "practice", qid })).concat([{ kind: "finish" }]);
    s.log.push({ type: "coach", text: coachLine(s, "practiceStart", { n: list.length }) });
    if (list.length) advance(s, p, now);
    else s.await = "done";
    return s;
  }

  function advance(s, p, now) {
    s.pos++;
    const step = s.steps[s.pos];
    if (!step) { s.await = "done"; return; }
    if (step.kind === "idea") {
      if (s.pos > 0) s.log.push({ type: "coach", text: coachLine(s, "idea") });
      s.log.push({ type: "idea", conceptId: step.conceptId, blocks: ideaBlocks(step.conceptId) });
      if (!p.read[step.conceptId]) p.read[step.conceptId] = now;
      s.current = { conceptId: step.conceptId };
      s.await = "continue";
      return;
    }
    if (step.kind === "quizIntro") {
      s.log.push({ type: "coach", text: coachLine(s, "quizStart", { n: chapterOf(s.chapterId).questions.length }) });
      advance(s, p, now);
      return;
    }
    if (step.kind === "finish") { finish(s, p, now); return; }
    // a question: check / quiz / review / daily
    if (step.kind === "check") s.log.push({ type: "coach", text: coachLine(s, "check") });
    s.log.push({ type: "question", qid: step.qid, mode: step.kind, order: optionOrder(p, step.qid), chosen: null });
    s.current = { conceptId: questionOf(step.qid).concept, qid: step.qid };
    s.await = "answer";
  }

  // chosen = the option's index in the manual (not its position on screen).
  function answer(s, p, chosen, now) {
    if (s.await !== "answer") return null;
    const msg = s.log[s.log.length - 1];
    const q = questionOf(msg.qid);
    if (!(chosen >= 0 && chosen < q.opts.length)) return null;
    msg.chosen = chosen;
    const correct = grade(p, msg.qid, chosen, msg.order, now);
    if (msg.mode !== "check") s.results[msg.qid] = correct;
    s.log.push({ type: "me", text: q.opts[chosen] });
    let line;
    if (correct) {
      s.runRight++; s.runWrong = 0;
      line = coachLine(s, "right");
      if (STREAK_MARKS.indexOf(s.runRight) !== -1) line += " " + coachLine(s, "streak", { n: s.runRight });
    } else {
      s.runWrong++; s.runRight = 0;
      line = coachLine(s, "wrong");
    }
    s.log.push({ type: "why", qid: msg.qid, correct, text: line });
    if (!correct && (p.q[msg.qid].wrong >= STUCK_WRONGS || s.runWrong >= STUCK_RUN)) {
      s.log.push({ type: "coach", stuck: true, text: coachLine(s, "stuck") });
    }
    s.await = "continue";
    return correct;
  }

  function cont(s, p, now) {
    if (s.await !== "continue") return;
    advance(s, p, now);
  }

  // "I don't understand" about whatever idea is current.
  function simpler(s) {
    if (!s.current || s.await === "done") return null;
    const cid = s.current.conceptId;
    const options = simplerOptions(cid);
    const turn = s.simplerTurns[cid] || 0;
    s.simplerTurns[cid] = turn + 1;
    let msg;
    if (turn < options.length) {
      const o = options[turn];
      msg = { type: "simpler", conceptId: cid, block: o.block, parts: o.parts, text: coachLine(s, o.kind === "tip" ? "simplerTip" : "simplerLine") };
    } else {
      const near = nearestConcept(cid);
      msg = near
        ? { type: "nearest", conceptId: near, text: coachLine(s, "simplerNearest", { lesson: conceptLabel(near) }) }
        : { type: "coach", text: coachLine(s, "simplerNone") };
    }
    s.log.push(msg);
    return msg;
  }

  function finish(s, p, now) {
    const qids = Object.keys(s.results);
    const score = qids.filter((id) => s.results[id]).length;
    if (s.kind === "lesson") {
      const ch = chapterOf(s.chapterId);
      const total = ch.questions.length;
      const missed = ch.questions.filter((q) => s.results[q.id] === false).map((q) => q.id);
      const L = p.lessons[s.chapterId];
      L.done = now; L.last = score; L.total = total; L.missed = missed;
      L.best = Math.max(L.best || 0, score);
      const key = score === total ? "quizPerfect" : score * 2 >= total ? "quizGood" : "quizLow";
      s.log.push({ type: "result", score, total, text: coachLine(s, key, { score, total }) });
      if (missed.length) {
        const topics = [];
        for (const id of missed) {
          const t = conceptOf(questionOf(id).concept).title;
          if (topics.indexOf(t) === -1) topics.push(t);
        }
        s.log.push({ type: "next", action: "review", chapterId: s.chapterId, text: coachLine(s, "nextReview", { topics: topics.slice(0, 3).join("; ") }) });
      } else {
        const next = COACH.order.find((id) => id !== s.chapterId && !(p.lessons[id] && p.lessons[id].done));
        s.log.push(next
          ? { type: "next", action: "lesson", chapterId: next, text: coachLine(s, "nextLesson", { lesson: lessonLabel(next) }) }
          : { type: "next", action: "daily", text: coachLine(s, "nextAllDone") });
      }
      if (ch.reflections.length) s.log.push({ type: "reflect", chapterId: ch.id });
    } else {
      if (s.kind === "daily") recordDaily(p, now);
      const key = s.kind === "daily" ? "dailyDone" : s.kind === "practice" ? "practiceDone" : "reviewDone";
      s.log.push({ type: "result", score, total: qids.length, text: coachLine(s, key, { score, total: qids.length }) });
    }
    s.current = null;
    s.await = "done";
  }

  // The words of a question's explanation: its source parts, as quoted
  // text, or null for a question marked "no source".
  function sourceQuote(q) {
    if (!q.source) return null;
    const b = blockOf(q.source.block);
    return { block: b.id, chapterId: chapterOfBlock(b.id).id, conceptId: conceptOfBlock(b.id).id, lines: quoteParts(b, q.source.parts) };
  }
  function quoteParts(block, parts) {
    const pick = parts.map((i) => block.parts[i]);
    if (block.type === "p") {
      // Sentences that aren't next to each other in the manual get "…"
      // between them, so a quote never reads as one continuous passage.
      return [pick.reduce((out, s, k) => (k === 0 ? s : out + (parts[k] === parts[k - 1] + 1 ? " " : " … ") + s), "")];
    }
    if (block.type === "table") return pick.map((row) => row.join(" — "));
    return pick;
  }

  // ================== RPN Field Guide — search (Phase 3) ==================
  // Rules only, offline, no LLM. Matches the words of a question against an
  // index of the manual, in any order, and answers by quoting the manual:
  // nothing here writes an answer, it only picks which passage to quote.
  //
  // Not the core app's cart search (utils.js searchTokens/rankProductsBySearch):
  // that is a plain lower-case substring match with no filler words, plurals,
  // typos or synonyms, and reusing it would have meant changing core code.
  // This keeps its two rules (words in any order; rank by how many words
  // matched, title hits first) and adds the rest:
  //   * lower-case, punctuation and apostrophes dropped, simple plurals
  //     removed ("vendors" -> "vendor")
  //   * SEARCH_WORDS (content/synonyms.json): filler words dropped, and each
  //     group of everyday variants read as one word ("stock take" -> stocktake)
  //   * a word the manual doesn't contain is read as the manual word one or
  //     two letters away (typos), or, while typing, the word it starts
  //   * rarer words count for more (inverse document frequency), and where
  //     a word is found counts: section title 3 > chapter title 2.5 >
  //     section text 2 > question or reflection text 1
  //
  // The index is a list of documents from SEARCH_SOURCES. Each source is
  // plain data in, documents out, so later phases can add forms help, the
  // RPN's tasks or receipts with registerSearchSource() and no matcher change.

  const SEARCH_FIELD_WEIGHT = { title: 3, chapter: 2.5, text: 2, question: 1, prompt: 1 };
  const SEARCH_GOOD = 0.6; // share of the question's (weighted) words a result must cover to count as an answer
  const SEARCH_MORE = 5; // further results under the answer

  // ---------------- words ----------------
  function searchStem(w) {
    if (w.length > 4 && w.endsWith("ies")) return w.slice(0, -3) + "y";
    if (w.length > 4 && /(xes|ches|shes|sses)$/.test(w)) return w.slice(0, -2);
    if (w.length > 3 && w.endsWith("s") && !/(ss|us|is)$/.test(w)) return w.slice(0, -1);
    return w;
  }
  function searchRawTokens(text) {
    return String(text || "")
      .toLowerCase()
      .replace(/[’'`]/g, "")
      .replace(/[^a-z0-9]+/g, " ")
      .trim()
      .split(" ")
      .filter(Boolean)
      .map(searchStem);
  }
  // Phrase and word variants -> one canonical word, longest phrase first.
  const SEARCH_LEXICON = (function () {
    const phrases = new Map(); // first token -> [{tokens, canon}]
    for (const group of SEARCH_WORDS.synonyms) {
      const canon = searchRawTokens(group[0]).join(" ");
      for (const variant of group) {
        const tokens = searchRawTokens(variant);
        if (!tokens.length) continue;
        if (!phrases.has(tokens[0])) phrases.set(tokens[0], []);
        phrases.get(tokens[0]).push({ tokens, canon });
      }
    }
    for (const list of phrases.values()) list.sort((a, b) => b.tokens.length - a.tokens.length);
    const filler = new Set(SEARCH_WORDS.filler.map((w) => searchRawTokens(w).join(" ")));
    return { phrases, filler };
  })();
  function searchWords(text) {
    const raw = searchRawTokens(text);
    const out = [];
    for (let i = 0; i < raw.length; ) {
      const options = SEARCH_LEXICON.phrases.get(raw[i]);
      const hit = options && options.find((o) => o.tokens.every((t, k) => raw[i + k] === t));
      if (hit) { out.push(hit.canon); i += hit.tokens.length; continue; }
      if (!SEARCH_LEXICON.filler.has(raw[i])) out.push(raw[i]);
      i++;
    }
    return out;
  }

  // ---------------- sources -> documents ----------------
  // A document: {id, kind, group, fields: {fieldName: text}, ...what to open}.
  const SEARCH_SOURCES = [];
  function registerSearchSource(kind, group, buildDocs) {
    SEARCH_SOURCES.push({ kind, group, buildDocs });
  }
  function conceptText(c) {
    return c.blocks.map(blockOf).filter((b) => b.type !== "h2")
      .map((b) => (b.label ? b.label + " " : "") + b.parts.map((p) => (Array.isArray(p) ? p.join(" ") : p)).join(" "))
      .join(" ");
  }
  // A section that is only a list of the manual's chapters ("1 – Our
  // Ecosystem", "6–7 – Onboarding & Setup") is a table of contents: it
  // mentions everything and answers nothing, so it isn't searched. The
  // chapter titles it lists are indexed in their own right.
  function isContentsSection(c) {
    const blocks = c.blocks.map(blockOf).filter((b) => b.type !== "h2");
    return blocks.length > 0 && blocks.every((b) => b.type === "table" && b.parts.every((row) => /^\d+(\s*[–-]\s*\d+)?\s+[–-]\s/.test(row[0])));
  }
  registerSearchSource("section", "Lessons", () => {
    const docs = [];
    for (const ch of MANUAL.chapters) {
      const track = MANUAL.tracks.find((t) => t.id === ch.track);
      for (const c of ch.concepts) {
        if (isContentsSection(c)) continue;
        docs.push({
          id: c.id, kind: "section", chapterId: ch.id, conceptId: c.id,
          fields: { title: c.title, chapter: ch.title + " " + (track ? track.title : ""), text: conceptText(c) },
        });
      }
    }
    return docs;
  });
  registerSearchSource("question", "Questions", () =>
    MANUAL.chapters.flatMap((ch) => ch.questions.map((q) => ({
      id: q.id, kind: "question", chapterId: ch.id, conceptId: q.concept, qid: q.id,
      fields: { question: q.q + " " + q.opts[q.correct] },
    }))));
  registerSearchSource("reflection", "Reflections", () =>
    MANUAL.chapters.flatMap((ch) => ch.reflections.map((prompt, i) => ({
      id: ch.id + ".r" + i, kind: "reflection", chapterId: ch.id, prompt: i,
      fields: { prompt },
    }))));

  function buildSearchIndex() {
    const docs = [];
    const groups = {};
    for (const src of SEARCH_SOURCES) {
      groups[src.kind] = src.group;
      for (const d of src.buildDocs()) {
        d.group = src.group;
        d.words = {};
        d.all = new Set();
        for (const f of Object.keys(d.fields)) {
          d.words[f] = new Set(searchWords(d.fields[f]));
          for (const w of d.words[f]) d.all.add(w);
        }
        docs.push(d);
      }
    }
    const df = new Map();
    for (const d of docs) for (const w of d.all) df.set(w, (df.get(w) || 0) + 1);
    return { docs, df, groups, n: docs.length };
  }

  // ---------------- query -> words the manual knows ----------------
  function editDistance(a, b, max) {
    if (Math.abs(a.length - b.length) > max) return max + 1;
    let prev = Array.from({ length: b.length + 1 }, (_, j) => j);
    let prev2 = null;
    for (let i = 1; i <= a.length; i++) {
      const cur = [i];
      let best = i;
      for (let j = 1; j <= b.length; j++) {
        const cost = a[i - 1] === b[j - 1] ? 0 : 1;
        let v = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + cost);
        if (prev2 && i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) v = Math.min(v, prev2[j - 2] + 1); // swapped letters
        cur.push(v);
        if (v < best) best = v;
      }
      if (best > max) return max + 1;
      prev2 = prev;
      prev = cur;
    }
    return prev[b.length];
  }
  // Each query word, as the word to look for: itself if the manual has it;
  // else a near spelling (1 letter off from 4 letters, 2 from 8); else, for
  // the word still being typed, the commonest manual word it starts.
  function searchQueryWords(index, query, typing) {
    const words = [...new Set(searchWords(query))];
    return words.map((w, i) => {
      if (index.df.has(w)) return { typed: w, word: w };
      let best = null, bestDf = 0;
      if (w.length >= 4) {
        const max = w.length >= 8 ? 2 : 1;
        for (const [cand, n] of index.df) {
          if (n > bestDf && cand.indexOf(" ") === -1 && editDistance(w, cand, max) <= max) { best = cand; bestDf = n; }
        }
      }
      if (!best && typing && i === words.length - 1 && w.length >= 3) {
        for (const [cand, n] of index.df) if (n > bestDf && cand.startsWith(w)) { best = cand; bestDf = n; }
      }
      return { typed: w, word: best }; // word null: the manual has nothing like it
    });
  }

  // ---------------- scoring ----------------
  function idf(index, w) { return Math.log(1 + index.n / (index.df.get(w) || index.n)); }
  function scoreDoc(index, doc, qwords) {
    let got = 0, total = 0, weighted = 0, hits = 0;
    for (const q of qwords) {
      // A word the manual doesn't have at all counts twice its rarest
      // word: if the manual never mentions it, the manual probably doesn't
      // cover the question ("fix a cracked phone screen" is not the
      // manual's "blank screen").
      const weight = q.word ? idf(index, q.word) : 2 * Math.log(1 + index.n);
      total += weight;
      if (!q.word) continue;
      let best = 0;
      for (const f of Object.keys(doc.words)) if (doc.words[f].has(q.word)) best = Math.max(best, SEARCH_FIELD_WEIGHT[f]);
      if (best) { got += weight; weighted += weight * best; hits++; }
    }
    return { coverage: total ? got / total : 0, weighted, hits };
  }

  // The part of a section that best answers: the sentence, table row, list
  // item or tip line holding the most (and rarest) of the question's words.
  // When the section's own title already holds at least as many of them
  // ("How to end a visit"), the title is the match and the section's
  // opening is the answer. A short sentence brings the next one along.
  // Returned as the same {block, parts} reference the coach uses, so it
  // quotes the same way. score = how much of the question one part holds.
  function bestPassage(index, conceptId, qwords) {
    const c = conceptOf(conceptId);
    const holds = (text) => {
      const words = new Set(searchWords(text));
      let score = 0;
      for (const q of qwords) if (q.word && words.has(q.word)) score += idf(index, q.word);
      return score;
    };
    let best = null, opening = null;
    for (const b of c.blocks.map(blockOf)) {
      if (b.type === "h2") continue;
      b.parts.forEach((part, i) => {
        if (!opening) opening = { block: b.id, i, score: 0 };
        const score = holds(Array.isArray(part) ? part.join(" ") : part);
        if (!best || score > best.score) best = { block: b.id, i, score };
      });
    }
    const titleScore = c.title !== chapterOfConcept(conceptId).title ? holds(c.title) : 0;
    const pick = titleScore > 0 && titleScore >= best.score ? opening : best;
    const b = blockOf(pick.block);
    const parts = [pick.i];
    const text = b.parts[pick.i];
    if (b.type === "p" && typeof text === "string" && text.length < 70 && pick.i + 1 < b.parts.length) parts.push(pick.i + 1);
    return { block: b.id, parts, lines: quoteParts(b, parts), score: Math.max(best.score, titleScore) };
  }

  // Questions to practise for an answer: the ones testing that section,
  // else the rest of its chapter.
  function relatedQuestions(conceptId) {
    const own = (COACH.conceptQuestions.get(conceptId) || []).slice();
    if (own.length) return own;
    return chapterOfConcept(conceptId).questions.map((q) => q.id);
  }

  // query -> {state, answer, more, nearest, words}
  //   state "empty"   : nothing typed (after filler words)
  //   state "answer"  : answer = {conceptId, chapterId, block, parts, lines, practice}
  //   state "nomatch" : nearest = up to 3 chapter ids, partial = some words matched
  function runSearch(index, query, opts) {
    const qwords = searchQueryWords(index, query, opts && opts.typing);
    if (!qwords.length) return { state: "empty", words: [] };
    const scored = index.docs
      .map((doc) => Object.assign({ doc }, scoreDoc(index, doc, qwords)))
      .filter((r) => r.hits > 0)
      .sort((a, b) => b.coverage - a.coverage || b.weighted - a.weighted || a.doc.id.localeCompare(b.doc.id, undefined, { numeric: true }));
    // Among results that cover the question, words found together in one
    // passage (or in the section's title) beat the same words scattered
    // across a long section.
    const good = scored.filter((r) => r.coverage >= SEARCH_GOOD);
    for (const r of good) {
      r.passage = r.doc.kind === "section" ? bestPassage(index, r.doc.conceptId, qwords) : null;
      r.final = r.weighted + (r.passage ? 1.5 * r.passage.score : 0);
    }
    good.sort((a, b) => b.final - a.final || b.coverage - a.coverage || a.doc.id.localeCompare(b.doc.id, undefined, { numeric: true }));
    const words = qwords.map((q) => ({ typed: q.typed, word: q.word }));

    let lead = good.find((r) => r.doc.kind === "section");
    let answer = null;
    if (lead) {
      const p = lead.passage;
      answer = { conceptId: lead.doc.conceptId, chapterId: lead.doc.chapterId, block: p.block, parts: p.parts, lines: p.lines };
    } else {
      // No section covers it, but a question with a source might.
      lead = good.find((r) => r.doc.kind === "question" && questionOf(r.doc.qid).source);
      if (lead) {
        const q = questionOf(lead.doc.qid);
        const b = blockOf(q.source.block);
        answer = { conceptId: q.concept, chapterId: chapterOfBlock(b.id).id, block: b.id, parts: q.source.parts.slice(), lines: quoteParts(b, q.source.parts) };
      }
    }
    if (!answer) {
      const byChapter = new Map();
      for (const r of scored) {
        const s = r.coverage * 10 + r.weighted;
        if (!byChapter.has(r.doc.chapterId) || byChapter.get(r.doc.chapterId) < s) byChapter.set(r.doc.chapterId, s);
      }
      const nearest = [...byChapter.entries()].sort((a, b) => b[1] - a[1]).slice(0, 3).map((e) => e[0]);
      // No manual passage to quote, but other results may still match well
      // (a question with no source; later, the RPN's own tasks): list them.
      return { state: "nomatch", partial: nearest.length > 0, nearest, more: good.slice(0, SEARCH_MORE).map((r) => r.doc), words };
    }
    answer.practice = relatedQuestions(answer.conceptId);
    const more = good
      .filter((r) => r !== lead && !(r.doc.kind === "section" && r.doc.conceptId === answer.conceptId))
      .slice(0, SEARCH_MORE)
      .map((r) => r.doc);
    return { state: "answer", answer, more, words };
  }

  // A few real section titles to try, changing day by day.
  function searchExamples(dayNumber, count) {
    const titles = [];
    for (const ch of MANUAL.chapters) for (const c of ch.concepts) if (c.title !== ch.title) titles.push(c.title);
    const out = [];
    const step = 7;
    for (let k = 0; out.length < Math.min(count, titles.length); k++) {
      const t = titles[(dayNumber * 3 + k * step) % titles.length];
      if (out.indexOf(t) === -1) out.push(t);
    }
    return out;
  }

  // ================== RPN Field Guide — Console connection (Phase 4) ==================
  // The only file that talks to the Console's Supabase project (CONSOLE_URL,
  // CONSOLE_ANON_KEY: injected by build.js from src/devicecheckin.js). Plain
  // fetch() to the REST API, the way the shop app's sync does; no SDK.
  //
  //   consoleSignIn(name, passcode)  -> the existing cl_login RPC (unchanged).
  //       Its 12-hour token carries user_type and sub (= cl_rpn.id); RLS on
  //       rpn_onboarding_notes is built on those. Staff accounts are refused
  //       here: the Field Guide is for RPNs.
  //   consoleSendNote(session, note) -> one insert into rpn_onboarding_notes.
  //
  // Every outcome is sorted into one the outbox can act on:
  //   sent       inserted, or it was already there from an earlier try
  //   auth       the token is expired or refused: "Sign in to send"
  //   failed + permanent  the Console refused the note itself (shown, retried only by hand)
  //   failed     no connection or the server had a problem (retried with backoff)
  const CONSOLE_TIMEOUT_MS = 15000;

  async function consoleFetch(pathAndQuery, opts, token) {
    const ctrl = typeof AbortController !== "undefined" ? new AbortController() : null;
    const timer = ctrl ? setTimeout(() => ctrl.abort(), CONSOLE_TIMEOUT_MS) : null;
    try {
      const res = await fetch(CONSOLE_URL + pathAndQuery, Object.assign({}, opts, {
        signal: ctrl ? ctrl.signal : undefined,
        headers: Object.assign({
          apikey: CONSOLE_ANON_KEY,
          Authorization: "Bearer " + (token || CONSOLE_ANON_KEY),
          "Content-Type": "application/json",
        }, (opts && opts.headers) || {}),
      }));
      const text = await res.text();
      let body = null;
      try { body = text ? JSON.parse(text) : null; } catch (e) { body = { message: text }; }
      return { status: res.status, body };
    } catch (e) {
      return { status: 0, body: null, network: true };
    } finally {
      if (timer) clearTimeout(timer);
    }
  }

  // The middle part of a JWT, decoded. Read only for exp/sub/user_type;
  // the server checks the signature on every request.
  function decodeJwtPayload(token) {
    try {
      const part = String(token).split(".")[1].replace(/-/g, "+").replace(/_/g, "/");
      const padded = part + "===".slice((part.length + 3) % 4);
      const bytes = atob(padded);
      const utf8 = decodeURIComponent(Array.prototype.map.call(bytes, (ch) => "%" + ("0" + ch.charCodeAt(0).toString(16)).slice(-2)).join(""));
      return JSON.parse(utf8);
    } catch (e) {
      return null;
    }
  }

  // -> {ok:true, session:{token, rpnId, name, exp}} or {ok:false, reason, message}
  //    reason: "network" | "invalid" | "not_rpn" | "server"
  async function consoleSignIn(name, passcode) {
    const r = await consoleFetch("/rest/v1/rpc/cl_login", { method: "POST", body: JSON.stringify({ p_name: name, p_passcode: passcode }) });
    if (r.network) return { ok: false, reason: "network" };
    if (r.status === 200 && r.body && r.body.token) {
      const claims = decodeJwtPayload(r.body.token);
      if (!claims || claims.user_type !== "rpn" || !claims.sub || !claims.exp) return { ok: false, reason: "not_rpn" };
      return { ok: true, session: { token: r.body.token, rpnId: claims.sub, name: r.body.full_name || claims.full_name || name, exp: claims.exp * 1000 } };
    }
    const message = (r.body && r.body.message) || "";
    if (/invalid name or passcode/i.test(message)) return { ok: false, reason: "invalid" };
    return { ok: false, reason: "server", message: message || "HTTP " + r.status };
  }

  // The columns the RPN sends. rpn_id is not one of them: the database
  // fills it from the token, and RLS refuses any other value.
  function noteRow(note) {
    const f = note.fields;
    const row = {
      id: note.id,
      business_name: f.business_name, owner_name: f.owner_name, phone: f.phone, city: f.city,
      location: f.location || null, notes: f.notes || null,
      business_type: f.business_type || null, record_keeping: f.record_keeping || null,
      approx_products: f.approx_products === "" || f.approx_products == null ? null : Number(f.approx_products),
      devices: f.devices || null, plan_interest: f.plan_interest || null,
      stocktake_needed: f.stocktake_needed || null,
      visit_date: f.visit_date,
      captured_at: new Date(note.savedAt).toISOString(),
    };
    return row;
  }

  // -> {result:"sent", duplicate?} | {result:"auth"} | {result:"failed", permanent, message}
  async function consoleSendNote(session, note) {
    const r = await consoleFetch("/rest/v1/rpn_onboarding_notes", {
      method: "POST",
      headers: { Prefer: "return=minimal" },
      body: JSON.stringify(noteRow(note)),
    }, session.token);
    if (r.network) return { result: "failed", permanent: false, message: "No connection to the Console" };
    if (r.status === 201 || r.status === 204) return { result: "sent" };
    const code = (r.body && r.body.code) || "";
    const message = (r.body && r.body.message) || "HTTP " + r.status;
    if (r.status === 401 && code !== "42501") return { result: "auth" }; // PGRST301/302: token expired or invalid
    if (code === "42501") return { result: "failed", permanent: true, message: "The Console didn't accept this account for notes (" + message + ")" };
    if (r.status === 409 || code === "23505") {
      // An earlier try got through but its answer was lost. If the note is
      // there and it's this RPN's, it's sent; nothing is inserted twice.
      const check = await consoleFetch("/rest/v1/rpn_onboarding_notes?select=id&id=eq." + encodeURIComponent(note.id), { method: "GET" }, session.token);
      if (check.status === 200 && Array.isArray(check.body) && check.body.length === 1) return { result: "sent", duplicate: true };
      if (check.network || check.status >= 500) return { result: "failed", permanent: false, message: "Couldn't confirm with the Console" };
      return { result: "failed", permanent: true, message: "The Console already has a different note with this id" };
    }
    if (r.status >= 500 || r.status === 429 || r.status === 408) return { result: "failed", permanent: false, message: "The Console had a problem (" + r.status + ")" };
    return { result: "failed", permanent: true, message: "The Console refused this note: " + message };
  }

  // ================== RPN Field Guide — onboarding notes outbox (Phase 4) ==================
  // Notes are saved on the phone first (IndexedDB "notes" store, store.js)
  // and sent to the Console when the phone is online AND the RPN is signed
  // in. Nothing is dropped: a note leaves this list only by being sent.
  //
  // Each note's status, shown on screen:
  //   saved    "Saved on phone"   waiting for a connection / its turn
  //   sending  "Sending…"         (in memory only, while a request is out)
  //   sent     "Sent to Console"
  //   failed   "Failed - retry"   with the reason; a passing problem (no
  //            connection, server error) is tried again on the same backoff
  //            as the shop app's sync (sync.js: 5 s, doubling, at most
  //            30 min), and the next try time is shown. A note the Console
  //            refused is not retried until the RPN taps Retry.
  //   signin   "Sign in to send"  no sign-in, it has run out (12 hours), or
  //            a different RPN is signed in on this phone
  //
  // A note belongs to the RPN who was signed in on this phone when it was
  // saved (their id and name stay with it, even after the sign-in runs
  // out), and is only ever sent with that RPN's own sign-in.
  const OUTBOX_BASE_DELAY_MS = 5000; // = SYNC_BASE_DELAY_MS in src/sync.js
  const OUTBOX_MAX_DELAY_MS = 30 * 60 * 1000; // = SYNC_MAX_DELAY_MS
  const SESSION_MARGIN_MS = 60 * 1000; // treat a token this close to expiry as expired
  function outboxBackoffMs(attempts) {
    return Math.min(OUTBOX_MAX_DELAY_MS, OUTBOX_BASE_DELAY_MS * Math.pow(2, Math.max(0, attempts - 1)));
  }

  // ---------------- the form's fields (mirror the database's checks) ----------------
  const NOTE_FIELDS = [
    { name: "business_name", label: "Business name", required: true, max: 120 },
    { name: "owner_name", label: "Owner's name", required: true, max: 120 },
    { name: "phone", label: "Phone (WhatsApp)", required: true, type: "tel", hint: "e.g. 0771 234 567" },
    { name: "city", label: "City or town", required: true, max: 80 },
    { name: "location", label: "Area or street", max: 200 },
    { name: "visit_date", label: "Date of visit", required: true, type: "date" },
    { name: "business_type", label: "Type of business", max: 80, hint: "e.g. grocery, hardware, salon" },
    { name: "record_keeping", label: "How they keep records now", max: 200, hint: "e.g. exercise book, Excel, nothing" },
    { name: "approx_products", label: "About how many products", type: "number" },
    { name: "devices", label: "Phones or computers they have", max: 200 },
    { name: "plan_interest", label: "Subscription they're interested in", max: 200, hint: "Their words. Prices are set by Digital Commerce." },
    { name: "stocktake_needed", label: "Do they need a stocktake?", type: "choice", options: [["", "Not asked"], ["yes", "Yes"], ["no", "No"], ["not_sure", "Not sure"]] },
    { name: "notes", label: "Notes", max: 4000, type: "textarea" },
  ];
  const PHONE_RULE = /^\+?[0-9][0-9 ]{6,19}$/; // = rpn_onboarding_notes_phone_check

  function localDateKey(ms) {
    const d = new Date(ms);
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  function emptyNoteFields(now) {
    const f = {};
    for (const def of NOTE_FIELDS) f[def.name] = "";
    f.visit_date = localDateKey(now);
    return f;
  }
  // Zimbabwe by default, the same rule as the RPN Field Manual's trainer
  // number: "0771…" and "771…" become +263771…
  function normalizePhone(raw) {
    const s = String(raw || "").trim();
    const plus = s.startsWith("+");
    let digits = s.replace(/[^0-9]/g, "");
    if (!digits) return "";
    if (!plus) {
      if (digits.charAt(0) === "0") digits = "263" + digits.slice(1);
      else if (digits.length <= 9) digits = "263" + digits;
    }
    return "+" + digits;
  }
  // -> {fields (cleaned), errors: {name: message}}
  function validateNote(input, now) {
    const f = {};
    const errors = {};
    for (const def of NOTE_FIELDS) {
      const raw = input[def.name] == null ? "" : String(input[def.name]);
      const value = def.type === "textarea" ? raw.trim() : raw.replace(/\s+/g, " ").trim();
      f[def.name] = value;
      if (def.required && !value) { errors[def.name] = def.label + " is needed."; continue; }
      if (def.max && value.length > def.max) errors[def.name] = "Keep it under " + def.max + " characters.";
    }
    if (f.phone && !errors.phone) {
      const p = normalizePhone(f.phone);
      const digits = p.replace(/[^0-9]/g, "");
      if (!PHONE_RULE.test(p) || digits.length < 9 || digits.length > 15) errors.phone = "Enter a phone number, e.g. 0771 234 567.";
      else f.phone = p;
    }
    if (f.approx_products !== "") {
      const n = Number(f.approx_products);
      if (!/^[0-9]+$/.test(f.approx_products) || n > 1000000) errors.approx_products = "A whole number, 0 to 1,000,000.";
    }
    if (f.stocktake_needed && ["yes", "no", "not_sure"].indexOf(f.stocktake_needed) === -1) errors.stocktake_needed = "Choose one.";
    if (f.visit_date && !errors.visit_date) {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(f.visit_date) || isNaN(new Date(f.visit_date + "T00:00:00").getTime())) errors.visit_date = "Enter the date of the visit.";
      else if (f.visit_date > localDateKey(now)) errors.visit_date = "The visit date can't be in the future.";
    }
    return { fields: f, errors };
  }

  // ---------------- state ----------------
  const field = {
    loaded: false,
    session: null, // {token, rpnId, name, exp} from cl_login, while it lasts
    identity: null, // {rpnId, name}: the RPN signed in on this phone (kept after the token runs out)
    notes: [], // newest first
    sending: new Set(), // note ids with a request out
    draft: null, // the form's values, kept while typing, across screens and reloads
    errors: {},
    signin: { busy: false, error: "" },
    running: false,
    again: false,
    current: null, // the promise of the run in progress
    timer: null,
  };
  const fieldNow = () => Date.now();

  function sessionValid(s, now) { return !!(s && s.token && s.exp - SESSION_MARGIN_MS > now); }
  function canSend(note, now) { return sessionValid(field.session, now) && field.session.rpnId === note.rpnId; }

  async function fieldInit() {
    await storeInit();
    try {
      const [session, identity, draft] = await Promise.all([storeGet("meta", "consoleSession"), storeGet("meta", "consoleIdentity"), storeGet("meta", "noteDraft")]);
      field.session = session ? session.value : null;
      field.identity = identity ? identity.value : null;
      field.draft = draft ? draft.value : null;
      field.notes = (await storeGetAll("notes")).sort((a, b) => b.savedAt - a.savedAt);
    } catch (e) { /* storage refused: start empty; storeMode says "memory" */ }
    // A note that was mid-send when the app closed is simply waiting again.
    for (const n of field.notes) if (n.status === "sending") n.status = "saved";
    field.loaded = true;
    // The screen drawn at boot said "Loading…": draw it properly once,
    // whichever it is (the form included; refreshFieldScreens skips that).
    if (state.tab === "field" || state.tab === "me") render(true);
    kickOutbox();
  }

  async function putNote(note) {
    await storePut("notes", note);
    const i = field.notes.findIndex((n) => n.id === note.id);
    if (i === -1) field.notes.unshift(note);
    else field.notes[i] = note;
  }
  function newNoteId() {
    if (typeof crypto !== "undefined" && crypto.randomUUID) return crypto.randomUUID();
    const b = new Uint8Array(16);
    crypto.getRandomValues(b);
    b[6] = (b[6] & 0x0f) | 0x40; b[8] = (b[8] & 0x3f) | 0x80;
    const h = Array.from(b, (x) => x.toString(16).padStart(2, "0")).join("");
    return h.slice(0, 8) + "-" + h.slice(8, 12) + "-" + h.slice(12, 16) + "-" + h.slice(16, 20) + "-" + h.slice(20);
  }
  // Saved on the phone straight away, then queued. Needs to know who the
  // RPN is (signed in at least once on this phone).
  async function saveNote(fields) {
    const now = fieldNow();
    const note = {
      id: newNoteId(), rpnId: field.identity.rpnId, rpnName: field.identity.name,
      fields, savedAt: now, status: "saved", attempts: 0, nextAttemptAt: now, permanent: false, lastError: "", sentAt: null,
    };
    await putNote(note);
    kickOutbox();
    return note;
  }

  // ---------------- sign-in ----------------
  async function signIn(name, passcode) {
    field.signin = { busy: true, error: "", name };
    const r = await consoleSignIn(name, passcode);
    if (!r.ok) {
      field.signin = { busy: false, error: r.reason, name };
      return r;
    }
    field.session = r.session;
    field.identity = { rpnId: r.session.rpnId, name: r.session.name };
    field.signin = { busy: false, error: "", name: "" };
    await storePut("meta", { key: "consoleSession", value: field.session });
    await storePut("meta", { key: "consoleIdentity", value: field.identity });
    // Notes waiting for this RPN's sign-in can go now.
    for (const n of field.notes) {
      if (n.status === "signin" && n.rpnId === r.session.rpnId) {
        Object.assign(n, { status: "saved", nextAttemptAt: fieldNow() });
        await storePut("notes", n);
      }
    }
    kickOutbox();
    return r;
  }
  // Forgets this phone's sign-in and who the RPN is. Notes stay, with
  // their RPN, until that RPN signs in again and they can be sent.
  async function signOut() {
    field.session = null;
    field.identity = null;
    await storeDelete("meta", "consoleSession");
    await storeDelete("meta", "consoleIdentity");
    refreshFieldScreens();
  }

  // ---------------- sending ----------------
  // One run at a time: asking again while a run is going makes that run
  // go round once more (field.again) instead of starting a second one, so
  // a note is never sent twice in parallel. Returns the run's promise.
  function kickOutbox() {
    if (field.running) { field.again = true; return field.current; }
    if (!field.loaded) return Promise.resolve();
    clearTimeout(field.timer);
    field.running = true;
    field.current = runOutbox();
    return field.current;
  }
  function outboxIdle() { return field.running ? field.current : Promise.resolve(); }
  async function runOutbox() {
    try {
      do {
        field.again = false;
        await outboxPass();
      } while (field.again);
    } finally {
      field.running = false;
    }
    scheduleOutbox();
  }
  async function outboxPass() {
    if (typeof navigator !== "undefined" && navigator.onLine === false) return; // waiting for a connection: statuses stay as they are
    const queue = field.notes
      .filter((n) => n.status === "saved" || n.status === "signin" || (n.status === "failed" && !n.permanent))
      .sort((a, b) => a.savedAt - b.savedAt);
    for (const note of queue) {
      const now = fieldNow();
      if (note.status === "failed" && note.nextAttemptAt > now) continue;
      if (!canSend(note, now)) {
        if (note.status !== "signin") { note.status = "signin"; await storePut("notes", note); refreshFieldScreens(); }
        continue;
      }
      field.sending.add(note.id);
      refreshFieldScreens();
      const res = await consoleSendNote(field.session, note);
      field.sending.delete(note.id);
      const after = fieldNow();
      if (res.result === "sent") {
        Object.assign(note, { status: "sent", sentAt: after, lastError: "", permanent: false, nextAttemptAt: null });
      } else if (res.result === "auth") {
        // The Console no longer accepts this sign-in: stop, keep everything.
        field.session = null;
        await storeDelete("meta", "consoleSession");
        Object.assign(note, { status: "signin" });
      } else {
        note.attempts++;
        Object.assign(note, {
          status: "failed", lastError: res.message, permanent: !!res.permanent,
          nextAttemptAt: res.permanent ? null : after + outboxBackoffMs(note.attempts),
        });
      }
      await storePut("notes", note);
      refreshFieldScreens();
      if (res.result === "auth") field.again = true; // so every other note shows "Sign in to send" too
      if (res.result === "failed" && !res.permanent) break; // no connection: don't hammer with the rest
    }
  }
  // Wake up for the next due retry, or when the sign-in runs out.
  function scheduleOutbox() {
    clearTimeout(field.timer);
    const now = fieldNow();
    const due = field.notes.filter((n) => n.status === "failed" && !n.permanent && n.nextAttemptAt).map((n) => n.nextAttemptAt);
    if (field.session && field.notes.some((n) => n.status === "saved")) due.push(field.session.exp - SESSION_MARGIN_MS);
    if (!due.length) return;
    const wait = Math.max(1000, Math.min.apply(null, due) - now);
    field.timer = setTimeout(kickOutbox, Math.min(wait, OUTBOX_MAX_DELAY_MS));
  }
  // Retry now: also for a note the Console refused (the RPN decides).
  async function retryNote(id) {
    const note = field.notes.find((n) => n.id === id);
    if (!note || note.status === "sent") return;
    Object.assign(note, { status: "saved", nextAttemptAt: fieldNow(), permanent: false });
    await storePut("notes", note);
    kickOutbox();
  }

  // ================== RPN Field Guide — Coach tab + learner profiles (Phase 2) ==================
  // Screens (all under #/coach):
  //   #/coach                      home: daily practice, weak spots, suggested next, lessons by track
  //   #/coach/lesson/<ch>          the coach conversation for one chapter
  //   #/coach/read/<ch>[/<block>]  the chapter as written, opened at a block
  //   #/coach/review[/<ch>]        weak-spot review;  #/coach/daily  today's practice
  // plus the "Learners on this phone" card on the Me tab.
  //
  // Every button carries data-act; app.js routes clicks, form submits and
  // typing on #fgMain to coachAction/coachSubmit/coachInput below, so a
  // re-render never needs re-wiring. The conversation itself is the
  // engine's session log (coach-engine.js): this file only draws it.
  //
  // Learners are local to this phone (store.js). They are not the RPN's
  // Console identity; sign-in comes in a later phase.

  const coach = {
    loaded: false,
    profiles: [],
    activeId: null,
    progress: null,
    sessions: new Map(), // "lesson:ch3" | "review" | "daily" -> engine session (this learner only)
    seen: new Map(), // session key -> log length already drawn, to scroll to what's new
    saveChain: Promise.resolve(),
    saveFailed: false,
  };
  const REFLECT_SAVE_MS = 400;
  let reflectTimer = null;

  const coachNow = () => Date.now();

  // ---------------- profiles + progress ----------------
  async function coachInit() {
    await storeInit();
    try {
      coach.profiles = (await storeGetAll("profiles")).sort((a, b) => a.created - b.created);
      const meta = await storeGet("meta", "activeProfileId");
      const active = meta && coach.profiles.find((p) => p.id === meta.value);
      if (active) await activateProfile(active.id, false);
    } catch (e) {
      coach.saveFailed = true;
    }
    coach.loaded = true;
    render(true); // the screen drawn at boot was only "Loading…"
  }
  function activeProfile() { return coach.profiles.find((p) => p.id === coach.activeId) || null; }

  async function activateProfile(id, remember) {
    const stored = await storeGet("progress", id);
    coach.progress = Object.assign(newProgress(id), stored || {});
    coach.activeId = id;
    coach.sessions.clear(); // a conversation belongs to the learner who had it
    coach.seen.clear();
    if (remember !== false) await storePut("meta", { key: "activeProfileId", value: id });
  }
  async function createProfile(name) {
    const profile = { id: "p_" + coachNow().toString(36) + Math.random().toString(36).slice(2, 7), name, created: coachNow() };
    await storePut("profiles", profile);
    coach.profiles.push(profile);
    await activateProfile(profile.id);
    saveProgress();
  }
  function saveProgress() {
    const snapshot = coach.progress;
    coach.saveChain = coach.saveChain
      .then(() => storePut("progress", snapshot))
      .then(() => { coach.saveFailed = false; })
      .catch(() => { coach.saveFailed = true; });
    return coach.saveChain;
  }
  const cleanName = (s) => String(s || "").replace(/\s+/g, " ").trim().slice(0, 40);

  // ---------------- small renderers ----------------
  const esc = escapeHtml;
  function trackClass(trackId) {
    const i = visibleTracks().findIndex((t) => t.id === trackId);
    return "fg-t" + ((i < 0 ? 0 : i) % 5 + 1);
  }
  function chapterIcon(ch) {
    return '<svg class="fg-chicon" viewBox="0 0 64 64" fill="none" aria-hidden="true" focusable="false">' + ch.icon + "</svg>";
  }
  function ring(frac, inner, label) {
    const r = 21, c = 2 * Math.PI * r;
    const off = c * (1 - Math.max(0, Math.min(1, frac)));
    return (
      '<span class="fg-ring"' + (label ? ' role="img" aria-label="' + esc(label) + '"' : ' aria-hidden="true"') + ">" +
      '<svg viewBox="0 0 48 48" focusable="false"><circle cx="24" cy="24" r="' + r + '" class="fg-ring-bg"/>' +
      '<circle cx="24" cy="24" r="' + r + '" class="fg-ring-fg" stroke-dasharray="' + c.toFixed(2) + '" stroke-dashoffset="' + off.toFixed(2) + '" transform="rotate(-90 24 24)"/></svg>' +
      '<span class="fg-ring-in">' + inner + "</span></span>"
    );
  }
  const anchorId = (blockId) => "blk-" + blockId.replace(".", "-");
  function blockHtml(b, withAnchor) {
    const id = withAnchor ? ' id="' + anchorId(b.id) + '"' : "";
    switch (b.type) {
      case "p": return '<p class="fg-mp"' + id + ">" + esc(b.parts.join(" ")) + "</p>";
      case "h2": return '<h3 class="fg-mh"' + id + ">" + esc(b.parts[0]) + "</h3>";
      case "list": {
        const tag = b.ordered ? "ol" : "ul";
        return "<" + tag + ' class="fg-mlist"' + id + ">" + b.parts.map((t) => "<li>" + esc(t) + "</li>").join("") + "</" + tag + ">";
      }
      case "table":
        return (
          '<div class="fg-mtable-wrap"' + id + '><table class="fg-mtable">' +
          (b.head.length ? "<thead><tr>" + b.head.map((h) => "<th>" + esc(h) + "</th>").join("") + "</tr></thead>" : "") +
          "<tbody>" + b.parts.map((row) => "<tr>" + row.map((c) => "<td>" + esc(c) + "</td>").join("") + "</tr>").join("") + "</tbody></table></div>"
        );
      default: // tip / dont / say
        return (
          '<div class="fg-callout fg-callout-' + b.type + '"' + id + '><div class="fg-callout-label">' + esc(b.label) + "</div>" +
          b.parts.map((t) => "<p>" + esc(t) + "</p>").join("") + "</div>"
        );
    }
  }
  function readLink(chapterId, blockId, label) {
    return '<button type="button" class="fg-link" data-act="read" data-ch="' + chapterId + '"' + (blockId ? ' data-block="' + blockId + '"' : "") + ">" + esc(label) + "</button>";
  }
  function quoteHtml(lines, blockId) {
    const ch = chapterOfBlock(blockId);
    const c = conceptOfBlock(blockId);
    return (
      '<blockquote class="fg-quote">' + lines.map((l) => "<p>" + esc(l) + "</p>").join("") + "</blockquote>" +
      '<div class="fg-quote-src"><span>' + esc("Chapter " + ch.n + (c && c.title !== ch.title ? " · " + c.title : "")) + "</span>" +
      readLink(ch.id, blockId, "Read in the manual") + "</div>"
    );
  }
  const AVATAR = '<span class="fg-avatar" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><path d="M6.5 4h11A2.5 2.5 0 0 1 20 6.5v7a2.5 2.5 0 0 1-2.5 2.5H11l-4.5 4v-4A2.5 2.5 0 0 1 4 13.5v-7A2.5 2.5 0 0 1 6.5 4z"/></svg></span>';
  const coachBubble = (inner, i, extra) => '<div class="fg-msg fg-msg-coach' + (extra || "") + '" data-i="' + i + '">' + AVATAR + '<div class="fg-bubble">' + inner + "</div></div>";

  // ---------------- home ----------------
  function setupCardHtml() {
    return (
      '<h1 class="fg-h1" tabindex="-1">Coach</h1>' +
      '<p class="fg-lead">Short lessons from the RPN Field Manual, a question after each idea, and practice that comes back to what you miss.</p>' +
      '<form class="card fg-setup" data-act="create-profile">' +
        '<h2 class="fg-card-title">Who is learning on this phone?</h2>' +
        '<label class="fg-label" for="fgNewName">Your name</label>' +
        '<input class="field" id="fgNewName" name="name" maxlength="40" autocomplete="name" required>' +
        '<p class="muted" style="margin:8px 0 12px">Progress stays on this phone. You can add other learners later under Me.</p>' +
        '<button type="submit" class="btn btn-primary">Start</button>' +
      "</form>"
    );
  }
  const FLAME = '<svg class="fg-svg" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path class="fg-ic-fill" d="M12 3c1 3.5 5 5.5 5 10a5 5 0 0 1-10 0c0-2.5 1.5-4 2.5-5 .3 2 1.3 3 2.5 3.5C12 9 11 6 12 3z"/></svg>';
  const TARGET = '<svg class="fg-svg" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle class="fg-ic-fill" cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><path d="M12 12l6-6M15 6h3v3"/></svg>';
  const CHEVRON = '<svg class="fg-svg fg-chev" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 6l6 6-6 6"/></svg>';

  function homeHtml() {
    const p = coach.progress;
    const prof = activeProfile();
    const now = coachNow();
    const daily = dailyQuestions(p, now);
    const anyStarted = COACH.order.some((id) => p.lessons[id]);
    const streakAlive = p.daily.streak > 0 && (p.daily.last === dayKey(now) || p.daily.last === dayKey(now - DAY_MS));
    const weak = weakQuestions(p);
    const next = suggestNext(p);

    let html =
      '<h1 class="fg-h1" tabindex="-1">Coach</h1>' +
      '<p class="fg-lead">Hi, ' + esc(prof.name) + '. <button type="button" class="fg-link" data-act="go-me">Not you?</button></p>';
    if (storeMode === "memory" || coach.saveFailed) {
      html += '<div class="fg-warn" role="status">This browser isn\'t keeping progress. It will be lost when the app closes.</div>';
    }
    html += '<div class="fg-grid2">' +
      '<div class="card fg-stat"><div class="fg-stat-ic fg-t1">' + FLAME + "</div>" +
        '<div class="fg-stat-title">Daily practice</div>' +
        '<div class="fg-stat-sub" id="fgStreak">' + (dailyDoneToday(p, now) ? "Done today · " : "") + (streakAlive ? p.daily.streak + "-day streak" : "No streak yet") + "</div>" +
        '<button type="button" class="btn btn-primary btn-sm" data-act="start-daily"' + (daily.length ? "" : " disabled") + ">" +
          (daily.length ? "Practise (" + daily.length + ")" : anyStarted ? "Nothing due" : "Start a lesson first") + "</button>" +
      "</div>" +
      '<div class="card fg-stat"><div class="fg-stat-ic fg-t2">' + TARGET + "</div>" +
        '<div class="fg-stat-title">Weak spots</div>' +
        '<div class="fg-stat-sub">' + (weak.length ? weak.length + " to review" : "Nothing to review") + "</div>" +
        '<button type="button" class="btn btn-outline btn-sm" data-act="start-review"' + (weak.length ? "" : " disabled") + ">Review</button>" +
      "</div></div>";

    if (next.kind === "lesson") {
      const ch = chapterOf(next.chapterId);
      html += '<button type="button" class="card fg-next ' + trackClass(ch.track) + '" data-act="open-lesson" data-ch="' + ch.id + '">' +
        '<span class="fg-next-k">' + (next.started ? "Continue" : "Next lesson") + "</span>" +
        '<span class="fg-next-t">Chapter ' + ch.n + ": " + esc(ch.title) + "</span>" + CHEVRON + "</button>";
    } else if (next.kind === "review") {
      html += '<button type="button" class="card fg-next fg-t2" data-act="start-review"><span class="fg-next-k">Suggested</span><span class="fg-next-t">Review what you missed last time</span>' + CHEVRON + "</button>";
    }

    for (const t of visibleTracks()) {
      html += '<h2 class="fg-track-h"><span class="fg-chip ' + trackClass(t.id) + '">' + esc(t.title) + "</span></h2>";
      for (const chId of t.lessons) {
        const ch = chapterOf(chId);
        const L = p.lessons[chId];
        const frac = lessonProgress(p, chId);
        const status = L && L.done ? "Quiz best " + L.best + " of " + L.total : L ? "In progress" : ch.concepts.length + " parts · " + ch.questions.length + " questions";
        html += '<button type="button" class="fg-lesson ' + trackClass(t.id) + '" data-act="open-lesson" data-ch="' + chId + '">' +
          ring(frac, chapterIcon(ch), Math.round(frac * 100) + "% done") +
          '<span class="fg-lesson-body"><span class="fg-lesson-n">Chapter ' + ch.n + "</span>" +
          '<span class="fg-lesson-title">' + esc(ch.title) + "</span>" +
          '<span class="fg-lesson-sub">' + esc(status) + "</span></span>" + CHEVRON + "</button>";
      }
    }
    return html;
  }

  // ---------------- conversation ----------------
  function sessionKey(sub) {
    if (sub[0] === "lesson") return "lesson:" + sub[1];
    return sub[0] === "review" || sub[0] === "practice" ? sub[0] : "daily";
  }
  const SESSION_ROUTES = ["lesson", "review", "daily", "practice"];
  // Search's "Practise this": a short session of the given questions.
  function startPracticeSession(qids) {
    coach.sessions.set("practice", startPractice(coach.progress, qids, coachNow()));
    coach.seen.set("practice", 0);
    saveProgress();
    if (location.hash === "#/coach/practice") render(true);
    else location.hash = "#/coach/practice";
  }
  function ensureSession(sub, fresh) {
    const key = sessionKey(sub);
    let s = coach.sessions.get(key);
    if (!s || fresh) {
      const now = coachNow();
      s = sub[0] === "lesson" ? startLesson(coach.progress, sub[1], now)
        : sub[0] === "review" ? startReview(coach.progress, sub[1] || null, now)
        : startDaily(coach.progress, now);
      coach.sessions.set(key, s);
      coach.seen.set(key, 0);
      saveProgress();
    }
    return s;
  }

  function questionHtml(m, i, label) {
    const q = questionOf(m.qid);
    const answered = m.chosen !== null;
    const opts = m.order.map((oi, pos) => {
      let cls = "fg-opt";
      if (answered && oi === q.correct) cls += " is-right";
      else if (answered && oi === m.chosen) cls += " is-wrong";
      return '<button type="button" class="' + cls + '" data-act="answer" data-i="' + oi + '"' + (answered ? " disabled" : "") + ">" +
        '<span class="fg-opt-k">' + "ABCDEFG".charAt(pos) + "</span><span>" + esc(q.opts[oi]) + "</span></button>";
    }).join("");
    return '<div class="fg-msg fg-msg-card" data-i="' + i + '"><div class="fg-q" data-qid="' + m.qid + '"><div class="fg-q-label">' + esc(label) + "</div>" +
      '<p class="fg-q-text">' + esc(q.q) + '</p><div class="fg-opts">' + opts + "</div></div></div>";
  }
  function whyHtml(m, i) {
    const q = questionOf(m.qid);
    const quote = sourceQuote(q);
    let inner = '<p class="fg-react">' + esc(m.text) + "</p>";
    if (!m.correct || !quote) inner += '<p class="fg-answer">Correct answer: <strong>' + esc(q.opts[q.correct]) + "</strong></p>";
    if (quote) inner += quoteHtml(quote.lines, quote.block);
    return coachBubble(inner, i, m.correct ? " is-right" : " is-wrong");
  }
  function reflectHtml(chapterId) {
    const ch = chapterOf(chapterId);
    const saved = (coach.progress.reflections[chapterId]) || {};
    return '<div class="card fg-reflect"><div class="fg-callout-label">In your own words</div>' +
      '<p class="muted" style="margin:4px 0 10px">Explain it the way you\'d explain it to a vendor. Saved on this phone as you type.</p>' +
      ch.reflections.map((prompt, pi) =>
        '<label class="fg-label" for="fgRef-' + chapterId + "-" + pi + '">' + (pi + 1) + ". " + esc(prompt) + "</label>" +
        '<textarea class="field fg-ta" id="fgRef-' + chapterId + "-" + pi + '" data-act="reflect" data-ch="' + chapterId + '" data-i="' + pi + '" rows="3">' + esc(saved[pi] || "") + "</textarea>"
      ).join("") +
      '<span class="fg-saved" data-saved="' + chapterId + '" aria-live="polite"></span></div>';
  }
  function logHtml(s) {
    let quizN = 0;
    const quizTotal = s.kind === "lesson" ? chapterOf(s.chapterId).questions.length : 0;
    const totalQs = s.steps.filter((st) => st.qid && st.kind !== "check").length;
    let qN = 0;
    return s.log.map((m, i) => {
      switch (m.type) {
        case "coach": return coachBubble("<p>" + esc(m.text) + "</p>", i, m.stuck ? " is-stuck" : "");
        case "idea": {
          const c = conceptOf(m.conceptId);
          const ch = chapterOfConcept(m.conceptId);
          return '<div class="fg-msg fg-msg-card" data-i="' + i + '"><div class="fg-idea ' + trackClass(ch.track) + '">' +
            '<div class="fg-src">From the manual · Chapter ' + ch.n + "</div>" +
            '<h3 class="fg-idea-t">' + esc(c.title) + "</h3>" +
            m.blocks.map((id) => blockHtml(blockOf(id), false)).join("") +
            '<div class="fg-idea-foot">' + readLink(ch.id, m.blocks[0], "Open in the manual") + "</div></div></div>";
        }
        case "question": {
          let label;
          if (m.mode === "check") label = "Quick check";
          else if (m.mode === "quiz") label = "Quiz · " + (++quizN) + " of " + quizTotal;
          else label = (m.mode === "review" ? "Review · " : "Practice · ") + (++qN) + " of " + totalQs;
          return questionHtml(m, i, label);
        }
        case "me": return '<div class="fg-msg fg-msg-me" data-i="' + i + '"><div class="fg-bubble">' + esc(m.text) + "</div></div>";
        case "why": return whyHtml(m, i);
        case "simpler": {
          const b = blockOf(m.block);
          return coachBubble("<p>" + esc(m.text) + "</p>" + quoteHtml(quoteParts(b, m.parts), b.id), i);
        }
        case "nearest": {
          const ch = chapterOfConcept(m.conceptId);
          const first = conceptOf(m.conceptId).blocks[0];
          return coachBubble("<p>" + esc(m.text) + '</p><button type="button" class="btn btn-outline btn-sm" data-act="read" data-ch="' + ch.id + '" data-block="' + first + '">Open it</button>', i);
        }
        case "result":
          return '<div class="fg-msg fg-msg-card" data-i="' + i + '"><div class="card fg-result">' +
            ring(m.total ? m.score / m.total : 0, '<b class="fg-result-n">' + m.score + "/" + m.total + "</b>", m.score + " out of " + m.total) +
            "<p>" + esc(m.text) + "</p></div></div>";
        case "next": {
          let btn = "";
          if (m.action === "review") btn = '<button type="button" class="btn btn-primary btn-sm" data-act="start-review" data-ch="' + m.chapterId + '">Review weak spots</button>';
          else if (m.action === "lesson") btn = '<button type="button" class="btn btn-primary btn-sm" data-act="open-lesson" data-ch="' + m.chapterId + '">Start it</button>';
          else btn = '<button type="button" class="btn btn-primary btn-sm" data-act="start-daily">Daily practice</button>';
          return coachBubble("<p>" + esc(m.text) + "</p>" + btn, i);
        }
        case "reflect": return '<div class="fg-msg fg-msg-card" data-i="' + i + '">' + reflectHtml(m.chapterId) + "</div>";
        default: return "";
      }
    }).join("");
  }
  function actionsHtml(s) {
    const stuck = s.log.length && s.log[s.log.length - 1].stuck;
    const help = s.current
      ? '<button type="button" class="btn btn-ghost' + (stuck ? " is-stuck" : "") + '" data-act="simpler">I don\'t understand</button>'
      : "";
    if (s.await === "continue") return '<div class="fg-actions">' + help + '<button type="button" class="btn btn-primary" data-act="continue">Continue</button></div>';
    if (s.await === "answer") return '<div class="fg-actions">' + help + "</div>";
    return '<div class="fg-actions"><button type="button" class="btn btn-outline" data-act="home">Back to Coach</button></div>';
  }
  function sessionHtml(sub) {
    const s = ensureSession(sub, false);
    let head, title;
    if (s.kind === "lesson") {
      const ch = chapterOf(s.chapterId);
      title = ch.title;
      head = '<span class="fg-chip ' + trackClass(ch.track) + '">Chapter ' + ch.n + "</span>";
    } else {
      title = s.kind === "review" ? "Weak spots" : s.kind === "practice" ? "Practice" : "Daily practice";
      head = "";
    }
    const frac = s.steps.length ? Math.max(0, s.pos) / s.steps.length : 0;
    return (
      '<div class="fg-subhead"><button type="button" class="fg-back" data-act="home">‹ Coach</button>' + head + "</div>" +
      '<h1 class="fg-h1" tabindex="-1">' + esc(title) + "</h1>" +
      (s.kind === "lesson"
        ? '<div class="fg-subrow">' + readLink(s.chapterId, null, "Read the chapter") + '<button type="button" class="fg-link" data-act="restart-lesson" data-ch="' + s.chapterId + '">Start over</button></div>'
        : "") +
      '<div class="fg-bar" role="progressbar" aria-label="Progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + Math.round((s.await === "done" ? 1 : frac) * 100) + '"><span style="width:' + ((s.await === "done" ? 1 : frac) * 100).toFixed(1) + '%"></span></div>' +
      '<div class="fg-chat" aria-live="polite">' + logHtml(s) + "</div>" +
      actionsHtml(s)
    );
  }

  // ---------------- reader ----------------
  function readerHtml(chapterId) {
    const ch = chapterOf(chapterId);
    if (!ch) return homeHtml();
    return (
      '<div class="fg-subhead"><button type="button" class="fg-back" data-act="home">‹ Coach</button><span class="fg-chip ' + trackClass(ch.track) + '">Chapter ' + ch.n + "</span></div>" +
      '<div class="fg-readhead ' + trackClass(ch.track) + '">' + ring(coach.progress ? lessonProgress(coach.progress, ch.id) : 0, chapterIcon(ch)) +
      '<h1 class="fg-h1" tabindex="-1">' + esc(ch.title) + "</h1></div>" +
      '<button type="button" class="btn btn-primary" data-act="open-lesson" data-ch="' + ch.id + '">Learn it with the coach</button>' +
      '<article class="fg-reader">' + ch.blocks.map((b) => blockHtml(b, true)).join("") + "</article>" +
      (ch.reflections.length && coach.progress ? reflectHtml(ch.id) : "") +
      '<p class="muted fg-source-note">From ' + esc(MANUAL.source.title) + ".</p>"
    );
  }

  // ---------------- entry points used by app.js ----------------
  function coachScreen(sub) {
    if (!coach.loaded) return '<h1 class="fg-h1" tabindex="-1">Coach</h1><p class="fg-lead">Loading…</p>';
    if (sub[0] === "read" && chapterOf(sub[1])) return readerHtml(sub[1]); // the manual itself needs no learner
    if (!coach.progress) return setupCardHtml();
    // A practice run only exists once search has started it (not after a reload).
    if (sub[0] === "practice" && !coach.sessions.has("practice")) return homeHtml();
    if ((sub[0] === "lesson" && chapterOf(sub[1])) || sub[0] === "review" || sub[0] === "daily" || sub[0] === "practice") return sessionHtml(sub);
    if (sub[0] === "read") return readerHtml(sub[1]);
    return homeHtml();
  }
  // After drawing: open the reader at its block, or bring the newest part
  // of a conversation into view.
  function coachAfterRender(sub, navigated) {
    if (sub[0] === "read" && sub[2]) {
      const el = sub[2] === "reflect" ? document.querySelector(".fg-reader ~ .fg-reflect") : document.getElementById(anchorId(sub[2]));
      if (el) {
        el.scrollIntoView({ block: "start" });
        el.classList.add("fg-flash");
      }
      return;
    }
    if (!coach.progress || SESSION_ROUTES.indexOf(sub[0]) === -1 || !coach.sessions.has(sessionKey(sub))) return;
    const key = sessionKey(sub);
    const s = coach.sessions.get(key);
    if (!s) return;
    const from = coach.seen.get(key) || 0;
    coach.seen.set(key, s.log.length);
    if (navigated && from === 0) return; // a fresh conversation starts at the top
    const target = document.querySelector('.fg-chat [data-i="' + (navigated ? s.log.length - 1 : from) + '"]');
    if (target) target.scrollIntoView({ block: "start" });
  }

  function currentSub() { return routeParts().slice(1); }

  async function coachAction(act, el) {
    const sub = currentSub();
    const now = coachNow();
    switch (act) {
      case "go-me": location.hash = "#/me"; return;
      case "home": location.hash = "#/coach"; return;
      case "open-lesson": {
        const key = "lesson:" + el.dataset.ch;
        const s = coach.sessions.get(key);
        if (s && s.await === "done") coach.sessions.delete(key); // a finished lesson opens fresh
        location.hash = "#/coach/lesson/" + el.dataset.ch;
        return;
      }
      case "restart-lesson":
        coach.sessions.delete("lesson:" + el.dataset.ch);
        ensureSession(["lesson", el.dataset.ch], true);
        render(true);
        return;
      case "read":
        location.hash = "#/coach/read/" + el.dataset.ch + (el.dataset.block ? "/" + el.dataset.block : "");
        return;
      case "start-review":
        coach.sessions.delete("review");
        ensureSession(["review", el.dataset.ch], true);
        if (location.hash === "#/coach/review") render(true);
        else location.hash = "#/coach/review";
        return;
      case "start-daily":
        coach.sessions.delete("daily");
        ensureSession(["daily"], true);
        if (location.hash === "#/coach/daily") render(true);
        else location.hash = "#/coach/daily";
        return;
      case "answer":
      case "continue":
      case "simpler": {
        const s = coach.sessions.get(sessionKey(sub));
        if (!s) return;
        if (act === "answer") answer(s, coach.progress, Number(el.dataset.i), now);
        else if (act === "continue") cont(s, coach.progress, now);
        else simpler(s);
        saveProgress();
        render(false);
        return;
      }
      case "switch-profile":
        if (el.dataset.id === coach.activeId) return;
        await activateProfile(el.dataset.id);
        render(false);
        return;
      case "rename-profile": {
        const prof = coach.profiles.find((p) => p.id === el.dataset.id);
        const name = cleanName(await fgDialog({ title: "Rename learner", input: prof.name, okLabel: "Save" }));
        if (!name) return;
        prof.name = name;
        await storePut("profiles", prof);
        render(false);
        return;
      }
      case "remove-profile": {
        const prof = coach.profiles.find((p) => p.id === el.dataset.id);
        const ok = await fgDialog({ title: "Remove " + prof.name + "?", text: "Their lessons, quiz scores and written answers on this phone are deleted. This can't be undone.", okLabel: "Remove", danger: true });
        if (!ok) return;
        await storeDelete("profiles", prof.id);
        await storeDelete("progress", prof.id);
        coach.profiles = coach.profiles.filter((p) => p.id !== prof.id);
        if (coach.activeId === prof.id) {
          coach.activeId = null;
          coach.progress = null;
          coach.sessions.clear();
          coach.seen.clear();
          if (coach.profiles.length) await activateProfile(coach.profiles[0].id);
          else await storeDelete("meta", "activeProfileId");
        }
        render(false);
        return;
      }
    }
  }
  async function coachSubmit(act, form) {
    const name = cleanName(form.elements.name.value);
    if (!name) { form.elements.name.focus(); return; }
    if (act === "create-profile" || act === "add-profile") {
      await createProfile(name);
      if (act === "create-profile") render(true);
      else render(false);
    }
  }
  function coachInput(el) {
    if (el.dataset.act !== "reflect" || !coach.progress) return;
    const chId = el.dataset.ch;
    const r = coach.progress.reflections[chId] || (coach.progress.reflections[chId] = {});
    r[el.dataset.i] = el.value;
    clearTimeout(reflectTimer);
    reflectTimer = setTimeout(() => {
      saveProgress().then(() => {
        for (const note of document.querySelectorAll('[data-saved="' + chId + '"]')) note.textContent = coach.saveFailed ? "Not saved" : "Saved";
      });
    }, REFLECT_SAVE_MS);
  }

  // ---------------- Me: learners on this phone ----------------
  function profilesCardHtml() {
    if (!coach.loaded) return "";
    const rows = coach.profiles.map((p) => {
      const active = p.id === coach.activeId;
      return '<div class="fg-prof' + (active ? " is-active" : "") + '">' +
        '<button type="button" class="fg-prof-main" data-act="switch-profile" data-id="' + p.id + '" aria-pressed="' + active + '">' +
          '<span class="fg-prof-dot" aria-hidden="true"></span><span class="fg-prof-name">' + esc(p.name) + "</span>" +
          (active ? '<span class="pill ok">Active</span>' : "") + "</button>" +
        '<button type="button" class="fg-link" data-act="rename-profile" data-id="' + p.id + '">Rename</button>' +
        '<button type="button" class="fg-link fg-danger" data-act="remove-profile" data-id="' + p.id + '">Remove</button></div>';
    }).join("");
    return '<div class="card" id="fgProfiles"><h2 class="fg-card-title">Learners on this phone</h2>' +
      '<p class="muted" style="margin:0 0 10px">Each learner\'s progress is kept apart, on this phone only. Signing in with your Console account comes later.</p>' +
      (rows || '<p class="muted">No learners yet.</p>') +
      '<form class="fg-addprof" data-act="add-profile"><input class="field" name="name" maxlength="40" placeholder="New learner\'s name" aria-label="New learner\'s name" required>' +
      '<button type="submit" class="btn btn-outline btn-sm">Add</button></form></div>';
  }

  // ================== RPN Field Guide — search sheet (Phase 3) ==================
  // The sheet from Phase 1, now searching the manual (search.js):
  //   typing -> onSearchInput (debounced) -> runSearch -> renderSearchResults
  //   tap or Enter on a result -> onSearchBodyClick -> the reader, a lesson,
  //   practice, or a reflection prompt (coach-ui.js does the opening)
  // States drawn: getting ready (index being built), empty (recent searches
  // + example questions), an answer (quoted passage + more results), and no
  // match (said plainly, with the nearest lessons). Every answer is a quote:
  // this file never writes one.
  //
  // Recent searches are kept per learner, in their progress record, and
  // only when a search was used (a result opened, or Enter pressed).
  const SEARCH_DEBOUNCE_MS = 150;
  const SEARCH_RECENT_MAX = 6;
  const searchUi = { index: null, building: false, timer: null, result: null, returnFocus: null, leadTurn: 0 };

  function searchInputEl() { return document.getElementById("fgSearchInput"); }

  function openSearch() {
    searchUi.returnFocus = document.activeElement;
    document.getElementById("fgSearch").hidden = false;
    const input = searchInputEl();
    input.focus();
    input.select();
    if (!searchUi.index && !searchUi.building) {
      searchUi.building = true;
      // Built after the sheet has drawn, so "Getting the manual ready" shows.
      setTimeout(() => {
        searchUi.index = buildSearchIndex();
        searchUi.building = false;
        runSearchNow(false);
      }, 0);
    }
    runSearchNow(false);
  }
  // restoreFocus false when a result navigates: the new screen takes focus.
  function closeSearch(restoreFocus) {
    clearTimeout(searchUi.timer);
    document.getElementById("fgSearch").hidden = true;
    if (restoreFocus !== false && searchUi.returnFocus && searchUi.returnFocus.focus) searchUi.returnFocus.focus();
  }
  function onSearchInput() {
    document.getElementById("fgSearchClear").hidden = !searchInputEl().value;
    clearTimeout(searchUi.timer);
    searchUi.timer = setTimeout(() => runSearchNow(true), SEARCH_DEBOUNCE_MS);
  }
  function clearSearch() {
    const input = searchInputEl();
    input.value = "";
    runSearchNow(false);
    input.focus();
  }
  // typing: the last word may be unfinished, so it can match a word it starts.
  function runSearchNow(typing) {
    const q = searchInputEl().value;
    document.getElementById("fgSearchClear").hidden = !q;
    if (!searchUi.index) {
      searchUi.result = null;
      renderSearchResults();
      return;
    }
    searchUi.result = q.trim() ? runSearch(searchUi.index, q, { typing }) : { state: "empty" };
    renderSearchResults();
  }

  // ---------------- drawing ----------------
  function srItem(icon, title, sub, attrs) {
    return '<button type="button" class="fg-sr-item" ' + attrs + ">" +
      '<span class="fg-sr-ic">' + icon + '</span><span class="fg-sr-txt"><span class="fg-sr-t">' + esc(title) + "</span>" +
      (sub ? '<span class="fg-sr-s">' + esc(sub) + "</span>" : "") + "</span></button>";
  }
  function docItem(doc) {
    const ch = chapterOf(doc.chapterId);
    if (doc.kind === "section") {
      const c = conceptOf(doc.conceptId);
