<style>
  :root{
    --orange:#E8590C;
    --orange-dark:#B8430A;
    --orange-light:#FFF1E6;
    --ink:#241C15;
    --ink-soft:#6B5D4F;
    --paper:#FFFFFF;
    --surface:#FFFAF6;
    --border:#EFDFCF;
    --success:#2E7D32;
    --success-bg:#EAF6EA;
    --danger:#C62828;
    --danger-bg:#FCEAEA;
    --warn:#8A6D00;
    --warn-bg:#FEF9E6;
    --radius:10px;
    --modal-radius:4px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--surface);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  #app{min-height:100vh;display:flex;flex-direction:column;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}

  .topbar{
    background:var(--paper);
    border-bottom:1px solid var(--border);
    padding:10px 14px;
    display:flex;align-items:center;gap:10px;
    position:sticky;top:0;z-index:20;
  }
  .topbar .brand-mark{width:34px;height:34px;border-radius:8px;object-fit:cover;flex:none;background:var(--orange-light);}
  .topbar .brand-mark.placeholder{display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--orange);border:1px solid var(--border);}
  .topbar .names{flex:1;min-width:0;}
  .topbar .shop{font-weight:700;font-size:15px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .topbar .branch{font-size:12px;color:var(--ink-soft);}
  .topbar .cart-btn{
    position:relative;background:var(--orange);color:#fff;border:none;
    width:42px;height:42px;border-radius:50%;font-size:19px;
    display:flex;align-items:center;justify-content:center;flex:none;
  }
  .cart-badge{
    position:absolute;top:-4px;right:-4px;background:var(--ink);color:#fff;
    font-size:10px;font-weight:700;min-width:17px;height:17px;border-radius:9px;
    display:flex;align-items:center;justify-content:center;padding:0 4px;
  }
  .icon-badge-wrap{position:relative;display:inline-block;}
  .icon-badge{
    position:absolute;top:-6px;right:-6px;background:var(--ink);color:#fff;
    font-size:9.5px;font-weight:700;min-width:15px;height:15px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;padding:0 3px;
  }

  .navbar{
    background:var(--paper);border-radius:16px;
    box-shadow:0 -2px 14px rgba(36,28,21,.14);
    display:flex;position:sticky;bottom:8px;z-index:20;
  }
  .navbar button{
    flex:1;background:none;border:none;padding:9px 2px 8px;
    display:flex;flex-direction:column;align-items:center;gap:2px;
    color:var(--ink-soft);font-size:10px;
  }
  .navbar button .ic{font-size:17px;}
  .navbar button.active{color:var(--orange);}
  @media (min-width:768px){
    .navbar button .ic{font-size:68px;}
    .navbar button{padding:16px 4px 14px;}
    .navbar button{font-size:13px;}
  }

  main{flex:1;padding:14px;padding-bottom:20px;max-width:640px;margin:0 auto;width:100%;}

  h1,h2,h3{margin:0 0 10px;}
  h1{font-size:20px;} h2{font-size:17px;} h3{font-size:14px;color:var(--ink-soft);font-weight:600;}
  p{line-height:1.5;}
  label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin:12px 0 4px;}
  .field{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--paper);font-size:15px;color:var(--ink);}
  .field:focus{outline:2px solid var(--orange);outline-offset:1px;}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    padding:12px 18px;border-radius:var(--radius);border:none;font-size:14.5px;font-weight:700;
    width:100%;
  }
  .btn-primary{background:var(--orange);color:#fff;}
  .btn-primary:active{background:var(--orange-dark);}
  .btn-outline{background:transparent;color:var(--orange);border:1.5px solid var(--orange);}
  .btn-ghost{background:var(--orange-light);color:var(--orange-dark);}
  .btn-danger{background:var(--danger-bg);color:var(--danger);}
  .btn-sm{width:auto;padding:8px 12px;font-size:13px;}
  .row{display:flex;gap:10px;}
  .row>*{flex:1;}
  .card{background:var(--paper);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px;}
  .muted{color:var(--ink-soft);font-size:13px;}
  .hr{border:none;border-top:1px solid var(--border);margin:14px 0;}
  .pill{display:inline-block;background:var(--orange-light);color:var(--orange-dark);font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:20px;}
  .pill.low{background:var(--danger-bg);color:var(--danger);}
  .pill.ok{background:var(--success-bg);color:var(--success);}
  .center{text-align:center;}
  .banner-img{width:100%;max-height:120px;object-fit:cover;border-radius:var(--radius);margin-bottom:12px;border:1px solid var(--border);}

  .search-wrap{position:relative;margin-bottom:12px;}
  .search-wrap input{padding-left:36px;}
  .search-wrap .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-soft);}
  .product-row{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:12px 4px;border-bottom:1px solid var(--border);
  }
  .product-row:last-child{border-bottom:none;}
  .product-row .pname{font-weight:600;font-size:14.5px;}
  .psku{font-size:10.5px;font-weight:700;color:var(--orange-dark);}
  .product-row .pmeta{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .prod-thumb{width:46px;height:46px;border-radius:8px;object-fit:cover;flex:none;background:var(--orange-light);border:1px solid var(--border);}
  .prod-thumb-placeholder{width:46px;height:46px;border-radius:8px;flex:none;background:var(--orange-light);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--orange);opacity:.45;}
  .add-chip{background:var(--orange);color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:700;flex:none;}
  .add-chip:disabled{background:var(--border);color:var(--ink-soft);}

  .overlay{position:fixed;inset:0;background:rgba(36,28,21,.42);z-index:40;display:none;}
  .overlay.show{display:block;}
  .drawer{
    position:fixed;right:0;top:0;bottom:0;width:92%;max-width:400px;background:var(--paper);
    z-index:50;transform:translateX(100%);transition:transform .22s ease;
    display:flex;flex-direction:column;box-shadow:-4px 0 18px rgba(0,0,0,.15);
  }
  .drawer.show{transform:translateX(0);}
  .drawer-head{padding:14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
  .drawer-body{flex:1;overflow-y:auto;padding:10px 14px;}
  .drawer-foot{padding:14px;border-top:1px solid var(--border);max-height:60vh;overflow-y:auto;}
  .cart-item{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--border);}
  .cart-item .ci-name{flex:1;font-size:13.5px;font-weight:600;}
  .cart-item .ci-price{font-size:12px;color:var(--ink-soft);}
  .qty-ctl{display:flex;align-items:center;gap:6px;}
  .qty-ctl button{width:26px;height:26px;border-radius:6px;border:1px solid var(--border);background:var(--surface);font-size:14px;}
  .qty-ctl span{min-width:18px;text-align:center;font-weight:700;font-size:13.5px;}
  .total-line{display:flex;justify-content:space-between;font-size:16px;font-weight:800;margin-bottom:6px;}
  .subline{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-soft);margin-bottom:4px;}
  .close-x{background:none;border:none;font-size:20px;color:var(--ink-soft);padding:4px;}

  .center-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .setup-card{max-width:420px;width:100%;background:var(--paper);border:1px solid var(--border);border-radius:14px;padding:22px;}
  .step-dots{display:flex;gap:6px;justify-content:center;margin-bottom:16px;}
  .step-dots span{width:7px;height:7px;border-radius:50%;background:var(--border);}
  .step-dots span.on{background:var(--orange);}
  .device-code{font-size:22px;font-weight:800;letter-spacing:2px;text-align:center;background:var(--orange-light);color:var(--orange-dark);padding:14px;border-radius:var(--radius);margin:14px 0;}

  table.simple{width:100%;border-collapse:collapse;font-size:13.5px;}
  table.simple th{text-align:left;color:var(--ink-soft);font-size:11.5px;padding:6px 4px;border-bottom:1px solid var(--border);}
  table.simple td{padding:8px 4px;border-bottom:1px solid var(--border);}
  table.simple tr.stock-out{background:var(--danger-bg);}
  table.simple tr.stock-low{background:var(--warn-bg);}

  .subtabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;}
  .subtabs button{padding:7px 12px;border-radius:20px;border:1px solid var(--border);background:var(--paper);font-size:12.5px;font-weight:600;color:var(--ink-soft);}
  .subtabs button.active{background:var(--orange);border-color:var(--orange);color:#fff;}

  .lang-block{margin-bottom:18px;}
  .lang-tag{display:inline-block;font-size:11px;font-weight:700;color:var(--orange-dark);background:var(--orange-light);padding:2px 8px;border-radius:20px;margin-bottom:6px;}

  /* popup modal cards */
  .modalOverlay{position:fixed;inset:0;background:rgba(36,28,21,.5);z-index:70;display:flex;align-items:center;justify-content:center;padding:16px;}

    .cat-noimg{width:100%;height:32mm;background:#FFF1E6;border-radius:2px;margin-bottom:2.5mm;display:flex;align-items:center;justify-content:center;color:#B8430A;font-size:11px;}

<body>
<div id="app"></div>
<div id="printArea"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>
<script>
/* =========================================================================
   seiGEN Commerce Lite — single-file offline POS
   Storage: SQLite via sql.js (WASM), persisted to IndexedDB as a blob.
   No install/Bluetooth. Runs as a plain local file; WhatsApp image/PDF
   attachments additionally need the file served via http://localhost
   (a local-server app) — text sharing always works from a plain file.

   ACTIVATION CODE FORMULA (also shown on the Help page in-app):
     function computeActivationCode(deviceCode, secretPhrase) {
       const combined = deviceCode.toUpperCase() + '|' + secretPhrase.toUpperCase();
       let hash = 0;
       for (let i = 0; i < combined.length; i++) {
         hash = ((hash << 5) - hash + combined.charCodeAt(i)) | 0;
       }
       hash = Math.abs(hash);
       return hash.toString(36).toUpperCase().padStart(6, '0').slice(-6);
     }
   Give this + the device code shown on the lock screen + the shop's secret
   phrase to any Claude chat to get the 6-character unlock code.
   ========================================================================= */

(function(){
  "use strict";

  let SQL=null, db=null;
  let cart=[];
  let appliedVoucher=null;
  let exportDirHandle=null;
  let route="loading";
  let moreTab="help";
  let plistQuery="";
  let plistBranch="";
  let reqBranch="";
  let reqDrawerOpen=false;
  let reqExpandedId=null;
  let reqLineSeq=0;
  let reqLines=[{id:reqLineSeq++, item:"", qty:""}];
  let settingsUnlocked=false;
  let stocktakeReportId=null;
  let rwType="sales";
  let rwBranch="";
  let rwFrom="";
  let rwTo="";
  let rwGranularity="day";
  let drawerOpen=false;
  let searchQuery="";
  let currency="$";
  let sessionUser="";

  const $app = document.getElementById("app");
  const IDB_NAME="seigen_lite_db", IDB_STORE="kv", IDB_KEY="dbfile";

  function idbOpen(){
    return new Promise((res,rej)=>{
      const r = indexedDB.open(IDB_NAME, 1);
      r.onupgradeneeded = ()=> r.result.createObjectStore(IDB_STORE);
      r.onsuccess = ()=> res(r.result);
      r.onerror = ()=> rej(r.error);
    });
  }
  async function idbGet(){
    const conn = await idbOpen();
    return new Promise((res,rej)=>{
      const tx = conn.transaction(IDB_STORE,"readonly");
      const rq = tx.objectStore(IDB_STORE).get(IDB_KEY);
      rq.onsuccess=()=>res(rq.result||null);
      rq.onerror=()=>rej(rq.error);
    });
  }
  async function idbSet(bytes){
    const conn = await idbOpen();
    return new Promise((res,rej)=>{
      const tx = conn.transaction(IDB_STORE,"readwrite");
      tx.objectStore(IDB_STORE).put(bytes, IDB_KEY);
      tx.oncomplete=()=>res(true);
      tx.onerror=()=>rej(tx.error);
    });
  }
  async function persist(){ await idbSet(db.export()); }

  // ---- generic (multi-db-capable) helpers ----
  function allX(t, sql, params=[]){
    const stmt = t.prepare(sql);
    stmt.bind(params);
    const out=[];
    while(stmt.step()) out.push(stmt.getAsObject());
    stmt.free();
    return out;
  }
  function oneX(t, sql, params=[]){ const r = allX(t, sql, params); return r.length? r[0]: null; }
  function runX(t, sql, params=[]){ t.run(sql, params); }
  function all(sql, params=[]){ return allX(db, sql, params); }
  function one(sql, params=[]){ return oneX(db, sql, params); }
  function run(sql, params=[]){ return runX(db, sql, params); }

  function getSettingX(t, key, fallback=""){ const r = oneX(t,"SELECT value FROM settings WHERE key=?",[key]); return r? r.value: fallback; }
  function setSetting(key, value){
    run("INSERT INTO settings(key,value) VALUES(?,?) ON CONFLICT(key) DO UPDATE SET value=excluded.value",[key,String(value)]);
  }
  function getSetting(key, fallback=""){ return getSettingX(db, key, fallback); }
  function currentBranch(){ return getSetting("branch_name","") || getSetting("shop_name","") || "Main"; }
  function isRemote(){ return getSetting("branch_type","main")==="remote"; }
  function logAudit(action, productName, details){
    run("INSERT INTO audit_log(ts,branch,user,action,product_name,details) VALUES(?,?,?,?,?,?)",
      [new Date().toISOString(), currentBranch(), sessionUser||"Unknown", action, productName||"", details||""]);
  }

  const SCHEMA = `
    CREATE TABLE IF NOT EXISTS settings(key TEXT PRIMARY KEY, value TEXT);
    CREATE TABLE IF NOT EXISTS products(
      id INTEGER PRIMARY KEY AUTOINCREMENT, name TEXT NOT NULL,
      price REAL NOT NULL DEFAULT 0, stock INTEGER NOT NULL DEFAULT 0,
      low_threshold INTEGER NOT NULL DEFAULT 5
    );
    CREATE TABLE IF NOT EXISTS sales(
      id INTEGER PRIMARY KEY AUTOINCREMENT, ts TEXT, subtotal REAL DEFAULT 0,
      discount REAL DEFAULT 0, total REAL, method TEXT, customer_id INTEGER
    );
    CREATE TABLE IF NOT EXISTS sale_items(
      id INTEGER PRIMARY KEY AUTOINCREMENT, sale_id INTEGER,
      product_id INTEGER, name TEXT, price REAL, qty INTEGER
    );
    CREATE TABLE IF NOT EXISTS eod_sessions(
      id INTEGER PRIMARY KEY AUTOINCREMENT, date TEXT,
      expected_cash REAL, counted_cash REAL, variance REAL, notes TEXT
    );
    CREATE TABLE IF NOT EXISTS customers(
      id INTEGER PRIMARY KEY AUTOINCREMENT, name TEXT NOT NULL, phone TEXT
    );
    CREATE TABLE IF NOT EXISTS payouts(
      id INTEGER PRIMARY KEY AUTOINCREMENT, ts TEXT, amount REAL, reason TEXT
    );
    CREATE TABLE IF NOT EXISTS credit_payments(
      id INTEGER PRIMARY KEY AUTOINCREMENT, customer_id INTEGER, ts TEXT, amount REAL, note TEXT
    );
    CREATE TABLE IF NOT EXISTS stock_received(
      id INTEGER PRIMARY KEY AUTOINCREMENT, ts TEXT, product_id INTEGER, name TEXT, qty INTEGER, note TEXT
    );
    CREATE TABLE IF NOT EXISTS audit_log(
      id INTEGER PRIMARY KEY AUTOINCREMENT, ts TEXT, branch TEXT, user TEXT, action TEXT, product_name TEXT, details TEXT
    );
    CREATE TABLE IF NOT EXISTS stock_requests(
      id INTEGER PRIMARY KEY AUTOINCREMENT, ts TEXT, branch TEXT, user TEXT,
      item_requested TEXT, customer_name TEXT, customer_phone TEXT, qty_wanted INTEGER, notes TEXT, fulfilled INTEGER DEFAULT 0
    );
    CREATE TABLE IF NOT EXISTS stock_transfers(
      id INTEGER PRIMARY KEY AUTOINCREMENT, ts TEXT, from_branch TEXT, to_branch TEXT,
      product_name TEXT, sku TEXT, qty INTEGER, note TEXT, user TEXT,
      status TEXT DEFAULT 'Dispatched', received_ts TEXT, received_user TEXT
    );
    CREATE TABLE IF NOT EXISTS stocktakes(
      id INTEGER PRIMARY KEY AUTOINCREMENT, branch TEXT, team_names TEXT,
      start_date TEXT, end_date TEXT, status TEXT DEFAULT 'Open',
      cutoff_ts TEXT, created_by TEXT, created_ts TEXT
    );
    CREATE TABLE IF NOT EXISTS stocktake_counts(
      id INTEGER PRIMARY KEY AUTOINCREMENT, stocktake_id INTEGER, product_id INTEGER,
      product_name TEXT, sku TEXT, system_qty INTEGER, counted_qty INTEGER,
      counted_ts TEXT, counted_by TEXT
    );
    CREATE TABLE IF NOT EXISTS purchases(
      id INTEGER PRIMARY KEY AUTOINCREMENT, ts TEXT, branch TEXT, user TEXT,
      supplier TEXT, product_id INTEGER, product_name TEXT, sku TEXT,
      qty INTEGER, unit_cost REAL, total_cost REAL, note TEXT
    );
    CREATE TABLE IF NOT EXISTS staff(
      id INTEGER PRIMARY KEY AUTOINCREMENT, name TEXT, role TEXT DEFAULT 'Cashier',
      passcode TEXT, branch TEXT, active INTEGER DEFAULT 1, created_ts TEXT
    );
    CREATE TABLE IF NOT EXISTS vouchers(
      id INTEGER PRIMARY KEY AUTOINCREMENT, customer_id INTEGER, amount REAL,
      branch TEXT, earned_ts TEXT, status TEXT DEFAULT 'Available',
      redeemed_ts TEXT, redeemed_sale_id INTEGER
    );
  `;
  function migrate(t){
    const alters = [
      "ALTER TABLE sales ADD COLUMN subtotal REAL DEFAULT 0",
      "ALTER TABLE sales ADD COLUMN discount REAL DEFAULT 0",
      "ALTER TABLE sales ADD COLUMN customer_id INTEGER",
      "ALTER TABLE sales ADD COLUMN branch TEXT DEFAULT ''",
      "ALTER TABLE sales ADD COLUMN discount_reason TEXT DEFAULT ''",
      "ALTER TABLE sales ADD COLUMN discount_approved_by TEXT DEFAULT ''",
      "ALTER TABLE sales ADD COLUMN discount_status TEXT DEFAULT ''",
      "ALTER TABLE sales ADD COLUMN markup REAL DEFAULT 0",
      "ALTER TABLE sales ADD COLUMN markup_reason TEXT DEFAULT ''",
      "ALTER TABLE sales ADD COLUMN voucher_amount REAL DEFAULT 0",
      "ALTER TABLE sales ADD COLUMN payment_ref TEXT DEFAULT ''",
      "ALTER TABLE sales ADD COLUMN user TEXT DEFAULT ''",
      "ALTER TABLE sale_items ADD COLUMN cost REAL DEFAULT 0",
      "ALTER TABLE products ADD COLUMN sku TEXT DEFAULT ''",
      "ALTER TABLE products ADD COLUMN image TEXT DEFAULT ''",
      "ALTER TABLE products ADD COLUMN branch TEXT DEFAULT ''",
      "ALTER TABLE products ADD COLUMN cost REAL DEFAULT 0",
      "ALTER TABLE products ADD COLUMN description TEXT DEFAULT ''",
      "ALTER TABLE products ADD COLUMN created_ts TEXT DEFAULT ''",
      "ALTER TABLE products ADD COLUMN shelf TEXT DEFAULT ''",
      "ALTER TABLE payouts ADD COLUMN branch TEXT DEFAULT ''",
      "ALTER TABLE payouts ADD COLUMN user TEXT DEFAULT ''",
      "ALTER TABLE stock_received ADD COLUMN branch TEXT DEFAULT ''",
      "ALTER TABLE stock_received ADD COLUMN user TEXT DEFAULT ''",
      "ALTER TABLE eod_sessions ADD COLUMN branch TEXT DEFAULT ''",
      "ALTER TABLE eod_sessions ADD COLUMN ts TEXT DEFAULT ''",
      "ALTER TABLE credit_payments ADD COLUMN branch TEXT DEFAULT ''",
      "ALTER TABLE credit_payments ADD COLUMN user TEXT DEFAULT ''",
      "ALTER TABLE customers ADD COLUMN branch TEXT DEFAULT ''"
    ];
    alters.forEach(sql=>{ try{ t.run(sql); }catch(e){} });
    try{ t.run("UPDATE products SET created_ts=? WHERE created_ts IS NULL OR created_ts=''", [new Date().toISOString()]); }catch(e){}
  }
  function backfillBranch(t, branchName){
    ["products","sales","payouts","stock_received","eod_sessions","credit_payments","customers","stock_requests"].forEach(tbl=>{
      try{ t.run(`UPDATE ${tbl} SET branch=? WHERE branch IS NULL OR branch=''`, [branchName]); }catch(e){}
    });
  }

  async function initDB(){
    SQL = await initSqlJs({ locateFile: f => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/${f}` });
    const existing = await idbGet();
    if(existing){ db = new SQL.Database(new Uint8Array(existing)); }
    else { db = new SQL.Database(); db.run(SCHEMA); await persist(); }
    db.run(SCHEMA);
    migrate(db);
    currency = getSetting("currency","$");
    if(getSetting("setup_complete")==="1"){ backfillBranch(db, currentBranch()); await persist(); }
  }

  function uid4(){
    const chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let s="";
    for(let i=0;i<4;i++) s+=chars[Math.floor(Math.random()*chars.length)];
    return s;
  }
  function computeActivationCode(deviceCode, secretPhrase){
    const combined = deviceCode.toUpperCase()+"|"+secretPhrase.toUpperCase();
    let hash=0;
    for(let i=0;i<combined.length;i++){ hash = ((hash<<5)-hash+combined.charCodeAt(i))|0; }
    hash = Math.abs(hash);
    return hash.toString(36).toUpperCase().padStart(6,"0").slice(-6);
  }
  function daysBetween(a,b){ return Math.floor((b-a)/86400000); }
  function activationStatus(){
    const installDate = getSetting("install_date","");
    const activatedUntil = getSetting("activated_until","");
    if(!installDate) return "no_setup";
    const now = new Date();
    if(activatedUntil && now <= new Date(activatedUntil)) return "ok";
    return "locked";
  }
  function currentDeviceCode(){
    const installDate = new Date(getSetting("install_date"));
    const installId = getSetting("install_id","XXXX");
    const cycle = Math.max(1, Math.floor(daysBetween(installDate,new Date())/30)+1);
    return `${installId}-C${cycle}`;
  }

  function searchProducts(q, branch){
    branch = branch===undefined ? currentBranch() : branch;
    const all_ = branch? all("SELECT * FROM products WHERE branch=? ORDER BY name",[branch])
                        : all("SELECT * FROM products ORDER BY branch,name");
    if(!q.trim()) return all_;
    const qTokens = q.trim().toLowerCase().split(/\s+/);
    return all_.filter(p=>{
      const hay = (p.name+" "+(p.sku||"")+" "+(p.description||"")).toLowerCase();
      return qTokens.every(t=> hay.includes(t));
    });
  }

  function addToCart(p){
    const existing = cart.find(c=>c.product_id===p.id);
    if(existing){ if(existing.qty < p.stock) existing.qty++; }
    else { if(p.stock>0) cart.push({product_id:p.id,name:p.name,price:p.price,qty:1,stock:p.stock}); }
    render();
  }
  function changeQty(pid, delta){
    const item = cart.find(c=>c.product_id===pid);
    if(!item) return;
    item.qty += delta;
    if(item.qty<=0) cart = cart.filter(c=>c.product_id!==pid);
    render();
  }
  function cartSubtotal(){ return cart.reduce((s,c)=>s+c.price*c.qty,0); }
  function currentDiscount(){
    const el = document.getElementById("discountInput");
    return el? (parseFloat(el.value)||0) : 0;
  }
  function currentMarkup(){
    const el = document.getElementById("markupInput");
    return el? (parseFloat(el.value)||0) : 0;
  }
  function currentVoucherAmount(){ return appliedVoucher? appliedVoucher.amount : 0; }
  function cartTotal(){
    const base = Math.max(0, cartSubtotal() - currentDiscount()) + currentMarkup();
    return Math.max(0, base - currentVoucherAmount());
  }
  // Loose name match for the live voucher-eligibility preview while typing
  // in the cart's customer field — not the same lookup findOrCreateCustomer
  // uses to attach/create the sale's customer record.
  function findMatchingCustomer(name){
    name = (name||"").trim();
    if(!name) return null;
    return one("SELECT * FROM customers WHERE lower(name)=lower(?)",[name]);
  }

  function findOrCreateCustomer(name, phone){
    name = (name||"").trim(); phone=(phone||"").trim();
    if(!name) return null;
    const existing = one("SELECT * FROM customers WHERE lower(name)=lower(?) AND COALESCE(phone,'')=COALESCE(?,'')",[name,phone]);
    if(existing) return existing.id;
    run("INSERT INTO customers(name,phone,branch) VALUES(?,?,?)",[name,phone,currentBranch()]);
    return one("SELECT last_insert_rowid() as id").id;
  }
  function customerBalance(cid){
    const owed = one("SELECT COALESCE(SUM(total),0) as t FROM sales WHERE customer_id=? AND method='Credit'",[cid]).t;
    const paid = one("SELECT COALESCE(SUM(amount),0) as t FROM credit_payments WHERE customer_id=?",[cid]).t;
    return owed - paid;
  }
  function waNumber(phone){
    let d = (phone||"").replace(/[^\d]/g,"");
    if(d.startsWith("0")) d = "263"+d.slice(1);
    return d;
  }
  function waLink(phone, text){
    const n = waNumber(phone);
    return n? `https://wa.me/${n}?text=${encodeURIComponent(text)}` : `https://wa.me/?text=${encodeURIComponent(text)}`;
  }

  // Frequent-customer vouchers: after a sale, check whether this customer
  // has now hit the configured purchase count within the configured window
  // at this branch, and if so, and they don't already hold an unused
  // voucher, issue one. The voucher amount comes from Settings — left at 0
  // (the shipped default) this never issues anything, by design.
  function maybeIssueFrequentCustomerVoucher(customerId, branch, ts){
    if(!customerId) return;
    const voucherAmt = parseFloat(getSetting("freq_voucher_amount","0"))||0;
    if(voucherAmt<=0) return;
    const purchasesNeeded = parseInt(getSetting("freq_purchases_needed","5"))||5;
    const withinDays = parseInt(getSetting("freq_within_days","30"))||30;
    const sinceTs = new Date(Date.now() - withinDays*86400000).toISOString();
    const recentCount = one("SELECT COUNT(*) as c FROM sales WHERE customer_id=? AND branch=? AND ts>=?",[customerId,branch,sinceTs]).c;
    if(recentCount < purchasesNeeded) return;
    const existingVoucher = one("SELECT * FROM vouchers WHERE customer_id=? AND status='Available'",[customerId]);
    if(existingVoucher) return;
    run("INSERT INTO vouchers(customer_id,amount,branch,earned_ts,status) VALUES(?,?,?,?,'Available')",[customerId,voucherAmt,branch,ts]);
  }

  function completeSale(method){
    if(cart.length===0) return;
    const nameEl = document.getElementById("custName");
    const phoneEl = document.getElementById("custPhone");
    const custName = nameEl? nameEl.value.trim() : "";
    const custPhone = phoneEl? phoneEl.value.trim() : "";
    if(method==="Credit" && !custName){ alert("Enter the customer's name for a credit sale"); return; }

    const discount = currentDiscount();
    const reasonEl = document.getElementById("discountReason");
    const approvedEl = document.getElementById("discountApprovedBy");
    const discountReason = reasonEl? reasonEl.value.trim() : "";
    const discountApprovedBy = approvedEl? approvedEl.value.trim() : "";
    if(discount>0 && !discountReason){ alert("Enter a reason for the discount"); return; }
    const discountStatus = discount>0? (discountApprovedBy? "Approved":"Pending") : "";

    const markup = currentMarkup();
    const markupReasonEl = document.getElementById("markupReason");
    const markupReason = markupReasonEl? markupReasonEl.value.trim() : "";

    const refEl = document.getElementById("paymentRef");
    const paymentRef = refEl? refEl.value.trim() : "";
    if((method==="EcoCash"||method==="Bank") && !paymentRef){ alert("Enter the payment reference number"); return; }

    const customerId = custName? findOrCreateCustomer(custName, custPhone) : null;
    const voucherToRedeem = appliedVoucher;
    const voucherAmount = voucherToRedeem? voucherToRedeem.amount : 0;

    const ts = new Date().toISOString();
    const subtotal = cartSubtotal();
    const total = Math.max(0, Math.max(0, subtotal - discount) + markup - voucherAmount);
    const branch = currentBranch();
    run(`INSERT INTO sales(ts,subtotal,discount,total,method,customer_id,branch,discount_reason,discount_approved_by,discount_status,markup,markup_reason,payment_ref,user,voucher_amount)
         VALUES(?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)`,
      [ts,subtotal,discount,total,method,customerId,branch,discountReason,discountApprovedBy,discountStatus,markup,markupReason,paymentRef,sessionUser||"",voucherAmount]);
    const saleId = one("SELECT last_insert_rowid() as id").id;
    cart.forEach(c=>{
      const prod = one("SELECT cost FROM products WHERE id=?",[c.product_id]);
      run("INSERT INTO sale_items(sale_id,product_id,name,price,qty,cost) VALUES(?,?,?,?,?,?)",
        [saleId,c.product_id,c.name,c.price,c.qty,prod?prod.cost:0]);
      run("UPDATE products SET stock = stock - ? WHERE id=?",[c.qty,c.product_id]);
    });
    if(voucherToRedeem){
      run("UPDATE vouchers SET status='Redeemed', redeemed_ts=?, redeemed_sale_id=? WHERE id=?",[ts,saleId,voucherToRedeem.id]);
    }
    const itemNames = cart.map(c=>c.name);
    const itemsSummary = itemNames.length<=3? itemNames.join(", ") : `${itemNames[0]} +${itemNames.length-1} more`;
    logAudit("Sale", itemsSummary, `Receipt #${saleId} · ${currency}${total.toFixed(2)} · ${method}`);
    maybeIssueFrequentCustomerVoucher(customerId, branch, ts);
    persist();
    window._lastReceipt = {saleId,ts,subtotal,discount,markup,voucherAmount,total,method,items:cart.slice()};
    printReceipt(saleId, ts, subtotal, discount, markup, voucherAmount, total, method, cart.slice());
    cart = []; drawerOpen=false; appliedVoucher=null;
    render();
  }

  function paperWidth(){ return parseFloat(getSetting("paper_width","58")) || 58; }
  // Estimated character columns for a given paper width in mm, now that
  // every print job forces condensed Font B (0.75 replaces the old 0.6
  // used for the default wider font). Still just an estimate — the "Print
  // test line" tool in Settings is the real calibration step.
  function paperColumns(mm){ return Math.max(16, Math.round(mm * 0.75)); }

  // ---------------- USB (WebUSB) thermal printing ----------------
  // Works only in Chrome/Edge (desktop or Android with an OTG-connected
  // printer), and only when served via http(s)/localhost — never from a
  // plain double-clicked file. Talks directly to the printer over USB
  // using raw ESC/POS commands, so no OS print driver is needed.
  function hasUSBPrint(){ return !!(navigator.usb); }
  function escposColWidth(){ return paperColumns(paperWidth()); }
  function concatBytes(arrays){
    const total = arrays.reduce((s,a)=>s+a.length,0);
    const out = new Uint8Array(total);
    let offset=0;
    arrays.forEach(a=>{ out.set(a,offset); offset+=a.length; });
    return out;
  }
  function escposTextBytes(str){ return new TextEncoder().encode(str); }
  const ESC=0x1B, GS=0x1D;
  const escposInit = ()=> new Uint8Array([ESC,0x40]);
  const escposBold = on => new Uint8Array([ESC,0x45,on?1:0]);
  const escposAlign = a => new Uint8Array([ESC,0x61, a==="center"?1:a==="right"?2:0]);
  const escposCut = ()=> new Uint8Array([0x0A,0x0A,0x0A,GS,0x56,0x00]);
  const escposLine = (width)=> escposTextBytes("-".repeat(width)+"\n");
  // Forced at the start of every print job (right after escposInit()) so
  // lines stop wrapping regardless of whatever font/width state the
  // printer powered on in: condensed Font B fits more characters per mm
  // than the default Font A, and the explicit 1x1 size reset undoes any
  // double-width/double-height mode that might still be active.
  const escposFontB = ()=> new Uint8Array([ESC, 0x4D, 0x01]); // ESC M 1 — condensed Font B
  const escposNormalSize = ()=> new Uint8Array([GS, 0x21, 0x00]); // GS ! 0x00 — 1x1 character size

  async function connectUSBPrinter(){
    if(!hasUSBPrint()){ alert("USB printing isn't available in this browser. Use Chrome, with the app served via a local server (not opened as a plain file)."); return false; }
    try{
      const device = await navigator.usb.requestDevice({ filters: [] });
      await device.open();
      if(device.configuration===null) await device.selectConfiguration(1);
      let interfaceNumber, endpointNumber;
      for(const iface of device.configuration.interfaces){
        for(const alt of iface.alternates){
          const outEp = alt.endpoints.find(e=>e.direction==="out");
          if(outEp){ interfaceNumber=iface.interfaceNumber; endpointNumber=outEp.endpointNumber; break; }
        }
        if(interfaceNumber!==undefined) break;
      }
      if(endpointNumber===undefined){ alert("That USB device doesn't look like a printer (no usable data channel found)."); return false; }
      await device.claimInterface(interfaceNumber);
      window._usbPrinter = {device, endpointNumber};
      return true;
    }catch(e){
      if(e && e.name!=="NotFoundError") alert("Couldn't connect to a USB printer: "+(e.message||e));
      return false;
    }
  }
  async function usbPrintBytes(bytes){
    if(!window._usbPrinter){ const ok = await connectUSBPrinter(); if(!ok) return false; }
    try{
      await window._usbPrinter.device.transferOut(window._usbPrinter.endpointNumber, bytes);
      return true;
    }catch(e){
      alert("USB print failed — check the printer is still connected and try again: "+(e.message||e));
      window._usbPrinter = null;
      return false;
    }
  }
  function usbPrintButtonHtml(id){
    return hasUSBPrint()? `<button class="btn btn-outline" id="${id}" style="flex:none;width:auto;padding:12px">🔌</button>` : "";
  }

  // ---------------- Bluetooth (Web Bluetooth/BLE) ESC/POS printing ----------------
  // Parallel to the USB path above, same escpos* byte builders, just a
  // different transport underneath. Many cheap BLE thermal printers expose
  // a plain "serial over BLE" characteristic under one of a couple of very
  // common vendor UUIDs — since we can't know the exact printer's service
  // ahead of time, we declare both as optionalServices (GATT requires the
  // service UUID to be pre-declared to access it after connecting) and
  // discover the actual writable characteristic at connect time instead of
  // assuming one.
  const BT_SERIAL_SERVICE_UUIDS = [
    "49535343-fe7d-4ae5-8fa9-9fafd205e455", // ISSC/Microchip transparent UART
    "6e400001-b5a3-f393-e0a9-e50e24dcca9e", // Nordic UART Service
  ];
  function hasBTPrint(){ return !!(navigator.bluetooth); }
  async function connectBTPrinter(){
    if(!hasBTPrint()){ alert("Bluetooth printing isn't available in this browser. Use Chrome, with the app served via a local server (not opened as a plain file)."); return false; }
    try{
      const device = await navigator.bluetooth.requestDevice({
        acceptAllDevices: true,
        optionalServices: BT_SERIAL_SERVICE_UUIDS
      });
      const server = await device.gatt.connect();
      const services = await server.getPrimaryServices();
      let writable = null;
      for(const service of services){
        const chars = await service.getCharacteristics();
        writable = chars.find(c=> c.properties.write || c.properties.writeWithoutResponse);
        if(writable) break;
      }
      if(!writable){
        alert("Connected, but couldn't find a way to send data to it — this printer's Bluetooth mode may not be compatible with this app.");
        return false;
      }
      window._btPrinter = {device, characteristic: writable};
      return true;
    }catch(e){
      if(e && e.name!=="NotFoundError") alert("Couldn't connect to a Bluetooth printer: "+(e.message||e));
      return false;
    }
  }
  async function btPrintBytes(bytes){
    if(!window._btPrinter){ const ok = await connectBTPrinter(); if(!ok) return false; }
    try{
      const ch = window._btPrinter.characteristic;
      const canWriteWithResponse = !!ch.properties.write;
      const CHUNK = 20; // GATT writes are typically capped around 20 bytes without a negotiated MTU
      for(let i=0;i<bytes.length;i+=CHUNK){
        const chunk = bytes.slice(i, i+CHUNK);
        if(canWriteWithResponse) await ch.writeValueWithResponse(chunk);
        else await ch.writeValueWithoutResponse(chunk);
      }
      return true;
    }catch(e){
      alert("Bluetooth print failed — check the printer is still connected and try again: "+(e.message||e));
      window._btPrinter = null;
      return false;
    }
  }

  // Sends straight to whichever direct printer is already connected, with
  // no OS dialog. Bluetooth wins if both happen to be connected at once —
  // an arbitrary but reasonable tie-break, not meant to be configurable.
  // Returns false when nothing is connected, so callers can fall back to
  // the normal #printArea/printNow() dialog path.
  async function sendDirect(bytes){
    if(window._btPrinter){ await btPrintBytes(bytes); return true; }
    if(window._usbPrinter){ await usbPrintBytes(bytes); return true; }
    return false;
  }

  // Byte-building is shared between USB and Bluetooth — only the transport
  // call at the end differs, so each format is built once here.
  function buildReceiptBytes(saleId, ts, subtotal, discount, markup, voucherAmount, total, method, items){
    const w = escposColWidth();
    const shop = getSetting("shop_name","My Shop");
    const branch = getSetting("branch_name","");
    const parts = [ escposInit(), escposFontB(), escposNormalSize(), escposAlign("center"), escposBold(true),
      escposTextBytes(shop+"\n"), escposBold(false) ];
    if(branch) parts.push(escposTextBytes(branch+"\n"));
    parts.push(escposAlign("left"), escposLine(w));
    parts.push(escposTextBytes(new Date(ts).toLocaleString()+"\n"));
    parts.push(escposTextBytes("Receipt #"+saleId+"\n"));
    parts.push(escposLine(w));
    items.forEach(i=> parts.push(escposTextBytes(padLine(`${i.qty} x ${i.name}`, `${currency}${(i.price*i.qty).toFixed(2)}`, w)+"\n")));
    parts.push(escposLine(w));
    parts.push(escposTextBytes(padLine("Subtotal", `${currency}${subtotal.toFixed(2)}`, w)+"\n"));
    if(discount>0) parts.push(escposTextBytes(padLine("Discount", `-${currency}${discount.toFixed(2)}`, w)+"\n"));
    if(markup>0) parts.push(escposTextBytes(padLine("Markup", `+${currency}${markup.toFixed(2)}`, w)+"\n"));
    if(voucherAmount>0) parts.push(escposTextBytes(padLine("Voucher", `-${currency}${voucherAmount.toFixed(2)}`, w)+"\n"));
    parts.push(escposBold(true), escposTextBytes(padLine("TOTAL", `${currency}${total.toFixed(2)}`, w)+"\n"), escposBold(false));
    parts.push(escposTextBytes("Payment: "+method+"\n"));
    parts.push(escposLine(w));
    parts.push(escposAlign("center"), escposTextBytes("Thank you for your business\n"));
    parts.push(escposCut());
    return concatBytes(parts);
  }
  async function usbPrintReceipt(saleId, ts, subtotal, discount, markup, voucherAmount, total, method, items){
    await usbPrintBytes(buildReceiptBytes(saleId, ts, subtotal, discount, markup, voucherAmount, total, method, items));
  }
  async function btPrintReceipt(saleId, ts, subtotal, discount, markup, voucherAmount, total, method, items){
    await btPrintBytes(buildReceiptBytes(saleId, ts, subtotal, discount, markup, voucherAmount, total, method, items));
  }

  function buildEODBytes(summary){
    const w = escposColWidth();
    const shop = getSetting("shop_name","My Shop");
    const parts = [ escposInit(), escposFontB(), escposNormalSize(), escposAlign("center"), escposBold(true),
      escposTextBytes(shop+"\n"), escposBold(false),
      escposTextBytes("End of Day — "+summary.date+"\n"), escposAlign("left"), escposLine(w) ];
    parts.push(escposTextBytes(padLine("Sales Cash", `${currency}${summary.cash.toFixed(2)}`, w)+"\n"));
    parts.push(escposTextBytes(padLine("Sales EcoCash", `${currency}${summary.ecocash.toFixed(2)}`, w)+"\n"));
    parts.push(escposTextBytes(padLine("Sales Credit", `${currency}${summary.credit.toFixed(2)}`, w)+"\n"));
    parts.push(escposTextBytes(padLine("Less: Discounts", `-${currency}${summary.discounts.toFixed(2)}`, w)+"\n"));
    parts.push(escposBold(true), escposTextBytes(padLine("Total Sales", `${currency}${summary.totalSales.toFixed(2)}`, w)+"\n"), escposBold(false));
    parts.push(escposLine(w));
    summary.payouts.forEach(p=> parts.push(escposTextBytes(padLine(p.reason||"Payout", `-${currency}${p.amount.toFixed(2)}`, w)+"\n")));
    parts.push(escposTextBytes(padLine("Less: Payouts", `-${currency}${summary.payoutsTotal.toFixed(2)}`, w)+"\n"));
    parts.push(escposLine(w));
    parts.push(escposTextBytes(padLine("Expected Cash", `${currency}${summary.expected.toFixed(2)}`, w)+"\n"));
    parts.push(escposTextBytes(padLine("Cash Count", `${currency}${summary.counted.toFixed(2)}`, w)+"\n"));
    parts.push(escposBold(true), escposTextBytes(padLine("Variance", `${currency}${summary.variance.toFixed(2)}`, w)+"\n"), escposBold(false));
    parts.push(escposLine(w));
    parts.push(escposTextBytes("Low stock:\n"));
    if(summary.lowStock.length) summary.lowStock.forEach(p=> parts.push(escposTextBytes("- "+p.name+" ("+p.stock+")\n")));
    else parts.push(escposTextBytes("None\n"));
    parts.push(escposCut());
    return concatBytes(parts);
  }
  async function usbPrintEODBytes(summary){ await usbPrintBytes(buildEODBytes(summary)); }
  async function btPrintEODBytes(summary){ await btPrintBytes(buildEODBytes(summary)); }

  // Calibration tool: a fixed-length known string is a far more reliable
  // wrap test than any receipt's real content. Accepts an explicit column
  // count so the Settings button can test the live (unsaved) mm value
  // instead of whatever's already persisted.
  function buildTestLineBytes(w){
    w = w || escposColWidth();
    let digits = "";
    for(let i=0;i<w;i++) digits += (i%2===0? "1":"9");
    const parts = [ escposInit(), escposFontB(), escposNormalSize() ];
    parts.push(escposTextBytes(digits+"\n"));
    parts.push(escposLine(w));
    parts.push(escposTextBytes("If this line wrapped, lower the mm value above.\n"));
    parts.push(escposCut());
    return concatBytes(parts);
  }
  async function printTestLine(){
    const mm = parseFloat(document.getElementById("sPaper").value) || paperWidth();
    const w = paperColumns(mm);
    const sentDirect = await sendDirect(buildTestLineBytes(w));
    if(sentDirect) return;
    let digits = "";
    for(let i=0;i<w;i++) digits += (i%2===0? "1":"9");
    document.getElementById("printArea").innerHTML = `
      <div class="receipt">
        <div style="font-family:monospace">${digits}</div>
        <hr>
        <div>If this line wrapped, lower the mm value above.</div>
      </div>`;
    printNow(mm);
  }

  function printNow(pageSizeMm){
    let styleEl = document.getElementById("dynPageSize");
    if(!styleEl){ styleEl=document.createElement("style"); styleEl.id="dynPageSize"; document.head.appendChild(styleEl); }
    styleEl.textContent = pageSizeMm ? `@page{size:${pageSizeMm}mm auto;margin:2mm;}` : `@page{margin:10mm;}`;
    window.print();
  }

  // Reprints ANY historical sale by id, reconstructed entirely from the

  function buildSaleCopyBytes(sale, items){
    const w = escposColWidth();
    const shop = getSetting("shop_name","My Shop");

    const parts = [ escposInit(), escposFontB(), escposNormalSize(), escposAlign("center"), escposBold(true),

  // Formats a receipt-style message as 80-column monospace text, wrapped in
  // WhatsApp's ``` monospace markers so item names and amounts line up.
  function padLine(left, right, width){
    width = width||80;
    left=String(left); right=String(right);
    const gap = Math.max(1, width-left.length-right.length);
    return left + " ".repeat(gap) + right;
  }
  function receiptText(title, itemLines, totalLines){
    const bar = "-".repeat(80);
    let out = title+"\n"+bar+"\n";
    itemLines.forEach(l=> out+=l+"\n");
    out += bar+"\n";
    totalLines.forEach(l=> out+=l+"\n");
    return "```\n"+out+"```";
  }

  // Shows a "voucher available" badge + Apply button once the typed
  // customer name matches an existing customer with an Available voucher;
  // switches to a "voucher applied" pill (with a way to remove it) once
  // applied. Auto-clears if the name is edited to no longer match the
  // customer the voucher was applied for.
  function renderVoucherBox(){
    const box = document.getElementById("voucherBox");
    if(!box) return;
    const nameEl = document.getElementById("custName");
    const name = nameEl? nameEl.value.trim() : "";
    const cust = findMatchingCustomer(name);
    const totalEl = document.getElementById("drawerTotal");
    if(appliedVoucher && (!cust || cust.id!==appliedVoucher.customerId)){
      appliedVoucher = null;
      if(totalEl) totalEl.textContent = currency+cartTotal().toFixed(2);
    }
    if(!cust){ box.innerHTML=""; return; }
    if(appliedVoucher && appliedVoucher.customerId===cust.id){
      box.innerHTML = `<div class="pill ok" style="display:inline-flex;align-items:center;gap:6px;margin:6px 0">Voucher applied: -${currency}${appliedVoucher.amount.toFixed(2)} <button type="button" data-remove-voucher style="background:none;border:none;color:inherit;font-weight:700;padding:0 2px;cursor:pointer">✕</button></div>`;
      box.querySelector("[data-remove-voucher]").onclick=()=>{
        appliedVoucher = null;
        if(totalEl) totalEl.textContent = currency+cartTotal().toFixed(2);
        renderVoucherBox();
      };
      return;
    }
    const voucher = one("SELECT * FROM vouchers WHERE customer_id=? AND status='Available'",[cust.id]);
    if(!voucher){ box.innerHTML=""; return; }
    box.innerHTML = `<div class="card" style="padding:8px 10px;margin:6px 0;display:flex;justify-content:space-between;align-items:center">
      <span>🎁 Voucher available: ${currency}${voucher.amount.toFixed(2)}</span>
      <button type="button" class="btn btn-sm btn-primary" data-apply-voucher style="flex:none">Apply Voucher</button>
    </div>`;
    box.querySelector("[data-apply-voucher]").onclick=()=>{
      appliedVoucher = { id:voucher.id, amount:voucher.amount, customerId:cust.id };
      if(totalEl) totalEl.textContent = currency+cartTotal().toFixed(2);
      renderVoucherBox();
    };
  }

  // Reads an image file, crops it to a square, and re-encodes as WebP.
  function handleImageFile(file, cb){
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        const size=300;
        const canvas=document.createElement("canvas");
        canvas.width=size; canvas.height=size;
        const ctx=canvas.getContext("2d");
        const side = Math.min(img.width,img.height);
        const sx=(img.width-side)/2, sy=(img.height-side)/2;
        ctx.drawImage(img, sx,sy,side,side, 0,0,size,size);
        canvas.toBlob(blob=>{
          const r2 = new FileReader();
          r2.onload=()=> cb(r2.result);
          r2.readAsDataURL(blob);
        }, "image/webp", 0.85);
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  }

  // ---------------- Stock Dispatch & Receive (branch-to-branch transfers) ----------------
  // Available to every branch, including Remote: this only moves stock a
  // branch already has (or accepts stock sent to it) — it's not the same as
  // adding a brand-new product from scratch, so it isn't gated by isRemote()
  // the way Add Product / Import / Edit are.
  function sanitizeFilenamePart(s){ return String(s).replace(/[\\/:*?"<>|]/g,"-"); }
  // Shared filename convention for every exported .sqlite file — Settings
  // Export, the WhatsApp share button, and this dispatch auto-export all
  // use this so a file's origin and moment are unambiguous at a glance.
  function exportFilename(baseName, branch){
    const date = new Date();
    const d = date.toISOString().slice(0,10);
    const t = date.toTimeString().slice(0,8).replace(/:/g,'-');
    return `${baseName}-${sanitizeFilenamePart(branch)}-${d}-${t}.sqlite`;
  }
  function dispatchStockModal(){
    const branch = currentBranch();

    if(products.length===0){ alert("No products in this branch to dispatch."); return; }
    const branches = listBranches().filter(b=>b!==branch);
    let lineSeq = 0;
    const newLine = ()=>({ id: lineSeq++, query:"", product:null, qty:"" });

    function lineRowHtml(line, idx){

        <div class="card" style="padding:10px;margin-bottom:8px">

      if(toBranch===branch) return alert("Destination branch must be different from the current branch");

      lines.forEach(l=>{

        run("UPDATE products SET stock=stock-? WHERE id=?",[qty,l.product.id]);
        run("INSERT INTO stock_received(ts,product_id,name,qty,note,branch,user) VALUES(?,?,?,?,?,?,?)",
          [ts,l.product.id,l.product.name,-qty,`Dispatched to ${toBranch}`,branch,sessionUser||""]);
        run(`INSERT INTO stock_transfers(ts,from_branch,to_branch,product_name,sku,qty,note,user,status)
             VALUES(?,?,?,?,?,?,?,?,'Dispatched')`,
          [ts,branch,toBranch,l.product.name,l.product.sku||"",qty,note,sessionUser||""]);
      });
      logAudit("Dispatch Stock", "", `${lines.length} item${lines.length===1?"":"s"} to ${toBranch}`);
      persist();
      // Lock the file and ship it: every dispatch, regardless of how many
      // lines it contains, ends with exactly ONE export — the sender hands
      // the recipient a data file to merge in (Settings) before they
      // Receive the stock.
      downloadDb(exportFilename("Export", toBranch));
      wrap.querySelector(".modal-body").innerHTML = `
        <div class="box" style="text-align:center">
          <p style="font-size:16px;font-weight:700;margin:0 0 6px">Dispatched</p>
          <p class="muted" style="margin:0">A data file has been downloaded — send it to ${escapeHtml(toBranch)} (WhatsApp, email, USB, however you'd normally share a file) so they can merge it in under Settings and then Receive the stock on their device.</p>
        </div>
        <button class="btn btn-primary" id="dsDone" style="margin-top:12px">Done</button>
      `;
      wrap.querySelector("#dsDone").onclick=()=>{ wrap.remove(); render(); };
    };
  }
  function pendingTransfersCount(){
    return one("SELECT COUNT(*) as c FROM stock_transfers WHERE to_branch=? AND status='Dispatched'",[currentBranch()]).c;
  }
  // Receiving a transfer addressed to this branch matches an existing product
  // by SKU first (case-insensitive), falling back to exact name — and if
  // neither matches, creates a new product for this branch. That create path
  // is a deliberate, narrow exception to "Remote can't add products": accepting
  // a transfer that was explicitly sent to you is not the same as self-service
  // adding new inventory from scratch.
  function receiveTransfer(transferId){
    const t = one("SELECT * FROM stock_transfers WHERE id=?",[transferId]);
    if(!t || t.status!=="Dispatched") return;
    const branch = currentBranch();
    let prod = t.sku? one("SELECT * FROM products WHERE branch=? AND lower(sku)=lower(?)",[branch,t.sku]) : null;
    if(!prod) prod = one("SELECT * FROM products WHERE branch=? AND lower(name)=lower(?)",[branch,t.product_name]);
    const ts = new Date().toISOString();
    if(prod){
      run("UPDATE products SET stock=stock+? WHERE id=?",[t.qty,prod.id]);
    } else {
      run("INSERT INTO products(name,price,stock,low_threshold,sku,branch,image,cost,created_ts,description) VALUES(?,?,?,?,?,?,?,?,?,?)",
        [t.product_name,0,t.qty,5,t.sku||"",branch,"",0,ts,""]);
      prod = { id: one("SELECT last_insert_rowid() as id").id };
    }
    run("INSERT INTO stock_received(ts,product_id,name,qty,note,branch,user) VALUES(?,?,?,?,?,?,?)",
      [ts,prod.id,t.product_name,t.qty,`Received from ${t.from_branch}`,branch,sessionUser||""]);
    run("UPDATE stock_transfers SET status='Received', received_ts=?, received_user=? WHERE id=?",[ts,sessionUser||"",transferId]);
    logAudit("Receive Stock", t.product_name, `${t.qty} from ${t.from_branch}`);
    persist();
  }

  // ---------------- Bulk inventory import (Excel/CSV) ----------------
  let _xlsxLoading = null;
  function loadXLSX(){
    if(window.XLSX) return Promise.resolve();
    if(_xlsxLoading) return _xlsxLoading;
    _xlsxLoading = new Promise((resolve, reject)=>{
      const s = document.createElement("script");
      s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
      s.onload = ()=> resolve();
      s.onerror = ()=> reject(new Error("Could not load the Excel import library — check your internet connection."));
      document.head.appendChild(s);
    });
    return _xlsxLoading;
  }
  // Header row matches IMPORT_COLUMN_MAP's primary synonym for each field
  // exactly, so a file filled in from this template re-imports with zero
  // "unrecognized column" ambiguity.
  async function downloadImportTemplate(){
    try{
      await loadXLSX();
      const headers = ["SKU","Item Name","Search Keywords","Cost","Price","Qty","Low Stock Alert Below"];
      const ws = XLSX.utils.aoa_to_sheet([headers]);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Products");
      XLSX.writeFile(wb, "seigen-import-template.xlsx");
    }catch(e){
      alert("Couldn't build the template: " + (e.message||e));
    }
  }
  function normalizeHeader(h){ return String(h||"").trim().toLowerCase().replace(/\s+/g," "); }
  const IMPORT_COLUMN_MAP = {
    sku: ["sku"],
    name: ["item name","name","product name","item"],
    keywords: ["search keywords","keywords","search"],
    cost: ["cost"],
    price: ["price","selling price"],
    qty: ["qty","quantity","stock","stock qty"],
    threshold: ["low stock alert below","low stock","threshold","alert level"]
  };
  function findColumn(headerMap, keys){
    for(const k of keys){ if(headerMap[k]!==undefined) return headerMap[k]; }
    return null;
  }
  function parseImportRows(sheetRows){
    if(sheetRows.length===0) return [];
    const rawHeaders = Object.keys(sheetRows[0]);
    const headerMap = {};
    rawHeaders.forEach(h=> headerMap[normalizeHeader(h)] = h);
    const col = {};
    for(const field in IMPORT_COLUMN_MAP){ col[field] = findColumn(headerMap, IMPORT_COLUMN_MAP[field]); }
    return sheetRows.map((r,i)=>{
      const get = (field)=> col[field]? r[col[field]] : "";
      const name = String(get("name")||"").trim();
      const priceNum = parseFloat(get("price"));
      const sku = String(get("sku")||"").trim();
      const keywords = String(get("keywords")||"").trim();
      const cost = parseFloat(get("cost"))||0;
      const qtyNum = parseInt(get("qty"));
      const qty = isNaN(qtyNum)? 0 : qtyNum;
      const thresholdNum = parseInt(get("threshold"));
      const threshold = isNaN(thresholdNum)? 5 : thresholdNum;
      let skipReason = null;
      if(!name) skipReason = "missing Item Name";
      else if(isNaN(priceNum)) skipReason = "missing or invalid Price";
      return { rowNum:i+2, name, sku, keywords, cost, price:isNaN(priceNum)?0:priceNum, qty, threshold, skipReason };
    });
  }
  function findImportMatch(branch, row){
    let existing = null;
    if(row.sku) existing = one("SELECT * FROM products WHERE branch=? AND lower(sku)=lower(?)",[branch,row.sku]);
    if(!existing) existing = one("SELECT * FROM products WHERE branch=? AND lower(name)=lower(?)",[branch,row.name]);
    return existing;
  }
  function importInventoryModal(){
    const wrap = openModal("Import Inventory from Excel", `
      <p class="muted">Columns expected: SKU, Item Name, Search Keywords (optional), Cost, Price, Qty, Low Stock Alert Below. Column order and exact wording don't matter.</p>
      <input class="field" id="impFile" type="file" accept=".xlsx,.xls,.csv">
      <div id="impStatus" class="muted" style="margin-top:8px"></div>
    `);
    const fileInput = wrap.querySelector("#impFile");
    const status = wrap.querySelector("#impStatus");
    fileInput.onchange = async ()=>{
      const file = fileInput.files[0];
      if(!file) return;
      status.textContent = "Reading file…";
      try{
        await loadXLSX();
        const buf = await file.arrayBuffer();
        const workbook = XLSX.read(buf, {type:"array"});
        const sheet = workbook.Sheets[workbook.SheetNames[0]];
        const sheetRows = XLSX.utils.sheet_to_json(sheet, {defval:""});
        const rows = parseImportRows(sheetRows);
        renderImportPreview(wrap, rows);
      }catch(e){
        status.textContent = "Couldn't read that file: " + (e.message||e);
      }
    };
  }
  function renderImportPreview(wrap, rows){
    const branch = currentBranch();
    const valid = rows.filter(r=>!r.skipReason);
    const skipped = rows.filter(r=>r.skipReason);
    let addCount=0, updateCount=0;
    valid.forEach(r=>{ if(findImportMatch(branch,r)) updateCount++; else addCount++; });
    const previewRows = valid.slice(0,15).map(r=>`
      <tr><td>${escapeHtml(r.name)}</td><td>${escapeHtml(r.sku||"—")}</td><td>${currency}${r.price.toFixed(2)}</td><td>${r.qty}</td></tr>
    `).join("");
    wrap.querySelector(".modal-body").innerHTML = `
      <div class="box">
        <div><b>${addCount}</b> new product${addCount===1?"":"s"} will be added</div>
        <div><b>${updateCount}</b> existing product${updateCount===1?"":"s"} will be updated</div>
        <div><b>${skipped.length}</b> row${skipped.length===1?"":"s"} skipped</div>
      </div>
      ${skipped.length? `<div class="box" style="max-height:120px;overflow-y:auto">
        ${skipped.map(r=>`<div class="muted">Row ${r.rowNum}: ${escapeHtml(r.skipReason)}</div>`).join("")}
      </div>` : ""}
      ${valid.length? `<table class="simple">
        <tr><th>Name</th><th>SKU</th><th>Price</th><th>Qty</th></tr>
        ${previewRows}
      </table>
      ${valid.length>15? `<p class="muted">…and ${valid.length-15} more</p>` : ""}` : ""}
      <div class="row" style="margin-top:12px">
        <button class="btn btn-outline" id="impCancel">Cancel</button>
        <button class="btn btn-primary" id="impConfirm" ${valid.length===0?"disabled":""}>Confirm Import</button>
      </div>
    `;
    wrap.querySelector("#impCancel").onclick = ()=> wrap.remove();
    const confirmBtn = wrap.querySelector("#impConfirm");
    if(confirmBtn) confirmBtn.onclick = ()=> runImport(wrap, valid);
  }
  function runImport(wrap, rows){
    const branch = currentBranch();
    const ts = new Date().toISOString();
    let added=0, updated=0;
    rows.forEach(r=>{
      const existing = findImportMatch(branch, r);
      if(existing){
        const delta = r.qty - existing.stock;
        run("UPDATE products SET name=?,sku=?,description=?,cost=?,price=?,low_threshold=?,stock=? WHERE id=?",
          [r.name, r.sku, r.keywords, r.cost, r.price, r.threshold, r.qty, existing.id]);
        run("INSERT INTO stock_received(ts,product_id,name,qty,note,branch,user) VALUES(?,?,?,?,?,?,?)",
          [ts, existing.id, r.name, delta, "Import adjustment", branch, sessionUser||""]);
        updated++;
      } else {
        run("INSERT INTO products(name,price,stock,low_threshold,sku,branch,image,cost,created_ts,description) VALUES(?,?,?,?,?,?,?,?,?,?)",
          [r.name, r.price, r.qty, r.threshold, r.sku, branch, "", r.cost, ts, r.keywords]);
        const pid = one("SELECT last_insert_rowid() as id").id;
        run("INSERT INTO stock_received(ts,product_id,name,qty,note,branch,user) VALUES(?,?,?,?,?,?,?)",
          [ts, pid, r.name, r.qty, "Import — initial stock", branch, sessionUser||""]);
        added++;
      }
    });
    logAudit("Bulk Import", "", `${added} added, ${updated} updated`);
    persist();
    wrap.querySelector(".modal-body").innerHTML = `
      <div class="box" style="text-align:center">
        <p style="font-size:16px;font-weight:700;margin:0 0 6px">Import complete</p>
        <p class="muted" style="margin:0">${added} added, ${updated} updated</p>
      </div>
      <button class="btn btn-primary" id="impDone" style="margin-top:12px">Done</button>
    `;
    wrap.querySelector("#impDone").onclick = ()=>{ wrap.remove(); render(); };
  }

  function renderEOD(main){
    const today = new Date().toISOString().slice(0,10);
    const branch = currentBranch();
    const todaySales = all("SELECT * FROM sales WHERE branch=? AND ts LIKE ?",[branch,today+"%"]);
    const cash = todaySales.filter(s=>s.method==="Cash").reduce((s,r)=>s+r.total,0);
    const ecocash = todaySales.filter(s=>s.method==="EcoCash").reduce((s,r)=>s+r.total,0);
    const credit = todaySales.filter(s=>s.method==="Credit").reduce((s,r)=>s+r.total,0);
    const discounts = todaySales.reduce((s,r)=>s+(r.discount||0),0);
    const totalSales = cash+ecocash+credit;
    const payouts = all("SELECT * FROM payouts WHERE branch=? AND ts LIKE ? ORDER BY ts",[branch,today+"%"]);
    const payoutsTotal = payouts.reduce((s,r)=>s+r.amount,0);
    const expected = cash - payoutsTotal;
    const lowStock = all("SELECT * FROM products WHERE branch=? AND stock<=low_threshold ORDER BY stock",[branch]);

    main.innerHTML = `
      <h2>End of Day — ${today}</h2>

      run("INSERT INTO eod_sessions(date,expected_cash,counted_cash,variance,notes,branch,ts) VALUES(?,?,?,?,?,?,?)",
        [today,expected,counted,variance,"",branch,new Date().toISOString()]);

        padLine("Expected Cash", `${currency}${expected.toFixed(2)}`),
        padLine("Cash Count", `${currency}${counted.toFixed(2)}`),
        padLine("Variance", `${currency}${variance.toFixed(2)}`),
        "", `Low stock: ${lowStock.map(p=>p.name).join(", ")||"None"}`
      ];
      shareWhatsApp(receiptText(`${escapeHtml(getSetting("shop_name",""))} — EOD ${today}`, itemLines, totalLines));
    };

    function productAgeDays(p){
      const lastReceived = one("SELECT MAX(ts) as t FROM stock_received WHERE product_id=?",[p.id]);

      return Math.max(0, daysBetween(new Date(ref), new Date()));

      else if(key==="month"){ from = new Date(now.getFullYear(), now.getMonth(), 1); }

  // ---------------- Stocktake ----------------
  // One open stocktake per branch at a time. Counting is deliberately blind
  // (system_qty is never shown while counting, same principle as the EOD
  // cash count) so staff aren't biased toward matching what the system
  // expects. Cutting off closes the count and produces a variance report;
  // applying the counts to live stock is a separate, explicitly-confirmed step.
  function renderStocktake(main){
    if(stocktakeReportId) return renderStocktakeReport(main, stocktakeReportId);
    // Stocktakes are per-branch, and a device can have more than one open at
    // once (e.g. for two branches whose data has been merged onto it). Only
    // auto-jump into counting when there's exactly one open take — otherwise
    // show the list so the user picks which one to continue.
    const openTakes = all("SELECT * FROM stocktakes WHERE status='Open' ORDER BY created_ts");
    if(openTakes.length===1) return renderStocktakeCounting(main, openTakes[0]);
    renderStocktakeList(main);
  }
  function renderStocktakeList(main){
    const openTakes = all("SELECT * FROM stocktakes WHERE status='Open' ORDER BY created_ts");
    const past = all("SELECT * FROM stocktakes WHERE status='Closed' ORDER BY cutoff_ts DESC");
    main.innerHTML = `
      <p class="muted">Count physical stock and compare it against what the system expects.</p>
      <button class="btn btn-primary" id="startStocktake" style="margin-bottom:14px">+ Start Stocktake</button>
      ${openTakes.length? `
        <h3>Open Stocktakes</h3>
        ${openTakes.map(s=>`
          <div class="card" style="display:flex;justify-content:space-between;align-items:center">
            <div>
              <div style="font-weight:700">${escapeHtml(s.branch)}</div>
              <div class="muted">${escapeHtml(s.start_date)}${s.end_date?` – ${escapeHtml(s.end_date)}`:""} · Team: ${escapeHtml(s.team_names||"—")}</div>
            </div>
            <button class="btn btn-sm btn-primary" data-continue-take="${s.id}">Continue</button>
          </div>`).join("")}
      ` : ""}
      <h3>Past Stocktakes</h3>
      ${past.length===0? `<p class="muted">No stocktakes yet.</p>` : past.map(s=>`
        <div class="card" style="display:flex;justify-content:space-between;align-items:center">
          <div>
            <div style="font-weight:700">${escapeHtml(s.branch)}</div>
            <div class="muted">${escapeHtml(s.start_date)}${s.end_date?` – ${escapeHtml(s.end_date)}`:""} · Team: ${escapeHtml(s.team_names||"—")} · Closed ${s.cutoff_ts? new Date(s.cutoff_ts).toLocaleDateString() : "—"}</div>
          </div>
          <button class="btn btn-sm btn-outline" data-view-take="${s.id}">View</button>
        </div>`).join("")}
    `;
    document.getElementById("startStocktake").onclick=()=>startStocktakeModal();
    main.querySelectorAll("[data-continue-take]").forEach(b=>{
      b.onclick=()=>{ const take = one("SELECT * FROM stocktakes WHERE id=?",[+b.dataset.continueTake]); renderStocktakeCounting(main, take); };
    });
    main.querySelectorAll("[data-view-take]").forEach(b=>{
      b.onclick=()=>{ stocktakeReportId = +b.dataset.viewTake; render(); };
    });
  }
  function startStocktakeModal(){
    const today = new Date().toISOString().slice(0,10);
    const wrap = openModal("Start Stocktake", `
      <label>Branch</label>${branchSelectHtml("stBranch", currentBranch())}
      <label>Team names</label>
      <input class="field" id="stTeam" placeholder="e.g. Tapiwa, Rudo">
      <label>Start date</label>
      <input class="field" id="stStart" type="date" value="${today}">
      <label>End date (optional estimate)</label>
      <input class="field" id="stEnd" type="date">
      <p class="muted" id="stWarning" style="color:var(--danger)"></p>
      <button class="btn btn-primary" id="stConfirm" style="margin-top:12px">Start</button>
    `);
    const branchSel = wrap.querySelector("#stBranch");
    const warningEl = wrap.querySelector("#stWarning");
    function updateWarning(){
      const b = branchSel.value;
      if(!b){ warningEl.textContent = `Pick a specific branch — a stocktake can't target "All branches".`; return; }
      const existing = one("SELECT * FROM stocktakes WHERE branch=? AND status='Open'",[b]);
      warningEl.textContent = existing? `${b} already has an open stocktake — cut it off before starting another.` : "";
    }
    branchSel.onchange = updateWarning;
    updateWarning();
    wrap.querySelector("#stConfirm").onclick=()=>{
      const branch = branchSel.value;
      if(!branch) return alert(`Pick a specific branch for this stocktake — it can't target "All branches".`);
      if(one("SELECT * FROM stocktakes WHERE branch=? AND status='Open'",[branch])){
        alert(`${branch} already has an open stocktake. Cut it off before starting another.`);
        return;
      }
      const team = wrap.querySelector("#stTeam").value.trim();
      const start = wrap.querySelector("#stStart").value || today;
      const end = wrap.querySelector("#stEnd").value || "";
      run("INSERT INTO stocktakes(branch,team_names,start_date,end_date,status,created_by,created_ts) VALUES(?,?,?,?,'Open',?,?)",
        [branch, team, start, end, sessionUser||"", new Date().toISOString()]);
      persist(); wrap.remove(); render();
    };
  }
  function renderStocktakeCounting(main, take){
    const branch = take.branch;
    const products = all("SELECT * FROM products WHERE branch=? ORDER BY name",[branch]);
    const counted = all("SELECT * FROM stocktake_counts WHERE stocktake_id=?",[take.id]);
    const countMap = {}; counted.forEach(c=> countMap[c.product_id]=c);
    main.innerHTML = `
      <h3>Stocktake — ${escapeHtml(take.branch)} — ${escapeHtml(take.start_date)}${take.end_date?` to ${escapeHtml(take.end_date)}`:""}</h3>
      <p class="muted">Team: ${escapeHtml(take.team_names||"—")} · Counted ${counted.length} of ${products.length}</p>
      <p class="muted">Count what's physically on the shelf — the system's expected quantity is hidden while you count, so it doesn't bias you.</p>
      <table class="simple">
        <tr><th>Item</th><th>Shelf</th><th>Counted Qty</th></tr>
        ${products.map(p=>{
          const c = countMap[p.id];
          return `<tr>
            <td>${skuNameCellScreen(p.sku,p.name)}</td>
            <td>${escapeHtml(p.shelf||"—")}</td>
            <td><input class="field" data-count="${p.id}" type="number" min="0" style="max-width:90px" value="${c?c.counted_qty:""}" placeholder="—"></td>
          </tr>`;
        }).join("")}
      </table>
      <button class="btn btn-danger" id="cutoffStocktake" style="margin-top:14px">Cut Off & Generate Report</button>
    `;
    main.querySelectorAll("[data-count]").forEach(inp=>{
      inp.onchange=(e)=>{
        const pid = +inp.dataset.count;
        const val = e.target.value;
        if(val==="") return;
        const qty = parseInt(val)||0;
        const p = one("SELECT * FROM products WHERE id=?",[pid]);
        const existingCount = one("SELECT * FROM stocktake_counts WHERE stocktake_id=? AND product_id=?",[take.id,pid]);
        if(existingCount){
          run("UPDATE stocktake_counts SET counted_qty=?, system_qty=?, counted_ts=?, counted_by=? WHERE id=?",
            [qty, p.stock, new Date().toISOString(), sessionUser||"", existingCount.id]);
        } else {
          run("INSERT INTO stocktake_counts(stocktake_id,product_id,product_name,sku,system_qty,counted_qty,counted_ts,counted_by) VALUES(?,?,?,?,?,?,?,?)",
            [take.id, pid, p.name, p.sku||"", p.stock, qty, new Date().toISOString(), sessionUser||""]);
        }
        persist();
      };
    });
    document.getElementById("cutoffStocktake").onclick=()=>{
      if(!confirm("Cut off this stocktake? Any products not yet counted will be marked 'Not counted' in the report.")) return;
      run("UPDATE stocktakes SET status='Closed', cutoff_ts=? WHERE id=?",[new Date().toISOString(), take.id]);
      persist();
      stocktakeReportId = take.id;
      render();
    };
  }
  function computeStocktakeVariance(takeId){
    const take = one("SELECT * FROM stocktakes WHERE id=?",[takeId]);
    if(!take) return { take:null, rows:[] };
    const products = all("SELECT * FROM products WHERE branch=? ORDER BY name",[take.branch]);
    const counts = all("SELECT * FROM stocktake_counts WHERE stocktake_id=?",[takeId]);
    const countMap = {}; counts.forEach(c=> countMap[c.product_id]=c);
    const rows = products.map(p=>{
      const c = countMap[p.id];
      const counted = c? c.counted_qty : null;
      const variance = counted===null? null : counted - c.system_qty;
      return { product:p, count:c, counted, variance };
    });
    return { take, rows };
  }
  function renderStocktakeReport(main, takeId){
    const { take, rows } = computeStocktakeVariance(takeId);
    if(!take){ stocktakeReportId=null; return renderStocktakeList(main); }
    main.innerHTML = `
      <h3>Stocktake Report — ${escapeHtml(take.branch)} — ${escapeHtml(take.start_date)}${take.end_date?` to ${escapeHtml(take.end_date)}`:""}</h3>
      <p class="muted">Team: ${escapeHtml(take.team_names||"—")} · Cut off ${take.cutoff_ts? new Date(take.cutoff_ts).toLocaleString() : "—"}</p>
      <div class="card" style="overflow-x:auto">
        <table class="simple">
          <tr><th>Item</th><th>Shelf</th><th>System Qty</th><th>Counted Qty</th><th>Variance</th></tr>
          ${rows.map(r=>`<tr>
            <td>${skuNameCellScreen(r.product.sku,r.product.name)}</td>
            <td>${escapeHtml(r.product.shelf||"—")}</td>
            <td>${r.count? r.count.system_qty : r.product.stock}</td>
            <td>${r.counted===null? "Not counted" : r.counted}</td>
            <td>${r.variance===null? "—" : (r.variance>0?`+${r.variance}`:r.variance)}</td>
          </tr>`).join("")}
        </table>
      </div>
      <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
        <button class="btn btn-outline" id="printStocktake">🖨️ Print/PDF</button>
        <button class="btn btn-outline" id="backToStocktakes">Back to Stocktakes</button>
      </div>
      ${take.status==="Closed"? `<button class="btn btn-danger" id="applyStocktake" style="margin-top:10px">Apply counts to inventory</button>` : ""}
    `;
    document.getElementById("printStocktake").onclick=()=>{
      const headers = ["Item","Shelf","System Qty","Counted Qty","Variance"];
      const printRows = rows.map(r=>[skuNameCell(r.product.sku,r.product.name), escapeHtml(r.product.shelf||"—"), r.count?r.count.system_qty:r.product.stock, r.counted===null?"Not counted":r.counted, r.variance===null?"—":(r.variance>0?`+${r.variance}`:r.variance)]);
      printReport("Stocktake Report", `${take.branch} · ${take.start_date}${take.end_date?` to ${take.end_date}`:""}`, headers, printRows, "");
    };
    document.getElementById("backToStocktakes").onclick=()=>{ stocktakeReportId=null; render(); };
    const applyBtn = document.getElementById("applyStocktake");
    if(applyBtn) applyBtn.onclick=()=>{
      const toApply = rows.filter(r=>r.counted!==null && r.variance!==0);
      if(toApply.length===0){ alert("No counted items differ from system stock — nothing to apply."); return; }
      if(!confirm(`Apply ${toApply.length} counted quantities to live stock? This can't be undone.`)) return;
      toApply.forEach(r=>{
        run("UPDATE products SET stock=? WHERE id=?",[r.counted, r.product.id]);
        run("INSERT INTO stock_received(ts,product_id,name,qty,note,branch,user) VALUES(?,?,?,?,?,?,?)",
          [new Date().toISOString(), r.product.id, r.product.name, r.variance, "Stocktake adjustment", take.branch, sessionUser||""]);
      });
      logAudit("Apply Stocktake", "", `${toApply.length} products adjusted (stocktake #${take.id})`);
      persist();
      alert("Inventory updated.");
      render();
    };
  }

  // Requests / market intelligence notepad — logs stock a customer asked for
  // that isn't currently in the shop. Any branch (including Remote) can log
  // one; once another branch's data file is merged in, its requests become
  // visible here too via the branch filter, same pattern as Product List.
  //
  // Logging + the pending queue live in a shared right-side drawer (same
  // .drawer/.overlay mechanics as the cart), opened from two places: the
  // Reports page and this More → Requests page's own button — one
  // implementation, two entry points. This page itself keeps showing the
  // full history (pending + fulfilled), unchanged, as the historical view.
  function newReqLine(){ return { id: reqLineSeq++, item:"", qty:"" }; }
  function openRequestsDrawer(){
    reqLines = [ newReqLine() ];
    reqExpandedId = null;
    reqDrawerOpen = true;
    render();
