  function pendingReqRowsHtml(rows){
    if(rows.length===0) return `<p class="muted" style="padding:6px 4px">No pending requests.</p>`;
    return rows.map(r=>`
      <div class="card" data-req-row="${r.id}" style="padding:10px;margin-bottom:8px;cursor:pointer">
        <div class="pname">${escapeHtml(r.item_requested)}</div>
        <div class="pmeta">${escapeHtml(r.branch)} · ${new Date(r.ts).toLocaleDateString()} · logged by ${escapeHtml(r.user||"—")}</div>
        ${(r.customer_name||r.customer_phone)? `<div class="pmeta">${escapeHtml(r.customer_name||"")}${r.customer_phone?` · ${escapeHtml(r.customer_phone)}`:""}</div>` : ""}
        ${r.qty_wanted? `<div class="pmeta">Qty wanted: ${r.qty_wanted}</div>` : ""}
        ${r.notes? `<div class="pmeta">${escapeHtml(r.notes)}</div>` : ""}
        ${reqExpandedId===r.id? `
          <div class="row" style="margin-top:10px" data-req-actions>
            ${r.customer_phone? `<button type="button" class="btn btn-ghost btn-sm" data-msg-customer="${r.id}">📲 Message Customer</button>` : ""}
            <button type="button" class="btn btn-outline btn-sm" data-mark-fulfilled="${r.id}">✓ Mark Fulfilled</button>
          </div>` : ""}
      </div>`).join("");
  }
  function wireReqPendingRows(){
    document.querySelectorAll("[data-req-row]").forEach(card=>{
      card.onclick=(e)=>{
        if(e.target.closest("[data-req-actions]")) return;
        const id = +card.dataset.reqRow;
        reqExpandedId = (reqExpandedId===id)? null : id;
        renderRequestsDrawer();
      };
    });
    document.querySelectorAll("[data-msg-customer]").forEach(b=>{
      b.onclick=(e)=>{
        e.stopPropagation();
        const r = one("SELECT * FROM stock_requests WHERE id=?",[+b.dataset.msgCustomer]);
        if(!r) return;
        const msg = `Hi ${r.customer_name||"there"}, following up on your request for "${r.item_requested}" — it's arrived / being followed up on.`;
        shareWhatsApp(msg, r.customer_phone);
      };
    });
    document.querySelectorAll("[data-mark-fulfilled]").forEach(b=>{
      b.onclick=(e)=>{
        e.stopPropagation();
        run("UPDATE stock_requests SET fulfilled=1 WHERE id=?",[+b.dataset.markFulfilled]);
        persist();
        reqExpandedId = null;
        renderRequestsDrawer();
        renderStockRequestsListOnly();
      };
    });
  }
  function renderRequestsDrawer(){
    const drawer = document.getElementById("reqDrawer");
    if(!drawer) return;
    const branch = reqBranch;
    const pending = branch? all("SELECT * FROM stock_requests WHERE branch=? AND fulfilled=0 ORDER BY ts DESC",[branch])
                          : all("SELECT * FROM stock_requests WHERE fulfilled=0 ORDER BY ts DESC");
    drawer.innerHTML = `
      <div class="drawer-head"><h3 style="margin:0">Log Request</h3><button class="close-x" id="closeReqDrawer">✕</button></div>
      <div class="drawer-body">
        <label style="margin-top:0">Customer name (optional)</label>
        <input class="field" id="reqCustName" placeholder="Full name">
        <label>Customer phone (optional)</label>
        <input class="field" id="reqCustPhone" placeholder="e.g. 077xxxxxxx">
        <div class="hr"></div>
        <div id="reqLinesWrap"></div>
        <button type="button" class="btn btn-outline btn-sm" id="reqAddLine" style="margin-top:4px">+ Add Line</button>
        <label>Notes (optional)</label>
        <input class="field" id="reqNotesShared" placeholder="e.g. willing to wait, asked twice">
        <button class="btn btn-primary" id="reqSubmit" style="margin-top:12px">Log Request</button>
        <div class="hr"></div>
        <h3>Pending Requests</h3>
        <label>Branch</label>${branchSelectHtml("reqDrawerBranchSel", reqBranch)}
        <div id="reqPendingList" style="margin-top:8px">${pendingReqRowsHtml(pending)}</div>
      </div>
    `;
    document.getElementById("closeReqDrawer").onclick=()=>{ reqDrawerOpen=false; render(); };
    const linesWrap = document.getElementById("reqLinesWrap");
    function renderReqLines(){
      linesWrap.innerHTML = reqLines.map((l,i)=>`
        <div class="card" style="padding:10px;margin-bottom:8px">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
            <span class="muted" style="font-size:11.5px;font-weight:700">ITEM ${i+1}</span>
            <button type="button" class="close-x" data-remove-reqline="${l.id}" title="Remove line" style="font-size:15px;padding:2px 6px">✕</button>
          </div>
          <label style="margin-top:0">Item requested</label>
          <input class="field" data-req-item="${l.id}" placeholder="e.g. 13mm socket set" value="${escapeHtml(l.item)}">
          <label>Qty wanted (optional)</label>
          <input class="field" data-req-qty="${l.id}" type="number" placeholder="0" value="${escapeHtml(String(l.qty))}">
        </div>`).join("");
      reqLines.forEach(l=>{
        const itemInput = linesWrap.querySelector(`[data-req-item="${l.id}"]`);
        if(itemInput) itemInput.oninput=(e)=>{ l.item=e.target.value; };
        const qtyInput = linesWrap.querySelector(`[data-req-qty="${l.id}"]`);
        if(qtyInput) qtyInput.oninput=(e)=>{ l.qty=e.target.value; };
        const removeBtn = linesWrap.querySelector(`[data-remove-reqline="${l.id}"]`);
        if(removeBtn) removeBtn.onclick=()=>{
          if(reqLines.length===1) reqLines[0]=newReqLine();
          else reqLines = reqLines.filter(x=>x.id!==l.id);
          renderReqLines();
        };
      });
    }
    renderReqLines();
    document.getElementById("reqAddLine").onclick=()=>{ reqLines.push(newReqLine()); renderReqLines(); };
    document.getElementById("reqSubmit").onclick=()=>{
      const custName = document.getElementById("reqCustName").value.trim();
      const custPhone = document.getElementById("reqCustPhone").value.trim();
      const notes = document.getElementById("reqNotesShared").value.trim();
      const validLines = reqLines.filter(l=>l.item.trim());
      if(validLines.length===0) return alert("Enter at least one item requested");
      const ts = new Date().toISOString();
      const branchNow = currentBranch();
      validLines.forEach(l=>{
        const qty = l.qty? parseInt(l.qty) : null;
        run("INSERT INTO stock_requests(ts,branch,user,item_requested,customer_name,customer_phone,qty_wanted,notes,fulfilled) VALUES(?,?,?,?,?,?,?,?,0)",
          [ts, branchNow, sessionUser||"", l.item.trim(), custName, custPhone, qty, notes]);
      });
      persist();
      reqLines = [ newReqLine() ];
      render();
      renderStockRequestsListOnly();
    };
    document.getElementById("reqDrawerBranchSel").onchange=(e)=>{ reqBranch=e.target.value; renderRequestsDrawer(); };
    wireReqPendingRows();
  }

  // ---------------- Purchasing & Receiving + COGS Recovery (Main branch only) ----------------
  // Cost/financial data, same precedent as the Margin Report — this whole
  // module is hidden for Remote branches, not just gated at the action level.
  // Cart-style line items, each with a live search-as-you-type product
  // picker (reusing searchProducts exactly as the Sell screen does) so
  // staff tap a match instead of retyping a name that has to align exactly
  // with what's already in the database. Typing something with no match
  // is still allowed to stand as a brand-new product, same find-or-create
  // fallback the single-item version used.
  function recordPurchaseModal(){
    const branch = currentBranch();
    let lineSeq = 0;
    const newLine = ()=>({ id: lineSeq++, query:"", product:null, qty:"", unitCost:"" });
    let lines = [ newLine() ];

    const wrap = openModal("Record Purchase", `
      <label>Supplier</label>
      <input class="field" id="puSupplier" placeholder="e.g. Metro Wholesalers">
      <label>Note (optional)</label>
      <input class="field" id="puNote" placeholder="e.g. invoice #1234">
      <div class="hr"></div>
      <div id="puLines"></div>
      <button class="btn btn-outline btn-sm" id="puAddLine" style="margin-top:4px">+ Add Line</button>
      <button class="btn btn-primary" id="puConfirm" style="margin-top:14px">Record Purchase</button>
    `);
    const linesEl = wrap.querySelector("#puLines");

    function dropdownHtml(line){
      if(line.product || !line.query.trim()) return "";
      const matches = searchProducts(line.query, branch).slice(0,6);
      return `<div class="card" style="padding:4px;margin-top:4px;max-height:150px;overflow-y:auto">
        ${matches.length? matches.map(m=>`<button type="button" data-pick="${line.id}:${m.id}" style="display:block;width:100%;text-align:left;background:none;border:none;padding:8px;font-size:13px;border-bottom:1px solid var(--border)">${escapeHtml(m.sku?m.sku+" — ":"")}${escapeHtml(m.name)}</button>`).join("")
                  : `<div class="muted" style="padding:6px;font-size:12.5px">No match — "${escapeHtml(line.query.trim())}" will be added as a new product</div>`}
      </div>`;
    }
    function wireDropdown(line){
      const dd = linesEl.querySelector(`[data-dropdown="${line.id}"]`);
      if(!dd) return;
      dd.querySelectorAll("[data-pick]").forEach(btn=>{
        btn.onclick=()=>{
          const [,pid] = btn.dataset.pick.split(":");
          line.product = one("SELECT * FROM products WHERE id=?",[+pid]);
          line.query = line.product.name;
          renderLines();
        };
      });
    }
    function lineRowHtml(line, idx){
      return `
        <div class="card" style="padding:10px;margin-bottom:8px">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
            <span class="muted" style="font-size:11.5px;font-weight:700">LINE ${idx+1}</span>
            <button type="button" class="close-x" data-remove-line="${line.id}" title="Remove line" style="font-size:15px;padding:2px 6px">✕</button>
          </div>
          <label style="margin-top:0">Product</label>
          ${line.product
            ? `<p class="muted" style="margin:0 0 4px">Matched: <b>${escapeHtml(line.product.sku?line.product.sku+" — ":"")}${escapeHtml(line.product.name)}</b> <button type="button" data-clear-match="${line.id}" style="background:none;border:none;color:var(--orange);text-decoration:underline;padding:0;font-size:12px;margin-left:4px">change</button></p>`
            : `<input class="field" data-product-input="${line.id}" placeholder="Search by name or SKU, or type a new item" value="${escapeHtml(line.query)}" autocomplete="off">
               <div data-dropdown="${line.id}">${dropdownHtml(line)}</div>`}
          <div class="row" style="margin-top:8px">
            <div><label>Qty</label><input class="field" data-qty="${line.id}" type="number" min="1" value="${escapeHtml(String(line.qty))}" placeholder="0"></div>
            <div><label>Unit Cost (${currency})</label><input class="field" data-unitcost="${line.id}" type="number" step="0.01" value="${escapeHtml(String(line.unitCost))}" placeholder="0.00"></div>
          </div>
        </div>`;
    }
    function renderLines(){
      linesEl.innerHTML = lines.map((l,i)=>lineRowHtml(l,i)).join("");
      lines.forEach(line=>{
        const input = linesEl.querySelector(`[data-product-input="${line.id}"]`);
        if(input) input.oninput=(e)=>{
          line.query = e.target.value;
          line.product = null;
          const dd = linesEl.querySelector(`[data-dropdown="${line.id}"]`);
          if(dd){ dd.innerHTML = dropdownHtml(line); wireDropdown(line); }
        };
        wireDropdown(line);
        const clearBtn = linesEl.querySelector(`[data-clear-match="${line.id}"]`);
        if(clearBtn) clearBtn.onclick=()=>{ line.product=null; renderLines(); };
        const qtyInput = linesEl.querySelector(`[data-qty="${line.id}"]`);
        if(qtyInput) qtyInput.oninput=(e)=>{ line.qty = e.target.value; };
        const costInput = linesEl.querySelector(`[data-unitcost="${line.id}"]`);
        if(costInput) costInput.oninput=(e)=>{ line.unitCost = e.target.value; };
        const removeBtn = linesEl.querySelector(`[data-remove-line="${line.id}"]`);
        if(removeBtn) removeBtn.onclick=()=>{
          if(lines.length===1) lines[0] = newLine();
          else lines = lines.filter(x=>x.id!==line.id);
          renderLines();
        };
      });
    }
    renderLines();
    wrap.querySelector("#puAddLine").onclick=()=>{ lines.push(newLine()); renderLines(); };

    wrap.querySelector("#puConfirm").onclick=()=>{
      const supplier = wrap.querySelector("#puSupplier").value.trim();
      const note = wrap.querySelector("#puNote").value.trim();
      if(!supplier) return alert("Enter the supplier");
      for(let i=0;i<lines.length;i++){
        const l = lines[i];
        const typed = l.product? l.product.name : l.query.trim();
        const qty = parseInt(l.qty)||0;
        const unitCost = parseFloat(l.unitCost);
        if(!typed) return alert(`Line ${i+1}: enter or select a product`);
        if(qty<1) return alert(`Line ${i+1}: enter a quantity of at least 1`);
        if(isNaN(unitCost) || unitCost<0) return alert(`Line ${i+1}: enter a valid unit cost`);
      }
      const ts = new Date().toISOString();
      const newProductNames = [];
      lines.forEach(l=>{
        const typed = l.product? l.product.name : l.query.trim();
        const qty = parseInt(l.qty)||0;
        const unitCost = parseFloat(l.unitCost)||0;
        const totalCost = qty*unitCost;
        let prod = l.product;
        if(!prod){
          prod = one("SELECT * FROM products WHERE branch=? AND lower(sku)=lower(?)",[branch,typed])
               || one("SELECT * FROM products WHERE branch=? AND lower(name)=lower(?)",[branch,typed]);
        }
        if(prod){
          run("UPDATE products SET stock=stock+?, cost=? WHERE id=?",[qty,unitCost,prod.id]);
        } else {
          run("INSERT INTO products(name,price,stock,low_threshold,sku,branch,image,cost,created_ts,description) VALUES(?,?,?,?,?,?,?,?,?,?)",
            [typed,0,qty,5,"",branch,"",unitCost,ts,""]);
          prod = { id: one("SELECT last_insert_rowid() as id").id, name: typed, sku:"" };
          newProductNames.push(typed);
        }
        run("INSERT INTO purchases(ts,branch,user,supplier,product_id,product_name,sku,qty,unit_cost,total_cost,note) VALUES(?,?,?,?,?,?,?,?,?,?,?)",
          [ts,branch,sessionUser||"",supplier,prod.id,prod.name,prod.sku||"",qty,unitCost,totalCost,note]);
        run("INSERT INTO stock_received(ts,product_id,name,qty,note,branch,user) VALUES(?,?,?,?,?,?,?)",
          [ts,prod.id,prod.name,qty,`Purchased from ${supplier}`,branch,sessionUser||""]);
      });
      logAudit("Record Purchase", "", `${lines.length} item${lines.length===1?"":"s"} from ${supplier}`);
      persist(); wrap.remove(); render();
      if(newProductNames.length) alert(`${newProductNames.join(", ")} ${newProductNames.length===1?"was":"were"} created with no selling price — set ${newProductNames.length===1?"it":"them"} via Edit on the Products page.`);
    };
  }
  function renderPurchasing(main){
    const branch = currentBranch();
    const seedMoney = parseFloat(getSetting("seed_money","0"))||0;
    const cogsRecovered = one(`SELECT COALESCE(SUM(si.cost*si.qty),0) as t FROM sale_items si JOIN sales s ON s.id=si.sale_id WHERE s.branch=?`,[branch]).t;
    const pctRecovered = seedMoney>0? (cogsRecovered/seedMoney*100) : null;
    const fullyRecovered = seedMoney>0 && cogsRecovered>=seedMoney;
    const purchases = all("SELECT * FROM purchases WHERE branch=? ORDER BY ts DESC LIMIT 200",[branch]);
    const groups = groupPurchases(purchases);
    main.innerHTML = `
      <div class="card">
        <h3>Capital Recovery</h3>
        <div class="subline"><span>Seed Money / Starting Capital</span><span>${currency}${seedMoney.toFixed(2)}</span></div>
        <div class="subline"><span>Total COGS Recovered</span><span>${currency}${cogsRecovered.toFixed(2)}</span></div>
        <div class="subline"><span>% Recovered</span><span>${pctRecovered===null? "—" : pctRecovered.toFixed(1)+"%"}</span></div>
        ${fullyRecovered
          ? `<div class="subline"><span>Status</span><span style="color:var(--success);font-weight:700">Fully recovered — ${currency}${(cogsRecovered-seedMoney).toFixed(2)} surplus</span></div>`
          : `<div class="subline"><span>Remaining to Recover</span><span>${currency}${Math.max(0,seedMoney-cogsRecovered).toFixed(2)}</span></div>`}
        <button class="btn btn-outline btn-sm" id="editSeedMoney" style="margin-top:8px">Edit Seed Money in Settings</button>
      </div>
      <button class="btn btn-primary" id="openRecordPurchase" style="margin-bottom:12px">+ Record Purchase</button>
      <h3>Recent Purchases</h3>
      ${groups.length===0? `<p class="muted">No purchases recorded yet.</p>` : groups.map(g=>{
        const groupTotal = g.items.reduce((s,it)=>s+it.total_cost,0);
        return `<div class="card">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
            <div>
              <div style="font-weight:700">${escapeHtml(g.supplier)}</div>
              <div class="muted">${new Date(g.ts).toLocaleString()}${g.note? ` · ${escapeHtml(g.note)}` : ""}</div>
            </div>
            <div style="font-weight:700;flex:none">${currency}${groupTotal.toFixed(2)}</div>
          </div>
          <div class="hr" style="margin:8px 0"></div>
          ${g.items.map(it=>`
            <div class="product-row" style="padding:6px 0">
              <div>
                <div class="pname">${escapeHtml(it.product_name)}</div>
                <div class="pmeta">Qty ${it.qty} @ ${currency}${it.unit_cost.toFixed(2)}</div>
              </div>
              <div>${currency}${it.total_cost.toFixed(2)}</div>
            </div>`).join("")}
        </div>`;
      }).join("")}
    `;
    document.getElementById("editSeedMoney").onclick=()=>{ moreTab="settings"; render(); };
    document.getElementById("openRecordPurchase").onclick=()=>recordPurchaseModal();
  }
  // Lines recorded together via recordPurchaseModal() share one ts+supplier,
  // which is the only signal we have to regroup them for display — there's
  // no separate "purchase batch" id in the schema.
  function groupPurchases(purchases){
    const groups = {}; const order = [];
    purchases.forEach(p=>{
      const key = p.ts+"|"+p.supplier;
      if(!groups[key]){ groups[key] = { ts:p.ts, supplier:p.supplier, note:p.note, items:[] }; order.push(key); }
      groups[key].items.push(p);
    });
    return order.map(k=>groups[k]);
  }

  // ---------------- Report Writer (view reports on screen, not just print) ----------------
  // Each config's fetch() returns {headers, rows, footer} using the exact
  // same queries as the matching card in the Reports tab, so the on-screen
  // view and the printed PDF are always guaranteed to agree.
  const REPORT_CONFIGS = [
    { id:"sales", label:"Sales Report", hasDate:true,
      fetch(b,fromTs,toTs){
        const sales = b? all("SELECT * FROM sales WHERE branch=? AND ts>=? AND ts<=? ORDER BY ts",[b,fromTs,toTs])
                        : all("SELECT * FROM sales WHERE ts>=? AND ts<=? ORDER BY ts",[fromTs,toTs]);
        const rows = sales.map(s=>[`<button type="button" class="btn btn-outline btn-sm" data-view-sale="${s.id}" style="padding:4px 10px;font-size:12px">${s.id}</button>`, new Date(s.ts).toLocaleString(), escapeHtml(s.branch||""), s.method, currency+s.subtotal.toFixed(2), currency+s.discount.toFixed(2), currency+(s.markup||0).toFixed(2), currency+s.total.toFixed(2)]);
        const grand = sales.reduce((s,r)=>s+r.total,0);
        return { headers:["Receipt#","Date/Time","Branch","Method","Subtotal","Discount","Markup","Total"], rows, footer:`Grand Total: ${currency}${grand.toFixed(2)}` };
      }
    },
    { id:"inventory", label:"Inventory Report", hasDate:false,
      fetch(b){
        const products = b? all("SELECT * FROM products WHERE branch=? ORDER BY name",[b]) : all("SELECT * FROM products ORDER BY branch,name");
        const rows = products.map(p=> b? [skuNameCell(p.sku,p.name), p.stock] : [skuNameCell(p.sku,p.name), escapeHtml(p.branch), p.stock]);
        const headers = b? ["Item","Qty"] : ["Item","Branch","Qty"];
        return { headers, rows, footer:"" };
      }
    },
    { id:"stock", label:"Stock Received Report", hasDate:true,
      fetch(b,fromTs,toTs){
        const recs = b? all("SELECT * FROM stock_received WHERE branch=? AND ts>=? AND ts<=? ORDER BY ts",[b,fromTs,toTs])
                       : all("SELECT * FROM stock_received WHERE ts>=? AND ts<=? ORDER BY ts",[fromTs,toTs]);
        const rows = recs.map(r=> b? [new Date(r.ts).toLocaleString(), escapeHtml(r.name), r.qty, escapeHtml(r.note||"")]
                                    : [new Date(r.ts).toLocaleString(), escapeHtml(r.branch), escapeHtml(r.name), r.qty, escapeHtml(r.note||"")]);
        const headers = b? ["Date/Time","Product","Qty","Note"] : ["Date/Time","Branch","Product","Qty","Note"];
        const totalQty = recs.reduce((s,r)=>s+r.qty,0);
        return { headers, rows, footer:`Total units received: ${totalQty}` };
      }
    },
    { id:"lowstock", label:"Low Stock Report", hasDate:false,
      fetch(b){
        const lowStock = b? all("SELECT * FROM products WHERE branch=? AND stock<=low_threshold ORDER BY stock",[b])
                           : all("SELECT * FROM products WHERE stock<=low_threshold ORDER BY branch,stock");
        const rows = lowStock.map(p=> b? [skuNameCell(p.sku,p.name), p.stock, p.low_threshold] : [skuNameCell(p.sku,p.name), escapeHtml(p.branch), p.stock, p.low_threshold]);
        const headers = b? ["Item","Current Stock","Alert Level"] : ["Item","Branch","Current Stock","Alert Level"];
        return { headers, rows, footer:"" };
      }
    },
    { id:"credit", label:"Credit Sales Report", hasDate:true,
      fetch(b,fromTs,toTs){
        const customers = all("SELECT * FROM customers ORDER BY name");
        const rows = []; let totalDebt=0, totalPaid=0;
        customers.forEach(c=>{
          const debt = b? one("SELECT COALESCE(SUM(total),0) as t FROM sales WHERE customer_id=? AND method='Credit' AND branch=? AND ts>=? AND ts<=?",[c.id,b,fromTs,toTs]).t
                         : one("SELECT COALESCE(SUM(total),0) as t FROM sales WHERE customer_id=? AND method='Credit' AND ts>=? AND ts<=?",[c.id,fromTs,toTs]).t;
          const paid = b? one("SELECT COALESCE(SUM(amount),0) as t FROM credit_payments WHERE customer_id=? AND branch=? AND ts>=? AND ts<=?",[c.id,b,fromTs,toTs]).t
                         : one("SELECT COALESCE(SUM(amount),0) as t FROM credit_payments WHERE customer_id=? AND ts>=? AND ts<=?",[c.id,fromTs,toTs]).t;
          const balance = customerBalance(c.id);
          if(debt>0 || paid>0){ rows.push([escapeHtml(c.name), currency+debt.toFixed(2), currency+paid.toFixed(2), currency+balance.toFixed(2)]); totalDebt+=debt; totalPaid+=paid; }
        });
        return { headers:["Customer","Credit Given","Payments","Current Balance"], rows, footer:`Period totals — Credit: ${currency}${totalDebt.toFixed(2)} | Payments: ${currency}${totalPaid.toFixed(2)}` };
      }
    },
    { id:"discount", label:"Discount Report", hasDate:true,
      fetch(b,fromTs,toTs){
        const sales = b? all("SELECT * FROM sales WHERE branch=? AND discount>0 AND ts>=? AND ts<=? ORDER BY ts",[b,fromTs,toTs])
                        : all("SELECT * FROM sales WHERE discount>0 AND ts>=? AND ts<=? ORDER BY ts",[fromTs,toTs]);
        const rows = sales.map(s=>{
          const cust = s.customer_id? one("SELECT name FROM customers WHERE id=?",[s.customer_id]) : null;
          return [new Date(s.ts).toLocaleString(), s.id, escapeHtml(cust?cust.name:"—"), currency+s.subtotal.toFixed(2), currency+s.discount.toFixed(2), currency+s.total.toFixed(2), escapeHtml(s.discount_reason||""), escapeHtml(s.discount_status||"")];
        });
        const totalDisc = sales.reduce((s,r)=>s+r.discount,0);
        return { headers:["Date","Receipt#","Customer","Amount","Discount","Cash Paid","Reason","Status"], rows, footer:`Total discounts given: ${currency}${totalDisc.toFixed(2)}` };
      }
    },
    // Per-staff commission summary — not remoteHidden, same visibility rule
    // as Discount Report: markup is about selling price, not cost, so it's
    // fine for Remote branches to see.
    { id:"markup", label:"Markup Report", hasDate:true,
      fetch(b,fromTs,toTs){
        const sales = b? all("SELECT * FROM sales WHERE branch=? AND markup>0 AND ts>=? AND ts<=?",[b,fromTs,toTs])
                        : all("SELECT * FROM sales WHERE markup>0 AND ts>=? AND ts<=?",[fromTs,toTs]);
        const byUser = {};
        sales.forEach(s=>{
          const user = s.user||"—";
          if(!byUser[user]) byUser[user] = {count:0, total:0};
          byUser[user].count++; byUser[user].total += s.markup;
        });

        return { headers, rows, footer:"" };

    },
    { id:"salestrend", label:"Sales Trend", hasDate:true, hasGranularity:true,
      fetch(b,fromTs,toTs,granularity){
        const sales = b? all("SELECT * FROM sales WHERE branch=? AND ts>=? AND ts<=? ORDER BY ts",[b,fromTs,toTs])
                        : all("SELECT * FROM sales WHERE ts>=? AND ts<=? ORDER BY ts",[fromTs,toTs]);
        function bucketKey(ts){
          if(granularity==="month") return ts.slice(0,7);
          if(granularity==="year") return ts.slice(0,4);
          if(granularity==="week"){
            // Simple Monday-start bucketing, computed off the date portion
            // only (as a local midnight) so it doesn't need to be strict
            // ISO-8601 or worry about UTC/local skew near midnight.
            const d = new Date(ts.slice(0,10)+"T00:00:00");
            const day = d.getDay();
            const diff = day===0? -6 : 1-day;
            d.setDate(d.getDate()+diff);
            const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), dd=String(d.getDate()).padStart(2,"0");
            return `${y}-${m}-${dd}`;
          }
          return ts.slice(0,10); // day (default)

        const buckets = {};

        const chartData = sortedKeys.map(k=>({label:k, value:buckets[k]}));
        const rows = sortedKeys.map(k=>[k, currency+buckets[k].toFixed(2)]);
        const grand = sortedKeys.reduce((s,k)=>s+buckets[k],0);
        return { headers:["Period","Total Sales"], rows, footer:`Grand Total: ${currency}${grand.toFixed(2)}`, chartData };
      }
    },
  ];

  // Hand-built inline SVG bar chart — no charting library. Bars are scaled
  // to the tallest bucket, capped at a sensible max width and centered so a
  // 1-2 bucket range doesn't render as one giant blob, and labels rotate +
  // abbreviate past ~10 buckets so they stay legible instead of overlapping.
  function abbreviateChartLabel(label){
    return /^\d{4}-\d{2}-\d{2}$/.test(label)? label.slice(5) : label;
  }
  function renderBarChartSvg(chartData){
    if(!chartData || chartData.length===0) return `<p class="muted">No data to chart.</p>`;
    const w=600, h=200, padBottom=46, padTop=14;
    const maxVal = Math.max(...chartData.map(d=>d.value), 0.01);
    const n = chartData.length;
    const gap = 6;
    const idealWidth = (w - gap*(n+1)) / n;
    const barWidth = Math.max(4, Math.min(idealWidth, 56));
    const totalBarsWidth = n*barWidth + (n-1)*gap;
    const startX = Math.max(gap, (w-totalBarsWidth)/2);
    const manyBars = n > 10;
    const bars = chartData.map((d,i)=>{
      const x = startX + i*(barWidth+gap);
      const barH = Math.max(1, (d.value/maxVal) * (h-padTop-padBottom));
      const y = h - padBottom - barH;
      const cx = x + barWidth/2;
      const labelY = h - padBottom + (manyBars? 10 : 16);
      const label = manyBars? abbreviateChartLabel(d.label) : d.label;
      const textAttrs = manyBars
        ? `text-anchor="end" transform="rotate(-40 ${cx.toFixed(1)} ${labelY.toFixed(1)})"`
        : `text-anchor="middle"`;
      return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barWidth.toFixed(1)}" height="${barH.toFixed(1)}" rx="2" style="fill:var(--orange)"></rect>
        <text x="${cx.toFixed(1)}" y="${labelY.toFixed(1)}" font-size="${manyBars?8.5:11}" style="fill:var(--ink-soft)" ${textAttrs}>${escapeHtml(label)}</text>`;
    }).join("");
    return `<div class="card" style="overflow-x:auto;padding:10px 6px">
      <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:200px;display:block" preserveAspectRatio="xMidYMid meet">${bars}</svg>
    </div>`;
  }
  function runReportWriter(){
    const configs = reportWriterConfigs();
    const selected = configs.find(c=>c.id===rwType);

    let granularity;
    if(selected.hasGranularity){

    const data = selected.fetch(b, fromTs, toTs, granularity);
    window._rwLastData = { title:selected.label, subtitle:`${b||"All branches"}${selected.hasDate? ` · ${rwFrom} to ${rwTo}`:""}`, headers:data.headers, rows:data.rows, footer:data.footer };

    target.innerHTML = `
      ${data.chartData? renderBarChartSvg(data.chartData) : ""}

        <div class="hr"></div>

        <input type="file" id="replaceDb" accept=".sqlite,.db">
      </div>`;

  function wireBackupMergeSection(){
    document.getElementById("exportDb").onclick=()=> downloadDb(exportFilename("Export", currentBranch()));
    document.getElementById("shareDb").onclick=()=> shareOrDownloadDb(exportFilename("Export", currentBranch()));
    const folderBtn = document.getElementById("chooseExportFolder");
    if(folderBtn) folderBtn.onclick=async ()=>{
      try{
        exportDirHandle = await window.showDirectoryPicker();
        render();
      }catch(e){ /* user cancelled the picker */ }
    };
    document.getElementById("mergeDb").onchange=(e)=>{
      const file = e.target.files[0];
      if(!file) return;
      downloadDb(`seigen-backup-before-merge-${new Date().toISOString().replace(/[:.]/g,"-")}.sqlite`);
      const reader = new FileReader();
      reader.onload = async ()=>{
        try{
          await mergeDatabase(new Uint8Array(reader.result));
          persist(); render();
          alert("Merge complete.");
        }catch(err){ alert("Could not merge that file. Make sure it's a valid seiGEN Commerce Lite export."); }
      };
      reader.readAsArrayBuffer(file);
    };
    document.getElementById("replaceDb").onchange=(e)=>{
      const file = e.target.files[0];
      if(!file) return;
      if(!confirm("This will replace ALL current data with the imported file. A backup of your current data downloads first. Continue?")) return;
      downloadDb(`seigen-backup-before-replace-${new Date().toISOString().replace(/[:.]/g,"-")}.sqlite`);
      const reader = new FileReader();
      reader.onload = async ()=>{
        const bytes = new Uint8Array(reader.result);
        db = new SQL.Database(bytes);
        db.run(SCHEMA); migrate(db);
        currency = getSetting("currency","$");
        backfillBranch(db, currentBranch());
        await persist();
        render();
        alert("Data imported.");
      };
      reader.readAsArrayBuffer(file);
    };
  }

  function downloadDb(filename){
    const bytes = db.export();
    const blob = new Blob([bytes], {type:"application/x-sqlite3"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    a.click();
    saveCopyToExportFolder(bytes, filename);
  }
  // Best-effort mirror of an export into the folder chosen via
  // window.showDirectoryPicker() (Section 11) — a no-op when no folder has
  // been chosen, or when the handle's permission has lapsed since.
  async function saveCopyToExportFolder(bytes, filename){
    if(!exportDirHandle) return;
    try{
      const fileHandle = await exportDirHandle.getFileHandle(filename, {create:true});
      const writable = await fileHandle.createWritable();
      await writable.write(bytes);
      await writable.close();
    }catch(e){ /* best-effort only */ }
  }
  // Shares the export directly into WhatsApp (or whatever the OS share
  // sheet offers) via the Web Share API when the browser supports sharing
  // files, falling back to the normal download otherwise.
  async function shareOrDownloadDb(filename){
    const bytes = db.export();
    const file = new File([bytes], filename, {type:"application/x-sqlite3"});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      try{
        await navigator.share({files:[file], title:filename});
        saveCopyToExportFolder(bytes, filename);
        return;
      }catch(e){
        if(e && e.name==="AbortError") return;
      }
    }
    downloadDb(filename);
    alert("Your browser doesn't support direct sharing — the file has been downloaded instead; attach it in WhatsApp manually.");
  }

  // ---------------- merge ----------------
  async function mergeDatabase(bytes){
    const impDb = new SQL.Database(bytes);
    impDb.run(SCHEMA); migrate(impDb);
    const impBranch = getSettingX(impDb,"branch_name","") || getSettingX(impDb,"shop_name","") || "Imported Branch";
    backfillBranch(impDb, impBranch);

    const prodMap = {};
    allX(impDb,"SELECT * FROM products").forEach(p=>{
      const existing = one("SELECT * FROM products WHERE name=? AND branch=?",[p.name,p.branch]);
      if(existing){ prodMap[p.id]=existing.id; }
      else{
        run("INSERT INTO products(name,price,stock,low_threshold,sku,branch,image,cost,created_ts,description) VALUES(?,?,?,?,?,?,?,?,?,?)",
          [p.name,p.price,p.stock,p.low_threshold,p.sku||"",p.branch,p.image||"",p.cost||0,p.created_ts||new Date().toISOString(),p.description||""]);
        prodMap[p.id] = one("SELECT last_insert_rowid() as id").id;
      }
    });

    const custMap = {};
    allX(impDb,"SELECT * FROM customers").forEach(c=>{
      const existing = one("SELECT * FROM customers WHERE lower(name)=lower(?) AND COALESCE(phone,'')=COALESCE(?,'')",[c.name,c.phone]);
      if(existing){ custMap[c.id]=existing.id; }
      else{
        run("INSERT INTO customers(name,phone,branch) VALUES(?,?,?)",[c.name,c.phone,c.branch]);
        custMap[c.id]=one("SELECT last_insert_rowid() as id").id;
      }
    });

    const saleMap = {}; const newSaleImpIds = new Set();
    allX(impDb,"SELECT * FROM sales").forEach(s=>{
      const dup = one("SELECT id FROM sales WHERE branch=? AND ts=?",[s.branch,s.ts]);
      if(dup){ saleMap[s.id]=dup.id; return; }
      const newCustId = s.customer_id? (custMap[s.customer_id]||null) : null;
      run(`INSERT INTO sales(ts,subtotal,discount,total,method,customer_id,branch,discount_reason,discount_approved_by,discount_status,markup,markup_reason,payment_ref,user,voucher_amount)
           VALUES(?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)`,
        [s.ts,s.subtotal||0,s.discount||0,s.total,s.method,newCustId,s.branch,s.discount_reason||"",s.discount_approved_by||"",s.discount_status||"",s.markup||0,s.markup_reason||"",s.payment_ref||"",s.user||"",s.voucher_amount||0]);
      saleMap[s.id]=one("SELECT last_insert_rowid() as id").id;
      newSaleImpIds.add(s.id);
    });
    allX(impDb,"SELECT * FROM sale_items").forEach(it=>{
      if(!newSaleImpIds.has(it.sale_id)) return;
      const newProdId = prodMap[it.product_id]||null;
      run("INSERT INTO sale_items(sale_id,product_id,name,price,qty,cost) VALUES(?,?,?,?,?,?)",
        [saleMap[it.sale_id], newProdId, it.name, it.price, it.qty, it.cost||0]);
    });

    allX(impDb,"SELECT * FROM payouts").forEach(p=>{
      const dup = one("SELECT id FROM payouts WHERE branch=? AND ts=?",[p.branch,p.ts]);
      if(dup) return;
      run("INSERT INTO payouts(ts,amount,reason,branch,user) VALUES(?,?,?,?,?)",[p.ts,p.amount,p.reason,p.branch,p.user||""]);
    });

    allX(impDb,"SELECT * FROM stock_received").forEach(r=>{
      const dup = one("SELECT id FROM stock_received WHERE branch=? AND ts=?",[r.branch,r.ts]);
      if(dup) return;
      const newProdId = prodMap[r.product_id]||null;
      run("INSERT INTO stock_received(ts,product_id,name,qty,note,branch,user) VALUES(?,?,?,?,?,?,?)",[r.ts,newProdId,r.name,r.qty,r.note,r.branch,r.user||""]);
    });

    allX(impDb,"SELECT * FROM credit_payments").forEach(cp=>{
      const dup = one("SELECT id FROM credit_payments WHERE branch=? AND ts=?",[cp.branch,cp.ts]);
      if(dup) return;
      const newCustId = custMap[cp.customer_id]||null;
      if(!newCustId) return;
      run("INSERT INTO credit_payments(customer_id,ts,amount,note,branch,user) VALUES(?,?,?,?,?,?)",[newCustId,cp.ts,cp.amount,cp.note,cp.branch,cp.user||""]);
    });

    allX(impDb,"SELECT * FROM eod_sessions").forEach(e=>{
      const dup = one("SELECT id FROM eod_sessions WHERE branch=? AND date=? AND expected_cash=? AND counted_cash=?",[e.branch,e.date,e.expected_cash,e.counted_cash]);
      if(dup) return;
      run("INSERT INTO eod_sessions(date,expected_cash,counted_cash,variance,notes,branch,ts) VALUES(?,?,?,?,?,?,?)",
        [e.date,e.expected_cash,e.counted_cash,e.variance,e.notes||"",e.branch,e.ts||""]);
    });

    allX(impDb,"SELECT * FROM audit_log").forEach(a=>{
      const dup = one("SELECT id FROM audit_log WHERE branch=? AND ts=?",[a.branch,a.ts]);
      if(dup) return;
      run("INSERT INTO audit_log(ts,branch,user,action,product_name,details) VALUES(?,?,?,?,?,?)",[a.ts,a.branch,a.user||"",a.action,a.product_name,a.details]);
    });

    allX(impDb,"SELECT * FROM stock_requests").forEach(r=>{
      const dup = one("SELECT id FROM stock_requests WHERE branch=? AND ts=?",[r.branch,r.ts]);
      if(dup) return;
      run("INSERT INTO stock_requests(ts,branch,user,item_requested,customer_name,customer_phone,qty_wanted,notes,fulfilled) VALUES(?,?,?,?,?,?,?,?,?)",
        [r.ts,r.branch,r.user||"",r.item_requested,r.customer_name||"",r.customer_phone||"",r.qty_wanted||null,r.notes||"",r.fulfilled||0]);
    });

    allX(impDb,"SELECT * FROM stock_transfers").forEach(t=>{
      const dup = one("SELECT id FROM stock_transfers WHERE from_branch=? AND ts=?",[t.from_branch,t.ts]);
      if(dup) return;
      run(`INSERT INTO stock_transfers(ts,from_branch,to_branch,product_name,sku,qty,note,user,status,received_ts,received_user)
           VALUES(?,?,?,?,?,?,?,?,?,?,?)`,
        [t.ts,t.from_branch,t.to_branch,t.product_name,t.sku||"",t.qty,t.note||"",t.user||"",t.status||"Dispatched",t.received_ts||"",t.received_user||""]);
    });

    allX(impDb,"SELECT * FROM staff").forEach(s=>{
      const existing = one("SELECT * FROM staff WHERE branch=? AND name=?",[s.branch,s.name]);
      if(existing) return;
      run("INSERT INTO staff(name,role,passcode,branch,active,created_ts) VALUES(?,?,?,?,?,?)",
        [s.name,s.role||"Cashier",s.passcode||"",s.branch,s.active!==undefined?s.active:1,s.created_ts||new Date().toISOString()]);
    });

    allX(impDb,"SELECT * FROM vouchers").forEach(v=>{
      const newCustId = custMap[v.customer_id]||null;
      if(!newCustId) return;
      const dup = one("SELECT id FROM vouchers WHERE customer_id=? AND earned_ts=?",[newCustId,v.earned_ts]);
      if(dup) return;
      const newSaleId = v.redeemed_sale_id? (saleMap[v.redeemed_sale_id]||null) : null;
      run("INSERT INTO vouchers(customer_id,amount,branch,earned_ts,status,redeemed_ts,redeemed_sale_id) VALUES(?,?,?,?,?,?,?)",
        [newCustId,v.amount,v.branch,v.earned_ts,v.status||"Available",v.redeemed_ts||"",newSaleId]);
    });
  }

            <p class="muted">You get 30 days free use from today. After that, this screen will ask for an activation code — call or WhatsApp +263774479121.</p>
            <div class="row" style="margin-top:10px">
              <button class="btn btn-outline" id="setupBack2">Back</button>
              <button class="btn btn-primary" id="setupFinish">Finish setup</button>
            </div>
          `}
        </div>
      </div>
    `;
    if(setupStep===1){
      document.getElementById("setMainBtn").onclick=()=>{ setupData.branch_type="main"; renderSetup(); };
      document.getElementById("setRemoteBtn").onclick=()=>{ setupData.branch_type="remote"; renderSetup(); };
      document.getElementById("setupNext").onclick=()=>{
        setupData.shop_name = document.getElementById("setShop").value.trim();
        setupData.branch_name = document.getElementById("setBranch").value.trim();
        if(!setupData.shop_name) return alert("Enter your shop name");
        setupStep=2; renderSetup();
      };
    } else if(setupStep===2){
      document.getElementById("setupBack").onclick=()=>{setupStep=1;renderSetup();};
      document.getElementById("setBanner").onchange=(e)=>{
        const f = e.target.files[0];
        if(!f) return;
        const reader = new FileReader();
        reader.onload = ()=>{ setupData.banner_image = reader.result; renderSetup(); };
        reader.readAsDataURL(f);
      };
      document.getElementById("setupNext2").onclick=()=>{
        setupData.contact_phone = document.getElementById("setContact").value.trim();
        setupData.currency = document.getElementById("setCurrency").value.trim()||"$";
        setupStep=3; renderSetup();
      };
    } else {
      document.getElementById("setupBack2").onclick=()=>{setupStep=2;renderSetup();};
      document.getElementById("setupFinish").onclick=async ()=>{
        setSetting("shop_name", setupData.shop_name);
        setSetting("branch_name", setupData.branch_name);
        setSetting("branch_type", setupData.branch_type);
        setSetting("contact_phone", setupData.contact_phone);
        setSetting("currency", setupData.currency);
        setSetting("banner_image", setupData.banner_image);
        setSetting("paper_width","80");
        setSetting("install_id", uid4());
        const now = new Date();
        setSetting("install_date", now.toISOString());
        const until = new Date(now.getTime()+30*86400000);
        setSetting("activated_until", until.toISOString());
        setSetting("setup_complete","1");
        currency = setupData.currency;
        backfillBranch(db, currentBranch());
        await persist();
        route="pos"; render();
      };
    }
  }

  function renderLock(){
    const deviceCode = currentDeviceCode();
    $app.innerHTML = `
      <div class="center-screen">
        <div class="setup-card center">
          <h2>Activation needed</h2>
          <p class="muted">Your 30 days are up. Call or WhatsApp us with the code below and we'll send an unlock code.</p>
          <div class="device-code">${deviceCode}</div>
          <button class="btn btn-primary" id="waLock">📲 WhatsApp +263774479121</button>
          <div class="hr"></div>
          <label>Enter activation code</label>
          <input class="field" id="actCode" placeholder="XXXXXX" style="text-align:center;letter-spacing:2px;font-weight:700">
          <button class="btn btn-outline" id="unlockBtn" style="margin-top:12px">Unlock</button>
        </div>
      </div>
    `;
    document.getElementById("waLock").onclick=()=>{
      const text = `Hi, my shop needs an activation code. Device code: ${deviceCode}`;
      window.open("https://wa.me/263774479121?text="+encodeURIComponent(text),"_blank");
    };
    document.getElementById("unlockBtn").onclick=async ()=>{
      const entered = document.getElementById("actCode").value.trim().toUpperCase();
      const secret = getSetting("secret_phrase","");
      const expected = computeActivationCode(deviceCode, secret);
      if(entered === expected){
        const until = new Date(Date.now()+30*86400000);
        setSetting("activated_until", until.toISOString());
        await persist();
        route="pos"; render();
      } else {
        alert("Incorrect code. Please check and try again.");
      }
    };
  }

  function renderWhoAmI(){
    route="whoami";
    const last = getSetting("last_user","");
    $app.innerHTML = `<div class="center-screen"><div class="setup-card center">
      <h2>Who's working today?</h2>
      <p class="muted">Your name is recorded against sales, stock changes, and discount approvals for this session.</p>
      <input class="field" id="whoName" placeholder="Your name" value="${escapeHtml(last)}" style="text-align:center;font-weight:700">
      <button class="btn btn-primary" id="whoContinue" style="margin-top:14px">Continue</button>
    </div></div>`;
    const input = document.getElementById("whoName");
    input.focus();
    document.getElementById("whoContinue").onclick=()=>{
      const name = input.value.trim();
      if(!name) return alert("Enter your name to continue");
      sessionUser = name;
      setSetting("last_user", name); persist();
      route="pos"; render();
    };
  }
  function changeSessionUser(){
    const name = prompt("Who's working now?", sessionUser||"");
    if(name && name.trim()){ sessionUser = name.trim(); setSetting("last_user", sessionUser); persist(); render(); }
  }

  // ================== ROUTER / BOOT ==================
  document.addEventListener("click",(e)=>{
    const btn = e.target.closest("[data-route]");
    if(btn){
      if(route==="more" && btn.dataset.route!=="more" && moreTab==="settings") settingsUnlocked=false;
      route = btn.dataset.route; drawerOpen=false; render();
    }
    const kebabToggle = e.target.closest("[data-kebab-toggle]");
    if(kebabToggle){
      const menu = document.getElementById("menu-"+kebabToggle.dataset.kebabToggle);
      const wasOpen = menu && menu.style.display==="block";
      document.querySelectorAll(".kebab-menu").forEach(m=> m.style.display="none");
      if(menu) menu.style.display = wasOpen? "none":"block";
    } else if(!e.target.closest(".kebab-menu")){
      document.querySelectorAll(".kebab-menu").forEach(m=> m.style.display="none");
    }
  });

  function renderLoading(){
    $app.innerHTML = `<div class="center-screen"><div class="setup-card center">
      <h2>Starting…</h2>
      <p class="muted">Loading seiGEN Commerce Lite.</p>
    </div></div>`;
  }
  function renderBootError(){
    $app.innerHTML = `<div class="center-screen"><div class="setup-card center">
      <h2>Couldn't start</h2>
      <p class="muted">This needs an internet connection the first time it opens on a device (to load its database engine) — after that it works offline.</p>
      <p class="muted">Also make sure it's opened in a real browser (Chrome), not a preview screen inside WhatsApp or a file manager — tap "Open with" and choose Chrome if unsure.</p>
      <button class="btn btn-primary" id="retryBoot">Retry</button>
    </div></div>`;
    document.getElementById("retryBoot").onclick=boot;
  }
  async function boot(){
    renderLoading();
    try{
      await initDB();
    }catch(e){ renderBootError(); return; }
    const status = activationStatus();
    if(status==="no_setup"){ route="setup"; renderSetup(); return; }
    if(status==="locked"){ route="lock"; renderLock(); return; }
    renderWhoAmI();
  }
  // Only registers when actually served over http(s)/localhost — this
  // silently does nothing when the file is just double-clicked (file://),
  // so it's safe to leave in either way. When it IS registered (device
  // running a local server, or hosted), it's what makes "Install app"
  // available and caches the app + the sql.js library for full offline use.
  if("serviceWorker" in navigator && location.protocol !== "file:"){
    window.addEventListener("load", ()=>{
      navigator.serviceWorker.register("sw.js").catch(()=>{});
    });
  }
  boot();
})();
</script>
</body>
</html>
