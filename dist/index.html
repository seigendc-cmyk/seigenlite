  // Hand-built inline SVG bar chart — no charting library. Bars are scaled
  // to the tallest bucket, capped at a sensible max width and centered so a
  // 1-2 bucket range doesn't render as one giant blob, and labels rotate +
  // abbreviate past ~10 buckets so they stay legible instead of overlapping.
  function abbreviateChartLabel(label){
    return /^\d{4}-\d{2}-\d{2}$/.test(label)? label.slice(5) : label;
  }
  function renderBarChartSvg(chartData){
    if(!chartData || chartData.length===0) return `<p class="muted">No data to chart.</p>`;
    const w=600, h=200, padBottom=46, padTop=14;
    const maxVal = Math.max(...chartData.map(d=>d.value), 0.01);
    const n = chartData.length;
    const gap = 6;
    const idealWidth = (w - gap*(n+1)) / n;
    const barWidth = Math.max(4, Math.min(idealWidth, 56));
    const totalBarsWidth = n*barWidth + (n-1)*gap;
    const startX = Math.max(gap, (w-totalBarsWidth)/2);
    const manyBars = n > 10;
    const bars = chartData.map((d,i)=>{
      const x = startX + i*(barWidth+gap);
      const barH = Math.max(1, (d.value/maxVal) * (h-padTop-padBottom));
      const y = h - padBottom - barH;
      const cx = x + barWidth/2;
      const labelY = h - padBottom + (manyBars? 10 : 16);
      const label = manyBars? abbreviateChartLabel(d.label) : d.label;
      const textAttrs = manyBars
        ? `text-anchor="end" transform="rotate(-40 ${cx.toFixed(1)} ${labelY.toFixed(1)})"`
        : `text-anchor="middle"`;
      return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barWidth.toFixed(1)}" height="${barH.toFixed(1)}" rx="2" style="fill:var(--orange)"></rect>
        <text x="${cx.toFixed(1)}" y="${labelY.toFixed(1)}" font-size="${manyBars?8.5:11}" style="fill:var(--ink-soft)" ${textAttrs}>${escapeHtml(label)}</text>`;
    }).join("");
    return `<div class="card" style="overflow-x:auto;padding:10px 6px">
      <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:200px;display:block" preserveAspectRatio="xMidYMid meet">${bars}</svg>
    </div>`;
  }

  function readFileBytes(file){
    return new Promise((res,rej)=>{
      const reader = new FileReader();
      reader.onload = ()=>res(new Uint8Array(reader.result));
      reader.onerror = ()=>rej(reader.error);
      reader.readAsArrayBuffer(file);

  // A Delivery Note is not a data backup. Judged by CONTENT (not name or type),
  // and checked before anything else happens — no pre-merge backup download,
  // no merge, no database change. Receive stock (Phase 3) is offered when it
  // exists in this build; it is handed the same file so nothing is re-picked.
  function showDNInBackupGuard(file, format){
    const isCat = format===CAT_FORMAT, isAck = format===ACK_FORMAT, isCx = format===CANCEL_FORMAT, isGrv = format===GRV_FORMAT || isAck;
    if(isAck || isCx){                       // Phase 5: cancellation files are never data backups either
      const openIt = isAck? typeof openGrvImportWithFile==="function" : typeof openReceiveWithFile==="function";
      const w = openModal(isAck? "This is a cancellation confirmation" : "This is a cancellation notice", `
        <p style="margin:0 0 10px">${isAck? "This is a cancellation confirmation, not a data backup. Use Import in Dispatch history." : "This is a cancellation notice, not a data backup. Use Receive stock."}</p>
        ${openIt? `<button class="btn btn-primary" id="dnGuardReceive">${isAck? "Open Import" : "Open Receive stock"}</button>` : ""}`);
      const b2 = w.querySelector("#dnGuardReceive");
      if(b2) b2.onclick=()=>{ w.remove(); if(isAck) openGrvImportWithFile(file); else openReceiveWithFile(file); };
      return;
    }
    const canOpen = isGrv? typeof openGrvImportWithFile==="function" : isCat? typeof openCatalogueWithFile==="function" : typeof openReceiveWithFile==="function";
    const wrap = openModal(isGrv? "This is a Goods Received Voucher" : isCat? "This is a Catalogue" : "This is a Delivery Note", `
      <p style="margin:0 0 10px">${isGrv? "This is a Goods Received Voucher file, not a data backup. Use Import GRV in Dispatch history." : isCat? "This is a Catalogue, not a data backup. Use Get catalogue." : "This is a Delivery Note, not a data backup. Use Receive stock to receive it."}</p>
      ${canOpen? `<button class="btn btn-primary" id="dnGuardReceive">${isGrv? "Open Import GRV" : isCat? "Open Get catalogue" : "Open Receive stock"}</button>` : ""}`);
    const btn = wrap.querySelector("#dnGuardReceive");
    if(btn) btn.onclick=()=>{ wrap.remove(); if(isCat) openCatalogueWithFile(file); else if(isGrv) openGrvImportWithFile(file); else openReceiveWithFile(file); };
  }
  // Our own JSON formats are never data backups.
  function guardedFormat(bytes){
    const f = sniffJsonFormat(bytes);
    return (f===DN_FORMAT || f===CAT_FORMAT || f===GRV_FORMAT || f===CANCEL_FORMAT || f===ACK_FORMAT)? f : null;
  }
  // A remote branch never takes a data file from a main branch: it carries the
  // main's staff passcodes, costs and every other branch's records. A remote gets
  // its products from the catalogue and its stock from Delivery Notes. Only a
  // file that says it came from a remote is accepted; this also covers Replace,
  // which would otherwise turn the device into a main branch. "" = no problem.
  function mainFileProblem(bytes, what){
    if(!isRemote()) return "";
    let type;
    try{ const imp = new SQL.Database(bytes); type = getSettingX(imp,"branch_type",""); }
    catch(e){ return ""; }                       // not a database at all: the normal path reports that
    if(type==="remote") return "";
    return (type==="main"? "This data file was exported by a main branch." : "This data file doesn't say it came from a remote branch.")
      +" A remote branch can't "+(what||"merge")+" it, because it would copy the main branch's staff passcodes, costs and other branches' records onto this device."
      +" Get products with Get catalogue and stock with Receive stock instead.";
  }
  // Replace also refuses a file that belongs to a differently named branch: the name is locked
  // after setup, and the file's own rows are filed under ITS name. "" = fine.
  function replaceNameProblem(bytes){
    const own = String(getSetting("branch_name","")).trim();
    if(!own) return "";
    let imp;
    try{ const t = new SQL.Database(bytes); imp = getSettingX(t,"branch_name","") || getSettingX(t,"shop_name","") || "Main"; }
    catch(e){ return ""; }
    return imp===own? "" : "This data file belongs to \""+imp+"\", but this device is \""+own+"\". A branch's name is locked after setup, so its data can't be replaced with another branch's file.";
  }
  async function onMergePicked(file){
    let bytes;
    try{ bytes = await readFileBytes(file); }catch(err){ alert("Could not read that file."); return; }
    const gf = guardedFormat(bytes);
    if(gf){ showDNInBackupGuard(file, gf); return; }
    const refused = mainFileProblem(bytes, "merge");
    if(refused){ alert(refused); return; }
    downloadDb(`seigen-backup-before-merge-${new Date().toISOString().replace(/[:.]/g,"-")}.sqlite`);
    try{
      const res = await mergeDatabase(bytes);
      persist(); render();
      alert("Merge complete.");
      if(res && res.priceDiffs && res.priceDiffs.length) showBranchPriceDifferences(res.branch, res.priceDiffs);
    }catch(err){ alert("Could not merge that file. Make sure it's a valid seiGEN Commerce Lite export."); }
  }
  // Replace gets the same guard: handing it a DN would otherwise swap the live
  // database for a non-database before failing.
  async function onReplacePicked(file){
    let bytes;
    try{ bytes = await readFileBytes(file); }catch(err){ alert("Could not read that file."); return; }
    const gf = guardedFormat(bytes);
    if(gf){ showDNInBackupGuard(file, gf); return; }
    const refused = mainFileProblem(bytes, "replace this device's data with") || replaceNameProblem(bytes);
    if(refused){ alert(refused); return; }
    if(!confirm("This will replace ALL current data with the imported file. A backup of your current data downloads first. Continue?")) return;
    downloadDb(`seigen-backup-before-replace-${new Date().toISOString().replace(/[:.]/g,"-")}.sqlite`);
    const ownId = getSetting("branch_id",""), ownCounters = ownId? all("SELECT doc_type,last_no FROM doc_counters WHERE branch_id=?",[ownId]) : [];
    db = new SQL.Database(bytes);
    db.run(SCHEMA); migrate(db);
    keepDeviceIdentity(ownId, ownCounters);
    currency = getSetting("currency","$");
    backfillBranch(db, currentBranch());
    await persist();
    render();
    alert("Data imported.");
  }


  // branch_id is never copied from imported data. If the file carries this device's
  // own id it is kept; otherwise the device's own id is put back (or, if it had
  // none, a fresh one is made). The device's DN/GRV counters are carried over
  // (highest wins), so restoring an older backup can never reuse a number.
  function keepDeviceIdentity(ownId, ownCounters){
    if(ownId){
      if(getSetting("branch_id","")!==ownId) setSetting("branch_id", ownId);
      (ownCounters||[]).forEach(c=>run(`INSERT INTO doc_counters(branch_id,doc_type,last_no) VALUES(?,?,?)
        ON CONFLICT(branch_id,doc_type) DO UPDATE SET last_no=MAX(last_no,excluded.last_no)`,[ownId,c.doc_type,c.last_no]));
    } else resetBranchId();
  }

  const SQLITE_MIME = "application/x-sqlite3";
  function exportScopeOptions(){
    const cur = currentBranch();
    const others = listBranches().filter(b=>b!==cur);
    const opts = [{value:cur, label:`${cur} only (this branch)`}];
    others.forEach(b=> opts.push({value:b, label:`${b} only`}));
    if(others.length) opts.push({value:"*", label:"Both / all branches on this device"});
    return opts;
  }
  // Data file for export. scope: "*" (or omitted) = everything on this device,
  // otherwise a branch name — only that branch's rows are kept, in a throwaway
  // copy, so the live database is untouched.
  function exportBytes(scope){
    if(!scope || scope==="*") return db.export();
    const copy = new SQL.Database(db.export());
    try{
      const run2 = (sql,p=[])=>{ try{ copy.run(sql,p); }catch(e){} };
      ["products","sales","eod_sessions","payouts","credit_payments","stock_received","audit_log",
       "stock_requests","purchases","staff","vouchers","stocktakes","stock_adjustments","stock_movements"].forEach(t=>
        run2(`DELETE FROM ${t} WHERE branch<>?`,[scope]));
      run2("DELETE FROM stock_transfers WHERE from_branch<>? AND to_branch<>?",[scope,scope]);
      run2("DELETE FROM dispatch_docs WHERE dispatch_branch_name<>? AND receive_branch_name<>?",[scope,scope]);
      run2("DELETE FROM dn_events WHERE dn_from_name<>? AND dn_to_name<>?",[scope,scope]);
      run2("DELETE FROM branch_prices WHERE dest_branch_name<>?",[scope]);
      run2("DELETE FROM sale_items WHERE sale_id NOT IN (SELECT id FROM sales)");
      run2("DELETE FROM stocktake_counts WHERE stocktake_id NOT IN (SELECT id FROM stocktakes)");
      run2(`DELETE FROM customers WHERE id NOT IN (SELECT customer_id FROM sales WHERE customer_id IS NOT NULL)
              AND id NOT IN (SELECT customer_id FROM credit_payments WHERE customer_id IS NOT NULL)
              AND id NOT IN (SELECT customer_id FROM vouchers WHERE customer_id IS NOT NULL)`);
      return copy.export();
    } finally { copy.close(); }
  }
  function saveFile(bytes, filename, mime){
    const blob = new Blob([bytes], {type:mime});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    a.click();
    saveCopyToExportFolder(bytes, filename);
  }
  function downloadDb(filename, scope){
    saveFile(exportBytes(scope), filename, SQLITE_MIME);
  }
  // Best-effort mirror of an export into the folder chosen via
  // window.showDirectoryPicker() (Section 11) — a no-op when no folder has
  // been chosen, or when the handle's permission has lapsed since.
  async function saveCopyToExportFolder(bytes, filename){
    if(!exportDirHandle) return;
    try{
      // A restored handle needs its permission re-granted after a reload;
      // this runs inside the export click, so the prompt is allowed.
      const opts = {mode:"readwrite"};
      if(await exportDirHandle.queryPermission(opts) !== "granted" &&
         await exportDirHandle.requestPermission(opts) !== "granted") return;
      const fileHandle = await exportDirHandle.getFileHandle(filename, {create:true});
      const writable = await fileHandle.createWritable();
      await writable.write(bytes);
      await writable.close();
    }catch(e){ /* best-effort only */ }
  }
  // Shares the export directly into WhatsApp (or whatever the OS share
  // sheet offers) via the Web Share API when the browser supports sharing
  // files, falling back to the normal download otherwise.
  async function shareOrSaveFile(bytes, filename, mime){
    const file = new File([bytes], filename, {type:mime});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      try{
        await navigator.share({files:[file], title:filename});
        saveCopyToExportFolder(bytes, filename);
        return;
      }catch(e){
        if(e && e.name==="AbortError") return;
      }
    }
    saveFile(bytes, filename, mime);
    alert("Your browser doesn't support direct sharing — the file has been downloaded instead; attach it in WhatsApp manually.");
  }
  const shareOrDownloadDb = (filename, scope)=> shareOrSaveFile(exportBytes(scope), filename, SQLITE_MIME);

  // Items to Excel — same columns as the import template (plus Branch), so an exported list can be edited and imported back. Cost and
  // search keywords are left out on Remote branches, where they're hidden.
  const XLSX_MIME = "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";
  async function itemsExcelBytes(scope){
    await loadXLSX();
    const items = (!scope || scope==="*")? all("SELECT * FROM products ORDER BY branch,name")
                                        : all("SELECT * FROM products WHERE branch=? ORDER BY name",[scope]);
    const full = !isRemote();
    const data = items.map(p=>{
      const r = {"Branch":p.branch||"", "SKU":p.sku||"", "Item Name":p.name, "Shelf":p.shelf||"", "Category":p.category||""};
      if(full){ r["Search Keywords"]=p.description||""; r["Cost"]=p.cost||0; }
      r["Price"]=p.price; r["Qty"]=p.stock; r["Low Stock Alert Below"]=p.low_threshold;
      return r;
    });
    const ws = XLSX.utils.json_to_sheet(data);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Items");
    return XLSX.write(wb, {type:"array", bookType:"xlsx"});
  }
  async function exportItemsExcel(scope, share){
    try{
      const bytes = new Uint8Array(await itemsExcelBytes(scope));
      const name = docFilename({type:"ItemList", prefix:"ITM", ext:"xlsx", scope});
      if(share) await shareOrSaveFile(bytes, name, XLSX_MIME); else saveFile(bytes, name, XLSX_MIME);
    }catch(e){
      alert("Couldn't export the item list: " + (e.message||e));
    }
  }

  // App log for audit — the activity log as CSV (opens in Excel) for a date
  // range and branch scope, to send to whoever requested it.
  function appLogCsvBytes(scope, fromTs, toTs){
    const logs = (!scope || scope==="*")
      ? all("SELECT * FROM audit_log WHERE ts>=? AND ts<=? ORDER BY ts",[fromTs,toTs])
      : all("SELECT * FROM audit_log WHERE branch=? AND ts>=? AND ts<=? ORDER BY ts",[scope,fromTs,toTs]);
    const q = (v)=> `"${String(v==null?"":v).replace(/"/g,'""')}"`;
    const lines = [["Date/Time","Branch","User","Action","Item","Details"].map(q).join(",")];
    logs.forEach(a=> lines.push([a.ts,a.branch,a.user,a.action,a.product_name,a.details].map(q).join(",")));
    return { bytes:new TextEncoder().encode("﻿"+lines.join("\r\n")), count:logs.length };
  }
  async function sendAppLog(scope, from, to, share){
    if(!from || !to) return alert("Choose the From and To dates.");
    const {bytes, count} = appLogCsvBytes(scope, from+"T00:00:00", to+"T23:59:59");
    if(count===0) return alert("No activity was logged in that date range.");
    logAudit("Export App Log", "", `${count} entries, ${from} to ${to}, ${scopeLabel(scope)}${share?" (shared)":""}`);
    persist();
    const fd = (iso)=> fileDatePart(new Date(iso+"T00:00:00"));
    const name = docFilename({type:"AppLog", prefix:"LOG", ext:"csv", scope, period:`${fd(from)}-to-${fd(to)}`});
    if(share) await shareOrSaveFile(bytes, name, "text/csv"); else saveFile(bytes, name, "text/csv");
  }

  // ---------------- merge ----------------
  async function mergeDatabase(bytes){
    const refused = mainFileProblem(bytes, "merge");
    if(refused) throw Object.assign(new Error(refused), { code:"MAIN_FILE_REFUSED" });
    const impDb = new SQL.Database(bytes);
    impDb.run(SCHEMA); migrate(impDb);
    const impBranch = getSettingX(impDb,"branch_name","") || getSettingX(impDb,"shop_name","") || "Imported Branch";
    backfillBranch(impDb, impBranch);
    // Multi-terminal Phase 1: every merged row keeps its uid (impDb already
    // has one on every row: migrate() above backfills older files), and rows
    // that carry terminal stamps keep them. A row whose uid is already here
    // is the same row: skipped before the natural-key checks, which are
    // unchanged.
    const byUid = (tbl, uid)=> uid? one(`SELECT id FROM ${tbl} WHERE uid=?`,[uid]) : null;
    const tid = (r)=> r.terminal_id||null, buid = (r)=> r.branch_uuid||null;

    const prodMap = {};
    allX(impDb,"SELECT * FROM products").forEach(p=>{
      const existing = byUid("products",p.uid) || one("SELECT * FROM products WHERE name=? AND branch=?",[p.name,p.branch]);
      if(existing){ prodMap[p.id]=existing.id; }
      else{
        run("INSERT INTO products(name,price,stock,low_threshold,sku,branch,image,cost,created_ts,description,uid) VALUES(?,?,?,?,?,?,?,?,?,?,?)",
          [p.name,p.price,p.stock,p.low_threshold,p.sku||"",p.branch,p.image||"",p.cost||0,p.created_ts||new Date().toISOString(),p.description||"",p.uid||null]);
        prodMap[p.id] = one("SELECT last_insert_rowid() as id").id;
      }
    });

    const custMap = {};
    allX(impDb,"SELECT * FROM customers").forEach(c=>{
      const existing = byUid("customers",c.uid) || one("SELECT * FROM customers WHERE lower(name)=lower(?) AND COALESCE(phone,'')=COALESCE(?,'')",[c.name,c.phone]);
      if(existing){ custMap[c.id]=existing.id; }
      else{
        run("INSERT INTO customers(name,phone,branch,uid) VALUES(?,?,?,?)",[c.name,c.phone,c.branch,c.uid||null]);
        custMap[c.id]=one("SELECT last_insert_rowid() as id").id;
      }
    });

    const saleMap = {}; const newSaleImpIds = new Set();
    allX(impDb,"SELECT * FROM sales").forEach(s=>{
      const dup = byUid("sales",s.uid) || one("SELECT id FROM sales WHERE branch=? AND ts=?",[s.branch,s.ts]);
      if(dup){ saleMap[s.id]=dup.id; return; }
      const newCustId = s.customer_id? (custMap[s.customer_id]||null) : null;
      run(`INSERT INTO sales(ts,subtotal,discount,total,method,customer_id,branch,discount_reason,discount_approved_by,discount_status,markup,markup_reason,payment_ref,user,voucher_amount,doc_ref,uid,terminal_id,branch_uuid,receipt_no)
           VALUES(?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)`,
        [s.ts,s.subtotal||0,s.discount||0,s.total,s.method,newCustId,s.branch,s.discount_reason||"",s.discount_approved_by||"",s.discount_status||"",s.markup||0,s.markup_reason||"",s.payment_ref||"",s.user||"",s.voucher_amount||0,s.doc_ref||"",s.uid||null,tid(s),buid(s),s.receipt_no||null]);
      saleMap[s.id]=one("SELECT last_insert_rowid() as id").id;
      newSaleImpIds.add(s.id);
    });
    allX(impDb,"SELECT * FROM sale_items").forEach(it=>{
      if(!newSaleImpIds.has(it.sale_id) || byUid("sale_items",it.uid)) return;
      const newProdId = prodMap[it.product_id]||null;
      run("INSERT INTO sale_items(sale_id,product_id,name,price,qty,cost,uid) VALUES(?,?,?,?,?,?,?)",
        [saleMap[it.sale_id], newProdId, it.name, it.price, it.qty, it.cost||0, it.uid||null]);
    });
    // Same additive rule as sale_items above: a merged-in split-tender sale
    // must bring its per-method payment lines along, or the receiving
    // branch's EOD cash figure and credit balances would silently lose the
    // split-tender breakdown for every sale merged in from another device.
    // impDb already had SCHEMA+migrate() applied above, so even a file from
    // before Multi-Currency Support arrives here with currency/rate/
    // tendered_amount already backfilled (to BASE/1/amount) — never NULL —
    // so a foreign-currency line's real rate/tendered figure always
    // survives the merge, not just its base-currency amount.
    allX(impDb,"SELECT * FROM sale_payments").forEach(p=>{
      if(!newSaleImpIds.has(p.sale_id) || byUid("sale_payments",p.uid)) return;
      run("INSERT INTO sale_payments(sale_id,method,amount,currency,rate,tendered_amount,uid) VALUES(?,?,?,?,?,?,?)",
        [saleMap[p.sale_id], p.method, p.amount||0, p.currency||"BASE", p.rate||1, p.tendered_amount==null? (p.amount||0) : p.tendered_amount, p.uid||null]);
    });

    allX(impDb,"SELECT * FROM payouts").forEach(p=>{
      const dup = byUid("payouts",p.uid) || one("SELECT id FROM payouts WHERE branch=? AND ts=?",[p.branch,p.ts]);
      if(dup) return;
      run("INSERT INTO payouts(ts,amount,reason,branch,user,uid,terminal_id,branch_uuid) VALUES(?,?,?,?,?,?,?,?)",[p.ts,p.amount,p.reason,p.branch,p.user||"",p.uid||null,tid(p),buid(p)]);
    });

    allX(impDb,"SELECT * FROM stock_received").forEach(r=>{
      // Rows linked to a DN/GRV (dispatch and receipt lines) share one timestamp per
      // document, so the old (branch, ts) key would keep only the first line. They
      // are de-duplicated per line instead; every other row keeps the old rule.
      // Stock adjustment ledger rows (Phase 4b) are keyed by (adj_branch_id, adj_no).
      const isAdj = r.adj_no!=null && r.adj_branch_id;
      const linked = r.dn_no!=null;
      const dup = byUid("stock_received",r.uid) || (isAdj
        ? one("SELECT id FROM stock_received WHERE adj_branch_id=? AND adj_no=?",[r.adj_branch_id,r.adj_no])
        : linked
        ? one("SELECT id FROM stock_received WHERE branch=? AND dn_branch_id=? AND dn_no=? AND name=? AND qty=?",[r.branch,r.dn_branch_id,r.dn_no,r.name,r.qty])
        : one("SELECT id FROM stock_received WHERE branch=? AND ts=?",[r.branch,r.ts]));
      if(dup) return;
      const newProdId = prodMap[r.product_id]||null;
      run("INSERT INTO stock_received(ts,product_id,name,qty,note,branch,user,dn_branch_id,dn_no,grv_no,adj_branch_id,adj_no,uid,terminal_id,branch_uuid,till_code) VALUES(?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)",
        [r.ts,newProdId,r.name,r.qty,r.note,r.branch,r.user||"",linked?r.dn_branch_id:null,linked?r.dn_no:null,r.grv_no==null?null:r.grv_no,
         isAdj?r.adj_branch_id:null,isAdj?r.adj_no:null,r.uid||null,tid(r),buid(r),r.till_code||null]);
    });

    // Stock adjustments (Phase 4b): additive, one row per (branch_id, adj_no), never updated.
    // products.stock is never touched by the merge, so nothing is counted twice.
    allX(impDb,"SELECT * FROM stock_adjustments").forEach(a=>{
      if(!a.branch_id || a.adj_no==null) return;
      if(byUid("stock_adjustments",a.uid) || one("SELECT id FROM stock_adjustments WHERE branch_id=? AND adj_no=?",[a.branch_id,a.adj_no])) return;
      run(`INSERT INTO stock_adjustments(branch,branch_id,adj_no,product_code,product_name,qty_delta,reason,note,by_user,authorised_by,ts,dn_branch_id,dn_no,uid,terminal_id,branch_uuid,till_code)
           VALUES(?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)`,
        [a.branch||"",a.branch_id,a.adj_no,a.product_code||"",a.product_name||"",a.qty_delta,a.reason||"",a.note||"",a.by_user||"",a.authorised_by||"",a.ts,
         a.dn_branch_id||null,a.dn_no==null?null:a.dn_no,a.uid||null,tid(a),buid(a),a.till_code||null]);
    });

    // Stock movements (Phase 2): additive, one row per uid, never updated.
    // products.stock is never touched by the merge; the source's movements
    // come with its product snapshot (outside this device's integrity check).
    allX(impDb,"SELECT * FROM stock_movements").forEach(m=>{
      if(!m.uid || byUid("stock_movements",m.uid)) return;
      run(`INSERT INTO stock_movements(uid,terminal_id,branch_uuid,product_id,product_uid,product_code,product_name,branch,qty_delta,kind,doc_type,doc_uid,doc_no,ts,user,note)
           VALUES(?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)`,
        [m.uid,tid(m),buid(m),prodMap[m.product_id]||null,m.product_uid||null,m.product_code||"",m.product_name||"",m.branch||"",m.qty_delta,m.kind,
         m.doc_type||"",m.doc_uid||null,m.doc_no||"",m.ts,m.user||"",m.note||""]);
    });

    allX(impDb,"SELECT * FROM credit_payments").forEach(cp=>{
      const dup = byUid("credit_payments",cp.uid) || one("SELECT id FROM credit_payments WHERE branch=? AND ts=?",[cp.branch,cp.ts]);
      if(dup) return;
      const newCustId = custMap[cp.customer_id]||null;
      if(!newCustId) return;
      run("INSERT INTO credit_payments(customer_id,ts,amount,note,branch,user,uid,terminal_id,branch_uuid) VALUES(?,?,?,?,?,?,?,?,?)",[newCustId,cp.ts,cp.amount,cp.note,cp.branch,cp.user||"",cp.uid||null,tid(cp),buid(cp)]);
    });

    allX(impDb,"SELECT * FROM eod_sessions").forEach(e=>{
      // Shift/EOD rows (see eod.js) are matched on started_ts, which is
      // always set and unique per shift — the old expected/counted match
      // below is kept only as a fallback for rows from before shifts
      // existed (no started_ts), where it's still the best available key.
      // The old match alone would miss an OPEN shift's duplicate on a
      // repeat merge, since expected_cash/counted_cash are still NULL then
      // and SQL NULL=NULL never matches.
      const dup = byUid("eod_sessions",e.uid) || one(
        `SELECT id FROM eod_sessions WHERE branch=? AND date=? AND (
           (started_ts<>'' AND started_ts=?) OR (expected_cash=? AND counted_cash=?)
         )`,
        [e.branch,e.date,e.started_ts||"",e.expected_cash,e.counted_cash]);
      if(dup) return;
      run(`INSERT INTO eod_sessions(date,expected_cash,counted_cash,variance,notes,branch,ts,status,opening_float,started_ts,started_by,started_staff_id,closed_ts,closed_by,closed_staff_id,printed_ts,uid,terminal_id,branch_uuid)
           VALUES(?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)`,
        [e.date,e.expected_cash,e.counted_cash,e.variance,e.notes||"",e.branch,e.ts||"",
         e.status||"closed",e.opening_float||0,e.started_ts||"",e.started_by||"",e.started_staff_id==null?null:e.started_staff_id,
         e.closed_ts||"",e.closed_by||"",e.closed_staff_id==null?null:e.closed_staff_id,e.printed_ts||"",e.uid||null,tid(e),buid(e)]);
    });

    allX(impDb,"SELECT * FROM audit_log").forEach(a=>{
      const dup = byUid("audit_log",a.uid) || one("SELECT id FROM audit_log WHERE branch=? AND ts=?",[a.branch,a.ts]);
      if(dup) return;
      run("INSERT INTO audit_log(ts,branch,user,action,product_name,details,uid) VALUES(?,?,?,?,?,?,?)",[a.ts,a.branch,a.user||"",a.action,a.product_name,a.details,a.uid||null]);
    });

    allX(impDb,"SELECT * FROM stock_requests").forEach(r=>{
      const dup = byUid("stock_requests",r.uid) || one("SELECT id FROM stock_requests WHERE branch=? AND ts=?",[r.branch,r.ts]);
      if(dup) return;
      run("INSERT INTO stock_requests(ts,branch,user,item_requested,customer_name,customer_phone,qty_wanted,notes,fulfilled,uid) VALUES(?,?,?,?,?,?,?,?,?,?)",
        [r.ts,r.branch,r.user||"",r.item_requested,r.customer_name||"",r.customer_phone||"",r.qty_wanted||null,r.notes||"",r.fulfilled||0,r.uid||null]);
    });

    allX(impDb,"SELECT * FROM stock_transfers").forEach(t=>{
      // Lines that belong to a Delivery Note merge as records only (dn_no is
      // kept, and every pending-receipt query excludes dn_no rows). They are
      // de-duplicated per DN line, because all lines of one DN share a ts.
      const dup = byUid("stock_transfers",t.uid) || (t.dn_no!=null
        ? one("SELECT id FROM stock_transfers WHERE from_branch=? AND dn_no=? AND sku=? AND product_name=?",[t.from_branch,t.dn_no,t.sku||"",t.product_name])
        : one("SELECT id FROM stock_transfers WHERE from_branch=? AND ts=?",[t.from_branch,t.ts]));
      if(dup){
        if(t.dn_branch_id) run("UPDATE stock_transfers SET dn_branch_id=? WHERE id=? AND (dn_branch_id IS NULL OR dn_branch_id='')",[t.dn_branch_id,dup.id]);
        return;
      }
      run(`INSERT INTO stock_transfers(ts,from_branch,to_branch,product_name,sku,qty,note,user,status,received_ts,received_user,dn_no,dn_branch_id,uid)
           VALUES(?,?,?,?,?,?,?,?,?,?,?,?,?,?)`,
        [t.ts,t.from_branch,t.to_branch,t.product_name,t.sku||"",t.qty,t.note||"",t.user||"",t.status||"Dispatched",t.received_ts||"",t.received_user||"",t.dn_no==null?null:t.dn_no,t.dn_branch_id||null,t.uid||null]);
    });

    // DN events (Phase 4): additive, one row per fact. dispatch_docs itself is
    // NOT merged (its key would clash between the dispatcher's and receiver's rows).
    // event_key de-duplicates: the same fact reaching main from two devices is one row.
    allX(impDb,"SELECT * FROM dn_events").forEach(e=>{
      if(byUid("dn_events",e.uid)) return;
      recordDnEvent({ dnBranchId:e.dn_branch_id, dnNo:e.dn_no, type:e.event_type, actorBranchId:e.actor_branch_id, actorName:e.actor_branch_name,
        fromName:e.dn_from_name, toName:e.dn_to_name, ts:e.event_ts, grvNo:e.grv_no, detail:e.detail_json||"", uid:e.uid||null,
        dnTill:e.dn_till_code||null, grvTill:e.grv_till_code||null });
    });

    // Destination register: main's list of branches (and WhatsApp numbers)
    // reaches Remote devices through this merge. Only ever adds; a number is
    // filled in only where the local entry has none.
    allX(impDb,"SELECT * FROM branch_register").forEach(b=>{
      const ex = one("SELECT * FROM branch_register WHERE name=?",[b.name]);
      if(!ex) run("INSERT INTO branch_register(name,whatsapp) VALUES(?,?)",[b.name,b.whatsapp||""]);
      else if(!ex.whatsapp && b.whatsapp) run("UPDATE branch_register SET whatsapp=? WHERE id=?",[b.whatsapp,ex.id]);
    });

    allX(impDb,"SELECT * FROM staff").forEach(s=>{
      const existing = byUid("staff",s.uid) || one("SELECT * FROM staff WHERE branch=? AND name=?",[s.branch,s.name]);
      if(existing) return;
      run("INSERT INTO staff(name,role,passcode,branch,active,created_ts,uid) VALUES(?,?,?,?,?,?,?)",
        [s.name,s.role||"Cashier",s.passcode||"",s.branch,s.active!==undefined?s.active:1,s.created_ts||new Date().toISOString(),s.uid||null]);
    });

    allX(impDb,"SELECT * FROM vouchers").forEach(v=>{
      const newCustId = custMap[v.customer_id]||null;
      if(!newCustId) return;
      const dup = byUid("vouchers",v.uid) || one("SELECT id FROM vouchers WHERE customer_id=? AND earned_ts=?",[newCustId,v.earned_ts]);
      if(dup) return;
      const newSaleId = v.redeemed_sale_id? (saleMap[v.redeemed_sale_id]||null) : null;
      run("INSERT INTO vouchers(customer_id,amount,branch,earned_ts,status,redeemed_ts,redeemed_sale_id,uid) VALUES(?,?,?,?,?,?,?,?)",
        [newCustId,v.amount,v.branch,v.earned_ts,v.status||"Available",v.redeemed_ts||"",newSaleId,v.uid||null]);
    });

    // Information for main only: where the branch's prices differ from main's,
    // read straight from the imported file (the merge itself never overwrites
    // an existing product). Nothing here changes any data.
    let priceDiffs = [];
    if(!isRemote()){
      priceDiffs = priceDifferences(
        all("SELECT sku,name,price FROM products WHERE branch=?",[currentBranch()]),
        allX(impDb,"SELECT sku,name,price FROM products WHERE branch=?",[impBranch]));
    }
    return { branch: impBranch, priceDiffs };
  }


  // ================== Supabase Foundation (sync queue) ==================
  // This app has no backend: everything lives in the local SQLite database
  // (sql.js -> IndexedDB), and that stays true by default. This file adds
  // a generic outbox ("sync_queue", schema in db.js) that any feature can
  // drop records into, plus a background worker that pushes them to Digital
  // Commerce's Supabase project (built in — see getSupabaseConfig) whenever
  // the device is online. It works silently, in the background, without
  // ever changing what already works offline.
  //
  // ---- How a future feature registers a new sync record type ----
  // 1. Call registerSyncType() once, anywhere at the top level of your
  //    feature's own file (order doesn't matter — everything in this app's
  //    IIFE is hoisted and concatenated into one script; see build.js):
  //
  //      registerSyncType("rpn_link", { table: "rpn_link" });
  //
  //    `table` is the Supabase table name that record type is inserted
  //    into. If you skip registerSyncType() entirely, enqueueSync() still
  //    works — the record_type string is used as the table name directly —
  //    but registering is the documented, explicit way to do it and is
  //    where you'd hang future per-type behaviour (e.g. a different write
  //    strategy) without changing the queue itself.
  // 2. Whenever your feature has something to sync, call:
  //
  //      enqueueSync("rpn_link", { rpn_name, rpn_code, rpn_whatsapp, city_area });
  //
  //    enqueueSync() stamps tenant_id onto the payload automatically (see
  //    tenantId() below) if you didn't already include one, timestamps it,
  //    and marks it "pending". That's it — you never touch sync_queue's SQL
  //    directly, and you never call Supabase yourself.
  // 3. The background worker (started once at boot, see main.js) picks up
  //    "pending"/"failed" rows whose next_attempt_ts has arrived, POSTs each
  //    payload as one row to `${table}` via the Supabase REST API, and marks
  //    it "synced" on success or "failed" (with exponential backoff) on
  //    failure. Your feature never needs to poll, retry, or handle offline
  //    itself — enqueue and forget.
  // 4. If your feature wants to show sync status (e.g. a future Sync
  //    Reminder Modal), read it with pendingSyncCount()/pendingSyncRows() —
  //    read-only, never mutate sync_queue directly from UI code.
  //
  // A tiny "sync_health_check" type is registered below and is what this
  // foundation is verified against end-to-end (see test/sync-queue.test.js
  // and README.md) — it is not a real feature, just proof the pipeline
  // works before RPN linkage/support tasks/etc. are built on top of it.

  // ---- tenant identity ----
  // "Tenant" reuses this device's existing branch identity (getBranchId(),
  // docnum.js) rather than inventing a second one — every other per-device
  // identifier in this app (stock_adjustments, doc_counters, DN/GRV
  // messaging) already keys off it. Once multi-tenant Supabase tables exist,
  // this is the column every synced row is attributed by.
  function tenantId(){ return getBranchId(); }

  // ---- Supabase config ----
  // Always Digital Commerce's own project — the same one device check-in
  // uses, defined once in devicecheckin.js. Shops no longer enter a URL/key;
  // any supabase_url/supabase_anon_key left in settings by older versions
  // is ignored. (Tests swap this function out to point at a local server.)
  function getSupabaseConfig(){
    return { url: DC_SUPABASE_URL, anonKey: DC_ANON_KEY };
  }
  function supabaseConfigured(){
    const cfg = getSupabaseConfig();
    return !!(cfg.url.trim() && cfg.anonKey.trim());
  }

  // ---- connectivity ----
  // navigator.onLine reflects the OS/browser's own link-layer status, which
  // is what "appropriate to the platform" means here: it's a standard Web
  // Platform API, so it works the same way in the PWA (a real browser) and
  // in the Tauri build (WebView2/WebKit, which implement it identically) —
  // no Tauri-specific plugin needed. It's a cheap pre-filter, not a
  // guarantee Supabase itself is reachable; the sync worker's own POST is
  // the real reachability test, and a failed POST just requeues with
  // backoff exactly like a genuinely offline device would.
  function isOnline(){ return typeof navigator==="undefined" || navigator.onLine!==false; }

  // ---- registry ----
  const SYNC_TYPES = {};
  function registerSyncType(recordType, opts){
    SYNC_TYPES[recordType] = Object.assign({ table: recordType }, opts||{});
  }
  function syncTableFor(recordType){
    return (SYNC_TYPES[recordType] && SYNC_TYPES[recordType].table) || recordType;
  }
  // Reference registration + what the worker is proven against (see file
  // header). Not a real feature — RPN linkage/support tasks are later work.
  registerSyncType("sync_health_check", { table:"sync_health_check" });

  // A type registered with { paused:true } queues nothing: enqueueSync()
  // returns null and writes no row. Used for record types whose Supabase
  // table doesn't exist (rpn_link, support_task — see rpn.js), so the queue
  // stops growing with rows that can never be delivered. Rows already
  // queued for a paused type are set to status 'paused' by
  // pauseSyncBacklog() (called from migrate) — kept, never deleted, and
  // outside every pending/failed count below.
  function syncTypePaused(recordType){ return !!(SYNC_TYPES[recordType] && SYNC_TYPES[recordType].paused); }
  const PAUSED_SYNC_TYPES = ["rpn_link","support_task"];
  function pauseSyncBacklog(t){
    try{ t.run(`UPDATE sync_queue SET status='paused' WHERE status IN ('pending','failed') AND record_type IN (${PAUSED_SYNC_TYPES.map(()=>"?").join(",")})`, PAUSED_SYNC_TYPES); }catch(e){}
  }

  // ---- enqueue / read ----
  function enqueueSync(recordType, payload, recordKey){
    if(!recordType) throw new Error("enqueueSync needs a record type");
    if(syncTypePaused(recordType)) return null;
    const now = new Date().toISOString();
    const body = Object.assign({}, payload||{});
    if(body.tenant_id===undefined) body.tenant_id = tenantId();
    run(`INSERT INTO sync_queue(record_type,record_key,tenant_id,payload_json,status,attempts,next_attempt_ts,created_ts,updated_ts)
         VALUES(?,?,?,?,'pending',0,?,?,?)`,
      [recordType, String(recordKey||""), tenantId(), JSON.stringify(body), now, now, now]);
    return one("SELECT * FROM sync_queue WHERE id=(SELECT last_insert_rowid())");
  }
  function pendingSyncRows(recordType){
    return recordType
      ? all("SELECT * FROM sync_queue WHERE record_type=? AND status IN ('pending','failed') ORDER BY id",[recordType])
      : all("SELECT * FROM sync_queue WHERE status IN ('pending','failed') ORDER BY id");
  }
  function pendingSyncCount(recordType){
    const r = recordType
      ? one("SELECT COUNT(*) c FROM sync_queue WHERE record_type=? AND status IN ('pending','failed')",[recordType])
      : one("SELECT COUNT(*) c FROM sync_queue WHERE status IN ('pending','failed')");
    return r? r.c : 0;
  }

  // ---- backoff ----
  const SYNC_BASE_DELAY_MS = 5000;        // first retry ~5s later
  const SYNC_MAX_DELAY_MS = 30*60*1000;   // capped at 30 minutes
  const SYNC_MAX_ATTEMPTS_PER_RUN = 25;   // one worker tick moves at most this many rows, so a huge backlog can't hang a tick
  function syncBackoffMs(attempts){
    return Math.min(SYNC_MAX_DELAY_MS, SYNC_BASE_DELAY_MS * Math.pow(2, Math.max(0, attempts-1)));
  }

  // ---- minimal Supabase REST client (no SDK — this app has no bundler; a
  // plain fetch() to PostgREST is the smallest thing that works identically
  // in the PWA and inside the Tauri webview, which both allow ordinary
  // fetch() to an external https origin without extra Tauri capabilities —
  // Tauri's permission system only gates calls into its own Rust commands) ----
  async function supabaseInsert(table, row){
    const cfg = getSupabaseConfig();
    if(!cfg.url.trim() || !cfg.anonKey.trim()) throw new Error("Supabase is not configured");
    const res = await fetch(cfg.url.replace(/\/+$/,"")+"/rest/v1/"+encodeURIComponent(table), {
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "apikey": cfg.anonKey,
        "Authorization": "Bearer "+cfg.anonKey,
        "Prefer":"return=minimal"
      },
      body: JSON.stringify(row)
    });
    if(!res.ok){
      let detail = "";
      try{ detail = (await res.text()).slice(0,200); }catch(e){}
      throw new Error("Supabase "+res.status+(detail? ": "+detail : ""));
    }
    return true;
  }

  // ---- worker ----
  let _syncRunning = false;
  async function pushOneSyncRow(row){
    try{
      await supabaseInsert(syncTableFor(row.record_type), JSON.parse(row.payload_json));
      const now = new Date().toISOString();
      run("UPDATE sync_queue SET status='synced', synced_ts=?, updated_ts=?, last_error='' WHERE id=?",[now,now,row.id]);
      return true;
    }catch(e){
      const attempts = (row.attempts||0)+1;
      const now = new Date().toISOString();
      const next = new Date(Date.now()+syncBackoffMs(attempts)).toISOString();
      run("UPDATE sync_queue SET status='failed', attempts=?, next_attempt_ts=?, updated_ts=?, last_error=? WHERE id=?",
        [attempts, next, now, String((e&&e.message)||e).slice(0,300), row.id]);
      return false;
    }
  }
  // Never blocks the UI or any core operation: this is only ever invoked
  // from a timer/connectivity event (see startSyncWorker) or an explicit,
  // call from Settings → Cloud sync's "Sync now" — nothing
  // in POS/stocktake/etc. awaits it, and _syncRunning skips overlapping runs
  // instead of queueing up work that could pile up behind a slow network.
  async function runSyncWorker(){
    if(_syncRunning) return { attempted:0, synced:0, reason:"already running" };
    if(!supabaseConfigured()) return { attempted:0, synced:0, reason:"not configured" };
    if(!isOnline()) return { attempted:0, synced:0, reason:"offline" };
    _syncRunning = true;
    try{
      const now = new Date().toISOString();
      const due = all(
        "SELECT * FROM sync_queue WHERE status IN ('pending','failed') AND (next_attempt_ts='' OR next_attempt_ts<=?) ORDER BY id LIMIT ?",
        [now, SYNC_MAX_ATTEMPTS_PER_RUN]
      );
      let synced=0;
      for(const row of due){ if(await pushOneSyncRow(row)) synced++; }
      if(due.length) await persist();
      return { attempted:due.length, synced };
    } finally { _syncRunning = false; }
  }

  const SYNC_POLL_MS = 60000; // background check while the app is open; a failed POST already retries sooner via backoff
  let _syncTimer = null;
  // One tick drives both the worker and the reminder modal below — the
  // modal reacts to the exact same timer/online-event the worker already
  // uses, rather than a second connectivity check running on its own clock.
  async function syncTick(){
    await runSyncWorker();
    checkSyncReminderModal();
  }
  // Called once at boot (main.js), after initDB. Entirely passive: offline or
  // with nothing due, every tick below is a few synchronous reads and
  // returns immediately; an unreachable server just backs off.
  function startSyncWorker(){
    if(_syncTimer) return;
    syncTick();
    _syncTimer = setInterval(syncTick, SYNC_POLL_MS);
    if(typeof window!=="undefined" && window.addEventListener) window.addEventListener("online", syncTick);
  }

  // ---- Sync Reminder (generic, reusable) ----
  // Shown as a small toast that slides in from the left of the header, not a
  // modal: it goes away on its own after SYNC_TOAST_MS, or at once on any
  // click outside it. When and why it shows is unchanged (see below).
  // Not RPN/support-specific: it only ever reads pendingSyncCount()/
  // pendingSyncRows() — the exact same queries the Cloud sync (beta)
  // Settings card already uses — so any future record type (RPN linkage,
  // support tasks, EOD, payouts, backups, ...) shows up here automatically
  // the moment it calls enqueueSync(), with no changes to this section.
  let _syncReminderVisible = false;
  let _syncReminderEl = null;
  function syncReminderVisible(){ return _syncReminderVisible; }
  // Pure trigger condition (Part C.2/C.5) — no DOM, so it's directly
  // testable: offline OR unconfigured, AND something pending, AND not in
  // the middle of a sale or still onboarding.
  function syncReminderShouldShow(){
    if(typeof route!=="undefined" && route==="setup") return false;         // RPN linkage is already on screen there
    if(typeof drawerOpen!=="undefined" && drawerOpen) return false;         // an in-progress sale (cart open)
    return (!isOnline() || !supabaseConfigured()) && pendingSyncCount()>0;
  }
  const SYNC_TOAST_MS = 4000;
  let _syncToastTimer = null;
  function onSyncToastOutsideClick(e){
    if(_syncReminderEl && !_syncReminderEl.contains(e.target)) dismissSyncReminder();
  }
  // User-dismiss path (timeout / outside click) and the programmatic one
  // tests use — both just mark it hidden. Nothing here touches sync_queue,
  // so the very next tick's syncReminderShouldShow() decides fresh: still
  // unsynced -> it reappears, exactly as specified.
  function dismissSyncReminder(){
    _syncReminderVisible = false;
    if(_syncToastTimer){ clearTimeout(_syncToastTimer); _syncToastTimer = null; }
    if(typeof document!=="undefined" && document.removeEventListener) document.removeEventListener("pointerdown", onSyncToastOutsideClick, true);
    const el = _syncReminderEl;
    _syncReminderEl = null;
    if(el){
      el.classList.remove("show");               // slide back out, then go
      setTimeout(()=>{ try{ el.remove(); }catch(e){} }, 250);
    }
  }
  function checkSyncReminderModal(){
    if(!syncReminderShouldShow()){ if(_syncReminderVisible) dismissSyncReminder(); return; }
    if(_syncReminderVisible) return; // already up, leave it alone
    // Never stack on top of another modal already in front of the user
    // (checkout/discount flow, a product editor, ...) — try again next tick.
    if(typeof document!=="undefined" && document.querySelector && document.querySelector(".modalOverlay")) return;
    _syncReminderVisible = true;
    if(typeof document==="undefined" || typeof document.createElement!=="function" || !document.body) return; // headless/test context — state above still exercised
    const n = pendingSyncCount();
    const el = document.createElement("div");
    el.className = "sync-toast";
    el.setAttribute("role", "status");
    el.innerHTML = `<span class="sync-toast-dot"></span><span>Offline · ${n} record${n===1?"":"s"} will sync when you reconnect</span>`;
    document.body.appendChild(el);        // outside #app, so render() never wipes it mid-show
    _syncReminderEl = el;
    void el.offsetWidth;                  // commit the off-screen position so the slide-in animates
    el.classList.add("show");
    _syncToastTimer = setTimeout(dismissSyncReminder, SYNC_TOAST_MS);
    // Capture phase: an outside tap closes it even when that tap's own
    // handler re-renders the screen underneath.
    document.addEventListener("pointerdown", onSyncToastOutsideClick, true);
  }

  // ---- Settings card (Cloud sync) ----
  // Status only: the project is built in (getSupabaseConfig above), so
  // there's nothing for the shop to enter — just whether its records have
  // gone up, and a way to try now instead of waiting for the next tick.
  function cloudSyncStatusText(){
    const pending = pendingSyncCount();
    if(!pending) return "Everything is synced.";
    if(!isOnline()) return `You're offline — ${pending} record(s) saved on this device will sync when you reconnect.`;
    const retrying = one("SELECT COUNT(*) c FROM sync_queue WHERE status='failed'").c;
    return `${pending} record(s) waiting to sync.` + (retrying? ` ${retrying} couldn't be sent yet and will be retried automatically.` : "");
  }
  function cloudSyncSectionHtml(){
    return `
      <div class="card">
        <h3>Cloud sync</h3>
        <p class="muted">Built in — there's nothing to set up. Records are kept on this device and saved to your cloud storage whenever you're online.</p>
        <p class="muted" id="cloudSyncStatus" style="font-size:12px">${escapeHtml(cloudSyncStatusText())}</p>
        ${pendingSyncCount()? `<button class="btn btn-outline" id="syncNowBtn" style="margin-top:6px">Sync now</button>` : ""}
      </div>`;
  }
  function wireCloudSyncSection(){
    const btn = document.getElementById("syncNowBtn");
    if(btn) btn.onclick=async ()=>{
      btn.disabled = true;
      btn.textContent = "Syncing…";
      await runSyncWorker();
      render();
    };
  }

  // ================== Digital Commerce — Device Check-in ==================
  // Additive, best-effort phone-home to the Digital Commerce backoffice
  // console: reports this device's identity/contact details, and receives
  // back a lock state (Cart/Add Product) plus any message cards the shop's
  // RPN/Digital Commerce has queued for them. Deliberately separate from
  // sync.js's outbox (enqueueSync/supabaseInsert/runSyncWorker). Both talk
  // to the same Digital Commerce project — DC_SUPABASE_URL/DC_ANON_KEY below
  // are the one definition, and sync.js's getSupabaseConfig() reuses them —
  // but this is a single RPC per launch whose reply sets lock state, not a
  // queued insert, so it intentionally doesn't go through enqueueSync() or
  // share sync_queue.
  //
  // Runs at every launch, on every reconnect, straight after setup
  // finishes and after Settings → Save phrase. Never blocks boot, never
  // retries with backoff, never pops up an error: a failure is only
  // recorded (dc_checkin_error) for Marketing and Settings to explain, and
  // the next launch or reconnect tries again (see startDeviceCheckin below)
  // — exactly the same "best-effort, nothing invented beyond what's asked"
  // rule fetchNetworkTime() (eod.js) already follows for its own probe.

  const DC_SUPABASE_URL = "https://urbopdsubwawtybwrxjd.supabase.co";
  const DC_CHECKIN_URL = DC_SUPABASE_URL + "/rest/v1/rpc/cl_device_checkin";
  const DC_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVyYm9wZHN1Yndhd3R5YndyeGpkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxMTYzNzEsImV4cCI6MjEwNTY5MjM3MX0.pCGkNETrB4ISse2ES_6goALKJz3g_22osjLfIgFG4k4";
  const DC_CHECKIN_TIMEOUT_MS = 8000;

  // ---- lock state (read fresh from settings every time — never cached in
  // a module-level var, so a check-in that lands mid-session takes effect
  // the moment either gate below is next consulted, with no forced re-render
  // needed) ----
  const DC_DEFAULT_LOCK_MESSAGE = "Contact Digital Commerce to reactivate";
  function dcLockCartReason(){
    return getSetting("dc_lock_cart","")==="1"
      ? (getSetting("dc_lock_reason","").trim() || DC_DEFAULT_LOCK_MESSAGE)
      : "";
  }
  function dcLockAddProductReason(){
    return getSetting("dc_lock_add_product","")==="1"
      ? (getSetting("dc_lock_reason","").trim() || DC_DEFAULT_LOCK_MESSAGE)
      : "";
  }

  // ---- message cards ----
  // The server marks each message delivered the instant it's returned in a
  // checkin response, so it is never re-sent — this local copy (settings
  // table, same store getSetting/setSetting already use everywhere else)
  // is the only record of it from that point on. Stored as one JSON array
  // under a single settings key rather than a new table: a shop-facing
  // inbox, not transactional/reportable data the rest of the app queries.
  function dcMessages(){
    try{ const arr = JSON.parse(getSetting("dc_messages","[]")); return Array.isArray(arr)? arr : []; }
    catch(e){ return []; }
  }
  function dcPendingMessages(){ return dcMessages().filter(m=>!m.dismissed); }
  function dcMergeMessages(incoming){
    if(!Array.isArray(incoming) || !incoming.length) return;
    const existing = dcMessages();
    const seen = new Set(existing.map(m=>m.id));
    const fresh = incoming.filter(m=> m && m.id && !seen.has(m.id)).map(m=>({
      id: m.id, title: m.title||"", body: m.body||"",
      created_at: m.created_at || new Date().toISOString(), dismissed:false
    }));
    if(!fresh.length) return;
    setSetting("dc_messages", JSON.stringify(existing.concat(fresh)));
  }
  function dcDismissMessage(id){
    const msgs = dcMessages().map(m=> m.id===id? Object.assign({},m,{dismissed:true}) : m);
    setSetting("dc_messages", JSON.stringify(msgs));
    persist();
  }

  // ---- registration (is this device known to Digital Commerce?) ----
  // A device is registered once a check-in has succeeded: the server then
  // has its install_id in cl_vendors, which is what the publish portal
  // checks before it will list a shop's products. dc_vendor_id is stored by
  // this version; dc_vendor_status is also accepted so a device that
  // registered under an older version still counts.
  // dc_checkin_error keeps the last reason a check-in didn't go through
  // (never shown as an alert — Marketing and Settings read it to explain).
  function dcIsRegistered(){ return !!(getSetting("dc_vendor_id","") || getSetting("dc_vendor_status","")); }
  function dcRegistration(){
    return { registered: dcIsRegistered(), hasPhrase: !!getSetting("secret_phrase","").trim(),
      lastError: getSetting("dc_checkin_error",""), lastOkTs: getSetting("dc_checkin_ok_ts","") };
  }

  // ---- the check-in call itself ----
  // Resolves to { ok, reason, message? } — never rejects — so the places
  // that start one on purpose (end of setup, Save phrase, Marketing's
  // "Check again") can say what happened. reason: "registered" |
  // "offline" | "no_install" | "no_phrase" | "rejected" | "network".
  let _dcInFlight = null;
  function deviceCheckin(){
    // One at a time: boot, setup and Save phrase can overlap on a fresh device.
    if(!_dcInFlight) _dcInFlight = dcCheckinOnce().finally(()=>{ _dcInFlight = null; });
    return _dcInFlight;
  }
  async function dcCheckinOnce(){
    if(!isOnline()) return { ok:false, reason:"offline" }; // sync.js's own cheap pre-filter, same rule its worker uses
    const installId = getSetting("install_id","");
    if(!installId) return { ok:false, reason:"no_install" }; // nothing meaningful to report before setup has created this device's identity
    // The server refuses a check-in without the shop's activation phrase,
    // so don't send one that can only fail.
    if(!getSetting("secret_phrase","").trim()) return { ok:false, reason:"no_phrase" };
    let timer = null;
    try{
      const ctrl = (typeof AbortController!=="undefined")? new AbortController() : null;
      if(ctrl) timer = setTimeout(()=>ctrl.abort(), DC_CHECKIN_TIMEOUT_MS);
      const res = await fetch(DC_CHECKIN_URL, {
        method: "POST",
        headers: { "apikey": DC_ANON_KEY, "Content-Type": "application/json" },
        signal: ctrl? ctrl.signal : undefined,
        body: JSON.stringify({
          p_install_id: installId,
          p_shop_secret_phrase: getSetting("secret_phrase",""),
          p_device_code: currentDeviceCode(),
          p_business_name: getSetting("shop_name",""),
          p_owner_name: "",           // no owner-name setting exists today — see summary
          p_phone: getSetting("contact_phone",""),
          p_city: "",                 // no shop-city setting exists today — see summary
          p_location: getSetting("branch_name",""), // closest existing concept to a free-text location
          p_rpn_hint_id: null,        // RPN linkage (rpn.js) is stored as free text, no UUID tracked locally — see summary
          p_device_key: (typeof deviceKey==="function")? deviceKey() : null,  // terminal.js: tells this device apart from another with the same install ID
          p_app_build: (typeof APP_BUILD!=="undefined")? APP_BUILD : null      // build.js (sw-pwa.js "build: vN"): shared stock waits until every till runs v7+
        })
      });
      if(!res.ok){
        // e.g. "Shop secret phrase does not match this install" — kept so
        // Settings/Marketing can explain; lock state is left untouched.
        let message = "HTTP " + res.status;
        try{ const t = await res.text(); try{ const j = JSON.parse(t); message = j.message || t || message; }catch(e){ message = t || message; } }catch(e){}
        setSetting("dc_checkin_error", String(message).slice(0, 200));
        await persist();
        return { ok:false, reason:"rejected", message: String(message).slice(0, 200) };
      }
      const data = await res.json();
      if(!data || typeof data!=="object") return { ok:false, reason:"network" };
      setSetting("dc_lock_cart", data.lock_cart? "1" : "");
      setSetting("dc_lock_add_product", data.lock_add_product? "1" : "");
      setSetting("dc_lock_reason", data.lock_reason || "");
      setSetting("dc_vendor_status", data.status || "");
      if(data.vendor_id) setSetting("dc_vendor_id", String(data.vendor_id));
      // Multi-terminal: only ever filled in, never cleared, by a check-in —
      // registering/joining (terminal.js) is what sets the full identity.
      if(data.business_id && !getSetting("business_id","")) setSetting("business_id", String(data.business_id));
      if(data.terminal_id && !getSetting("terminal_id","")) setSetting("terminal_id", String(data.terminal_id));
      // Phase 2: main can deactivate a till. Selling is unaffected; Settings
      // says so and hides register/join. Only a true/false answer changes it
      // (null = this install isn't a till, or an older server).
      if(data.terminal_active===false) setSetting("terminal_inactive", "1");
      else if(data.terminal_active===true) setSetting("terminal_inactive", "");
      setSetting("dc_checkin_error", "");
      setSetting("dc_checkin_ok_ts", new Date().toISOString());
      dcMergeMessages(data.messages);
      await persist();
      return { ok:true, reason:"registered" };
      // Deliberately no render() here: this can land at any moment,
      // including mid-keystroke in a search box or a cart discount field —
      // forcing a full re-render would be exactly the rebuild-loses-focus
      // bug class this app has fixed elsewhere (see updateSplitTenderDerived's
      // comment in pos.js). Both gates below read settings fresh on every
      // call, so the new lock/messages state takes effect on the very next
      // natural render (next tap, next screen) with no special-casing here.
    }catch(e){
      // Offline, timeout, unreachable server, malformed response — all the
      // same: never alert the shop user, try again next launch or reconnect
      // (see startDeviceCheckin below).
      return { ok:false, reason:"network" };
    } finally { if(timer) clearTimeout(timer); }
  }
  // What to tell the shop when a check-in didn't register the device.
  function dcCheckinProblemText(r){
    r = r || {};
    if(r.reason==="no_phrase") return "Enter your activation secret phrase (from your RPN or Digital Commerce) in More → Settings.";
    if(r.reason==="offline" || r.reason==="network") return "Connect to the internet, then try again.";
    if(r.reason==="rejected") return /secret phrase does not match/i.test(r.message||"")
      ? "Digital Commerce has a different activation phrase for this device. Check the phrase with your RPN or Digital Commerce and save it again in More → Settings."
      : /registered to another device/i.test(r.message||"")
      ? "Digital Commerce has this install ID registered to another device, so this one can't use it. Contact Digital Commerce to re-admit this device."
      : "Digital Commerce couldn't register this device (" + (r.message||"unknown reason") + "). Contact Digital Commerce.";
    return "";
  }

  // Called once at boot (main.js, after initDB — so getSetting/currentDeviceCode
  // work) and again on every "online" event, mirroring startSyncWorker's own
  // listener registration (sync.js) but as its own separate listener: this
  // is one RPC whose reply drives lock state, not a queued insert, so it
  // doesn't share that worker's wiring.
  function startDeviceCheckin(){
    deviceCheckin(); // fire-and-forget — boot() never awaits this, so it can never delay startup
    if(typeof window!=="undefined" && window.addEventListener) window.addEventListener("online", deviceCheckin);
  }
