  // Adjustments recorded ON THIS DEVICE (a main device also holds merged ones, which live in the report).
  function openAdjustmentsHistory(){
    const wrap = openModal("Adjustments", "");
    const body = wrap.querySelector(".modal-body");
    let reason = "", from = "", to = "";
    function list(){
      const f = { reason, fromMs:from? Date.parse(from+"T00:00:00") : null, toMs:to? Date.parse(to+"T23:59:59") : null };
      const rows = adjustmentReportData(all("SELECT * FROM stock_adjustments WHERE branch_id=?",[getBranchId()]), [], f).rows.reverse();
      body.innerHTML = `
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px">
          <select class="field" id="ahReason" style="flex:1;min-width:140px;margin:0"><option value="">All reasons</option>${ADJ_REASONS.map(r=>`<option value="${escapeHtml(r)}" ${r===reason?"selected":""}>${escapeHtml(r)}</option>`).join("")}</select>
          <input class="field" id="ahFrom" type="date" value="${from}" style="flex:1;min-width:130px;margin:0"><input class="field" id="ahTo" type="date" value="${to}" style="flex:1;min-width:130px;margin:0">
        </div>
        ${rows.length===0? `<p class="muted">No adjustments.</p>` : `<div style="max-height:52vh;overflow:auto"><table class="simple">
          <tr><th>Date</th><th>Item</th><th>Qty</th><th>Reason</th><th>Note</th><th>By</th></tr>
          ${rows.map(r=>`<tr><td>${escapeHtml(new Date(r.ts).toLocaleDateString())}</td>
            <td>${r.product_code? `<div class="psku">${escapeHtml(r.product_code)}</div>` : ""}${escapeHtml(r.product_name)}</td>
            <td>${r.qty_delta>0?"+":""}${r.qty_delta}</td><td>${escapeHtml(r.reason)}</td><td>${escapeHtml(r.note||"")}</td>
            <td>${escapeHtml(r.by_user||"")}<div class="pmeta">Admin: ${escapeHtml(r.authorised_by||"")}</div></td></tr>`).join("")}</table></div>`}`;
      body.querySelector("#ahReason").onchange=(e)=>{ reason = e.target.value; list(); };
      body.querySelector("#ahFrom").onchange=(e)=>{ from = e.target.value; list(); };
      body.querySelector("#ahTo").onchange=(e)=>{ to = e.target.value; list(); };
    }
    list();

  // ---------------- Cancel / reissue / close as loss: the dispatching device (Phase 5) ----------------
  // Only the DISPATCHING device, with the Admin passcode, can cancel, reissue or close a DN.
  //
  // Protocol in one paragraph: starting a case writes a cancel_pending event and makes a checksummed notice
  // (or, for a reissue, a replacement DN that also acts as the notice). NOTHING about stock changes yet.
  // The receiver confirms (its DN becomes a tombstone: received XOR cancelled) and sends a confirmation back.
  // Only when that confirmation is imported (or the GRV for the replacement arrives, or management overrides)
  // is everything posted, in ONE synchronous transaction: restore, the replacement DN's stock, write-offs,
  // events and audit. A GRV that arrives while a cancel is pending ends the cancel instead.

  const cancelEnabled = ()=> getSetting("cancel_enabled","")==="1";
  const CANCEL_OFF_MSG = "Cancel and reissue is switched off on this device. An Admin can switch it on in Settings once every branch has updated the app.";
  const DN_CLOSED_STATUSES = ["cancelled","superseded","loss_closed"];

  function dnCaseByNo(caseNo){ return one("SELECT * FROM dn_cases WHERE dn_branch_id=? AND case_no=?",[getBranchId(),caseNo]); }
  function pendingCaseFor(dnNo){ return one("SELECT * FROM dn_cases WHERE dn_branch_id=? AND dn_no=? AND state='pending'",[getBranchId(),dnNo]); }
  function caseByReplacement(newDnNo){ return one("SELECT * FROM dn_cases WHERE dn_branch_id=? AND replaced_by=? ORDER BY id DESC",[getBranchId(),newDnNo]); }
  function planOf(c){ try{ return JSON.parse(c.plan_json).lines; }catch(e){ return []; } }
  function findProductForLine(l){
    const branch = currentBranch();
    return (l.code? one("SELECT * FROM products WHERE branch=? AND lower(sku)=lower(?)",[branch,l.code]) : null)
        || one("SELECT * FROM products WHERE branch=? AND lower(name)=lower(?)",[branch,l.name]);
  }
  function derivedDnStatus(dnNo){
    const r = dnStatusMap().get(getBranchId()+"|"+dnNo);
    return r? r.status : "dispatched";
  }
  const canStartCancel = (status)=> ["dispatched","awaiting","variance"].includes(status);

  // ---- the posting: restore, replacement DN stock, write-offs. Synchronous; the CALLER owns the transaction. ----
  // opts: { override:boolean, via:string, now:Date }
  function postCaseSync(c, opts){
    const branchId = getBranchId(), h = one("SELECT * FROM dispatch_docs WHERE dispatch_branch_id=? AND dn_no=? AND direction='out'",[branchId,c.dn_no]);
    if(!h) throw new Error(ownDnDisplay(c.dn_no)+" is not a Delivery Note of this device.");
    if(c.state!=="pending") throw new Error("This cancellation is already "+c.state+".");
    const ts = (opts.now||new Date()).toISOString(), plan = planOf(c), dn = ownDnDisplay(c.dn_no), admin = c.authorised_by||"";
    const products = plan.map(l=>{
      const p = findProductForLine(l);
      if(!p) throw new Error((l.code? l.code+" " : "")+l.name+" is no longer a product in this branch, so stock can't be restored. Nothing was changed.");
      return p;
    });
    // 1. restore everything that left with the original DN (first, so the later rows can never go below zero)
    plan.forEach((l,i)=>writeAdjustment({ product:products[i], delta:l.orig, reason:"Dispatch cancelled", note:"Restored: "+dn+" cancelled ("+CANCEL_KIND_LABEL[c.kind]+")",
      admin, ts, dnBranchId:branchId, dnNo:c.dn_no }));
    // 2. a reissue sends the corrected quantities again, on the replacement DN
    if(c.kind==="reissue"){
      const nh = one("SELECT * FROM dispatch_docs WHERE dispatch_branch_id=? AND dn_no=? AND direction='out'",[branchId,c.replaced_by]);
      if(!nh) throw new Error("The replacement Delivery Note "+ownDnDisplay(c.replaced_by)+" is missing.");
      plan.forEach((l,i)=>{
        if(!(l.nw>0)) return;
        const cur = one("SELECT stock FROM products WHERE id=?",[products[i].id]);
        if(!cur || cur.stock<l.nw) throw new Error(l.name+": only "+(cur?cur.stock:0)+" in stock for the replacement. Nothing was changed.");
        const nhText = docDisplay("DN",c.replaced_by,nh.till_code);
        moveStock({ productId:products[i].id, delta:-l.nw, kind:"dispatch", docType:"dn", docUid:nh.uid||null, docNo:nhText, ts, note:"To "+h.receive_branch_name+" (replacement)" });
        run("INSERT INTO stock_received(ts,product_id,name,qty,note,branch,user,dn_branch_id,dn_no,till_code) VALUES(?,?,?,?,?,?,?,?,?,?)",
          [ts,products[i].id,l.name,-l.nw,"Dispatched to "+h.receive_branch_name+" ("+nhText+")",currentBranch(),String(sessionUser||""),branchId,c.replaced_by,nh.till_code||null]);
      });
      run("UPDATE dispatch_docs SET stock_posted=1 WHERE dispatch_branch_id=? AND dn_no=? AND direction='out'",[branchId,c.replaced_by]);
    }
    // 3. what is written off, linked to the ORIGINAL DN, with the reason management chose
    plan.forEach((l,i)=>{ if(l.writeoff>0) writeAdjustment({ product:products[i], delta:-l.writeoff, reason:l.reason, note:c.note||"", admin, ts, dnBranchId:branchId, dnNo:c.dn_no }); });
    // 4. nothing may end below zero
    products.forEach(p=>{ const cur = one("SELECT stock,name FROM products WHERE id=?",[p.id]); if(cur.stock<0) throw new Error(cur.name+": stock would go below zero. Nothing was changed."); });
    const status = c.kind==="reissue"? "superseded" : c.kind==="loss"? "loss_closed" : "cancelled";
    run("UPDATE dn_cases SET state='posted', posted_ts=?, posted_via=?, override=? WHERE id=?",[ts,opts.via||"",opts.override?1:0,c.id]);
    run("UPDATE dispatch_docs SET status=?, cancel_kind=?, cancelled_ts=? WHERE dispatch_branch_id=? AND dn_no=? AND direction='out'",[status,c.kind,ts,branchId,c.dn_no]);
    recordDnEvent({ dnBranchId:branchId, dnNo:c.dn_no, type:"cancel_posted", actorBranchId:branchId, actorName:currentBranch(), fromName:h.dispatch_branch_name, toName:h.receive_branch_name, ts:localIso(opts.now||new Date()),
      detail:{ kind:c.kind, replaced_by:c.replaced_by||null, override:!!opts.override, case_no:c.case_no, via:opts.via||"" } });
    logAudit("Cancel posted", "", dn+": "+CANCEL_KIND_LABEL[c.kind]+(c.replaced_by? " (replaced by "+ownDnDisplay(c.replaced_by)+")" : "")+", "+(opts.override? "WITHOUT receiver confirmation" : "confirmed")+", authorised by "+admin);
  }

  // ---- start ----
  // o: { dnNo, kind, plan:[{nw,writeoff,reason}], note, passcode, override?, typed?, now? }
  // Synchronous; the caller awaits persist(). -> { caseNo, caseText, kind, newDnNo|null, overridden }
  function startCancelCase(o){
    requireSignedIn();
    if(!cancelEnabled()) throw new Error(CANCEL_OFF_MSG);
    if(!hasAdminPasscode()) throw new Error(NO_ADMIN_PASSCODE_MSG);
    const admin = findAdmin(o.passcode);
    if(!admin) throw new Error("Incorrect Admin passcode.");
    const branchId = getBranchId(), now = o.now || new Date(), ts = now.toISOString();
    const h = one("SELECT * FROM dispatch_docs WHERE dispatch_branch_id=? AND dn_no=? AND direction='out'",[branchId,o.dnNo]);
    if(!h) throw new Error("That Delivery Note was not dispatched from this device.");
    const dn = ownDnDisplay(o.dnNo), status = derivedDnStatus(o.dnNo);
    if(pendingCaseFor(o.dnNo)) throw new Error(dn+" already has a cancellation in progress.");
    if(!canStartCancel(status)) throw new Error(dn+" is "+(DN_STATUS_LABEL[status]||status).toLowerCase()+", so it can't be cancelled. Only dispatched, awaiting or variance Delivery Notes can.");
    if(h.status==="received" || DN_CLOSED_STATUSES.includes(h.status)) throw new Error(dn+" is already "+h.status+".");
    const stored = dnStoredLines(h).map(l=>({ code:l.sku||"", name:l.product_name, qty:l.qty }));
    if(!stored.length) throw new Error("The lines of "+dn+" could not be found on this device.");
    const norm = normalizeCancelPlan(o.kind, stored, o.plan, o.note);
    if(!norm.ok) throw new Error(norm.error);
    norm.lines.forEach(l=>{ if(!findProductForLine(l)) throw new Error((l.code? l.code+" " : "")+l.name+" is no longer a product in this branch."); });
    if(o.override && String(o.typed||"").trim()!=="CANCEL "+dn) throw new Error("Type CANCEL "+dn+" exactly to cancel without the receiver's confirmation.");
    db.run("BEGIN");
    try{
      const cx = reserveDocNumber("CXL"), nonce = newCancelNonce();
      let newNo = null;
      if(o.kind==="reissue"){
        const nd = reserveDocNumber("DN"); newNo = nd.n;
        const send = norm.lines.filter(l=>l.nw>0), units = send.reduce((s,l)=>s+l.nw,0);
        const ok = insertDispatchDoc({ dispatchBranchId:branchId, dispatchBranchName:h.dispatch_branch_name, dnNo:nd.n, receiveBranchName:h.receive_branch_name, direction:"out",
          createdTs:ts, createdIso:localIso(now), lineCount:send.length, unitTotal:units, status:"dispatched", fileName:dnFileName(nd.n, h.dispatch_branch_name, now, nd.till),
          tillCode:nd.till, internalRef:h.internal_ref||null });
        if(!ok) throw new Error("Delivery Note "+nd.text+" already exists.");
        run("UPDATE dispatch_docs SET replaces_dn_no=?, stock_posted=0 WHERE dispatch_branch_id=? AND dn_no=? AND direction='out'",[o.dnNo,branchId,nd.n]);
        send.forEach(l=>run(`INSERT INTO stock_transfers(ts,from_branch,to_branch,product_name,sku,qty,note,user,status,dn_no,dn_branch_id) VALUES(?,?,?,?,?,?,?,?,'Dispatched',?,?)`,
          [ts,h.dispatch_branch_name,h.receive_branch_name,l.name,l.code,l.nw,nd.text+" (replaces "+dn+")",String(sessionUser||""),nd.n,branchId]));
        recordDnEvent({ dnBranchId:branchId, dnNo:nd.n, type:"dispatched", actorBranchId:branchId, actorName:h.dispatch_branch_name, fromName:h.dispatch_branch_name, toName:h.receive_branch_name, ts,
          detail:{ dn_created_iso:localIso(now), lines:send.length, units, replaces:o.dnNo }, dnTill:nd.till||null });
      }
      run(`INSERT INTO dn_cases(case_no,dn_branch_id,dn_no,kind,state,nonce,plan_json,replaced_by,override,note,started_ts,started_by,authorised_by,till_code)
           VALUES(?,?,?,?,'pending',?,?,?,0,?,?,?,?,?)`,
        [cx.n,branchId,o.dnNo,o.kind,nonce,JSON.stringify({ lines:norm.lines }),newNo,String(o.note).trim(),ts,String(sessionUser||""),admin.name,cx.till||null]);
      run("UPDATE dispatch_docs SET cancel_no=?, replaced_by=?, cancel_kind=? WHERE dispatch_branch_id=? AND dn_no=? AND direction='out'",[cx.n,newNo,o.kind,branchId,o.dnNo]);
      recordDnEvent({ dnBranchId:branchId, dnNo:o.dnNo, type:"cancel_pending", actorBranchId:branchId, actorName:currentBranch(), fromName:h.dispatch_branch_name, toName:h.receive_branch_name, ts,
        detail:{ kind:o.kind, cancel_no:cx.n, replaced_by:newNo } });
      logAudit("Cancel started", "", dn+": "+CANCEL_KIND_LABEL[o.kind]+" ("+cx.text+")"+(newNo? ", replacement "+ownDnDisplay(newNo) : "")+", "+String(o.note).trim()+" (authorised by "+admin.name+")");
      if(o.override) postCaseSync(one("SELECT * FROM dn_cases WHERE dn_branch_id=? AND case_no=?",[branchId,cx.n]), { override:true, via:"override", now });
      db.run("COMMIT");
      return { caseNo:cx.n, caseText:cx.text, kind:o.kind, newDnNo:newNo, overridden:!!o.override };
    }catch(e){
      try{ db.run("ROLLBACK"); }catch(_){}
      throw e;
    }
  }

  // Management posts a pending cancel without waiting for the receiver. Flagged; a later GRV makes the DN a conflict.
  function overridePendingCase(o){
    requireSignedIn();
    if(!cancelEnabled()) throw new Error(CANCEL_OFF_MSG);
    if(!hasAdminPasscode()) throw new Error(NO_ADMIN_PASSCODE_MSG);
    const admin = findAdmin(o.passcode);
    if(!admin) throw new Error("Incorrect Admin passcode.");
    const c = pendingCaseFor(o.dnNo);
    if(!c) throw new Error(ownDnDisplay(o.dnNo)+" has no cancellation waiting for a confirmation.");
    if(String(o.typed||"").trim()!=="CANCEL "+ownDnDisplay(o.dnNo)) throw new Error("Type CANCEL "+ownDnDisplay(o.dnNo)+" exactly to cancel without the receiver's confirmation.");
    db.run("BEGIN");
    try{
      run("UPDATE dn_cases SET authorised_by=? WHERE id=?",[admin.name,c.id]);
      postCaseSync(Object.assign({}, c, { authorised_by:admin.name }), { override:true, via:"override", now:o.now||new Date() });
      db.run("COMMIT");
    }catch(e){ try{ db.run("ROLLBACK"); }catch(_){} throw e; }
  }

  // ---- receiver's confirmation arrives ----
  function ackContext(){
    return { ownBranchId:getBranchId(),
      header:(dnNo)=>one("SELECT * FROM dispatch_docs WHERE dispatch_branch_id=? AND dn_no=? AND direction='out'",[getBranchId(),dnNo]),
      caseByNo:dnCaseByNo };
  }
  async function ackCheckBytes(bytes){
    const text = decodeBytesUtf8(bytes);
    return { res: await checkIncomingAck(text, ackContext()), text };
  }
  // Post the case (or, for an override-posted case, just record that the receiver has now confirmed). One transaction.
  function commitAckImport(ack, now){
    db.run("BEGIN");
    try{
      const c = dnCaseByNo(ack.cancel_no);
      if(!c || c.nonce!==ack.nonce || c.dn_no!==ack.dn_no) throw new Error("This confirmation doesn't match any cancellation started on this device.");
      const h = one("SELECT * FROM dispatch_docs WHERE dispatch_branch_id=? AND dn_no=? AND direction='out'",[getBranchId(),ack.dn_no]);
      let posted = false;
      if(c.state==="pending"){
        if(h.status==="received") throw new Error(ownDnDisplay(ack.dn_no)+" is recorded as received. Nothing was changed.");
        postCaseSync(c, { override:false, via:"confirmation", now });
        posted = true;
      } else if(c.state==="posted" && c.override && !c.acked_ts){ /* upgrade only */ }
      else throw new Error("Already confirmed.");
      run("UPDATE dn_cases SET acked_ts=? WHERE id=?",[now.toISOString(),c.id]);
      recordDnEvent({ dnBranchId:getBranchId(), dnNo:ack.dn_no, type:"cancelled", actorBranchId:ack.to.branch_id, actorName:ack.to.name, fromName:h.dispatch_branch_name, toName:h.receive_branch_name,
        ts:ack.confirmed_iso, detail:{ cancel_no:ack.cancel_no, variance_seen:ack.variance_seen, via:"confirmation" } });
      db.run("COMMIT");
      return { posted, upgraded:!posted, case:dnCaseByNo(ack.cancel_no) };
    }catch(e){ try{ db.run("ROLLBACK"); }catch(_){} throw e; }
  }

  // ---- files the dispatcher sends ----
  function cancelNoticeFileName(caseNo, receiverName, date, tillCode){
    return docDisplay("CXL",caseNo,tillCode)+"-"+sanitizeBranchName(receiverName)+"-"+fileDatePart(date)+"-"+fileTimePart(date)+"-cancel"+DOC_FILE_EXT;
  }
  async function cancelNoticeFor(c){
    const h = one("SELECT * FROM dispatch_docs WHERE dispatch_branch_id=? AND dn_no=? AND direction='out'",[getBranchId(),c.dn_no]);
    const items = dnStoredLines(h).map(l=>({ code:l.sku||"", name:l.product_name, qty:l.qty }));
    const doc = await buildCancel({ cancelNo:c.case_no, nonce:c.nonce, kind:c.kind, dnNo:c.dn_no, fromBranchId:getBranchId(), fromName:h.dispatch_branch_name, toName:h.receive_branch_name,
      replacedBy:c.replaced_by||null, cancelledIso:localIso(new Date(c.started_ts)), items, tillCode:c.till_code||"", dnTillCode:h.till_code||"" });
    return { doc, text:serializeCancel(doc), fileName:cancelNoticeFileName(c.case_no, h.receive_branch_name, new Date(c.started_ts), c.till_code), header:h };
  }
  async function shareCancelNotice(c){
    const n = await cancelNoticeFor(c);
    const msg = "CANCELLED: "+n.doc.dn_display+" ("+n.doc.cancel_display+") from "+n.doc.from.name+". Do not receive it. In seiGEN Commerce Lite open Products \u2192 Receive stock and choose the attached file.";
    return shareDocFile({ fileName:n.fileName, text:n.text, folder:"Cancellations", title:n.doc.cancel_display, phone:dnPhoneFor(n.header.receive_branch_name), shareText:msg, whatsappText:msg+" (Attach the file from the folder that just opened.)" });
  }
  // The replacement DN (it also acts as the notice for the DN it replaces).
  async function shareReplacementDN(newDnNo){
    const h = dnHeaderFor(newDnNo), rec = await dnGetRecord(h);
    const s = await dnShareRecord(h, rec);
    return s;
  }

  // ---- screens ----
  function openCancelWizard(dnNo, onDone){
    if(!cancelEnabled()){ alert(CANCEL_OFF_MSG); return; }
    try{ requireSignedIn(); }catch(e){ alert(e.message); return; }
    if(!hasAdminPasscode()){ alert(NO_ADMIN_PASSCODE_MSG); return; }
    const h = dnHeaderFor(dnNo);
    if(!h){ alert("That Delivery Note was not dispatched from this device."); return; }
    const status = derivedDnStatus(dnNo);
    if(!canStartCancel(status)){ alert(ownDnDisplay(dnNo)+" is "+(DN_STATUS_LABEL[status]||status).toLowerCase()+". Only dispatched, awaiting or variance Delivery Notes can be cancelled."); return; }
    const dn = ownDnDisplay(dnNo), lines = dnStoredLines(h).map(l=>({ code:l.sku||"", name:l.product_name, qty:l.qty }));
    const mv = dnStatusMap().get(getBranchId()+"|"+dnNo);
    const counted = (l)=>{ const f = mv && mv.varianceFlags.find(x=>(x.code||"")===(l.code||"") && x.name===l.name); return f? Math.min(f.counted, l.qty) : null; };
    const wrap = openModal("Cancel or reissue "+dn, "");
    const body = wrap.querySelector(".modal-body");
    const receiver = h.receive_branch_name;
    let note = "", kind = "cancel", state = lines.map(l=>({ nw:counted(l)!==null? counted(l) : l.qty, disp:"return" }));
    function planFromState(){
      return state.map((s,i)=>{
        const diff = lines[i].qty - (kind==="reissue"? Number(s.nw) : 0);
        return { nw:s.nw, writeoff:(s.disp==="return" || kind==="cancel")? 0 : (kind==="loss"? lines[i].qty : (Number.isInteger(diff)? diff : 0)), reason:s.disp==="return"? "" : s.disp };
      });
    }
    function draw(err){
      body.innerHTML = `
        <div class="pmeta" style="margin-bottom:6px">To <b>${escapeHtml(receiver)}</b> · status: ${escapeHtml(DN_STATUS_LABEL[status]||status)}${mv && mv.hasVariance? " · variance reported" : ""}</div>
        ${mv && mv.hasVariance? `<div class="box" style="margin-bottom:8px;font-size:12.5px">${escapeHtml(varianceText(mv))}</div>` : ""}
        <div class="card" style="padding:8px;margin-bottom:8px">
          ${[["cancel","Cancel: sent by mistake. Everything returns to stock."],["reissue","Cancel and reissue with corrected lines"],["loss","Close as loss: the goods never arrived or can't be recovered"]].map(o=>`
            <label style="display:flex;gap:8px;align-items:flex-start;margin:4px 0"><input type="radio" name="cwKind" value="${o[0]}" ${kind===o[0]?"checked":""} style="width:auto;margin-top:3px"><span>${escapeHtml(o[1])}</span></label>`).join("")}
        </div>
        ${kind==="cancel"? "" : `<div style="max-height:34vh;overflow:auto">${lines.map((l,i)=>`
          <div class="card" style="padding:8px;margin-bottom:6px">
            <div><b>${escapeHtml(l.name)}</b> <span class="muted">${escapeHtml(l.code||"no code")} · sent ${l.qty}</span></div>
            ${kind==="reissue"? `<label style="margin:6px 0 0">New quantity (0 to ${l.qty})</label><input class="field" data-nw="${i}" inputmode="numeric" value="${state[i].nw}">` : ""}
            <label style="margin:6px 0 0">${kind==="reissue"? "The difference" : "Write off as"}</label>
            <select class="field" data-disp="${i}">
              ${kind==="reissue"? `<option value="return" ${state[i].disp==="return"?"selected":""}>Return to stock</option>` : ""}
              ${ADJ_WRITEOFF_REASONS.map(r=>`<option value="${escapeHtml(r)}" ${state[i].disp===r?"selected":""}>Write off: ${escapeHtml(r)}</option>`).join("")}
            </select>
          </div>`).join("")}</div>`}
        <div id="cwSummary" class="muted" style="font-size:12.5px;margin:6px 0"></div>
        <label>Note (why)</label><textarea class="field" id="cwNote" rows="2">${escapeHtml(note)}</textarea>
        <label>Admin passcode</label><input class="field" id="cwPass" type="password" autocomplete="off">
        <div id="cwErr" style="color:#b42318;font-size:12.5px;margin-top:6px">${escapeHtml(err||"")}</div>
        <button class="btn btn-primary" id="cwStart" style="margin-top:10px">Start</button>`;
      body.querySelectorAll('[name="cwKind"]').forEach(r=>r.onchange=()=>{ kind = r.value; if(kind==="loss") state.forEach(s=>{ if(s.disp==="return") s.disp="Lost in transit"; }); if(kind!=="loss") state.forEach(s=>{ }); draw(); });
      body.querySelectorAll("[data-nw]").forEach(i=>i.oninput=()=>{ state[+i.dataset.nw].nw = i.value; summary(); });
      body.querySelectorAll("[data-disp]").forEach(s=>s.onchange=()=>{ state[+s.dataset.disp].disp = s.value; summary(); });
      body.querySelector("#cwNote").oninput=(e)=>{ note = e.target.value; };        // survives a re-draw after an error
      summary();
      body.querySelector("#cwStart").onclick=start;
    }
    function summary(){
      const el = body.querySelector("#cwSummary"); if(!el) return;
      const n = normalizeCancelPlan(kind, lines, planFromState(), "x");
      el.textContent = n.ok? cancelPlanSummary(kind, n.lines, dn).text : n.error;
      el.style.color = n.ok? "" : "#b42318";
    }
    let busy = false;
    async function start(){
      if(busy) return; busy = true;
      let r;
      try{
        note = body.querySelector("#cwNote").value;
        r = startCancelCase({ dnNo, kind, plan:planFromState(), note, passcode:body.querySelector("#cwPass").value });
        await persist();
      }catch(e){ busy = false; draw(e.message||String(e)); return; }
      if(r.newDnNo){
        try{ const hh = dnHeaderFor(r.newDnNo), b = await dnBuildFromDb(hh); await dnfPut(hh.dispatch_branch_id, hh.dn_no, { text:b.text, file_name:hh.file_name, saved_ts:new Date().toISOString() }); }catch(e){}
      }
      started(r);
    }
    function started(r){
      const nd = r.newDnNo? ownDnDisplay(r.newDnNo) : "";
      body.innerHTML = `<div class="box" style="margin-bottom:10px"><p style="font-weight:700;margin:0 0 4px">${escapeHtml(r.caseText)} started for ${escapeHtml(dn)}</p>
        <p class="muted" style="margin:0">Nothing has changed in your stock yet. It is posted when ${escapeHtml(receiver)}'s confirmation is imported${nd? " (or when the receipt voucher for "+escapeHtml(nd)+" arrives)" : ""}. Send them the file now.</p></div>
        ${nd? `<button class="btn btn-primary" id="cwShareNew" style="width:100%;margin-bottom:8px">${isTauriApp()? "📁 " : "📲 "}Send replacement ${escapeHtml(nd)} to ${escapeHtml(receiver)}</button>` : ""}
        <button class="btn ${nd? "btn-outline" : "btn-primary"}" id="cwShareNotice" style="width:100%;margin-bottom:8px">${isTauriApp()? "📁 " : "📲 "}Send cancellation notice to ${escapeHtml(receiver)}</button>
        <div id="cwMsg" class="muted" style="font-size:12.5px;margin-bottom:8px"></div>
        <button class="btn btn-ghost" id="cwDone">Done</button>`;
      const msg = body.querySelector("#cwMsg");
      const sn = body.querySelector("#cwShareNew");
      if(sn) sn.onclick=async ()=>{ try{ msg.textContent = dnShareMessage(await shareReplacementDN(r.newDnNo)); }catch(e){ msg.textContent = "Couldn't share: "+(e.message||e); } };
      body.querySelector("#cwShareNotice").onclick=async ()=>{ try{ msg.textContent = dnShareMessage(await shareCancelNotice(dnCaseByNo(r.caseNo))); }catch(e){ msg.textContent = "Couldn't share: "+(e.message||e); } };
      body.querySelector("#cwDone").onclick=()=>{ wrap.remove(); if(onDone) onDone(); else render(); };
    }
    draw();
  }

  // For a DN with a cancel waiting for the receiver: re-share, or post it WITHOUT the receiver's confirmation.
  function openPendingCancelModal(dnNo, onDone){
    const c = pendingCaseFor(dnNo);
    if(!c){ alert("No cancellation is waiting on "+ownDnDisplay(dnNo)+"."); return; }
    const h = dnHeaderFor(dnNo), dn = ownDnDisplay(dnNo), receiver = h.receive_branch_name;
    const wrap = openModal(dn+": cancel pending", `
      <p style="margin:0 0 6px">${escapeHtml(docDisplay("CXL",c.case_no,c.till_code))} (${escapeHtml(CANCEL_KIND_LABEL[c.kind])}) is waiting for <b>${escapeHtml(receiver)}</b> to confirm. Your stock changes only when it does.</p>
      <button class="btn btn-outline" id="pcShare" style="width:100%;margin-bottom:6px">${isTauriApp()? "📁 " : "📲 "}Send the cancellation again</button>
      ${c.replaced_by? `<button class="btn btn-outline" id="pcShareNew" style="width:100%;margin-bottom:6px">Send replacement ${escapeHtml(ownDnDisplay(c.replaced_by))} again</button>` : ""}
      <div id="pcMsg" class="muted" style="font-size:12.5px;margin-bottom:8px"></div>
      <div class="box" style="border-color:#b42318">
        <b>Cancel without confirmation</b>
        <p class="muted" style="margin:4px 0">Use this only if ${escapeHtml(receiver)} can't be reached. Your stock is posted now. If they still receive the goods, stock will be counted twice and ${escapeHtml(dn)} will show <b>Conflict</b>. Nothing is corrected automatically.</p>
        <label style="margin-top:6px">Type CANCEL ${escapeHtml(dn)}</label><input class="field" id="pcTyped" autocomplete="off">
        <label>Admin passcode</label><input class="field" id="pcPass" type="password" autocomplete="off">
        <div id="pcErr" style="color:#b42318;font-size:12.5px;margin-top:6px"></div>
        <button class="btn btn-primary" id="pcGo" style="margin-top:8px;background:#b42318">Cancel without confirmation</button>
      </div>`);
    const q = (s)=>wrap.querySelector(s);
    q("#pcShare").onclick=async ()=>{ try{ q("#pcMsg").textContent = dnShareMessage(await shareCancelNotice(c)); }catch(e){ q("#pcMsg").textContent = "Couldn't share: "+(e.message||e); } };
    const sn = q("#pcShareNew"); if(sn) sn.onclick=async ()=>{ try{ q("#pcMsg").textContent = dnShareMessage(await shareReplacementDN(c.replaced_by)); }catch(e){ q("#pcMsg").textContent = "Couldn't share: "+(e.message||e); } };
    let busy = false;
    q("#pcGo").onclick=async ()=>{
      if(busy) return; busy = true;
      try{ overridePendingCase({ dnNo, passcode:q("#pcPass").value, typed:q("#pcTyped").value }); await persist(); }
      catch(e){ busy = false; q("#pcErr").textContent = e.message||String(e); return; }
      wrap.remove(); if(onDone) onDone(); else render();
    };
  }

  // ---------------- Import GRV (dispatcher side, Phase 4) ----------------
  // The receiver sends its Goods Received Voucher back. Importing it marks the DN
  // 'received'. Stock is NEVER touched here: it was deducted at dispatch and the
  // receiver added it on Accept. Nothing is written unless every check passes.

  // ---- pure part ----
  const grvLineKey = (l)=> (String(l.code==null?"":l.code).trim().toLowerCase() || "name:"+String(l.name==null?"":l.name).trim().toLowerCase());
  function grvLineText(l){ return (l.code? l.code+" " : "")+l.name+" × "+l.qty; }
  // dnLines: [{code,name,qty}] (what this branch dispatched)  grvLines: [{code,name,qty}]
  // Equal means the same set of (code, qty) pairs — order does not matter.
  // Lines with no code are matched on their name.
  function compareGrvLines(dnLines, grvLines){
    const norm = (ls)=> ls.map(l=>grvLineKey(l)+"|"+l.qty).sort();
    const a = norm(dnLines), b = norm(grvLines);
    if(a.length===b.length && a.every((x,i)=>x===b[i])) return { same:true };
    return { same:false, dn:dnLines.map(grvLineText), grv:grvLines.map(grvLineText) };
  }
  // ctx: { ownBranchId, lookup(dnNo) -> dispatch_docs 'out' row | null, storedLines(header) -> [{code,name,qty}] }
  // -> { ok:false, stage, message, ... } | { ok:true, doc, header, lines }
  async function checkIncomingGRV(text, ctx, hashFn){
    // 1. parse, validate, checksum
    const p = await parseGRV(text, hashFn);
    if(!p.ok) return { ok:false, stage:"file", message:p.errors[0], errors:p.errors };
    const doc = p.doc;
    // 2. the DN must have been dispatched by this branch
    if(doc.from.branch_id!==ctx.ownBranchId)
      return { ok:false, stage:"branch", message:"This Goods Received Voucher is for "+doc.dn_display+" dispatched by \""+doc.from.name+"\", not by this branch. Nothing was changed.", doc };
    // 3. and must exist here as an outgoing DN
    const h = ctx.lookup(doc.dn_no);
    // A GRV can only be matched on the till that dispatched the DN (only that device holds the dispatch record).
    if(!h) return { ok:false, stage:"unknown", message:doc.dn_display+" was not dispatched from this device, so this voucher can't be matched."
      +(doc.dn_till_code? " Import it on till "+doc.dn_till_code+", which dispatched it." : "")+" Nothing was changed.", doc };
    // 4. only once
    if(h.status==="received")
      return { ok:false, stage:"duplicate", message:"Already confirmed on "+(isoDateText(h.received_iso)||String(h.received_ts||"").slice(0,10))+" as "+docDisplay("GRV",h.grv_no,h.grv_till_code)+".", doc, header:h };
    // 4b. a DN cancelled here can't be received: record that the two facts disagree (the screen does), change no stock
    if(["cancelled","superseded","loss_closed"].includes(h.status))
      return { ok:false, stage:"conflict", message:doc.dn_display+" was "+({ cancelled:"cancelled", superseded:"cancelled and reissued", loss_closed:"closed as a loss" }[h.status])+" on this device, but this voucher ("+doc.grv_display+") says "+doc.to.name
        +" received it. Both facts are now recorded and "+doc.dn_display+" shows as Conflict. No stock was changed. Management must check the stock.", doc, header:h };
    // 5. the lines must equal what was dispatched
    const stored = ctx.storedLines(h);
    const cmp = compareGrvLines(stored, doc.items);
    if(!cmp.same)
      return { ok:false, stage:"lines", message:"The lines on this voucher are not the same as the lines dispatched on "+doc.dn_display+". Nothing was changed.", dn:cmp.dn, grv:cmp.grv, doc, header:h };
    return { ok:true, doc, header:h };
  }

  // ---- database side ----
  function grvImportContext(){
    return { ownBranchId:getBranchId(),
      lookup:(dnNo)=>one("SELECT * FROM dispatch_docs WHERE dispatch_branch_id=? AND dn_no=? AND direction='out'",[getBranchId(),dnNo]),
      storedLines:(h)=>dnStoredLines(h).map(l=>({ code:l.sku||"", name:l.product_name, qty:l.qty })) };
  }
  async function grvImportCheckBytes(bytes){
    const text = decodeBytesUtf8(bytes);
    return { res: await checkIncomingGRV(text, grvImportContext()), text };
  }
  // Synchronous and all-or-nothing; the caller awaits persist() afterwards.
  // Writes the header and the event ONLY: no product, stock or counter is touched.
  function commitGrvImport(doc, now){
    db.run("BEGIN");
    try{
      const h = one("SELECT * FROM dispatch_docs WHERE dispatch_branch_id=? AND dn_no=? AND direction='out'",[getBranchId(),doc.dn_no]);
      if(!h) throw new Error(doc.dn_display+" was not dispatched from this device.");
      if(h.status==="received") throw new Error("Already confirmed as "+docDisplay("GRV",h.grv_no,h.grv_till_code)+".");
      const ts = now.toISOString();
      let aborted = null, posted = null;
      // A cancel still waiting on this DN ends here: the receiver had accepted it, so nothing is restored.
      const pc = pendingCaseFor(doc.dn_no);
      if(pc){
        run("UPDATE dn_cases SET state='aborted', posted_ts=?, posted_via='grv' WHERE id=?",[ts,pc.id]);
        recordDnEvent({ dnBranchId:getBranchId(), dnNo:doc.dn_no, type:"cancel_aborted", actorBranchId:getBranchId(), actorName:currentBranch(), fromName:h.dispatch_branch_name, toName:h.receive_branch_name, ts:localIso(now),
          detail:{ case_no:pc.case_no, reason:"received as "+doc.grv_display } });
        if(pc.kind==="reissue" && pc.replaced_by){          // the replacement was never valid: nothing was posted for it
          run("UPDATE dispatch_docs SET status='cancelled', cancel_kind='aborted', cancelled_ts=? WHERE dispatch_branch_id=? AND dn_no=? AND direction='out'",[ts,getBranchId(),pc.replaced_by]);
          recordDnEvent({ dnBranchId:getBranchId(), dnNo:pc.replaced_by, type:"cancel_posted", actorBranchId:getBranchId(), actorName:currentBranch(), fromName:h.dispatch_branch_name, toName:h.receive_branch_name, ts:localIso(now),
            detail:{ kind:"aborted", replaced_by:null, override:false, case_no:pc.case_no, via:"grv-of-original" } });
        }
        aborted = { caseNo:pc.case_no, replacement:pc.replaced_by||null };
      }
      // A voucher for a REPLACEMENT DN also proves the DN it replaced can no longer be received: post that cancel now.
      if(h.replaces_dn_no && h.stock_posted===0){
        const oc = caseByReplacement(h.dn_no);
        if(oc && oc.state==="pending"){
          postCaseSync(oc, { override:false, via:"grv-of-replacement", now });
          run("UPDATE dn_cases SET acked_ts=? WHERE id=?",[ts,oc.id]);
          recordDnEvent({ dnBranchId:getBranchId(), dnNo:oc.dn_no, type:"cancelled", actorBranchId:doc.to.branch_id, actorName:doc.to.name, fromName:h.dispatch_branch_name, toName:h.receive_branch_name,
            ts:doc.received_iso, detail:{ cancel_no:oc.case_no, via:"grv-of-replacement" } });
          posted = { dnNo:oc.dn_no, caseNo:oc.case_no };
        }
      }
      run(`UPDATE dispatch_docs SET status='received', grv_no=?, received_ts=?, received_iso=?, received_by=?, grv_till_code=?, grv_internal_ref=?
           WHERE dispatch_branch_id=? AND dn_no=? AND direction='out'`,
        [doc.grv_no, ts, doc.received_iso, String(sessionUser||""), doc.till_code||null, doc.internal_ref||null, getBranchId(), doc.dn_no]);
      recordDnEvent({ dnBranchId:getBranchId(), dnNo:doc.dn_no, type:"received", actorBranchId:doc.to.branch_id, actorName:doc.to.name,
        fromName:h.dispatch_branch_name, toName:h.receive_branch_name, ts:doc.received_iso, grvNo:doc.grv_no,
        detail:{ dn_created_iso:h.created_iso, imported_at:ts, imported_by:String(sessionUser||"") }, dnTill:h.till_code||null, grvTill:doc.till_code||null });
      logAudit("Import GRV","",doc.grv_display+" confirms "+doc.dn_display+" received by "+doc.to.name);
      db.run("COMMIT");
      return { header:one("SELECT * FROM dispatch_docs WHERE dispatch_branch_id=? AND dn_no=? AND direction='out'",[getBranchId(),doc.dn_no]), aborted, posted };
    }catch(e){
      try{ db.run("ROLLBACK"); }catch(_){}
      throw e;
    }
  }
  // A voucher for a DN this device cancelled: record the disagreement as a fact (no stock, no header change).
  // The DN then derives as 'conflict' (a posted cancel AND a receipt).
  function commitConflictGrv(doc, now){
    db.run("BEGIN");
    try{
      const h = one("SELECT * FROM dispatch_docs WHERE dispatch_branch_id=? AND dn_no=? AND direction='out'",[getBranchId(),doc.dn_no]);
      if(!h) throw new Error(doc.dn_display+" was not dispatched from this device.");
      recordDnEvent({ dnBranchId:getBranchId(), dnNo:doc.dn_no, type:"received", actorBranchId:doc.to.branch_id, actorName:doc.to.name,
        fromName:h.dispatch_branch_name, toName:h.receive_branch_name, ts:doc.received_iso, grvNo:doc.grv_no,
        detail:{ dn_created_iso:h.created_iso, imported_at:now.toISOString(), imported_by:String(sessionUser||""), conflict:true } });
      logAudit("GRV conflict","",doc.grv_display+" says "+doc.dn_display+" was received, but it is "+h.status+" here. Stock NOT changed.");
      db.run("COMMIT");
    }catch(e){ try{ db.run("ROLLBACK"); }catch(_){} throw e; }
  }

  // ---- screen ----
  function openGrvImportWithFile(file){ openGrvImportScreen(file); }
  function openGrvImportScreen(file, onDone){
    const wrap = openModal("Import GRV", `
      <p class="muted" style="margin-top:0">Choose the Goods Received Voucher file the receiving branch sent back. Any file name works.</p>
      <input type="file" id="giFile">`);
    const body = wrap.querySelector(".modal-body");
    wrap.querySelector("#giFile").onchange=(e)=>{ const f = e.target.files[0]; e.target.value=""; if(f) handle(f); };
    if(file) handle(file);
    function close(){ wrap.remove(); if(onDone) onDone(); else render(); }
    function blocked(res){
      const both = res.stage==="lines"? `
        <div class="card" style="padding:8px;margin:8px 0"><b>Dispatched on ${escapeHtml(res.doc.dn_display)}</b>${res.dn.map(t=>`<div class="pmeta">${escapeHtml(t)}</div>`).join("")}</div>
        <div class="card" style="padding:8px;margin:8px 0"><b>On the voucher ${escapeHtml(res.doc.grv_display)}</b>${res.grv.map(t=>`<div class="pmeta">${escapeHtml(t)}</div>`).join("")}</div>` : "";
      body.innerHTML = `<p style="margin:0 0 6px"><b>${escapeHtml(res.message)}</b></p>${both}<button class="btn btn-outline" id="giClose">Close</button>`;
      body.querySelector("#giClose").onclick=close;
    }
    // A cancellation confirmation from a receiver: post the cancel (restore, replacement, write-offs) in one transaction.
    async function handleAck(bytes){
      let out;
      try{ out = await ackCheckBytes(bytes); }catch(e){ return blocked({ stage:"file", message:"Could not read that file as a cancellation confirmation." }); }
      if(!out.res.ok) return blocked(out.res);
      const ack = out.res.doc;
      let r;
      try{ r = commitAckImport(ack, new Date()); }
      catch(e){ return blocked({ stage:"commit", message:"Nothing was changed. "+(e.message||String(e)) }); }
      try{ await persist(); }catch(e){}
      const c = r.case, kindText = c? CANCEL_KIND_LABEL[c.kind] : "Cancelled";
      body.innerHTML = `<div class="box" style="text-align:center;margin-bottom:10px"><p style="font-size:16px;font-weight:700;margin:0 0 4px">${escapeHtml(ack.dn_display)}: ${escapeHtml(kindText.toLowerCase())}</p>
        <p class="muted" style="margin:0">${r.upgraded? escapeHtml(ack.to.name+" has now confirmed the cancellation you posted earlier without confirmation. Nothing else changed.") : escapeHtml("Confirmed by "+ack.to.name+". Your stock was restored"+(c && c.kind==="reissue"? ", the replacement "+ownDnDisplay(c.replaced_by)+" was posted" : "")+(c && c.kind==="loss"? " and the loss was written off" : "")+".")}</p></div>
        <button class="btn btn-primary" id="giDone">Done</button>`;
      body.querySelector("#giDone").onclick=close;
    }
    async function handle(f){
      body.innerHTML = `<div class="box" style="text-align:center"><p style="margin:0">Reading…</p></div>`;
      let bytes;
      try{ bytes = await readFileBytes(f); }catch(e){ return blocked({ stage:"file", message:"Could not read that file." }); }
      const fmt = sniffJsonFormat(bytes);
      if(fmt===ACK_FORMAT) return handleAck(bytes);
      if(fmt===CANCEL_FORMAT) return blocked({ stage:"file", message:"This is a cancellation notice for the receiving branch. It goes through Products, then Receive stock, on the branch it was sent to." });
      let out;
      try{ out = await grvImportCheckBytes(bytes); }catch(e){ return blocked({ stage:"file", message:"Could not read that file as a Goods Received Voucher." }); }
      if(!out.res.ok && out.res.stage==="conflict"){
        try{ commitConflictGrv(out.res.doc, new Date()); await persist(); }catch(e){ return blocked({ stage:"commit", message:"Nothing was changed. "+(e.message||String(e)) }); }
        try{ await dnfPut(getBranchId(), "GRV:"+out.res.doc.dn_no, { text:out.text, file_name:f.name||"", saved_ts:new Date().toISOString() }); }catch(e){}
        return blocked(out.res);
      }
      if(!out.res.ok) return blocked(out.res);
      const doc = out.res.doc;
      let cr;
      try{ cr = commitGrvImport(doc, new Date()); }
      catch(e){ return blocked({ stage:"commit", message:"Nothing was changed. "+(e.message||String(e)) }); }
      try{ await persist(); }catch(e){}
      try{ await dnfPut(getBranchId(), "GRV:"+doc.dn_no, { text:out.text, file_name:f.name||"", saved_ts:new Date().toISOString() }); }catch(e){}
      body.innerHTML = `<div class="box" style="text-align:center;margin-bottom:10px"><p style="font-size:16px;font-weight:700;margin:0 0 4px">${escapeHtml(doc.dn_display)} confirmed</p>
        <p class="muted" style="margin:0">Received by ${escapeHtml(doc.to.name)} on ${escapeHtml(isoDateText(doc.received_iso))} as ${escapeHtml(doc.grv_display)}. ${cr && cr.posted? "This also confirms the cancellation of "+escapeHtml(ownDnDisplay(cr.posted.dnNo))+": your stock was restored and this replacement was posted." : "Your stock was not changed."}</p>
        ${cr && cr.aborted? `<p style="margin:8px 0 0;color:#b54708">The cancellation in progress on this Delivery Note was ended, because the goods were received. Nothing was restored${cr.aborted.replacement? " and the replacement "+escapeHtml(ownDnDisplay(cr.aborted.replacement))+" is void" : ""}.</p>` : ""}</div>
        <button class="btn btn-primary" id="giDone">Done</button>`;
      body.querySelector("#giDone").onclick=close;
    }
  }

  // ---------------- Bulk inventory import (Excel/CSV) ----------------
  let _xlsxLoading = null;
  function loadXLSX(){
    if(window.XLSX) return Promise.resolve();
    if(_xlsxLoading) return _xlsxLoading;
    _xlsxLoading = new Promise((resolve, reject)=>{
      const s = document.createElement("script");
      s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
      s.onload = ()=> resolve();
      s.onerror = ()=> reject(new Error("Could not load the Excel import library — check your internet connection."));
      document.head.appendChild(s);
    });
    return _xlsxLoading;
  }
  // Header row matches IMPORT_COLUMN_MAP's primary synonym for each field
  // exactly, so a file filled in from this template re-imports with zero
  // "unrecognized column" ambiguity.
  async function downloadImportTemplate(){
    try{
      await loadXLSX();
      const headers = ["SKU","Item Name","Shelf","Search Keywords","Category","Cost","Price","Qty","Low Stock Alert Below"];
      const ws = XLSX.utils.aoa_to_sheet([headers]);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Products");
      XLSX.writeFile(wb, "seigen-import-template.xlsx");
    }catch(e){
      alert("Couldn't build the template: " + (e.message||e));
    }
  }
  function normalizeHeader(h){ return String(h||"").trim().toLowerCase().replace(/\s+/g," "); }
  const IMPORT_COLUMN_MAP = {
    sku: ["sku"],
    name: ["item name","name","product name","item"],
    shelf: ["shelf","shelf / location","location","bin"],
    keywords: ["search keywords","keywords","search"],
    category: ["category"],
    cost: ["cost"],
    price: ["price","selling price"],
    qty: ["qty","quantity","stock","stock qty"],
    threshold: ["low stock alert below","low stock","threshold","alert level"]
  };
  function findColumn(headerMap, keys){
    for(const k of keys){ if(headerMap[k]!==undefined) return headerMap[k]; }
    return null;
  }
  // Update Existing / Add New: hasQtyColumn tells the caller whether the
  // file even had a recognizable Qty/Quantity/Stock column at all — a
  // price-or-description-only file (no such column) must never be able to
  // zero out existing stock just because a missing value parsed to 0. See
  // runImport()'s applyQty handling below, and item 6 of the task summary.
  // Spreadsheet numbers arrive either as real numbers (xlsx) or as text
  // (csv, or cells formatted as text). "1,200.50" must read as 1200.5, not
  // parseFloat's silent 1 — thousands separators are stripped only when
  // they're unambiguously thousands separators.
  function importNum(v){
    if(typeof v==="number") return v;
    let s = String(v==null?"":v).trim().replace(/\s/g,"");
    if(/^-?\d{1,3}(,\d{3})+(\.\d+)?$/.test(s)) s = s.replace(/,/g,"");
    return s===""? NaN : Number(s);
  }
  // Each row also carries `update`: only the fields an existing product
  // should have overwritten. A column the file doesn't have at all (e.g.
  // Category in an older Items export, or Cost in a Remote branch's export)
  // leaves that field alone rather than blanking it, and a blank numeric
  // cell leaves Cost / Low Stock Alert alone rather than resetting it to
  // 0 / 5. Brand-new products still get the defaulted values.
  function parseImportRows(sheetRows){
    if(sheetRows.length===0) return { rows:[], hasQtyColumn:false };
    const rawHeaders = Object.keys(sheetRows[0]);
    const headerMap = {};
    rawHeaders.forEach(h=> headerMap[normalizeHeader(h)] = h);
    const col = {};
    for(const field in IMPORT_COLUMN_MAP){ col[field] = findColumn(headerMap, IMPORT_COLUMN_MAP[field]); }
    const rows = sheetRows.map((r,i)=>{
      const get = (field)=> col[field]? r[col[field]] : "";
      const text = (field)=> String(get(field)==null? "" : get(field)).trim();
      const name = text("name");
      const priceNum = importNum(get("price"));
      const sku = text("sku");
      const shelf = text("shelf");
      const keywords = text("keywords");
      const category = text("category");
      const costNum = importNum(get("cost"));
      const cost = isNaN(costNum)? 0 : costNum;
      const qtyNum = Math.trunc(importNum(get("qty")));
      const qty = isNaN(qtyNum)? 0 : qtyNum;
      const thresholdNum = Math.trunc(importNum(get("threshold")));
      const threshold = isNaN(thresholdNum)? 5 : thresholdNum;
      let skipReason = null;
      if(!name) skipReason = "missing Item Name";
      else if(isNaN(priceNum)) skipReason = "missing or invalid Price";
      else if(priceNum<0) skipReason = "negative Price";
      const update = { name, price: priceNum };
      if(sku) update.sku = sku;   // blank SKU never wipes an existing one — it's half of the product's identity
      if(col.shelf) update.shelf = shelf;
      if(col.keywords) update.description = keywords;
      if(col.category) update.category = category;
      if(col.cost && !isNaN(costNum)) update.cost = costNum;
      if(col.threshold && !isNaN(thresholdNum)) update.low_threshold = thresholdNum;
      return { rowNum:i+2, name, sku, shelf, keywords, category, cost, price:isNaN(priceNum)?0:priceNum, qty, hasQty:!isNaN(qtyNum), threshold, update, skipReason };
    });
    return { rows, hasQtyColumn: col.qty!==null };
  }
  // Update Existing / Add New's identity rule — the SAME one this app
  // already used for its one existing import mode (SKU first, falling back
  // to name; both scoped to the current branch, per the multi-branch
  // isolation every other product query already follows). Reused as-is,
  // not reimplemented, so this new mode can never disagree with the
  // original import path about what counts as "the same product".
  function findImportMatch(branch, row){
    let existing = null;
    if(row.sku) existing = one("SELECT * FROM products WHERE branch=? AND lower(sku)=lower(?)",[branch,row.sku]);
    if(!existing) existing = one("SELECT * FROM products WHERE branch=? AND lower(name)=lower(?)",[branch,row.name]);
    return existing;
  }
  function importInventoryModal(){
    const wrap = openModal("Update Existing / Add New — Import Inventory from Excel", `
      <p class="muted">Matches each row to an existing product by SKU, then by name — a match is updated in place, anything unmatched is added as new. Products already in your catalogue but missing from the file are left alone (nothing is ever deleted). Columns expected: SKU, Item Name, Shelf, Search Keywords, Category, Cost, Price, Qty, Low Stock Alert Below — all optional except Item Name and Price. Column order and exact wording don't matter; a column left out of the file leaves that detail unchanged on existing products.</p>
      <input class="field" id="impFile" type="file" accept=".xlsx,.xls,.csv">
      <div id="impStatus" class="muted" style="margin-top:8px"></div>
    `);
    const fileInput = wrap.querySelector("#impFile");
    const status = wrap.querySelector("#impStatus");
    fileInput.onchange = async ()=>{
      const file = fileInput.files[0];
      if(!file) return;
      status.textContent = "Reading file…";
      try{
        await loadXLSX();
        const buf = await file.arrayBuffer();
        // raw for CSV: keep SKUs/barcodes as typed ("00123" must not become 123).
        const workbook = XLSX.read(buf, {type:"array", raw:/\.csv$/i.test(file.name)});
        const sheet = workbook.Sheets[workbook.SheetNames[0]];
        const sheetRows = XLSX.utils.sheet_to_json(sheet, {defval:""});
        const { rows, hasQtyColumn } = parseImportRows(sheetRows);
        renderImportPreview(wrap, rows, hasQtyColumn);
      }catch(e){
        status.textContent = "Couldn't read that file: " + (e.message||e);
      }
    };
  }
  // A row's identity within THIS FILE — same precedence as findImportMatch
  // (SKU, else name) — used only to detect two rows in the same file
  // claiming the same product, never to decide DB matching itself.
  function importRowKey(row){ return row.sku? "sku:"+row.sku.toLowerCase() : "name:"+row.name.toLowerCase(); }
  // Splits the already-parsed rows into: rows to actually apply (first
  // occurrence of each identity wins), duplicates (a later row reusing an
  // earlier row's identity — reported, not silently applied a second time
  // with possibly-conflicting values), and the already-invalid rows
  // parseImportRows() flagged. Pure/read-only — never touches the database.
  function classifyImportRows(rows){
    const skipped = rows.filter(r=>r.skipReason);
    const seen = new Set();
    const toApply = [], duplicates = [];
    rows.filter(r=>!r.skipReason).forEach(r=>{
      const key = importRowKey(r);
      if(seen.has(key)) duplicates.push(r); else { seen.add(key); toApply.push(r); }
    });
    return { toApply, duplicates, skipped };
  }
  function renderImportPreview(wrap, rows, hasQtyColumn){
    const branch = currentBranch();
    const { toApply, duplicates, skipped } = classifyImportRows(rows);
    let addCount=0, updateCount=0;
    toApply.forEach(r=>{ if(findImportMatch(branch,r)) updateCount++; else addCount++; });
    const previewRows = toApply.slice(0,15).map(r=>`
      <tr><td>${escapeHtml(r.name)}</td><td>${escapeHtml(r.sku||"—")}</td><td>${currency}${r.price.toFixed(2)}</td><td>${r.qty}</td></tr>
    `).join("");
    wrap.querySelector(".modal-body").innerHTML = `
      <div class="box">
        <div>${rows.length} record${rows.length===1?"":"s"} read from the file</div>
        <div><b>${addCount}</b> new product${addCount===1?"":"s"} will be added</div>
        <div><b>${updateCount}</b> existing product${updateCount===1?"":"s"} will be updated</div>
        <div><b>${duplicates.length}</b> duplicate row${duplicates.length===1?"":"s"} in this file (same SKU/name as an earlier row) — only the first is applied</div>
        <div><b>${skipped.length}</b> row${skipped.length===1?"":"s"} rejected</div>
      </div>
      <label style="display:flex;align-items:center;gap:8px;margin:10px 0 0;${hasQtyColumn?"":"opacity:.6"}">
        <input type="checkbox" id="impApplyQty" ${hasQtyColumn?"":"disabled"}>
        <span>Also update stock quantity from the Qty column${hasQtyColumn?"":" — no Qty/Quantity/Stock column was found in this file"}</span>
      </label>
      <p class="muted" style="margin:4px 0 0">Off by default: existing stock is left exactly as it is unless you tick this — a price/description-only file should never be able to zero out what's on the shelf.</p>
      ${(duplicates.length||skipped.length)? `<div class="box" style="max-height:140px;overflow-y:auto;margin-top:10px">
        ${duplicates.map(r=>`<div class="muted">Row ${r.rowNum}: duplicate of an earlier row (${escapeHtml(r.sku?"SKU "+r.sku:r.name)}) — not applied</div>`).join("")}
        ${skipped.map(r=>`<div class="muted">Row ${r.rowNum}: rejected — ${escapeHtml(r.skipReason)}</div>`).join("")}
      </div>` : ""}
      ${toApply.length? `<table class="simple" style="margin-top:10px">
        <tr><th>Name</th><th>SKU</th><th>Price</th><th>Qty</th></tr>
        ${previewRows}
      </table>
      ${toApply.length>15? `<p class="muted">…and ${toApply.length-15} more</p>` : ""}` : ""}
      <div class="row" style="margin-top:12px">
        <button class="btn btn-outline" id="impCancel">Cancel</button>
        <button class="btn btn-primary" id="impConfirm" ${toApply.length===0?"disabled":""}>Confirm Import</button>
      </div>
    `;
    wrap.querySelector("#impCancel").onclick = ()=> wrap.remove();
    const confirmBtn = wrap.querySelector("#impConfirm");
    if(confirmBtn) confirmBtn.onclick = ()=>{
      const applyQty = hasQtyColumn && !!wrap.querySelector("#impApplyQty").checked;
      runImport(wrap, { toApply, duplicates, skipped, totalRead: rows.length }, applyQty);
    };
  }
  // Update Existing / Add New. Only ever touches products (and, when the
  // shop opted into it, stock_received — the same audit trail restock/
  // adjust/other-import paths already write to) — no other table. Branch
  // isolation comes for free: findImportMatch() above is already
  // branch-scoped, and every INSERT here stamps currentBranch(), same as
  // productModal()'s own Add Product path.
  function runImport(wrap, batch, applyQty){
    // Multi-terminal Phase 3b (P8): at a shared-stock branch quantities are set by a stocktake.
    if(applyQty && typeof sharedStockTill==="function" && sharedStockTill()){
      alert("This branch uses shared stock: quantities are set by a stocktake (More → Stocktake), not by an import. Import again without applying quantities.");
      return;
    }
    const branch = currentBranch();
    const ts = new Date().toISOString();
    let created=0, updated=0;
    batch.toApply.forEach(r=>{
      const existing = findImportMatch(branch, r);
      if(existing){
        // Quantity is deliberately excluded from this UPDATE unless the
        // shop explicitly opted in (applyQty) — everything else (name,
        // sku, description, category, cost, price, low-stock threshold)
        // is "product master data" and always safe to update in place.
        // Only the fields parseImportRows() put in r.update — columns the
        // file lacks (or blank numeric cells) keep their current values.
        const fields = Object.keys(r.update);
        run("UPDATE products SET "+fields.map(f=>f+"=?").join(",")+" WHERE id=?",
          fields.map(f=>r.update[f]).concat([existing.id]));
        // A blank Qty cell is "no figure given", never "set stock to 0".
        if(applyQty && r.hasQty){
          const delta = moveStock({ productId:existing.id, setTo:r.qty, kind:"import", docType:"import", ts, note:"Import adjustment" });
          run("INSERT INTO stock_received(ts,product_id,name,qty,note,branch,user) VALUES(?,?,?,?,?,?,?)",
            [ts, existing.id, r.name, delta, "Import adjustment", branch, sessionUser||""]);
        }
        updated++;
      } else {
        // A brand-new product always needs a starting stock figure — this
        // is establishing it for the first time, not "changing" an
        // existing quantity, so it's unaffected by the applyQty opt-in.
        run("INSERT INTO products(name,price,stock,low_threshold,sku,branch,image,cost,created_ts,description,category,shelf) VALUES(?,?,?,?,?,?,?,?,?,?,?,?)",
          [r.name, r.price, r.qty, r.threshold, r.sku, branch, "", r.cost, ts, r.keywords, r.category, r.shelf]);
        const pid = one("SELECT last_insert_rowid() as id").id;
        recordStockMovement(pid, r.qty, { kind:"import", docType:"import", ts, note:"Import — initial stock" });
        run("INSERT INTO stock_received(ts,product_id,name,qty,note,branch,user) VALUES(?,?,?,?,?,?,?)",
          [ts, pid, r.name, r.qty, "Import — initial stock", branch, sessionUser||""]);
        created++;
      }
    });
    logAudit("Bulk Import", "", `${created} added, ${updated} updated, ${batch.duplicates.length} duplicate row(s) skipped, ${batch.skipped.length} rejected${applyQty?"":", stock quantity untouched"}`);
    persist();
    wrap.querySelector(".modal-body").innerHTML = `
      <div class="box" style="text-align:center">
        <p style="font-size:16px;font-weight:700;margin:0 0 6px">Import complete</p>
        <p class="muted" style="margin:0">${batch.totalRead} record${batch.totalRead===1?"":"s"} read · ${created} added · ${updated} updated${applyQty?"" : " (quantity untouched)"}</p>
        <p class="muted" style="margin:4px 0 0">${batch.duplicates.length} duplicate row${batch.duplicates.length===1?"":"s"} skipped · ${batch.skipped.length} row${batch.skipped.length===1?"":"s"} rejected</p>
      </div>
      ${(batch.duplicates.length||batch.skipped.length)? `<div class="box" style="max-height:140px;overflow-y:auto;margin-top:10px">
        ${batch.duplicates.map(r=>`<div class="muted">Row ${r.rowNum}: duplicate — not applied</div>`).join("")}
        ${batch.skipped.map(r=>`<div class="muted">Row ${r.rowNum}: rejected — ${escapeHtml(r.skipReason)}</div>`).join("")}
      </div>` : ""}
      <button class="btn btn-primary" id="impDone" style="margin-top:12px">Done</button>
    `;
    wrap.querySelector("#impDone").onclick = ()=>{ wrap.remove(); render(); };
  }

  // ---------------- Multi-Currency Support (Settings) ----------------
  // The base currency is still just the existing `currency` setting/symbol
  // (Settings -> "Currency symbol") — unchanged, and never a row in this
  // table. This table only holds the OTHER currencies a cashier may be
  // handed cash/EcoCash/etc. in, each with a manually-set exchange rate
  // (offline-first app: no live rate feed). "BASE" is a reserved code that
  // can never be assigned to a real row — it's what sale_payments.currency
  // is set to for a base-currency line (see pos.js completeSale).
  //
  // rate convention: foreign units per 1 base-currency unit (e.g. base=USD,
  // ZWL rate=13000 means 1 USD = ZWL 13000). So:
  //   foreign equivalent of a base amount = base * rate
  //   base equivalent of a tendered foreign amount = tendered / rate
  const BASE_CURRENCY_CODE = "BASE";

  function activeCurrencies(){ return all("SELECT * FROM currencies WHERE active=1 ORDER BY code"); }
  function allCurrencies(){ return all("SELECT * FROM currencies ORDER BY active DESC, code"); }
  function getCurrencyByCode(code){ return code? one("SELECT * FROM currencies WHERE code=?",[code]) : null; }
  // Accepted at checkout right now: configured, active, and has a usable
  // (>0) rate — the one gate completeSale() checks before taking payment in
  // it (item 8: no configured/zero rate must block, never fall back to 1:1).
  function currencyAccepted(code){
    const c = getCurrencyByCode(code);
    return !!(c && c.active && c.rate>0);
  }
  // Display helpers — fall back to the bare code if a line names a currency
  // this device no longer has configured (deactivated locally, or merged in
  // from a branch with a different list): the historical fact still prints,
  // just without a friendly symbol/name.
  function currencySymbolFor(code){
    if(!code || code===BASE_CURRENCY_CODE) return currency;
    const c = getCurrencyByCode(code);
    return c? (c.symbol||c.code) : code;
  }
  function currencyNameFor(code){
    if(!code || code===BASE_CURRENCY_CODE) return "Base currency";
    const c = getCurrencyByCode(code);
    return c? (c.name||c.code) : code;
  }

  // Pure add/edit (no DOM), so the modal's Save button and the test suite
  // share one validated path — same shape as saveStaffMember (staff.js).
  function saveCurrency(o){
    o = o||{};
    const code = String(o.code||"").trim().toUpperCase();
    if(!code) throw new Error("Enter a currency code (e.g. ZWL, ZAR).");
    if(code===BASE_CURRENCY_CODE) throw new Error(`"${BASE_CURRENCY_CODE}" is reserved for the base currency — choose a different code.`);
    const rate = parseFloat(o.rate);
    if(!(rate>0)) throw new Error("Enter an exchange rate greater than 0.");
    const name = String(o.name||"").trim();
    const symbol = String(o.symbol||"").trim();
    const isEdit = !!o.id;
    const existing = isEdit? one("SELECT * FROM currencies WHERE id=?",[o.id]) : null;
    if(isEdit && !existing) throw new Error("Currency not found");
    const clash = one("SELECT id FROM currencies WHERE upper(code)=? AND active=1 AND id<>?",[code, isEdit? o.id : 0]);
    if(clash) throw new Error(`"${code}" is already an accepted currency.`);
    if(isEdit){
      const active = o.active===undefined ? existing.active : (o.active? 1 : 0);
      run("UPDATE currencies SET code=?, name=?, symbol=?, rate=?, active=? WHERE id=?",[code,name,symbol,rate,active,o.id]);
      return one("SELECT * FROM currencies WHERE id=?",[o.id]);
    }
    run("INSERT INTO currencies(code,name,symbol,rate,active) VALUES(?,?,?,?,1)",[code,name,symbol,rate]);
    return one("SELECT * FROM currencies ORDER BY id DESC LIMIT 1");
  }
