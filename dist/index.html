  // ---------------- Cancel / reissue / close as loss: the dispatching device (Phase 5) ----------------
  // Only the DISPATCHING device, with the Admin passcode, can cancel, reissue or close a DN.
  //
  // Protocol in one paragraph: starting a case writes a cancel_pending event and makes a checksummed notice
  // (or, for a reissue, a replacement DN that also acts as the notice). NOTHING about stock changes yet.
  // The receiver confirms (its DN becomes a tombstone: received XOR cancelled) and sends a confirmation back.
  // Only when that confirmation is imported (or the GRV for the replacement arrives, or management overrides)
  // is everything posted, in ONE synchronous transaction: restore, the replacement DN's stock, write-offs,
  // events and audit. A GRV that arrives while a cancel is pending ends the cancel instead.

  const cancelEnabled = ()=> getSetting("cancel_enabled","")==="1";
  const CANCEL_OFF_MSG = "Cancel and reissue is switched off on this device. An Admin can switch it on in Settings once every branch has updated the app.";
  const DN_CLOSED_STATUSES = ["cancelled","superseded","loss_closed"];

  function dnCaseByNo(caseNo){ return one("SELECT * FROM dn_cases WHERE dn_branch_id=? AND case_no=?",[getBranchId(),caseNo]); }
  function pendingCaseFor(dnNo){ return one("SELECT * FROM dn_cases WHERE dn_branch_id=? AND dn_no=? AND state='pending'",[getBranchId(),dnNo]); }
  function caseByReplacement(newDnNo){ return one("SELECT * FROM dn_cases WHERE dn_branch_id=? AND replaced_by=? ORDER BY id DESC",[getBranchId(),newDnNo]); }
  function planOf(c){ try{ return JSON.parse(c.plan_json).lines; }catch(e){ return []; } }
  function findProductForLine(l){
    const branch = currentBranch();
    return (l.code? one("SELECT * FROM products WHERE branch=? AND lower(sku)=lower(?)",[branch,l.code]) : null)
        || one("SELECT * FROM products WHERE branch=? AND lower(name)=lower(?)",[branch,l.name]);
  }
  function derivedDnStatus(dnNo){
    const r = dnStatusMap().get(getBranchId()+"|"+dnNo);
    return r? r.status : "dispatched";
  }
  const canStartCancel = (status)=> ["dispatched","awaiting","variance"].includes(status);

  // ---- the posting: restore, replacement DN stock, write-offs. Synchronous; the CALLER owns the transaction. ----
  // opts: { override:boolean, via:string, now:Date }
  function postCaseSync(c, opts){
    const branchId = getBranchId(), h = one("SELECT * FROM dispatch_docs WHERE dispatch_branch_id=? AND dn_no=? AND direction='out'",[branchId,c.dn_no]);
    if(!h) throw new Error(formatDocNo("DN",c.dn_no)+" is not a Delivery Note of this device.");
    if(c.state!=="pending") throw new Error("This cancellation is already "+c.state+".");
    const ts = (opts.now||new Date()).toISOString(), plan = planOf(c), dn = formatDocNo("DN",c.dn_no), admin = c.authorised_by||"";
    const products = plan.map(l=>{
      const p = findProductForLine(l);
      if(!p) throw new Error((l.code? l.code+" " : "")+l.name+" is no longer a product in this branch, so stock can't be restored. Nothing was changed.");
      return p;
    });
    // 1. restore everything that left with the original DN (first, so the later rows can never go below zero)
    plan.forEach((l,i)=>writeAdjustment({ product:products[i], delta:l.orig, reason:"Dispatch cancelled", note:"Restored: "+dn+" cancelled ("+CANCEL_KIND_LABEL[c.kind]+")",
      admin, ts, dnBranchId:branchId, dnNo:c.dn_no }));
    // 2. a reissue sends the corrected quantities again, on the replacement DN
    if(c.kind==="reissue"){
      const nh = one("SELECT * FROM dispatch_docs WHERE dispatch_branch_id=? AND dn_no=? AND direction='out'",[branchId,c.replaced_by]);
      if(!nh) throw new Error("The replacement Delivery Note "+formatDocNo("DN",c.replaced_by)+" is missing.");
      plan.forEach((l,i)=>{
        if(!(l.nw>0)) return;
        const cur = one("SELECT stock FROM products WHERE id=?",[products[i].id]);
        if(!cur || cur.stock<l.nw) throw new Error(l.name+": only "+(cur?cur.stock:0)+" in stock for the replacement. Nothing was changed.");
        run("UPDATE products SET stock=stock-? WHERE id=?",[l.nw,products[i].id]);
        run("INSERT INTO stock_received(ts,product_id,name,qty,note,branch,user,dn_branch_id,dn_no) VALUES(?,?,?,?,?,?,?,?,?)",
          [ts,products[i].id,l.name,-l.nw,"Dispatched to "+h.receive_branch_name+" ("+formatDocNo("DN",c.replaced_by)+")",currentBranch(),String(sessionUser||""),branchId,c.replaced_by]);
      });
      run("UPDATE dispatch_docs SET stock_posted=1 WHERE dispatch_branch_id=? AND dn_no=? AND direction='out'",[branchId,c.replaced_by]);
    }
    // 3. what is written off, linked to the ORIGINAL DN, with the reason management chose
    plan.forEach((l,i)=>{ if(l.writeoff>0) writeAdjustment({ product:products[i], delta:-l.writeoff, reason:l.reason, note:c.note||"", admin, ts, dnBranchId:branchId, dnNo:c.dn_no }); });
    // 4. nothing may end below zero
    products.forEach(p=>{ const cur = one("SELECT stock,name FROM products WHERE id=?",[p.id]); if(cur.stock<0) throw new Error(cur.name+": stock would go below zero. Nothing was changed."); });
    const status = c.kind==="reissue"? "superseded" : c.kind==="loss"? "loss_closed" : "cancelled";
    run("UPDATE dn_cases SET state='posted', posted_ts=?, posted_via=?, override=? WHERE id=?",[ts,opts.via||"",opts.override?1:0,c.id]);
    run("UPDATE dispatch_docs SET status=?, cancel_kind=?, cancelled_ts=? WHERE dispatch_branch_id=? AND dn_no=? AND direction='out'",[status,c.kind,ts,branchId,c.dn_no]);
    recordDnEvent({ dnBranchId:branchId, dnNo:c.dn_no, type:"cancel_posted", actorBranchId:branchId, actorName:currentBranch(), fromName:h.dispatch_branch_name, toName:h.receive_branch_name, ts:localIso(opts.now||new Date()),
      detail:{ kind:c.kind, replaced_by:c.replaced_by||null, override:!!opts.override, case_no:c.case_no, via:opts.via||"" } });
    logAudit("Cancel posted", "", dn+": "+CANCEL_KIND_LABEL[c.kind]+(c.replaced_by? " (replaced by "+formatDocNo("DN",c.replaced_by)+")" : "")+", "+(opts.override? "WITHOUT receiver confirmation" : "confirmed")+", authorised by "+admin);
  }

  // ---- start ----
  // o: { dnNo, kind, plan:[{nw,writeoff,reason}], note, passcode, override?, typed?, now? }
  // Synchronous; the caller awaits persist(). -> { caseNo, caseText, kind, newDnNo|null, overridden }
  function startCancelCase(o){
    requireSignedIn();
    if(!cancelEnabled()) throw new Error(CANCEL_OFF_MSG);
    if(!hasAdminPasscode()) throw new Error(NO_ADMIN_PASSCODE_MSG);
    const admin = findAdmin(o.passcode);
    if(!admin) throw new Error("Incorrect Admin passcode.");
    const branchId = getBranchId(), now = o.now || new Date(), ts = now.toISOString();
    const h = one("SELECT * FROM dispatch_docs WHERE dispatch_branch_id=? AND dn_no=? AND direction='out'",[branchId,o.dnNo]);
    if(!h) throw new Error("That Delivery Note was not dispatched from this device.");
    const dn = formatDocNo("DN",o.dnNo), status = derivedDnStatus(o.dnNo);
    if(pendingCaseFor(o.dnNo)) throw new Error(dn+" already has a cancellation in progress.");
    if(!canStartCancel(status)) throw new Error(dn+" is "+(DN_STATUS_LABEL[status]||status).toLowerCase()+", so it can't be cancelled. Only dispatched, awaiting or variance Delivery Notes can.");
    if(h.status==="received" || DN_CLOSED_STATUSES.includes(h.status)) throw new Error(dn+" is already "+h.status+".");
    const stored = dnStoredLines(h).map(l=>({ code:l.sku||"", name:l.product_name, qty:l.qty }));
    if(!stored.length) throw new Error("The lines of "+dn+" could not be found on this device.");
    const norm = normalizeCancelPlan(o.kind, stored, o.plan, o.note);
    if(!norm.ok) throw new Error(norm.error);
    norm.lines.forEach(l=>{ if(!findProductForLine(l)) throw new Error((l.code? l.code+" " : "")+l.name+" is no longer a product in this branch."); });
    if(o.override && String(o.typed||"").trim()!=="CANCEL "+dn) throw new Error("Type CANCEL "+dn+" exactly to cancel without the receiver's confirmation.");
    db.run("BEGIN");
    try{
      const cx = reserveDocNumber("CXL"), nonce = newCancelNonce();
      let newNo = null;
      if(o.kind==="reissue"){
        const nd = reserveDocNumber("DN"); newNo = nd.n;
        const send = norm.lines.filter(l=>l.nw>0), units = send.reduce((s,l)=>s+l.nw,0);
        const ok = insertDispatchDoc({ dispatchBranchId:branchId, dispatchBranchName:h.dispatch_branch_name, dnNo:nd.n, receiveBranchName:h.receive_branch_name, direction:"out",
          createdTs:ts, createdIso:localIso(now), lineCount:send.length, unitTotal:units, status:"dispatched", fileName:dnFileName(nd.n, h.dispatch_branch_name, now) });
        if(!ok) throw new Error("Delivery Note "+nd.text+" already exists.");
        run("UPDATE dispatch_docs SET replaces_dn_no=?, stock_posted=0 WHERE dispatch_branch_id=? AND dn_no=? AND direction='out'",[o.dnNo,branchId,nd.n]);
        send.forEach(l=>run(`INSERT INTO stock_transfers(ts,from_branch,to_branch,product_name,sku,qty,note,user,status,dn_no,dn_branch_id) VALUES(?,?,?,?,?,?,?,?,'Dispatched',?,?)`,
          [ts,h.dispatch_branch_name,h.receive_branch_name,l.name,l.code,l.nw,nd.text+" (replaces "+dn+")",String(sessionUser||""),nd.n,branchId]));
        recordDnEvent({ dnBranchId:branchId, dnNo:nd.n, type:"dispatched", actorBranchId:branchId, actorName:h.dispatch_branch_name, fromName:h.dispatch_branch_name, toName:h.receive_branch_name, ts,
          detail:{ dn_created_iso:localIso(now), lines:send.length, units, replaces:o.dnNo } });
      }
      run(`INSERT INTO dn_cases(case_no,dn_branch_id,dn_no,kind,state,nonce,plan_json,replaced_by,override,note,started_ts,started_by,authorised_by)
           VALUES(?,?,?,?,'pending',?,?,?,0,?,?,?,?)`,
        [cx.n,branchId,o.dnNo,o.kind,nonce,JSON.stringify({ lines:norm.lines }),newNo,String(o.note).trim(),ts,String(sessionUser||""),admin.name]);
      run("UPDATE dispatch_docs SET cancel_no=?, replaced_by=?, cancel_kind=? WHERE dispatch_branch_id=? AND dn_no=? AND direction='out'",[cx.n,newNo,o.kind,branchId,o.dnNo]);
      recordDnEvent({ dnBranchId:branchId, dnNo:o.dnNo, type:"cancel_pending", actorBranchId:branchId, actorName:currentBranch(), fromName:h.dispatch_branch_name, toName:h.receive_branch_name, ts,
        detail:{ kind:o.kind, cancel_no:cx.n, replaced_by:newNo } });
      logAudit("Cancel started", "", dn+": "+CANCEL_KIND_LABEL[o.kind]+" ("+cx.text+")"+(newNo? ", replacement "+formatDocNo("DN",newNo) : "")+", "+String(o.note).trim()+" (authorised by "+admin.name+")");
      if(o.override) postCaseSync(one("SELECT * FROM dn_cases WHERE dn_branch_id=? AND case_no=?",[branchId,cx.n]), { override:true, via:"override", now });
      db.run("COMMIT");
      return { caseNo:cx.n, caseText:cx.text, kind:o.kind, newDnNo:newNo, overridden:!!o.override };
    }catch(e){
      try{ db.run("ROLLBACK"); }catch(_){}
      throw e;
    }
  }

  // Management posts a pending cancel without waiting for the receiver. Flagged; a later GRV makes the DN a conflict.
  function overridePendingCase(o){
    requireSignedIn();
    if(!cancelEnabled()) throw new Error(CANCEL_OFF_MSG);
    if(!hasAdminPasscode()) throw new Error(NO_ADMIN_PASSCODE_MSG);
    const admin = findAdmin(o.passcode);
    if(!admin) throw new Error("Incorrect Admin passcode.");
    const c = pendingCaseFor(o.dnNo);
    if(!c) throw new Error(formatDocNo("DN",o.dnNo)+" has no cancellation waiting for a confirmation.");
    if(String(o.typed||"").trim()!=="CANCEL "+formatDocNo("DN",o.dnNo)) throw new Error("Type CANCEL "+formatDocNo("DN",o.dnNo)+" exactly to cancel without the receiver's confirmation.");
    db.run("BEGIN");
    try{
      run("UPDATE dn_cases SET authorised_by=? WHERE id=?",[admin.name,c.id]);
      postCaseSync(Object.assign({}, c, { authorised_by:admin.name }), { override:true, via:"override", now:o.now||new Date() });
      db.run("COMMIT");
    }catch(e){ try{ db.run("ROLLBACK"); }catch(_){} throw e; }
  }

  // ---- receiver's confirmation arrives ----
  function ackContext(){
    return { ownBranchId:getBranchId(),
      header:(dnNo)=>one("SELECT * FROM dispatch_docs WHERE dispatch_branch_id=? AND dn_no=? AND direction='out'",[getBranchId(),dnNo]),
      caseByNo:dnCaseByNo };
  }
  async function ackCheckBytes(bytes){
    const text = decodeBytesUtf8(bytes);
    return { res: await checkIncomingAck(text, ackContext()), text };
  }
  // Post the case (or, for an override-posted case, just record that the receiver has now confirmed). One transaction.
  function commitAckImport(ack, now){
    db.run("BEGIN");
    try{
      const c = dnCaseByNo(ack.cancel_no);
      if(!c || c.nonce!==ack.nonce || c.dn_no!==ack.dn_no) throw new Error("This confirmation doesn't match any cancellation started on this device.");
      const h = one("SELECT * FROM dispatch_docs WHERE dispatch_branch_id=? AND dn_no=? AND direction='out'",[getBranchId(),ack.dn_no]);
      let posted = false;
      if(c.state==="pending"){
        if(h.status==="received") throw new Error(formatDocNo("DN",ack.dn_no)+" is recorded as received. Nothing was changed.");
        postCaseSync(c, { override:false, via:"confirmation", now });
        posted = true;
      } else if(c.state==="posted" && c.override && !c.acked_ts){ /* upgrade only */ }
      else throw new Error("Already confirmed.");
      run("UPDATE dn_cases SET acked_ts=? WHERE id=?",[now.toISOString(),c.id]);
      recordDnEvent({ dnBranchId:getBranchId(), dnNo:ack.dn_no, type:"cancelled", actorBranchId:ack.to.branch_id, actorName:ack.to.name, fromName:h.dispatch_branch_name, toName:h.receive_branch_name,
        ts:ack.confirmed_iso, detail:{ cancel_no:ack.cancel_no, variance_seen:ack.variance_seen, via:"confirmation" } });
      db.run("COMMIT");
      return { posted, upgraded:!posted, case:dnCaseByNo(ack.cancel_no) };
    }catch(e){ try{ db.run("ROLLBACK"); }catch(_){} throw e; }
  }

  // ---- files the dispatcher sends ----
  function cancelNoticeFileName(caseNo, receiverName, date){
    return formatDocNo("CXL",caseNo)+"-"+sanitizeBranchName(receiverName)+"-"+fileDatePart(date)+"-"+fileTimePart(date)+"-cancel"+DOC_FILE_EXT;
  }
  async function cancelNoticeFor(c){
    const h = one("SELECT * FROM dispatch_docs WHERE dispatch_branch_id=? AND dn_no=? AND direction='out'",[getBranchId(),c.dn_no]);
    const items = dnStoredLines(h).map(l=>({ code:l.sku||"", name:l.product_name, qty:l.qty }));
    const doc = await buildCancel({ cancelNo:c.case_no, nonce:c.nonce, kind:c.kind, dnNo:c.dn_no, fromBranchId:getBranchId(), fromName:h.dispatch_branch_name, toName:h.receive_branch_name,
      replacedBy:c.replaced_by||null, cancelledIso:localIso(new Date(c.started_ts)), items });
    return { doc, text:serializeCancel(doc), fileName:cancelNoticeFileName(c.case_no, h.receive_branch_name, new Date(c.started_ts)), header:h };
  }
  async function shareCancelNotice(c){
    const n = await cancelNoticeFor(c);
    const msg = "CANCELLED: "+n.doc.dn_display+" ("+n.doc.cancel_display+") from "+n.doc.from.name+". Do not receive it. In seiGEN Commerce Lite open Products \u2192 Receive stock and choose the attached file.";
    return shareDocFile({ fileName:n.fileName, text:n.text, folder:"Cancellations", title:n.doc.cancel_display, phone:dnPhoneFor(n.header.receive_branch_name), shareText:msg, whatsappText:msg+" (Attach the file from the folder that just opened.)" });
  }
  // The replacement DN (it also acts as the notice for the DN it replaces).
  async function shareReplacementDN(newDnNo){
    const h = dnHeaderFor(newDnNo), rec = await dnGetRecord(h);
    const s = await dnShareRecord(h, rec);
    return s;
  }

  // ---- screens ----
  function openCancelWizard(dnNo, onDone){
    if(!cancelEnabled()){ alert(CANCEL_OFF_MSG); return; }
    try{ requireSignedIn(); }catch(e){ alert(e.message); return; }
    if(!hasAdminPasscode()){ alert(NO_ADMIN_PASSCODE_MSG); return; }
    const h = dnHeaderFor(dnNo);
    if(!h){ alert("That Delivery Note was not dispatched from this device."); return; }
    const status = derivedDnStatus(dnNo);
    if(!canStartCancel(status)){ alert(formatDocNo("DN",dnNo)+" is "+(DN_STATUS_LABEL[status]||status).toLowerCase()+". Only dispatched, awaiting or variance Delivery Notes can be cancelled."); return; }
    const dn = formatDocNo("DN",dnNo), lines = dnStoredLines(h).map(l=>({ code:l.sku||"", name:l.product_name, qty:l.qty }));
    const mv = dnStatusMap().get(getBranchId()+"|"+dnNo);
    const counted = (l)=>{ const f = mv && mv.varianceFlags.find(x=>(x.code||"")===(l.code||"") && x.name===l.name); return f? Math.min(f.counted, l.qty) : null; };
    const wrap = openModal("Cancel or reissue "+dn, "");
    const body = wrap.querySelector(".modal-body");
    const receiver = h.receive_branch_name;
    let note = "", kind = "cancel", state = lines.map(l=>({ nw:counted(l)!==null? counted(l) : l.qty, disp:"return" }));
    function planFromState(){
      return state.map((s,i)=>{
        const diff = lines[i].qty - (kind==="reissue"? Number(s.nw) : 0);
        return { nw:s.nw, writeoff:(s.disp==="return" || kind==="cancel")? 0 : (kind==="loss"? lines[i].qty : (Number.isInteger(diff)? diff : 0)), reason:s.disp==="return"? "" : s.disp };
      });
    }
    function draw(err){
      body.innerHTML = `
        <div class="pmeta" style="margin-bottom:6px">To <b>${escapeHtml(receiver)}</b> · status: ${escapeHtml(DN_STATUS_LABEL[status]||status)}${mv && mv.hasVariance? " · variance reported" : ""}</div>
        ${mv && mv.hasVariance? `<div class="box" style="margin-bottom:8px;font-size:12.5px">${escapeHtml(varianceText(mv))}</div>` : ""}
        <div class="card" style="padding:8px;margin-bottom:8px">
          ${[["cancel","Cancel: sent by mistake. Everything returns to stock."],["reissue","Cancel and reissue with corrected lines"],["loss","Close as loss: the goods never arrived or can't be recovered"]].map(o=>`
            <label style="display:flex;gap:8px;align-items:flex-start;margin:4px 0"><input type="radio" name="cwKind" value="${o[0]}" ${kind===o[0]?"checked":""} style="width:auto;margin-top:3px"><span>${escapeHtml(o[1])}</span></label>`).join("")}
        </div>
        ${kind==="cancel"? "" : `<div style="max-height:34vh;overflow:auto">${lines.map((l,i)=>`
          <div class="card" style="padding:8px;margin-bottom:6px">
            <div><b>${escapeHtml(l.name)}</b> <span class="muted">${escapeHtml(l.code||"no code")} · sent ${l.qty}</span></div>
            ${kind==="reissue"? `<label style="margin:6px 0 0">New quantity (0 to ${l.qty})</label><input class="field" data-nw="${i}" inputmode="numeric" value="${state[i].nw}">` : ""}
            <label style="margin:6px 0 0">${kind==="reissue"? "The difference" : "Write off as"}</label>
            <select class="field" data-disp="${i}">
              ${kind==="reissue"? `<option value="return" ${state[i].disp==="return"?"selected":""}>Return to stock</option>` : ""}
              ${ADJ_WRITEOFF_REASONS.map(r=>`<option value="${escapeHtml(r)}" ${state[i].disp===r?"selected":""}>Write off: ${escapeHtml(r)}</option>`).join("")}
            </select>
          </div>`).join("")}</div>`}
        <div id="cwSummary" class="muted" style="font-size:12.5px;margin:6px 0"></div>
        <label>Note (why)</label><textarea class="field" id="cwNote" rows="2">${escapeHtml(note)}</textarea>
        <label>Admin passcode</label><input class="field" id="cwPass" type="password" autocomplete="off">
        <div id="cwErr" style="color:#b42318;font-size:12.5px;margin-top:6px">${escapeHtml(err||"")}</div>
        <button class="btn btn-primary" id="cwStart" style="margin-top:10px">Start</button>`;
      body.querySelectorAll('[name="cwKind"]').forEach(r=>r.onchange=()=>{ kind = r.value; if(kind==="loss") state.forEach(s=>{ if(s.disp==="return") s.disp="Lost in transit"; }); if(kind!=="loss") state.forEach(s=>{ }); draw(); });
      body.querySelectorAll("[data-nw]").forEach(i=>i.oninput=()=>{ state[+i.dataset.nw].nw = i.value; summary(); });
      body.querySelectorAll("[data-disp]").forEach(s=>s.onchange=()=>{ state[+s.dataset.disp].disp = s.value; summary(); });
      body.querySelector("#cwNote").oninput=(e)=>{ note = e.target.value; };        // survives a re-draw after an error
      summary();
      body.querySelector("#cwStart").onclick=start;
    }
    function summary(){
      const el = body.querySelector("#cwSummary"); if(!el) return;
      const n = normalizeCancelPlan(kind, lines, planFromState(), "x");
      el.textContent = n.ok? cancelPlanSummary(kind, n.lines, dn).text : n.error;
      el.style.color = n.ok? "" : "#b42318";
    }
    let busy = false;
    async function start(){
      if(busy) return; busy = true;
      let r;
      try{
        note = body.querySelector("#cwNote").value;
        r = startCancelCase({ dnNo, kind, plan:planFromState(), note, passcode:body.querySelector("#cwPass").value });
        await persist();
      }catch(e){ busy = false; draw(e.message||String(e)); return; }
      if(r.newDnNo){
        try{ const hh = dnHeaderFor(r.newDnNo), b = await dnBuildFromDb(hh); await dnfPut(hh.dispatch_branch_id, hh.dn_no, { text:b.text, file_name:hh.file_name, saved_ts:new Date().toISOString() }); }catch(e){}
      }
      started(r);
    }
    function started(r){
      const nd = r.newDnNo? formatDocNo("DN",r.newDnNo) : "";
      body.innerHTML = `<div class="box" style="margin-bottom:10px"><p style="font-weight:700;margin:0 0 4px">${escapeHtml(r.caseText)} started for ${escapeHtml(dn)}</p>
        <p class="muted" style="margin:0">Nothing has changed in your stock yet. It is posted when ${escapeHtml(receiver)}'s confirmation is imported${nd? " (or when the receipt voucher for "+escapeHtml(nd)+" arrives)" : ""}. Send them the file now.</p></div>
        ${nd? `<button class="btn btn-primary" id="cwShareNew" style="width:100%;margin-bottom:8px">${isTauriApp()? "📁 " : "📲 "}Send replacement ${escapeHtml(nd)} to ${escapeHtml(receiver)}</button>` : ""}
        <button class="btn ${nd? "btn-outline" : "btn-primary"}" id="cwShareNotice" style="width:100%;margin-bottom:8px">${isTauriApp()? "📁 " : "📲 "}Send cancellation notice to ${escapeHtml(receiver)}</button>
        <div id="cwMsg" class="muted" style="font-size:12.5px;margin-bottom:8px"></div>
        <button class="btn btn-ghost" id="cwDone">Done</button>`;
      const msg = body.querySelector("#cwMsg");
      const sn = body.querySelector("#cwShareNew");
      if(sn) sn.onclick=async ()=>{ try{ msg.textContent = dnShareMessage(await shareReplacementDN(r.newDnNo)); }catch(e){ msg.textContent = "Couldn't share: "+(e.message||e); } };
      body.querySelector("#cwShareNotice").onclick=async ()=>{ try{ msg.textContent = dnShareMessage(await shareCancelNotice(dnCaseByNo(r.caseNo))); }catch(e){ msg.textContent = "Couldn't share: "+(e.message||e); } };
      body.querySelector("#cwDone").onclick=()=>{ wrap.remove(); if(onDone) onDone(); else render(); };
    }
    draw();
  }

  // For a DN with a cancel waiting for the receiver: re-share, or post it WITHOUT the receiver's confirmation.
  function openPendingCancelModal(dnNo, onDone){
    const c = pendingCaseFor(dnNo);
    if(!c){ alert("No cancellation is waiting on "+formatDocNo("DN",dnNo)+"."); return; }
    const h = dnHeaderFor(dnNo), dn = formatDocNo("DN",dnNo), receiver = h.receive_branch_name;
    const wrap = openModal(dn+": cancel pending", `
      <p style="margin:0 0 6px">${escapeHtml(formatDocNo("CXL",c.case_no))} (${escapeHtml(CANCEL_KIND_LABEL[c.kind])}) is waiting for <b>${escapeHtml(receiver)}</b> to confirm. Your stock changes only when it does.</p>
      <button class="btn btn-outline" id="pcShare" style="width:100%;margin-bottom:6px">${isTauriApp()? "📁 " : "📲 "}Send the cancellation again</button>
      ${c.replaced_by? `<button class="btn btn-outline" id="pcShareNew" style="width:100%;margin-bottom:6px">Send replacement ${escapeHtml(formatDocNo("DN",c.replaced_by))} again</button>` : ""}
      <div id="pcMsg" class="muted" style="font-size:12.5px;margin-bottom:8px"></div>
      <div class="box" style="border-color:#b42318">
        <b>Cancel without confirmation</b>
        <p class="muted" style="margin:4px 0">Use this only if ${escapeHtml(receiver)} can't be reached. Your stock is posted now. If they still receive the goods, stock will be counted twice and ${escapeHtml(dn)} will show <b>Conflict</b>. Nothing is corrected automatically.</p>
        <label style="margin-top:6px">Type CANCEL ${escapeHtml(dn)}</label><input class="field" id="pcTyped" autocomplete="off">
        <label>Admin passcode</label><input class="field" id="pcPass" type="password" autocomplete="off">
        <div id="pcErr" style="color:#b42318;font-size:12.5px;margin-top:6px"></div>
        <button class="btn btn-primary" id="pcGo" style="margin-top:8px;background:#b42318">Cancel without confirmation</button>
      </div>`);
    const q = (s)=>wrap.querySelector(s);
    q("#pcShare").onclick=async ()=>{ try{ q("#pcMsg").textContent = dnShareMessage(await shareCancelNotice(c)); }catch(e){ q("#pcMsg").textContent = "Couldn't share: "+(e.message||e); } };
    const sn = q("#pcShareNew"); if(sn) sn.onclick=async ()=>{ try{ q("#pcMsg").textContent = dnShareMessage(await shareReplacementDN(c.replaced_by)); }catch(e){ q("#pcMsg").textContent = "Couldn't share: "+(e.message||e); } };
    let busy = false;
    q("#pcGo").onclick=async ()=>{
      if(busy) return; busy = true;
      try{ overridePendingCase({ dnNo, passcode:q("#pcPass").value, typed:q("#pcTyped").value }); await persist(); }
      catch(e){ busy = false; q("#pcErr").textContent = e.message||String(e); return; }
      wrap.remove(); if(onDone) onDone(); else render();
    };
  }

  // ---------------- Import GRV (dispatcher side, Phase 4) ----------------
  // The receiver sends its Goods Received Voucher back. Importing it marks the DN
  // 'received'. Stock is NEVER touched here: it was deducted at dispatch and the
  // receiver added it on Accept. Nothing is written unless every check passes.

  // ---- pure part ----
  const grvLineKey = (l)=> (String(l.code==null?"":l.code).trim().toLowerCase() || "name:"+String(l.name==null?"":l.name).trim().toLowerCase());
  function grvLineText(l){ return (l.code? l.code+" " : "")+l.name+" × "+l.qty; }
  // dnLines: [{code,name,qty}] (what this branch dispatched)  grvLines: [{code,name,qty}]
  // Equal means the same set of (code, qty) pairs — order does not matter.
  // Lines with no code are matched on their name.
  function compareGrvLines(dnLines, grvLines){
    const norm = (ls)=> ls.map(l=>grvLineKey(l)+"|"+l.qty).sort();
    const a = norm(dnLines), b = norm(grvLines);
    if(a.length===b.length && a.every((x,i)=>x===b[i])) return { same:true };
    return { same:false, dn:dnLines.map(grvLineText), grv:grvLines.map(grvLineText) };
  }
  // ctx: { ownBranchId, lookup(dnNo) -> dispatch_docs 'out' row | null, storedLines(header) -> [{code,name,qty}] }
  // -> { ok:false, stage, message, ... } | { ok:true, doc, header, lines }
  async function checkIncomingGRV(text, ctx, hashFn){
    // 1. parse, validate, checksum
    const p = await parseGRV(text, hashFn);
    if(!p.ok) return { ok:false, stage:"file", message:p.errors[0], errors:p.errors };
    const doc = p.doc;
    // 2. the DN must have been dispatched by this branch
    if(doc.from.branch_id!==ctx.ownBranchId)
      return { ok:false, stage:"branch", message:"This Goods Received Voucher is for "+doc.dn_display+" dispatched by \""+doc.from.name+"\", not by this branch. Nothing was changed.", doc };
    // 3. and must exist here as an outgoing DN
    const h = ctx.lookup(doc.dn_no);
    if(!h) return { ok:false, stage:"unknown", message:doc.dn_display+" was not dispatched from this device, so this voucher can't be matched. Nothing was changed.", doc };
    // 4. only once
    if(h.status==="received")
      return { ok:false, stage:"duplicate", message:"Already confirmed on "+(isoDateText(h.received_iso)||String(h.received_ts||"").slice(0,10))+" as "+formatDocNo("GRV",h.grv_no)+".", doc, header:h };
    // 4b. a DN cancelled here can't be received: record that the two facts disagree (the screen does), change no stock
    if(["cancelled","superseded","loss_closed"].includes(h.status))
      return { ok:false, stage:"conflict", message:doc.dn_display+" was "+({ cancelled:"cancelled", superseded:"cancelled and reissued", loss_closed:"closed as a loss" }[h.status])+" on this device, but this voucher ("+doc.grv_display+") says "+doc.to.name
        +" received it. Both facts are now recorded and "+doc.dn_display+" shows as Conflict. No stock was changed. Management must check the stock.", doc, header:h };
    // 5. the lines must equal what was dispatched
    const stored = ctx.storedLines(h);
    const cmp = compareGrvLines(stored, doc.items);
    if(!cmp.same)
      return { ok:false, stage:"lines", message:"The lines on this voucher are not the same as the lines dispatched on "+doc.dn_display+". Nothing was changed.", dn:cmp.dn, grv:cmp.grv, doc, header:h };
    return { ok:true, doc, header:h };
  }

  // ---- database side ----
  function grvImportContext(){
    return { ownBranchId:getBranchId(),
      lookup:(dnNo)=>one("SELECT * FROM dispatch_docs WHERE dispatch_branch_id=? AND dn_no=? AND direction='out'",[getBranchId(),dnNo]),
      storedLines:(h)=>dnStoredLines(h).map(l=>({ code:l.sku||"", name:l.product_name, qty:l.qty })) };
  }
  async function grvImportCheckBytes(bytes){
    const text = decodeBytesUtf8(bytes);
    return { res: await checkIncomingGRV(text, grvImportContext()), text };
  }
  // Synchronous and all-or-nothing; the caller awaits persist() afterwards.
  // Writes the header and the event ONLY: no product, stock or counter is touched.
  function commitGrvImport(doc, now){
    db.run("BEGIN");
    try{
      const h = one("SELECT * FROM dispatch_docs WHERE dispatch_branch_id=? AND dn_no=? AND direction='out'",[getBranchId(),doc.dn_no]);
      if(!h) throw new Error(doc.dn_display+" was not dispatched from this device.");
      if(h.status==="received") throw new Error("Already confirmed as "+formatDocNo("GRV",h.grv_no)+".");
      const ts = now.toISOString();
      let aborted = null, posted = null;
      // A cancel still waiting on this DN ends here: the receiver had accepted it, so nothing is restored.
      const pc = pendingCaseFor(doc.dn_no);
      if(pc){
        run("UPDATE dn_cases SET state='aborted', posted_ts=?, posted_via='grv' WHERE id=?",[ts,pc.id]);
        recordDnEvent({ dnBranchId:getBranchId(), dnNo:doc.dn_no, type:"cancel_aborted", actorBranchId:getBranchId(), actorName:currentBranch(), fromName:h.dispatch_branch_name, toName:h.receive_branch_name, ts:localIso(now),
          detail:{ case_no:pc.case_no, reason:"received as "+doc.grv_display } });
        if(pc.kind==="reissue" && pc.replaced_by){          // the replacement was never valid: nothing was posted for it
          run("UPDATE dispatch_docs SET status='cancelled', cancel_kind='aborted', cancelled_ts=? WHERE dispatch_branch_id=? AND dn_no=? AND direction='out'",[ts,getBranchId(),pc.replaced_by]);
          recordDnEvent({ dnBranchId:getBranchId(), dnNo:pc.replaced_by, type:"cancel_posted", actorBranchId:getBranchId(), actorName:currentBranch(), fromName:h.dispatch_branch_name, toName:h.receive_branch_name, ts:localIso(now),
            detail:{ kind:"aborted", replaced_by:null, override:false, case_no:pc.case_no, via:"grv-of-original" } });
        }
        aborted = { caseNo:pc.case_no, replacement:pc.replaced_by||null };
      }
      // A voucher for a REPLACEMENT DN also proves the DN it replaced can no longer be received: post that cancel now.
      if(h.replaces_dn_no && h.stock_posted===0){
        const oc = caseByReplacement(h.dn_no);
        if(oc && oc.state==="pending"){
          postCaseSync(oc, { override:false, via:"grv-of-replacement", now });
          run("UPDATE dn_cases SET acked_ts=? WHERE id=?",[ts,oc.id]);
          recordDnEvent({ dnBranchId:getBranchId(), dnNo:oc.dn_no, type:"cancelled", actorBranchId:doc.to.branch_id, actorName:doc.to.name, fromName:h.dispatch_branch_name, toName:h.receive_branch_name,
            ts:doc.received_iso, detail:{ cancel_no:oc.case_no, via:"grv-of-replacement" } });
          posted = { dnNo:oc.dn_no, caseNo:oc.case_no };
        }
      }
      run("UPDATE dispatch_docs SET status='received', grv_no=?, received_ts=?, received_iso=?, received_by=? WHERE dispatch_branch_id=? AND dn_no=? AND direction='out'",
        [doc.grv_no, ts, doc.received_iso, String(sessionUser||""), getBranchId(), doc.dn_no]);
      recordDnEvent({ dnBranchId:getBranchId(), dnNo:doc.dn_no, type:"received", actorBranchId:doc.to.branch_id, actorName:doc.to.name,
        fromName:h.dispatch_branch_name, toName:h.receive_branch_name, ts:doc.received_iso, grvNo:doc.grv_no,
        detail:{ dn_created_iso:h.created_iso, imported_at:ts, imported_by:String(sessionUser||"") } });
      logAudit("Import GRV","",doc.grv_display+" confirms "+doc.dn_display+" received by "+doc.to.name);
      db.run("COMMIT");
      return { header:one("SELECT * FROM dispatch_docs WHERE dispatch_branch_id=? AND dn_no=? AND direction='out'",[getBranchId(),doc.dn_no]), aborted, posted };
    }catch(e){
      try{ db.run("ROLLBACK"); }catch(_){}
      throw e;
    }
  }
  // A voucher for a DN this device cancelled: record the disagreement as a fact (no stock, no header change).
  // The DN then derives as 'conflict' (a posted cancel AND a receipt).
  function commitConflictGrv(doc, now){
    db.run("BEGIN");
    try{
      const h = one("SELECT * FROM dispatch_docs WHERE dispatch_branch_id=? AND dn_no=? AND direction='out'",[getBranchId(),doc.dn_no]);
      if(!h) throw new Error(doc.dn_display+" was not dispatched from this device.");
      recordDnEvent({ dnBranchId:getBranchId(), dnNo:doc.dn_no, type:"received", actorBranchId:doc.to.branch_id, actorName:doc.to.name,
        fromName:h.dispatch_branch_name, toName:h.receive_branch_name, ts:doc.received_iso, grvNo:doc.grv_no,
        detail:{ dn_created_iso:h.created_iso, imported_at:now.toISOString(), imported_by:String(sessionUser||""), conflict:true } });
      logAudit("GRV conflict","",doc.grv_display+" says "+doc.dn_display+" was received, but it is "+h.status+" here. Stock NOT changed.");
      db.run("COMMIT");
    }catch(e){ try{ db.run("ROLLBACK"); }catch(_){} throw e; }
  }

  // ---- screen ----
  function openGrvImportWithFile(file){ openGrvImportScreen(file); }
  function openGrvImportScreen(file, onDone){
    const wrap = openModal("Import GRV", `
      <p class="muted" style="margin-top:0">Choose the Goods Received Voucher file the receiving branch sent back. Any file name works.</p>
      <input type="file" id="giFile">`);
    const body = wrap.querySelector(".modal-body");
    wrap.querySelector("#giFile").onchange=(e)=>{ const f = e.target.files[0]; e.target.value=""; if(f) handle(f); };
    if(file) handle(file);
    function close(){ wrap.remove(); if(onDone) onDone(); else render(); }
    function blocked(res){
      const both = res.stage==="lines"? `
        <div class="card" style="padding:8px;margin:8px 0"><b>Dispatched on ${escapeHtml(res.doc.dn_display)}</b>${res.dn.map(t=>`<div class="pmeta">${escapeHtml(t)}</div>`).join("")}</div>
        <div class="card" style="padding:8px;margin:8px 0"><b>On the voucher ${escapeHtml(res.doc.grv_display)}</b>${res.grv.map(t=>`<div class="pmeta">${escapeHtml(t)}</div>`).join("")}</div>` : "";
      body.innerHTML = `<p style="margin:0 0 6px"><b>${escapeHtml(res.message)}</b></p>${both}<button class="btn btn-outline" id="giClose">Close</button>`;
      body.querySelector("#giClose").onclick=close;
    }
    // A cancellation confirmation from a receiver: post the cancel (restore, replacement, write-offs) in one transaction.
    async function handleAck(bytes){
      let out;
      try{ out = await ackCheckBytes(bytes); }catch(e){ return blocked({ stage:"file", message:"Could not read that file as a cancellation confirmation." }); }
      if(!out.res.ok) return blocked(out.res);
      const ack = out.res.doc;
      let r;
      try{ r = commitAckImport(ack, new Date()); }
      catch(e){ return blocked({ stage:"commit", message:"Nothing was changed. "+(e.message||String(e)) }); }
      try{ await persist(); }catch(e){}
      const c = r.case, kindText = c? CANCEL_KIND_LABEL[c.kind] : "Cancelled";
      body.innerHTML = `<div class="box" style="text-align:center;margin-bottom:10px"><p style="font-size:16px;font-weight:700;margin:0 0 4px">${escapeHtml(ack.dn_display)}: ${escapeHtml(kindText.toLowerCase())}</p>
        <p class="muted" style="margin:0">${r.upgraded? escapeHtml(ack.to.name+" has now confirmed the cancellation you posted earlier without confirmation. Nothing else changed.") : escapeHtml("Confirmed by "+ack.to.name+". Your stock was restored"+(c && c.kind==="reissue"? ", the replacement "+formatDocNo("DN",c.replaced_by)+" was posted" : "")+(c && c.kind==="loss"? " and the loss was written off" : "")+".")}</p></div>
        <button class="btn btn-primary" id="giDone">Done</button>`;
      body.querySelector("#giDone").onclick=close;
    }
    async function handle(f){
      body.innerHTML = `<div class="box" style="text-align:center"><p style="margin:0">Reading…</p></div>`;
      let bytes;
      try{ bytes = await readFileBytes(f); }catch(e){ return blocked({ stage:"file", message:"Could not read that file." }); }
      const fmt = sniffJsonFormat(bytes);
      if(fmt===ACK_FORMAT) return handleAck(bytes);
      if(fmt===CANCEL_FORMAT) return blocked({ stage:"file", message:"This is a cancellation notice for the receiving branch. It goes through Products, then Receive stock, on the branch it was sent to." });
      let out;
      try{ out = await grvImportCheckBytes(bytes); }catch(e){ return blocked({ stage:"file", message:"Could not read that file as a Goods Received Voucher." }); }
      if(!out.res.ok && out.res.stage==="conflict"){
        try{ commitConflictGrv(out.res.doc, new Date()); await persist(); }catch(e){ return blocked({ stage:"commit", message:"Nothing was changed. "+(e.message||String(e)) }); }
        try{ await dnfPut(getBranchId(), "GRV:"+out.res.doc.dn_no, { text:out.text, file_name:f.name||"", saved_ts:new Date().toISOString() }); }catch(e){}
        return blocked(out.res);
      }
      if(!out.res.ok) return blocked(out.res);
      const doc = out.res.doc;
      let cr;
      try{ cr = commitGrvImport(doc, new Date()); }
      catch(e){ return blocked({ stage:"commit", message:"Nothing was changed. "+(e.message||String(e)) }); }
      try{ await persist(); }catch(e){}
      try{ await dnfPut(getBranchId(), "GRV:"+doc.dn_no, { text:out.text, file_name:f.name||"", saved_ts:new Date().toISOString() }); }catch(e){}
      body.innerHTML = `<div class="box" style="text-align:center;margin-bottom:10px"><p style="font-size:16px;font-weight:700;margin:0 0 4px">${escapeHtml(doc.dn_display)} confirmed</p>
        <p class="muted" style="margin:0">Received by ${escapeHtml(doc.to.name)} on ${escapeHtml(isoDateText(doc.received_iso))} as ${escapeHtml(doc.grv_display)}. ${cr && cr.posted? "This also confirms the cancellation of "+escapeHtml(formatDocNo("DN",cr.posted.dnNo))+": your stock was restored and this replacement was posted." : "Your stock was not changed."}</p>
        ${cr && cr.aborted? `<p style="margin:8px 0 0;color:#b54708">The cancellation in progress on this Delivery Note was ended, because the goods were received. Nothing was restored${cr.aborted.replacement? " and the replacement "+escapeHtml(formatDocNo("DN",cr.aborted.replacement))+" is void" : ""}.</p>` : ""}</div>
        <button class="btn btn-primary" id="giDone">Done</button>`;
      body.querySelector("#giDone").onclick=close;
    }
  }

  // ---------------- Bulk inventory import (Excel/CSV) ----------------
  let _xlsxLoading = null;
  function loadXLSX(){
    if(window.XLSX) return Promise.resolve();
    if(_xlsxLoading) return _xlsxLoading;
    _xlsxLoading = new Promise((resolve, reject)=>{
      const s = document.createElement("script");
      s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
      s.onload = ()=> resolve();
      s.onerror = ()=> reject(new Error("Could not load the Excel import library — check your internet connection."));
      document.head.appendChild(s);
    });
    return _xlsxLoading;
  }
  // Header row matches IMPORT_COLUMN_MAP's primary synonym for each field
  // exactly, so a file filled in from this template re-imports with zero
  // "unrecognized column" ambiguity.
  async function downloadImportTemplate(){
    try{
      await loadXLSX();
      const headers = ["SKU","Item Name","Search Keywords","Cost","Price","Qty","Low Stock Alert Below"];
      const ws = XLSX.utils.aoa_to_sheet([headers]);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Products");
      XLSX.writeFile(wb, "seigen-import-template.xlsx");
    }catch(e){
      alert("Couldn't build the template: " + (e.message||e));
    }
  }
  function normalizeHeader(h){ return String(h||"").trim().toLowerCase().replace(/\s+/g," "); }
  const IMPORT_COLUMN_MAP = {
    sku: ["sku"],
    name: ["item name","name","product name","item"],
    keywords: ["search keywords","keywords","search"],
    cost: ["cost"],
    price: ["price","selling price"],
    qty: ["qty","quantity","stock","stock qty"],
    threshold: ["low stock alert below","low stock","threshold","alert level"]
  };
  function findColumn(headerMap, keys){
    for(const k of keys){ if(headerMap[k]!==undefined) return headerMap[k]; }
    return null;
  }
  function parseImportRows(sheetRows){
    if(sheetRows.length===0) return [];
    const rawHeaders = Object.keys(sheetRows[0]);
    const headerMap = {};
    rawHeaders.forEach(h=> headerMap[normalizeHeader(h)] = h);
    const col = {};
    for(const field in IMPORT_COLUMN_MAP){ col[field] = findColumn(headerMap, IMPORT_COLUMN_MAP[field]); }
    return sheetRows.map((r,i)=>{
      const get = (field)=> col[field]? r[col[field]] : "";
      const name = String(get("name")||"").trim();
      const priceNum = parseFloat(get("price"));
      const sku = String(get("sku")||"").trim();
      const keywords = String(get("keywords")||"").trim();
      const cost = parseFloat(get("cost"))||0;
      const qtyNum = parseInt(get("qty"));
      const qty = isNaN(qtyNum)? 0 : qtyNum;
      const thresholdNum = parseInt(get("threshold"));
      const threshold = isNaN(thresholdNum)? 5 : thresholdNum;
      let skipReason = null;
      if(!name) skipReason = "missing Item Name";
      else if(isNaN(priceNum)) skipReason = "missing or invalid Price";
      return { rowNum:i+2, name, sku, keywords, cost, price:isNaN(priceNum)?0:priceNum, qty, threshold, skipReason };
    });
  }
  function findImportMatch(branch, row){
    let existing = null;
    if(row.sku) existing = one("SELECT * FROM products WHERE branch=? AND lower(sku)=lower(?)",[branch,row.sku]);
    if(!existing) existing = one("SELECT * FROM products WHERE branch=? AND lower(name)=lower(?)",[branch,row.name]);
    return existing;
  }
  function importInventoryModal(){
    const wrap = openModal("Import Inventory from Excel", `
      <p class="muted">Columns expected: SKU, Item Name, Search Keywords (optional), Cost, Price, Qty, Low Stock Alert Below. Column order and exact wording don't matter.</p>
      <input class="field" id="impFile" type="file" accept=".xlsx,.xls,.csv">
      <div id="impStatus" class="muted" style="margin-top:8px"></div>
    `);
    const fileInput = wrap.querySelector("#impFile");
    const status = wrap.querySelector("#impStatus");
    fileInput.onchange = async ()=>{
      const file = fileInput.files[0];
      if(!file) return;
      status.textContent = "Reading file…";
      try{
        await loadXLSX();
        const buf = await file.arrayBuffer();
        const workbook = XLSX.read(buf, {type:"array"});
        const sheet = workbook.Sheets[workbook.SheetNames[0]];
        const sheetRows = XLSX.utils.sheet_to_json(sheet, {defval:""});
        const rows = parseImportRows(sheetRows);
        renderImportPreview(wrap, rows);
      }catch(e){
        status.textContent = "Couldn't read that file: " + (e.message||e);
      }
    };
  }
  function renderImportPreview(wrap, rows){
    const branch = currentBranch();
    const valid = rows.filter(r=>!r.skipReason);
    const skipped = rows.filter(r=>r.skipReason);
    let addCount=0, updateCount=0;
    valid.forEach(r=>{ if(findImportMatch(branch,r)) updateCount++; else addCount++; });
    const previewRows = valid.slice(0,15).map(r=>`
      <tr><td>${escapeHtml(r.name)}</td><td>${escapeHtml(r.sku||"—")}</td><td>${currency}${r.price.toFixed(2)}</td><td>${r.qty}</td></tr>
    `).join("");
    wrap.querySelector(".modal-body").innerHTML = `
      <div class="box">
        <div><b>${addCount}</b> new product${addCount===1?"":"s"} will be added</div>
        <div><b>${updateCount}</b> existing product${updateCount===1?"":"s"} will be updated</div>
        <div><b>${skipped.length}</b> row${skipped.length===1?"":"s"} skipped</div>
      </div>
      ${skipped.length? `<div class="box" style="max-height:120px;overflow-y:auto">
        ${skipped.map(r=>`<div class="muted">Row ${r.rowNum}: ${escapeHtml(r.skipReason)}</div>`).join("")}
      </div>` : ""}
      ${valid.length? `<table class="simple">
        <tr><th>Name</th><th>SKU</th><th>Price</th><th>Qty</th></tr>
        ${previewRows}
      </table>
      ${valid.length>15? `<p class="muted">…and ${valid.length-15} more</p>` : ""}` : ""}
      <div class="row" style="margin-top:12px">
        <button class="btn btn-outline" id="impCancel">Cancel</button>
        <button class="btn btn-primary" id="impConfirm" ${valid.length===0?"disabled":""}>Confirm Import</button>
      </div>
    `;
    wrap.querySelector("#impCancel").onclick = ()=> wrap.remove();
    const confirmBtn = wrap.querySelector("#impConfirm");
    if(confirmBtn) confirmBtn.onclick = ()=> runImport(wrap, valid);
  }
  function runImport(wrap, rows){
    const branch = currentBranch();
    const ts = new Date().toISOString();
    let added=0, updated=0;
    rows.forEach(r=>{
      const existing = findImportMatch(branch, r);
      if(existing){
        const delta = r.qty - existing.stock;
        run("UPDATE products SET name=?,sku=?,description=?,cost=?,price=?,low_threshold=?,stock=? WHERE id=?",
          [r.name, r.sku, r.keywords, r.cost, r.price, r.threshold, r.qty, existing.id]);
        run("INSERT INTO stock_received(ts,product_id,name,qty,note,branch,user) VALUES(?,?,?,?,?,?,?)",
          [ts, existing.id, r.name, delta, "Import adjustment", branch, sessionUser||""]);
        updated++;
      } else {
        run("INSERT INTO products(name,price,stock,low_threshold,sku,branch,image,cost,created_ts,description) VALUES(?,?,?,?,?,?,?,?,?,?)",
          [r.name, r.price, r.qty, r.threshold, r.sku, branch, "", r.cost, ts, r.keywords]);
        const pid = one("SELECT last_insert_rowid() as id").id;
        run("INSERT INTO stock_received(ts,product_id,name,qty,note,branch,user) VALUES(?,?,?,?,?,?,?)",
          [ts, pid, r.name, r.qty, "Import — initial stock", branch, sessionUser||""]);
        added++;
      }
    });
    logAudit("Bulk Import", "", `${added} added, ${updated} updated`);
    persist();
    wrap.querySelector(".modal-body").innerHTML = `
      <div class="box" style="text-align:center">
        <p style="font-size:16px;font-weight:700;margin:0 0 6px">Import complete</p>
        <p class="muted" style="margin:0">${added} added, ${updated} updated</p>
      </div>
      <button class="btn btn-primary" id="impDone" style="margin-top:12px">Done</button>
    `;
    wrap.querySelector("#impDone").onclick = ()=>{ wrap.remove(); render(); };
  }

  function payoutModal(refreshFn){
    const wrap = openModal("Add Payout", `
      <label>Amount (${currency})</label>

    `);
    wrap.querySelector("#poConfirm").onclick=()=>{

      run("INSERT INTO payouts(ts,amount,reason,branch,user) VALUES(?,?,?,?,?)",[new Date().toISOString(),amt,reason||"Payout",currentBranch(),sessionUser||""]);

  function renderEOD(main){
    const today = new Date().toISOString().slice(0,10);
    const branch = currentBranch();
    const todaySales = all("SELECT * FROM sales WHERE branch=? AND ts LIKE ?",[branch,today+"%"]);
    const cash = todaySales.filter(s=>s.method==="Cash").reduce((s,r)=>s+r.total,0);
    const ecocash = todaySales.filter(s=>s.method==="EcoCash").reduce((s,r)=>s+r.total,0);
    const credit = todaySales.filter(s=>s.method==="Credit").reduce((s,r)=>s+r.total,0);
    const discounts = todaySales.reduce((s,r)=>s+(r.discount||0),0);
    const totalSales = cash+ecocash+credit;
    const payouts = all("SELECT * FROM payouts WHERE branch=? AND ts LIKE ? ORDER BY ts",[branch,today+"%"]);
    const payoutsTotal = payouts.reduce((s,r)=>s+r.amount,0);
    const expected = cash - payoutsTotal;
    const lowStock = all("SELECT * FROM products WHERE branch=? AND stock<=low_threshold ORDER BY stock",[branch]);

    main.innerHTML = `
      <h2>End of Day — ${today}</h2>
      <div class="card">
        <div class="subline"><span>Sales Cash</span><span>${currency}${cash.toFixed(2)}</span></div>
        <div class="subline"><span>Sales EcoCash</span><span>${currency}${ecocash.toFixed(2)}</span></div>
        <div class="subline"><span>Sales Credit</span><span>${currency}${credit.toFixed(2)}</span></div>
        <div class="subline"><span>Less: Discounts</span><span>-${currency}${discounts.toFixed(2)}</span></div>
        <div class="hr" style="margin:8px 0"></div>
        <div class="total-line"><span>Total Sales</span><span>${currency}${totalSales.toFixed(2)}</span></div>
      </div>

      <div class="card">
        <h3>Payouts today</h3>
        ${payouts.length===0?`<p class="muted">None recorded</p>`:
          payouts.map(p=>`<div class="subline"><span>${escapeHtml(p.reason||"Payout")}</span><span>-${currency}${p.amount.toFixed(2)}</span></div>`).join("")}
        <div class="subline" style="font-weight:700"><span>Total payouts</span><span>-${currency}${payoutsTotal.toFixed(2)}</span></div>
        <button class="btn btn-outline" id="openAddPayout" style="margin-top:10px">+ Add Payout</button>
      </div>

      <div class="card">
        <h3>Blind cash count</h3>
        <p class="muted">Count the drawer and enter the amount. Expected cash stays hidden until you submit.</p>
        <label>Cash counted (${currency})</label>
        <input class="field" id="counted" type="number" step="0.01" placeholder="0.00">
        <button class="btn btn-primary" id="submitCount" style="margin-top:12px">Reveal Variance</button>
        <div id="varianceResult"></div>
      </div>

      <div class="card">
        <h3>Low stock (${lowStock.length})</h3>
        ${lowStock.length===0? `<p class="muted">All good — nothing low.</p>` :
          lowStock.map(p=>`<div class="product-row"><div class="pname">${escapeHtml(p.name)}</div><span class="pill low">${p.stock} left</span></div>`).join("")}
      </div>
      <div class="row">
        <button class="btn btn-outline" id="printEodBtn">🖨️ Print / PDF</button>
        <button class="btn btn-ghost" id="waEodBtn">📲 WhatsApp</button>
        ${hasUSBPrint()? `<button class="btn btn-outline" id="usbEodBtn" style="flex:none;width:auto;padding:12px">🔌</button>` : ""}
        ${hasBTPrint()? `<button class="btn btn-outline" id="btEodBtn" style="flex:none;width:auto;padding:12px">🔵</button>` : ""}
      </div>
    `;
    document.getElementById("openAddPayout").onclick=()=>payoutModal(()=>render());
    document.getElementById("submitCount").onclick=()=>{
      const counted = parseFloat(document.getElementById("counted").value);
      if(isNaN(counted)) return alert("Enter the counted cash amount");
      const variance = counted - expected;
      run("INSERT INTO eod_sessions(date,expected_cash,counted_cash,variance,notes,branch,ts) VALUES(?,?,?,?,?,?,?)",
        [today,expected,counted,variance,"",branch,new Date().toISOString()]);
      persist();
      document.getElementById("varianceResult").innerHTML = `
        <div class="hr"></div>
        <div class="row">
          <div><div class="muted">Expected</div><b>${currency}${expected.toFixed(2)}</b></div>
          <div><div class="muted">Counted</div><b>${currency}${counted.toFixed(2)}</b></div>
          <div><div class="muted">Variance</div><b style="color:${variance<0?'var(--danger)':'var(--success)'}">${currency}${variance.toFixed(2)}</b></div>
        </div>`;
    };
    document.getElementById("printEodBtn").onclick=()=>{
      const counted = parseFloat(document.getElementById("counted").value)||0;
      printEOD({date:today,cash,ecocash,credit,discounts,totalSales,payouts,payoutsTotal,expected,counted,variance:counted-expected,lowStock});
    };
    const usbEodBtn = document.getElementById("usbEodBtn");
    if(usbEodBtn) usbEodBtn.onclick=()=>{
      const counted = parseFloat(document.getElementById("counted").value)||0;
      usbPrintEODBytes({date:today,cash,ecocash,credit,discounts,totalSales,payouts,payoutsTotal,expected,counted,variance:counted-expected,lowStock});
    };
    const btEodBtn = document.getElementById("btEodBtn");
    if(btEodBtn) btEodBtn.onclick=()=>{
      const counted = parseFloat(document.getElementById("counted").value)||0;
      btPrintEODBytes({date:today,cash,ecocash,credit,discounts,totalSales,payouts,payoutsTotal,expected,counted,variance:counted-expected,lowStock});
    };
    document.getElementById("waEodBtn").onclick=()=>{
      const counted = parseFloat(document.getElementById("counted").value)||0;
      const variance = counted-expected;
      const itemLines = [
        padLine("Sales Cash", `${currency}${cash.toFixed(2)}`),
        padLine("Sales EcoCash", `${currency}${ecocash.toFixed(2)}`),
        padLine("Sales Credit", `${currency}${credit.toFixed(2)}`),
        padLine("Less: Discounts", `-${currency}${discounts.toFixed(2)}`),
        padLine("Payouts", `-${currency}${payoutsTotal.toFixed(2)}`)
      ];
      const totalLines = [
        padLine("Total Sales", `${currency}${totalSales.toFixed(2)}`),
        padLine("Expected Cash", `${currency}${expected.toFixed(2)}`),
        padLine("Cash Count", `${currency}${counted.toFixed(2)}`),
        padLine("Variance", `${currency}${variance.toFixed(2)}`),
        "", `Low stock: ${lowStock.map(p=>p.name).join(", ")||"None"}`
      ];
      shareWhatsApp(receiptText(`${escapeHtml(getSetting("shop_name",""))} — EOD ${today}`, itemLines, totalLines));
    };
  }

    function productAgeDays(p){
      const lastReceived = one("SELECT MAX(ts) as t FROM stock_received WHERE product_id=? AND qty>0 AND adj_no IS NULL",[p.id]);
      const ref = (lastReceived && lastReceived.t) ? lastReceived.t : (p.created_ts||new Date().toISOString());
      return Math.max(0, daysBetween(new Date(ref), new Date()));

    function applyPreset(fromId, toId, key){

      if(key==="week"){ from.setDate(now.getDate()-6); }
      else if(key==="month"){ from = new Date(now.getFullYear(), now.getMonth(), 1); }
      document.getElementById(fromId).value = from.toISOString().slice(0,10);
      document.getElementById(toId).value = to.toISOString().slice(0,10);

  // ---------------- Stocktake ----------------
  // One open stocktake per branch at a time. Counting is deliberately blind
  // (system_qty is never shown while counting, same principle as the EOD
  // cash count) so staff aren't biased toward matching what the system
  // expects. Cutting off closes the count and produces a variance report;
  // applying the counts to live stock is a separate, explicitly-confirmed step.
  function renderStocktake(main){
    if(stocktakeReportId) return renderStocktakeReport(main, stocktakeReportId);
    // Stocktakes are per-branch, and a device can have more than one open at
    // once (e.g. for two branches whose data has been merged onto it). Only
    // auto-jump into counting when there's exactly one open take — otherwise
    // show the list so the user picks which one to continue.
    const openTakes = all("SELECT * FROM stocktakes WHERE status='Open' ORDER BY created_ts");
    if(openTakes.length===1) return renderStocktakeCounting(main, openTakes[0]);
    renderStocktakeList(main);
  }
  function renderStocktakeList(main){
    const openTakes = all("SELECT * FROM stocktakes WHERE status='Open' ORDER BY created_ts");
    const past = all("SELECT * FROM stocktakes WHERE status='Closed' ORDER BY cutoff_ts DESC");
    main.innerHTML = `
      <p class="muted">Count physical stock and compare it against what the system expects.</p>
      <button class="btn btn-primary" id="startStocktake" style="margin-bottom:14px">+ Start Stocktake</button>
      ${openTakes.length? `
        <h3>Open Stocktakes</h3>
        ${openTakes.map(s=>`
          <div class="card" style="display:flex;justify-content:space-between;align-items:center">
            <div>
              <div style="font-weight:700">${escapeHtml(s.branch)}</div>
              <div class="muted">${escapeHtml(s.start_date)}${s.end_date?` – ${escapeHtml(s.end_date)}`:""} · Team: ${escapeHtml(s.team_names||"—")}</div>
            </div>
            <button class="btn btn-sm btn-primary" data-continue-take="${s.id}">Continue</button>
          </div>`).join("")}
      ` : ""}
      <h3>Past Stocktakes</h3>
      ${past.length===0? `<p class="muted">No stocktakes yet.</p>` : past.map(s=>`
        <div class="card" style="display:flex;justify-content:space-between;align-items:center">
          <div>
            <div style="font-weight:700">${escapeHtml(s.branch)}</div>
            <div class="muted">${escapeHtml(s.start_date)}${s.end_date?` – ${escapeHtml(s.end_date)}`:""} · Team: ${escapeHtml(s.team_names||"—")} · Closed ${s.cutoff_ts? new Date(s.cutoff_ts).toLocaleDateString() : "—"}</div>
          </div>
          <button class="btn btn-sm btn-outline" data-view-take="${s.id}">View</button>
        </div>`).join("")}
    `;
    document.getElementById("startStocktake").onclick=()=>startStocktakeModal();
    main.querySelectorAll("[data-continue-take]").forEach(b=>{
      b.onclick=()=>{ const take = one("SELECT * FROM stocktakes WHERE id=?",[+b.dataset.continueTake]); renderStocktakeCounting(main, take); };
    });
    main.querySelectorAll("[data-view-take]").forEach(b=>{
      b.onclick=()=>{ stocktakeReportId = +b.dataset.viewTake; render(); };
    });
  }
  function startStocktakeModal(){
    const today = new Date().toISOString().slice(0,10);
    const wrap = openModal("Start Stocktake", `
      <label>Branch</label>${branchSelectHtml("stBranch", currentBranch())}
      <label>Team names</label>
      <input class="field" id="stTeam" placeholder="e.g. Tapiwa, Rudo">
      <label>Start date</label>
      <input class="field" id="stStart" type="date" value="${today}">
      <label>End date (optional estimate)</label>
      <input class="field" id="stEnd" type="date">
      <p class="muted" id="stWarning" style="color:var(--danger)"></p>
      <button class="btn btn-primary" id="stConfirm" style="margin-top:12px">Start</button>
    `);
    const branchSel = wrap.querySelector("#stBranch");
    const warningEl = wrap.querySelector("#stWarning");
    function updateWarning(){
      const b = branchSel.value;
      if(!b){ warningEl.textContent = `Pick a specific branch — a stocktake can't target "All branches".`; return; }
      const existing = one("SELECT * FROM stocktakes WHERE branch=? AND status='Open'",[b]);
      warningEl.textContent = existing? `${b} already has an open stocktake — cut it off before starting another.` : "";
    }
    branchSel.onchange = updateWarning;
    updateWarning();
    wrap.querySelector("#stConfirm").onclick=()=>{
      const branch = branchSel.value;
      if(!branch) return alert(`Pick a specific branch for this stocktake — it can't target "All branches".`);
      if(one("SELECT * FROM stocktakes WHERE branch=? AND status='Open'",[branch])){
        alert(`${branch} already has an open stocktake. Cut it off before starting another.`);
        return;
      }
      const team = wrap.querySelector("#stTeam").value.trim();
      const start = wrap.querySelector("#stStart").value || today;
      const end = wrap.querySelector("#stEnd").value || "";
      run("INSERT INTO stocktakes(branch,team_names,start_date,end_date,status,created_by,created_ts) VALUES(?,?,?,?,'Open',?,?)",
        [branch, team, start, end, sessionUser||"", new Date().toISOString()]);
      persist(); wrap.remove(); render();
    };
  }
  function renderStocktakeCounting(main, take){
    const branch = take.branch;
    const products = all("SELECT * FROM products WHERE branch=? ORDER BY name",[branch]);
    const counted = all("SELECT * FROM stocktake_counts WHERE stocktake_id=?",[take.id]);
    const countMap = {}; counted.forEach(c=> countMap[c.product_id]=c);
    main.innerHTML = `
      <h3>Stocktake — ${escapeHtml(take.branch)} — ${escapeHtml(take.start_date)}${take.end_date?` to ${escapeHtml(take.end_date)}`:""}</h3>
      <p class="muted">Team: ${escapeHtml(take.team_names||"—")} · Counted ${counted.length} of ${products.length}</p>
      <p class="muted">Count what's physically on the shelf — the system's expected quantity is hidden while you count, so it doesn't bias you.</p>
      <table class="simple">
        <tr><th>Item</th><th>Shelf</th><th>Counted Qty</th></tr>
        ${products.map(p=>{
          const c = countMap[p.id];
          return `<tr>
            <td>${skuNameCellScreen(p.sku,p.name)}</td>
            <td>${escapeHtml(p.shelf||"—")}</td>
            <td><input class="field" data-count="${p.id}" type="number" min="0" style="max-width:90px" value="${c?c.counted_qty:""}" placeholder="—"></td>
          </tr>`;
        }).join("")}
      </table>
      <button class="btn btn-danger" id="cutoffStocktake" style="margin-top:14px">Cut Off & Generate Report</button>
    `;
    main.querySelectorAll("[data-count]").forEach(inp=>{
      inp.onchange=(e)=>{
        const pid = +inp.dataset.count;
        const val = e.target.value;
        if(val==="") return;
        const qty = parseInt(val)||0;
        const p = one("SELECT * FROM products WHERE id=?",[pid]);
        const existingCount = one("SELECT * FROM stocktake_counts WHERE stocktake_id=? AND product_id=?",[take.id,pid]);
        if(existingCount){
          run("UPDATE stocktake_counts SET counted_qty=?, system_qty=?, counted_ts=?, counted_by=? WHERE id=?",
            [qty, p.stock, new Date().toISOString(), sessionUser||"", existingCount.id]);
        } else {
          run("INSERT INTO stocktake_counts(stocktake_id,product_id,product_name,sku,system_qty,counted_qty,counted_ts,counted_by) VALUES(?,?,?,?,?,?,?,?)",
            [take.id, pid, p.name, p.sku||"", p.stock, qty, new Date().toISOString(), sessionUser||""]);
        }
        persist();
      };
    });
    document.getElementById("cutoffStocktake").onclick=()=>{
      if(!confirm("Cut off this stocktake? Any products not yet counted will be marked 'Not counted' in the report.")) return;
      run("UPDATE stocktakes SET status='Closed', cutoff_ts=? WHERE id=?",[new Date().toISOString(), take.id]);
      persist();
      stocktakeReportId = take.id;
      render();
    };
  }
  function computeStocktakeVariance(takeId){
    const take = one("SELECT * FROM stocktakes WHERE id=?",[takeId]);
    if(!take) return { take:null, rows:[] };
    const products = all("SELECT * FROM products WHERE branch=? ORDER BY name",[take.branch]);
    const counts = all("SELECT * FROM stocktake_counts WHERE stocktake_id=?",[takeId]);
    const countMap = {}; counts.forEach(c=> countMap[c.product_id]=c);
    const rows = products.map(p=>{
      const c = countMap[p.id];
      const counted = c? c.counted_qty : null;
      const variance = counted===null? null : counted - c.system_qty;
      return { product:p, count:c, counted, variance };
    });
    return { take, rows };
  }
  function renderStocktakeReport(main, takeId){
    const { take, rows } = computeStocktakeVariance(takeId);
    if(!take){ stocktakeReportId=null; return renderStocktakeList(main); }
    main.innerHTML = `
      <h3>Stocktake Report — ${escapeHtml(take.branch)} — ${escapeHtml(take.start_date)}${take.end_date?` to ${escapeHtml(take.end_date)}`:""}</h3>
      <p class="muted">Team: ${escapeHtml(take.team_names||"—")} · Cut off ${take.cutoff_ts? new Date(take.cutoff_ts).toLocaleString() : "—"}</p>
      <div class="card" style="overflow-x:auto">
        <table class="simple">
          <tr><th>Item</th><th>Shelf</th><th>System Qty</th><th>Counted Qty</th><th>Variance</th></tr>
          ${rows.map(r=>`<tr>
            <td>${skuNameCellScreen(r.product.sku,r.product.name)}</td>
            <td>${escapeHtml(r.product.shelf||"—")}</td>
            <td>${r.count? r.count.system_qty : r.product.stock}</td>
            <td>${r.counted===null? "Not counted" : r.counted}</td>
            <td>${r.variance===null? "—" : (r.variance>0?`+${r.variance}`:r.variance)}</td>
          </tr>`).join("")}
        </table>
      </div>
      <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
        <button class="btn btn-outline" id="printStocktake">🖨️ Print/PDF</button>
        <button class="btn btn-outline" id="backToStocktakes">Back to Stocktakes</button>
      </div>
      ${take.status==="Closed"? `<button class="btn btn-danger" id="applyStocktake" style="margin-top:10px">Apply counts to inventory</button>` : ""}
    `;
    document.getElementById("printStocktake").onclick=()=>{
      const headers = ["Item","Shelf","System Qty","Counted Qty","Variance"];
      const printRows = rows.map(r=>[skuNameCell(r.product.sku,r.product.name), escapeHtml(r.product.shelf||"—"), r.count?r.count.system_qty:r.product.stock, r.counted===null?"Not counted":r.counted, r.variance===null?"—":(r.variance>0?`+${r.variance}`:r.variance)]);
      printReport("Stocktake Report", `${take.branch} · ${take.start_date}${take.end_date?` to ${take.end_date}`:""}`, headers, printRows, "");
    };
    document.getElementById("backToStocktakes").onclick=()=>{ stocktakeReportId=null; render(); };
    const applyBtn = document.getElementById("applyStocktake");
    if(applyBtn) applyBtn.onclick=()=>{
      const toApply = rows.filter(r=>r.counted!==null && r.variance!==0);
      if(toApply.length===0){ alert("No counted items differ from system stock — nothing to apply."); return; }
      if(!confirm(`Apply ${toApply.length} counted quantities to live stock? This can't be undone.`)) return;
      toApply.forEach(r=>{
        run("UPDATE products SET stock=? WHERE id=?",[r.counted, r.product.id]);
        run("INSERT INTO stock_received(ts,product_id,name,qty,note,branch,user) VALUES(?,?,?,?,?,?,?)",
          [new Date().toISOString(), r.product.id, r.product.name, r.variance, "Stocktake adjustment", take.branch, sessionUser||""]);
      });
      logAudit("Apply Stocktake", "", `${toApply.length} products adjusted (stocktake #${take.id})`);
      persist();
      alert("Inventory updated.");
      render();
    };
  }


  // Requests / market intelligence notepad — logs stock a customer asked for

  function newReqLine(){ return { id: reqLineSeq++, item:"", qty:"" }; }
  function openRequestsDrawer(){

  function wireReqPendingRows(){
    document.querySelectorAll("[data-req-row]").forEach(card=>{
      card.onclick=(e)=>{

    function renderReqLines(){
      linesWrap.innerHTML = reqLines.map((l,i)=>`
        <div class="card" style="padding:10px;margin-bottom:8px">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
            <span class="muted" style="font-size:11.5px;font-weight:700">ITEM ${i+1}</span>

          </div>
          <label style="margin-top:0">Item requested</label>
          <input class="field" data-req-item="${l.id}" placeholder="e.g. 13mm socket set" value="${escapeHtml(l.item)}">

          <input class="field" data-req-qty="${l.id}" type="number" placeholder="0" value="${escapeHtml(String(l.qty))}">

        const itemInput = linesWrap.querySelector(`[data-req-item="${l.id}"]`);
        if(itemInput) itemInput.oninput=(e)=>{ l.item=e.target.value; };
        const qtyInput = linesWrap.querySelector(`[data-req-qty="${l.id}"]`);
        if(qtyInput) qtyInput.oninput=(e)=>{ l.qty=e.target.value; };

        if(removeBtn) removeBtn.onclick=()=>{

    document.getElementById("reqSubmit").onclick=()=>{

        const qty = l.qty? parseInt(l.qty) : null;
        run("INSERT INTO stock_requests(ts,branch,user,item_requested,customer_name,customer_phone,qty_wanted,notes,fulfilled) VALUES(?,?,?,?,?,?,?,?,0)",
          [ts, branchNow, sessionUser||"", l.item.trim(), custName, custPhone, qty, notes]);

      persist();
      reqLines = [ newReqLine() ];
      render();
      renderStockRequestsListOnly();

    document.getElementById("reqDrawerBranchSel").onchange=(e)=>{ reqBranch=e.target.value; renderRequestsDrawer(); };
    wireReqPendingRows();

  // ---------------- Purchasing & Receiving + COGS Recovery (Main branch only) ----------------
  // Cost/financial data, same precedent as the Margin Report — this whole
  // module is hidden for Remote branches, not just gated at the action level.
  // Cart-style line items, each with a live search-as-you-type product
  // picker (reusing searchProducts exactly as the Sell screen does) so
  // staff tap a match instead of retyping a name that has to align exactly
  // with what's already in the database. Typing something with no match
  // is still allowed to stand as a brand-new product, same find-or-create
  // fallback the single-item version used.
  function recordPurchaseModal(){
    const branch = currentBranch();
    let lineSeq = 0;
    const newLine = ()=>({ id: lineSeq++, query:"", product:null, qty:"", unitCost:"" });
    let lines = [ newLine() ];

    const wrap = openModal("Record Purchase", `
      <label>Supplier</label>
      <input class="field" id="puSupplier" placeholder="e.g. Metro Wholesalers">
      <label>Note (optional)</label>
      <input class="field" id="puNote" placeholder="e.g. invoice #1234">
      <div class="hr"></div>
      <div id="puLines"></div>
      <button class="btn btn-outline btn-sm" id="puAddLine" style="margin-top:4px">+ Add Line</button>
      <button class="btn btn-primary" id="puConfirm" style="margin-top:14px">Record Purchase</button>
    `);
    const linesEl = wrap.querySelector("#puLines");

    function dropdownHtml(line){
      if(line.product || !line.query.trim()) return "";
      const matches = searchProducts(line.query, branch).slice(0,6);
      return `<div class="card" style="padding:4px;margin-top:4px;max-height:150px;overflow-y:auto">
        ${matches.length? matches.map(m=>`<button type="button" data-pick="${line.id}:${m.id}" style="display:block;width:100%;text-align:left;background:none;border:none;padding:8px;font-size:13px;border-bottom:1px solid var(--border)">${escapeHtml(m.sku?m.sku+" — ":"")}${escapeHtml(m.name)}</button>`).join("")
                  : `<div class="muted" style="padding:6px;font-size:12.5px">No match — "${escapeHtml(line.query.trim())}" will be added as a new product</div>`}
      </div>`;
    }
    function wireDropdown(line){
      const dd = linesEl.querySelector(`[data-dropdown="${line.id}"]`);
      if(!dd) return;
      dd.querySelectorAll("[data-pick]").forEach(btn=>{
        btn.onclick=()=>{
          const [,pid] = btn.dataset.pick.split(":");
          line.product = one("SELECT * FROM products WHERE id=?",[+pid]);
          line.query = line.product.name;
          renderLines();
        };
      });
    }
    function lineRowHtml(line, idx){
      return `
        <div class="card" style="padding:10px;margin-bottom:8px">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
            <span class="muted" style="font-size:11.5px;font-weight:700">LINE ${idx+1}</span>
            <button type="button" class="close-x" data-remove-line="${line.id}" title="Remove line" style="font-size:15px;padding:2px 6px">✕</button>
          </div>
          <label style="margin-top:0">Product</label>
          ${line.product
            ? `<p class="muted" style="margin:0 0 4px">Matched: <b>${escapeHtml(line.product.sku?line.product.sku+" — ":"")}${escapeHtml(line.product.name)}</b> <button type="button" data-clear-match="${line.id}" style="background:none;border:none;color:var(--orange);text-decoration:underline;padding:0;font-size:12px;margin-left:4px">change</button></p>`
            : `<input class="field" data-product-input="${line.id}" placeholder="Search by name or SKU, or type a new item" value="${escapeHtml(line.query)}" autocomplete="off">
               <div data-dropdown="${line.id}">${dropdownHtml(line)}</div>`}
          <div class="row" style="margin-top:8px">
            <div><label>Qty</label><input class="field" data-qty="${line.id}" type="number" min="1" value="${escapeHtml(String(line.qty))}" placeholder="0"></div>
            <div><label>Unit Cost (${currency})</label><input class="field" data-unitcost="${line.id}" type="number" step="0.01" value="${escapeHtml(String(line.unitCost))}" placeholder="0.00"></div>
          </div>
        </div>`;
    }
    function renderLines(){
      linesEl.innerHTML = lines.map((l,i)=>lineRowHtml(l,i)).join("");
      lines.forEach(line=>{
        const input = linesEl.querySelector(`[data-product-input="${line.id}"]`);
        if(input) input.oninput=(e)=>{
          line.query = e.target.value;
          line.product = null;
          const dd = linesEl.querySelector(`[data-dropdown="${line.id}"]`);
          if(dd){ dd.innerHTML = dropdownHtml(line); wireDropdown(line); }
        };
        wireDropdown(line);
        const clearBtn = linesEl.querySelector(`[data-clear-match="${line.id}"]`);
        if(clearBtn) clearBtn.onclick=()=>{ line.product=null; renderLines(); };
        const qtyInput = linesEl.querySelector(`[data-qty="${line.id}"]`);
        if(qtyInput) qtyInput.oninput=(e)=>{ line.qty = e.target.value; };
        const costInput = linesEl.querySelector(`[data-unitcost="${line.id}"]`);
        if(costInput) costInput.oninput=(e)=>{ line.unitCost = e.target.value; };
        const removeBtn = linesEl.querySelector(`[data-remove-line="${line.id}"]`);
        if(removeBtn) removeBtn.onclick=()=>{
          if(lines.length===1) lines[0] = newLine();
          else lines = lines.filter(x=>x.id!==line.id);
          renderLines();
        };
      });
    }
    renderLines();
    wrap.querySelector("#puAddLine").onclick=()=>{ lines.push(newLine()); renderLines(); };

    wrap.querySelector("#puConfirm").onclick=()=>{
      const supplier = wrap.querySelector("#puSupplier").value.trim();
      const note = wrap.querySelector("#puNote").value.trim();
      if(!supplier) return alert("Enter the supplier");
      for(let i=0;i<lines.length;i++){
        const l = lines[i];
        const typed = l.product? l.product.name : l.query.trim();
        const qty = parseInt(l.qty)||0;
        const unitCost = parseFloat(l.unitCost);
        if(!typed) return alert(`Line ${i+1}: enter or select a product`);
        if(qty<1) return alert(`Line ${i+1}: enter a quantity of at least 1`);
        if(isNaN(unitCost) || unitCost<0) return alert(`Line ${i+1}: enter a valid unit cost`);
      }
      const ts = new Date().toISOString();
      const newProductNames = [];
      lines.forEach(l=>{
        const typed = l.product? l.product.name : l.query.trim();
        const qty = parseInt(l.qty)||0;
        const unitCost = parseFloat(l.unitCost)||0;
        const totalCost = qty*unitCost;
        let prod = l.product;
        if(!prod){
          prod = one("SELECT * FROM products WHERE branch=? AND lower(sku)=lower(?)",[branch,typed])
               || one("SELECT * FROM products WHERE branch=? AND lower(name)=lower(?)",[branch,typed]);
        }
        if(prod){
          run("UPDATE products SET stock=stock+?, cost=? WHERE id=?",[qty,unitCost,prod.id]);
        } else {
          run("INSERT INTO products(name,price,stock,low_threshold,sku,branch,image,cost,created_ts,description) VALUES(?,?,?,?,?,?,?,?,?,?)",
            [typed,0,qty,5,"",branch,"",unitCost,ts,""]);
          prod = { id: one("SELECT last_insert_rowid() as id").id, name: typed, sku:"" };
          newProductNames.push(typed);
        }
        run("INSERT INTO purchases(ts,branch,user,supplier,product_id,product_name,sku,qty,unit_cost,total_cost,note) VALUES(?,?,?,?,?,?,?,?,?,?,?)",
          [ts,branch,sessionUser||"",supplier,prod.id,prod.name,prod.sku||"",qty,unitCost,totalCost,note]);
        run("INSERT INTO stock_received(ts,product_id,name,qty,note,branch,user) VALUES(?,?,?,?,?,?,?)",
          [ts,prod.id,prod.name,qty,`Purchased from ${supplier}`,branch,sessionUser||""]);
      });
      logAudit("Record Purchase", "", `${lines.length} item${lines.length===1?"":"s"} from ${supplier}`);
      persist(); wrap.remove(); render();
      if(newProductNames.length) alert(`${newProductNames.join(", ")} ${newProductNames.length===1?"was":"were"} created with no selling price — set ${newProductNames.length===1?"it":"them"} via Edit on the Products page.`);
    };
  }
  function renderPurchasing(main){
    const branch = currentBranch();
    const seedMoney = parseFloat(getSetting("seed_money","0"))||0;
    const cogsRecovered = one(`SELECT COALESCE(SUM(si.cost*si.qty),0) as t FROM sale_items si JOIN sales s ON s.id=si.sale_id WHERE s.branch=?`,[branch]).t;
    const pctRecovered = seedMoney>0? (cogsRecovered/seedMoney*100) : null;
    const fullyRecovered = seedMoney>0 && cogsRecovered>=seedMoney;
    const purchases = all("SELECT * FROM purchases WHERE branch=? ORDER BY ts DESC LIMIT 200",[branch]);
    const groups = groupPurchases(purchases);
    main.innerHTML = `
      <div class="card">

  // Lines recorded together via recordPurchaseModal() share one ts+supplier,
  // which is the only signal we have to regroup them for display — there's
  // no separate "purchase batch" id in the schema.
  function groupPurchases(purchases){
    const groups = {}; const order = [];
    purchases.forEach(p=>{
      const key = p.ts+"|"+p.supplier;
      if(!groups[key]){ groups[key] = { ts:p.ts, supplier:p.supplier, note:p.note, items:[] }; order.push(key); }
      groups[key].items.push(p);
    });
    return order.map(k=>groups[k]);
  }

          if(granularity==="month") return ts.slice(0,7);
          if(granularity==="year") return ts.slice(0,4);
          if(granularity==="week"){
            // Simple Monday-start bucketing, computed off the date portion
            // only (as a local midnight) so it doesn't need to be strict
            // ISO-8601 or worry about UTC/local skew near midnight.
            const d = new Date(ts.slice(0,10)+"T00:00:00");
            const day = d.getDay();
            const diff = day===0? -6 : 1-day;
            d.setDate(d.getDate()+diff);
            const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), dd=String(d.getDate()).padStart(2,"0");
            return `${y}-${m}-${dd}`;
