  // ================== Business date (seed for licensing anti-rollback) ==================
  // No business-date concept existed anywhere in the app before this — every
  // date-sensitive screen (this one included) used the raw device clock
  // directly. This is the minimum necessary to stop the obvious "wind the
  // clock back a day to keep selling without closing EOD" bypass (Part 7):
  // a persisted high-water-mark that the business date can never fall
  // behind, even if the device clock does.
  //
  // This is NOT full anti-rollback protection — a device whose clock is
  // rolled back BEFORE the app ever observes the later date (e.g. changed
  // while the app is closed, before its next launch) isn't caught here;
  // that needs a trusted time source (network time, or a monotonic clock
  // survey) and is explicitly out of scope for this task. This function is
  // deliberately the seed for that later licensing/anti-rollback work, not
  // a replacement for it.
  function businessDateToday(now){
    now = now || new Date();
    const deviceDate = now.toISOString().slice(0,10);
    const hwm = getSetting("business_date_hwm","");
    const date = (hwm && hwm > deviceDate) ? hwm : deviceDate;
    if(date !== hwm){ setSetting("business_date_hwm", date); persist(); }
    return date;
  }

  // ================== License anti-rollback: trusted time ==================
  // This is the "later licensing/anti-rollback work" businessDateToday()'s
  // own comment above flags as its reason for existing. Same technique
  // (a persisted settings-table watermark the app's notion of "now" can
  // never fall behind, no matter what the device clock says), same file,
  // extended from day-granularity (all EOD/shift needs) to full-timestamp
  // precision, because licensing needs to tell ordinary clock drift (a few
  // minutes — never flagged) apart from an actual rollback or forward-jump
  // attempt. This is a second SETTING (trusted_time_hwm), not a second
  // MECHANISM — one settings table, one "persisted max wins" idea, used by
  // activation.js instead of a raw `new Date()` everywhere a licensing
  // decision is made.
  //
  // Also reuses the app's one existing audit trail (logAudit()/audit_log,
  // db.js) for anomaly records instead of a separate log, and its one
  // existing outbound network call primitive (fetch(), see sync.js's
  // supabaseInsert) as an authoritative time source when online — see
  // fetchNetworkTime()'s comment for exactly what "reuse" means here and
  // its real limits, which are also called out plainly in this task's
  // summary rather than overclaimed.

  const CLOCK_DRIFT_TOLERANCE_MS = 5*60*1000;         // ordinary NTP/manual clock drift — never flagged as an anomaly
  const CLOCK_FORWARD_JUMP_ANOMALY_MS = 45*86400000;  // beyond "device was switched off a while"; large enough that no legitimate offline gap this app expects should trip it, small enough to catch a trial-cycling forward jump
  const NETWORK_TIME_TIMEOUT_MS = 4000;               // never let a hung network probe delay boot — see fetchNetworkTime()

  function trustedTimeHwm(){
    const raw = getSetting("trusted_time_hwm","");
    return raw? new Date(raw) : null;
  }
  function setTrustedTimeHwm(d){ setSetting("trusted_time_hwm", d.toISOString()); }
  // Same shape/spirit as every other logAudit() call in this app (Shift
  // started, stock adjustments, ...) — product_name left blank because this
  // isn't a product event, exactly like those other non-product actions.
  function logClockAnomaly(kind, detail){ logAudit("Clock anomaly: "+kind, "", detail); }

  // The one choke point that advances/clamps trusted_time_hwm and records
  // an anomaly when `observed` doesn't line up with it. Pure aside from the
  // setSetting/logAudit side effects — never throws, never blocks anything
  // else. `trustedSource: true` means `observed` already came from a
  // corroborated server timestamp (fetchNetworkTime()): it's allowed to
  // advance the watermark past the forward-jump ceiling (a real server
  // response IS the authoritative source item 4 asks for — the ceiling
  // exists to distrust the DEVICE clock, not a verified server one), but it
  // can still never move the watermark backwards, same as any other source.
  function evaluateTrustedTime(observed, opts){
    observed = observed || new Date();
    const trustedSource = !!(opts && opts.trustedSource);
    const hwm = trustedTimeHwm();
    if(!hwm){ setTrustedTimeHwm(observed); return { time:observed, anomaly:null }; }
    const deltaMs = observed.getTime() - hwm.getTime();
    if(!trustedSource && deltaMs < -CLOCK_DRIFT_TOLERANCE_MS){
      logClockAnomaly("rollback", `Device time ${observed.toISOString()} is ${Math.round(-deltaMs/60000)} min behind the last trusted time ${hwm.toISOString()}`);
      return { time:hwm, anomaly:"rollback" }; // watermark wins — the trusted time never actually moves backwards
    }
    if(!trustedSource && deltaMs > CLOCK_FORWARD_JUMP_ANOMALY_MS){
      logClockAnomaly("forward_jump", `Device time ${observed.toISOString()} is ${Math.round(deltaMs/86400000)} days ahead of the last trusted time ${hwm.toISOString()}`);
      return { time:hwm, anomaly:"forward_jump" }; // don't trust an uncorroborated jump either — freeze at the watermark
    }
    if(deltaMs > 0){ setTrustedTimeHwm(observed); return { time:observed, anomaly:null }; }
    return { time:hwm, anomaly:null }; // not newer than the watermark (e.g. trivial negative drift from a trusted source) — keep it, no anomaly
  }

  // Attempts a server-corroborated timestamp using the exact same fetch()
  // call this app already makes for Supabase (sync.js's supabaseInsert) —
  // the only outbound network mechanism it has. Reads the response's Date
  // header, which every HTTP server sends, including Supabase's own
  // gateway. Real, plainly-stated limitation: a cross-origin fetch()'s
  // response headers are only readable in a browser if the server opts in
  // via Access-Control-Expose-Headers, which most gateways (Supabase's
  // included, by default) do not do for the Date header — so in practice
  // this often returns null, and the app correctly falls back to the local
  // high-water-mark below. It's still the right thing to attempt (it costs
  // nothing when it fails). It reuses cloud sync's Supabase project (built
  // in — see getSupabaseConfig in sync.js) rather than inventing a new
  // server to ask. Bounded by a short
  // timeout so a hung request can never delay boot.
  async function fetchNetworkTime(){
    if(!isOnline()) return null;
    const cfg = getSupabaseConfig();
    if(!cfg.url.trim()) return null;
    let timer=null;
    try{
      const ctrl = (typeof AbortController!=="undefined")? new AbortController() : null;
      if(ctrl) timer = setTimeout(()=>ctrl.abort(), NETWORK_TIME_TIMEOUT_MS);
      const res = await fetch(cfg.url.replace(/\/+$/,"")+"/rest/v1/", { method:"HEAD", cache:"no-store", signal: ctrl? ctrl.signal : undefined });
      const hdr = (res && res.headers && res.headers.get)? res.headers.get("date") : null;
      if(!hdr) return null;
      const d = new Date(hdr);
      return isNaN(d.getTime())? null : d;
    }catch(e){ return null; }
    finally{ if(timer) clearTimeout(timer); }
  }

  // Cached across the session so activation.js's synchronous checks
  // (activationStatus(), currentDeviceCode(), the unlock handler) all see
  // the SAME evaluated instant/anomaly this boot found, rather than each
  // re-running the async network probe. Set for real by establishTrustedTime()
  // (called once at boot, main.js — same spot/habit as businessDateToday()'s
  // own "as early as possible each session" call).
  let _lastClockCheck = null;
  async function establishTrustedTime(now){
    const netTime = await fetchNetworkTime();
    _lastClockCheck = netTime
      ? evaluateTrustedTime(netTime, { trustedSource:true })
      : evaluateTrustedTime(now || new Date());
    persist();
    return _lastClockCheck;
  }
  // The time any licensing decision must use instead of a raw `new Date()`.
  // If establishTrustedTime() hasn't run yet this session (a direct/test
  // call, or activationStatus() somehow reached before boot's await
  // resolves), this still routes through the same watermark-clamping logic
  // synchronously (device clock only, no network) — never bypasses it.
  function trustedNow(){
    if(!_lastClockCheck) _lastClockCheck = evaluateTrustedTime(new Date());
    return _lastClockCheck.time;
  }
  // What activation.js's lock screen reads to explain (Part 6: license/
  // activation state only, never a data lockout) when the CURRENT session's
  // check found the device clock rolled back or jumped — null the rest of
  // the time, including once a later, clean check supersedes it.
  function lastClockAnomaly(){ return _lastClockCheck? _lastClockCheck.anomaly : null; }

  // ================== Shift / EOD control ==================
  // Reuses eod_sessions (already existed as a one-row-per-count log; see
  // db.js) as the shift record — one row per (branch, business date),
  // status 'open' while trading, 'closed' once EOD is completed. No new
  // table. Operator attribution reuses currentStaff()/sessionStaffId from
  // the staff-PIN work: currentStaff() when PIN sign-in is active, else the
  // existing single-operator sessionUser — never a second identity concept.
  function oldestOpenShift(branch){
    return one("SELECT * FROM eod_sessions WHERE branch=? AND status='open' ORDER BY date LIMIT 1",[branch]);
  }
  function openShiftForDate(branch, date){
    return one("SELECT * FROM eod_sessions WHERE branch=? AND date=? AND status='open'",[branch,date]);
  }
  function eodOperatorName(){
    const staff = currentStaff();
    return staff? staff.name : (sessionUser||"");
  }
  function eodOperatorStaffId(){
    const staff = currentStaff();
    return staff? staff.id : null;
  }
  // "" = a sale may proceed; otherwise the plain reason to show the
  // operator. The one choke point both renderPOS and renderPOSDesktop (via
  // completeSale) go through — see pos.js.
  function shiftBlockReason(now){
    const branch = currentBranch();
    const today = businessDateToday(now);
    const stale = oldestOpenShift(branch);
    if(stale && stale.date<today) return `${stale.date}'s shift hasn't been completed yet. Go to Reports → End of Day, complete and print it, before making a new sale.`;
    if(!stale) return "Start a shift (declare your opening cash float) in Reports → End of Day before making a sale.";
    return "";
  }
  // Idempotent: re-calling with today's shift already open just returns it
  // (Part 8's "reopening the screen never creates duplicates" applies here
  // too, not just to completion).
  function startShift(openingFloat, now){
    const branch = currentBranch();
    const today = businessDateToday(now);
    const stale = oldestOpenShift(branch);
    if(stale && stale.date<today) throw new Error(`${stale.date}'s shift hasn't been completed yet. Complete and print it before starting a new one.`);
    if(stale && stale.date===today) return stale;
    const amt = parseFloat(openingFloat);
    if(isNaN(amt) || amt<0) throw new Error("Enter the opening cash float (0 or more)");
    const ts = (now||new Date()).toISOString();
    run(`INSERT INTO eod_sessions(date,branch,ts,status,opening_float,started_ts,started_by,started_staff_id)
         VALUES(?,?,?,'open',?,?,?,?)`,
      [today,branch,ts,amt,ts,eodOperatorName(),eodOperatorStaffId()]);
    logAudit("Shift started","",`Opening float ${currency}${amt.toFixed(2)}`);
    persist();
    return openShiftForDate(branch,today);
  }
  // Single source of truth for the reconciliation math (Part 4), shared by
  // the live preview and the actual completion, so what's shown is always
  // what gets recorded. Payouts already exist as a concept in this app
  // (the payouts table, used elsewhere for cash-drawer-outs) and are reused
  // exactly as-is — no Chart of Accounts/categorization is built here; that
  // stays the clearly-flagged next phase.
  // cash/ecocash/credit are read from sale_payments, not sales.total, so a
  // split-tender sale only contributes the portion actually paid by each
  // method — critical for "expected cash", which must never include a
  // non-cash tender line just because it shared a receipt with a cash one.
  // Every sale (split or not) has at least one sale_payments row (see
  // pos.js completeSale), so this is exactly equivalent to the old
  // sales.total-based sums for any sale that was never split.
  function eodTotalsFor(branch, date, openingFloat){
    const daySales = all("SELECT * FROM sales WHERE branch=? AND ts LIKE ?",[branch,date+"%"]);
    const saleIds = daySales.map(s=>s.id);
    const dayPayments = saleIds.length
      ? all(`SELECT * FROM sale_payments WHERE sale_id IN (${saleIds.map(()=>"?").join(",")})`, saleIds)
      : [];
    const sumMethod = (m)=> dayPayments.filter(p=>p.method===m).reduce((s,r)=>s+r.amount,0);
    const cash = sumMethod("Cash");
    const ecocash = sumMethod("EcoCash");
    const credit = sumMethod("Credit");
    const discounts = daySales.reduce((s,r)=>s+(r.discount||0),0);
    const totalSales = cash+ecocash+credit;
    const payouts = all("SELECT * FROM payouts WHERE branch=? AND ts LIKE ? ORDER BY ts",[branch,date+"%"]);
    const payoutsTotal = payouts.reduce((s,r)=>s+r.amount,0);
    const expected = (openingFloat||0) + cash - payoutsTotal; // opening float + cash sales - payouts = expected cash
    // Multi-Currency Support (item 5): `cash` above stays the blended
    // base-currency-equivalent figure `expected` is built from — unchanged.
    // This is purely an additional breakdown so a till count can be
    // reconciled physically, per currency, using `tendered` (the actual
    // banknotes handed over) rather than each currency's base-equivalent.
    const byCurrency = {};
    dayPayments.filter(p=>p.method==="Cash").forEach(p=>{
      const code = p.currency || BASE_CURRENCY_CODE;
      if(!byCurrency[code]) byCurrency[code] = { currency:code, tendered:0, amount:0 };
      byCurrency[code].tendered += (p.tendered_amount==null? p.amount : p.tendered_amount);
      byCurrency[code].amount += p.amount;
    });
    const cashByCurrency = Object.keys(byCurrency).sort().map(code=>({
      currency: code,
      symbol: currencySymbolFor(code),
      name: currencyNameFor(code),
      tendered: roundMoney(byCurrency[code].tendered),
      amount: roundMoney(byCurrency[code].amount),
    }));
    return { cash, ecocash, credit, discounts, totalSales, payouts, payoutsTotal, expected, cashByCurrency };
  }
  // Closes whichever shift is open (today's, or an older unresolved one
  // being caught up on) — idempotent: once closed, oldestOpenShift() no
  // longer finds it, so calling this again throws instead of writing a
  // second row (Part 8).
  function completeEOD(countedCash, notes, now){
    const branch = currentBranch();
    const shift = oldestOpenShift(branch);
    if(!shift) throw new Error("There's no open shift to complete.");
    const counted = parseFloat(countedCash);
    if(isNaN(counted)) throw new Error("Enter the counted cash amount");
    const totals = eodTotalsFor(branch, shift.date, shift.opening_float);
    const variance = counted-totals.expected;
    const ts = (now||new Date()).toISOString();
    run(`UPDATE eod_sessions SET status='closed', expected_cash=?, counted_cash=?, variance=?, notes=?, closed_ts=?, closed_by=?, closed_staff_id=? WHERE id=?`,
      [totals.expected,counted,variance,notes||"",ts,eodOperatorName(),eodOperatorStaffId(),shift.id]);
    logAudit("EOD completed","",`Expected ${currency}${totals.expected.toFixed(2)}, counted ${currency}${counted.toFixed(2)}, variance ${currency}${variance.toFixed(2)}`);
    persist();
    return one("SELECT * FROM eod_sessions WHERE id=?",[shift.id]);
  }
  function markEodPrinted(shiftId, now){
    run("UPDATE eod_sessions SET printed_ts=? WHERE id=?",[(now||new Date()).toISOString(),shiftId]);
    persist();
  }
  // Shapes a shift + its totals into the `summary` object printing.js's
  // buildEODBytes/printEOD already expect — only addition is openingFloat.
  function eodPrintSummary(shift, totals, lowStock, counted){
    const c = counted===undefined? (shift.counted_cash||0) : counted;
    return { date:shift.date, cash:totals.cash, ecocash:totals.ecocash, credit:totals.credit, discounts:totals.discounts,
      totalSales:totals.totalSales, payouts:totals.payouts, payoutsTotal:totals.payoutsTotal, openingFloat:shift.opening_float||0,
      expected:totals.expected, counted:c, variance:c-totals.expected, lowStock, cashByCurrency:totals.cashByCurrency||[] };
  }
  function eodWhatsAppText(summary){
    const itemLines = [
      padLine("Opening Float", `${currency}${summary.openingFloat.toFixed(2)}`),
      padLine("Sales Cash", `${currency}${summary.cash.toFixed(2)}`),
      // Only shown once more than one currency was actually taken as cash —
      // a base-currency-only shop's EOD message reads exactly as before.
      ...((summary.cashByCurrency||[]).length>1
        ? summary.cashByCurrency.map(r=>padLine(`  ${r.currency} cash`, `${r.symbol}${r.tendered.toFixed(2)}`))
        : []),
      padLine("Sales EcoCash", `${currency}${summary.ecocash.toFixed(2)}`),
      padLine("Sales Credit", `${currency}${summary.credit.toFixed(2)}`),
      padLine("Less: Discounts", `-${currency}${summary.discounts.toFixed(2)}`),
      padLine("Payouts", `-${currency}${summary.payoutsTotal.toFixed(2)}`)
    ];
    const totalLines = [
      padLine("Total Sales", `${currency}${summary.totalSales.toFixed(2)}`),
      padLine("Expected Cash", `${currency}${summary.expected.toFixed(2)}`),
      padLine("Cash Count", `${currency}${summary.counted.toFixed(2)}`),
      padLine("Variance", `${currency}${summary.variance.toFixed(2)}`),
      "", `Low stock: ${summary.lowStock.map(p=>p.name).join(", ")||"None"}`
    ];
    return receiptText(`${escapeHtml(getSetting("shop_name",""))} — EOD ${summary.date}`, itemLines, totalLines);
  }

  // Advisory only — completeSale() is what actually enforces the block.
  // Shared by renderPOS (pos.js) and renderPOSDesktop (desktop/sales-
  // desktop.js, Tauri only) so a cashier finds out before filling a cart,
  // not only at checkout, without either screen duplicating the rule.
  function shiftBlockBannerHtml(){
    const reason = shiftBlockReason();
    if(!reason) return "";
    return `<div class="card" style="border-color:var(--danger,#c0392b);margin-bottom:10px">
      <p style="margin:0 0 8px;font-weight:700">${escapeHtml(reason)}</p>
      <button class="btn btn-outline" id="goToEodBtn">Go to End of Day</button>
    </div>`;
  }
  function wireShiftBlockBanner(){
    const btn = document.getElementById("goToEodBtn");
    if(btn) btn.onclick=()=>{ route="reports"; render(); };
  }

  function renderEOD(main){
    const branch = currentBranch();
    const now = new Date();
    const today = businessDateToday(now);
    const shift = oldestOpenShift(branch);
    if(!shift) return renderStartShiftCard(main, branch, today);
    renderShiftReconciliation(main, branch, shift, today);
  }

  function renderStartShiftCard(main, branch, today){
    const lastClosed = one("SELECT * FROM eod_sessions WHERE branch=? AND date=? AND status='closed' ORDER BY closed_ts DESC LIMIT 1",[branch,today]);
    main.innerHTML = `
      ${lastClosed? `
        <div class="card">
          <h3>Today's End of Day is complete</h3>
          <p class="muted">Closed ${lastClosed.closed_ts? new Date(lastClosed.closed_ts).toLocaleString() : ""} by ${escapeHtml(lastClosed.closed_by||"—")}.</p>
          <div class="subline"><span>Opening float</span><span>${currency}${(lastClosed.opening_float||0).toFixed(2)}</span></div>
          <div class="subline"><span>Expected cash</span><span>${currency}${(lastClosed.expected_cash||0).toFixed(2)}</span></div>
          <div class="subline"><span>Counted cash</span><span>${currency}${(lastClosed.counted_cash||0).toFixed(2)}</span></div>
          <div class="subline" style="font-weight:700"><span>Variance</span><span style="color:${(lastClosed.variance||0)<0?'var(--danger)':'var(--success)'}">${currency}${(lastClosed.variance||0).toFixed(2)}</span></div>
          <button class="btn btn-outline" id="reprintClosedEodBtn" style="margin-top:10px">🖨️ Print / PDF again</button>
        </div>` : ""}
      <div class="card">
        <h3>Start Shift — ${today}</h3>
        <p class="muted">Declare the opening cash float counted into the drawer before selling can begin${lastClosed? " again":""}. Recorded against you, timestamped.</p>
        <label>Opening float (${currency})</label>
        <input class="field" id="openingFloat" type="number" step="0.01" placeholder="0.00">
        <button class="btn btn-primary" id="startShiftBtn" style="margin-top:12px">Start Shift</button>
      </div>
    `;
    const reprint = document.getElementById("reprintClosedEodBtn");
    if(reprint) reprint.onclick=()=>{
      const totals = eodTotalsFor(branch, lastClosed.date, lastClosed.opening_float);
      const lowStock = all("SELECT * FROM products WHERE branch=? AND stock<=low_threshold ORDER BY stock",[branch]);
      printEOD(eodPrintSummary(lastClosed, totals, lowStock));
      markEodPrinted(lastClosed.id);
    };
    document.getElementById("startShiftBtn").onclick=()=>{
      try{ startShift(document.getElementById("openingFloat").value); }
      catch(e){ return alert(e.message||String(e)); }
      render();
    };
  }

  function renderShiftReconciliation(main, branch, shift, today){
    const totals = eodTotalsFor(branch, shift.date, shift.opening_float);
    const lowStock = all("SELECT * FROM products WHERE branch=? AND stock<=low_threshold ORDER BY stock",[branch]);
    const isStale = shift.date<today;
    main.innerHTML = `
      ${isStale? `<div class="card" style="border-color:var(--danger,#c0392b)">
        <p style="margin:0;font-weight:700">This shift is from ${shift.date} and must be completed before ${today}'s sales can continue.</p>
      </div>` : ""}
      <h2>End of Day — ${shift.date}</h2>
      <div class="card">
        <div class="subline"><span>Opening float</span><span>${currency}${(shift.opening_float||0).toFixed(2)}</span></div>
        <div class="subline"><span>Sales Cash</span><span>${currency}${totals.cash.toFixed(2)}</span></div>
        ${(totals.cashByCurrency||[]).length>1? `<div style="padding-left:12px;margin-bottom:2px">
          ${totals.cashByCurrency.map(r=>`<div class="subline" style="font-size:12px"><span>${escapeHtml(r.currency)} cash</span><span>${escapeHtml(r.symbol)}${r.tendered.toFixed(2)} <span class="muted">(≈ ${currency}${r.amount.toFixed(2)})</span></span></div>`).join("")}
        </div>` : ""}
        <div class="subline"><span>Sales EcoCash</span><span>${currency}${totals.ecocash.toFixed(2)}</span></div>
        <div class="subline"><span>Sales Credit</span><span>${currency}${totals.credit.toFixed(2)}</span></div>
        <div class="subline"><span>Less: Discounts</span><span>-${currency}${totals.discounts.toFixed(2)}</span></div>
        <div class="hr" style="margin:8px 0"></div>
        <div class="total-line"><span>Total Sales</span><span>${currency}${totals.totalSales.toFixed(2)}</span></div>
        <p class="muted" style="font-size:12px;margin-top:6px">Shift started ${shift.started_ts? new Date(shift.started_ts).toLocaleString():""} by ${escapeHtml(shift.started_by||"—")}.</p>
      </div>

      <div class="card">
        <h3>Payouts today</h3>
        ${totals.payouts.length===0?`<p class="muted">None recorded</p>`:
          totals.payouts.map(p=>`<div class="subline"><span>${escapeHtml(p.reason||"Payout")}</span><span>-${currency}${p.amount.toFixed(2)}</span></div>`).join("")}
        <div class="subline" style="font-weight:700"><span>Total payouts</span><span>-${currency}${totals.payoutsTotal.toFixed(2)}</span></div>
        <button class="btn btn-outline" id="openAddPayout" style="margin-top:10px">+ Add Payout</button>
      </div>

      <div class="card">
        <h3>Blind cash count</h3>
        <p class="muted">Opening float + cash sales − payouts = expected cash. Count the drawer and enter the amount — expected cash stays hidden until you submit.</p>
        <label>Cash counted (${currency})</label>
        <input class="field" id="counted" type="number" step="0.01" placeholder="0.00">
        <button class="btn btn-primary" id="submitCount" style="margin-top:12px">Complete EOD</button>
        <div id="varianceResult"></div>
      </div>

      <div class="card">
        <h3>Low stock (${lowStock.length})</h3>
        ${lowStock.length===0? `<p class="muted">All good — nothing low.</p>` :
          lowStock.map(p=>`<div class="product-row"><div class="pname">${escapeHtml(p.name)}</div><span class="pill low">${p.stock} left</span></div>`).join("")}
      </div>
    `;
    document.getElementById("openAddPayout").onclick=()=>payoutModal(()=>render());

    // Printing/sharing only becomes available once EOD is actually
    // completed (see file header on "completes and prints") — the buttons
    // are injected here rather than shown upfront, and always act on the
    // just-closed record so what's printed always matches what's stored.
    document.getElementById("submitCount").onclick=()=>{
      const countedVal = document.getElementById("counted").value;
      let completed;
      try{ completed = completeEOD(countedVal, ""); }
      catch(e){ return alert(e.message||String(e)); }
      const variance = completed.variance;
      const summary = eodPrintSummary(completed, totals, lowStock, completed.counted_cash);
      document.getElementById("varianceResult").innerHTML = `
        <div class="hr"></div>
        <div class="row">
          <div><div class="muted">Expected</div><b>${currency}${completed.expected_cash.toFixed(2)}</b></div>
          <div><div class="muted">Counted</div><b>${currency}${completed.counted_cash.toFixed(2)}</b></div>
          <div><div class="muted">Variance</div><b style="color:${variance<0?'var(--danger)':'var(--success)'}">${currency}${variance.toFixed(2)}</b></div>
        </div>
        <p class="muted" style="margin-top:8px">Shift closed. Print or share this report, then Sell unlocks for the next business day.</p>
        <div class="row" style="margin-top:10px">
          <button class="btn btn-outline" id="printEodBtn">🖨️ Print / PDF</button>
          <button class="btn btn-ghost" id="waEodBtn">📲 WhatsApp</button>
          ${hasUSBPrint()? `<button class="btn btn-outline" id="usbEodBtn" style="flex:none;width:auto;padding:12px">🔌</button>` : ""}
          ${hasBTPrint()? `<button class="btn btn-outline" id="btEodBtn" style="flex:none;width:auto;padding:12px">🔵</button>` : ""}
        </div>`;
      document.getElementById("submitCount").disabled = true;
      document.getElementById("counted").disabled = true;
      document.getElementById("printEodBtn").onclick=()=>{ printEOD(summary); markEodPrinted(completed.id); };
      document.getElementById("waEodBtn").onclick=()=>{ shareWhatsApp(eodWhatsAppText(summary)); markEodPrinted(completed.id); };
      const usbBtn = document.getElementById("usbEodBtn");
      if(usbBtn) usbBtn.onclick=()=>{ usbPrintEODBytes(summary); markEodPrinted(completed.id); };
      const btBtn = document.getElementById("btEodBtn");
      if(btBtn) btBtn.onclick=()=>{ btPrintEODBytes(summary); markEodPrinted(completed.id); };
    };
  }

  function branchSelectHtml(id, defaultValue){
    const branches = listBranches();
    const sel = defaultValue===undefined ? currentBranch() : defaultValue;
    return `<select class="field" id="${id}">
      <option value="" ${sel===""?"selected":""}>All branches</option>
      ${branches.map(b=>`<option value="${escapeHtml(b)}" ${b===sel?"selected":""}>${escapeHtml(b)}</option>`).join("")}
    </select>`;
  }

      </div>` : "";
    return `<div class="rep-head"><h3 class="rep-title">${title}</h3>${menu}</div>`;
  }

      <div class="card" data-report-name="Aging Inventory">

      </div>
    `;
    renderEOD(document.getElementById("eodSection"));
    document.getElementById("reportsLogRequestBtn").onclick=()=>openRequestsDrawer();

    // Filters which report-generator CARDS are shown by title — purely a
    // display:none toggle over cards already in the DOM, so it never
    // touches Report Writer (a separate page/state, rwType etc.) and never
    // re-renders (so none of the onclick wiring below needs re-binding).
    function applyReportsFilter(){
      const cards = main.querySelectorAll("[data-report-name]");
      let anyVisible = false;
      cards.forEach(c=>{
        const match = matchesAnyOrder(reportsQuery, c.dataset.reportName);
        c.style.display = match? "" : "none";
        if(match) anyVisible = true;
      });
      document.getElementById("reportsNoMatch").style.display = anyVisible? "none" : "";
    }
    document.getElementById("reportsSearch").oninput=(e)=>{ reportsQuery = e.target.value; applyReportsFilter(); };
    applyReportsFilter();

    function branchFilter(id){ const v=document.getElementById(id).value; return v||null; }
    function agingBucket(days){
      if(days<15) return "0-15 days";
      if(days<30) return "15-30 days";
      if(days<60) return "30-60 days";
      if(days<90) return "60-90 days";
      return "90+ days";
    }
    function productAgeDays(p){
      const lastReceived = one("SELECT MAX(ts) as t FROM stock_received WHERE product_id=? AND qty>0 AND adj_no IS NULL",[p.id]);
      const ref = (lastReceived && lastReceived.t) ? lastReceived.t : (p.created_ts||new Date().toISOString());
      return Math.max(0, daysBetween(new Date(ref), new Date()));
    }
    // Quick-access preset menus: sets a card's date range then triggers its
    // own Generate button, so common variants are one tap instead of four.
    function applyPreset(fromId, toId, key){
      const now = new Date();
      let from = new Date(now), to = new Date(now);
      if(key==="week"){ from.setDate(now.getDate()-6); }
      else if(key==="month"){ from = new Date(now.getFullYear(), now.getMonth(), 1); }
      document.getElementById(fromId).value = from.toISOString().slice(0,10);
      document.getElementById(toId).value = to.toISOString().slice(0,10);
    }
    const PRESET_TARGETS = {
      sales:["salesFrom","salesTo","genSales"], stock:["stockFrom","stockTo","genStock"],
      credit:["creditFrom","creditTo","genCredit"], disc:["discFrom","discTo","genDiscount"],
      margin:["marginFrom","marginTo","genMargin"], fast:["fastFrom","fastTo","genFast"],
      payout:["payoutFrom","payoutTo","genPayoutReport"], branch:["brFrom","brTo","genBranchReport"],
    };
    main.querySelectorAll("[data-preset]").forEach(btn=>{
      btn.onclick=()=>{
        const [cardKey,presetKey] = btn.dataset.preset.split(":");
        const target = PRESET_TARGETS[cardKey];
        if(!target) return;
        applyPreset(target[0], target[1], presetKey);
        document.getElementById("menu-"+cardKey).style.display="none";
        document.getElementById(target[2]).click();
      };
    });


    document.getElementById("genSales").onclick=()=>{
      const {fromTs,toTs} = dateRangeSQL("salesFrom","salesTo");
      const b = branchFilter("salesBranch");
      const sales = b? all("SELECT * FROM sales WHERE branch=? AND ts>=? AND ts<=? ORDER BY ts",[b,fromTs,toTs])
                      : all("SELECT * FROM sales WHERE ts>=? AND ts<=? ORDER BY ts",[fromTs,toTs]);
      const rows = sales.map(s=>[new Date(s.ts).toLocaleString(), escapeHtml(s.branch||""), s.method, escapeHtml(s.doc_ref||""), currency+s.subtotal.toFixed(2), currency+s.discount.toFixed(2), currency+s.total.toFixed(2)]);
      const grand = sales.reduce((s,r)=>s+r.total,0);
      // Payment-method breakdown (item 6): sourced from sale_payments via
      // paymentMethodTotals (pos.js) so a split sale's Cash/EcoCash/Credit
      // lines are isolated the same way EOD reconciliation isolates them,
      // rather than bucketing the whole sale under one method.
      const breakdown = paymentMethodTotals(b, fromTs, toTs);
      const breakdownHtml = breakdown.length? `
        <h3 class="section">By Payment Method</h3>
        <table><tr><th>Method</th><th>Total</th></tr>
        ${breakdown.map(r=>`<tr><td>${escapeHtml(r.method)}</td><td>${currency}${r.total.toFixed(2)}</td></tr>`).join("")}
        </table>` : "";
      // Item 6: an additional currency-level table, only shown when tender
      // actually happened in more than the base currency — a base-only
      // shop's Sales Report is otherwise identical to before this feature.
      const currencyRows = paymentMethodCurrencyTotals(b, fromTs, toTs);
      const currencyHtml = currencyRows.some(r=>r.currency!==BASE_CURRENCY_CODE)? `
        <h3 class="section">By Payment Method &amp; Currency</h3>
        <table><tr><th>Method</th><th>Currency</th><th>Tendered</th><th>${currency} Equivalent</th></tr>
        ${currencyRows.map(r=>`<tr><td>${escapeHtml(r.method)}</td><td>${escapeHtml(r.currency===BASE_CURRENCY_CODE?"Base":r.currency)}</td><td>${escapeHtml(r.symbol)}${r.tendered.toFixed(2)}</td><td>${currency}${r.total.toFixed(2)}</td></tr>`).join("")}
        </table>` : "";
      printReport("Sales Report", `${b||"All branches"} · ${fromTs.slice(0,10)} to ${toTs.slice(0,10)}`,
        ["Date/Time","Branch","Method","Doc Ref","Subtotal","Discount","Total"], rows,
        `<p><b>Grand Total: ${currency}${grand.toFixed(2)}</b></p>${breakdownHtml}${currencyHtml}`);
    };
    document.getElementById("waSales").onclick=()=>{
      const {fromTs,toTs} = dateRangeSQL("salesFrom","salesTo");
      const b = branchFilter("salesBranch");
      const sales = b? all("SELECT * FROM sales WHERE branch=? AND ts>=? AND ts<=? ORDER BY ts",[b,fromTs,toTs])
                      : all("SELECT * FROM sales WHERE ts>=? AND ts<=? ORDER BY ts",[fromTs,toTs]);
      const grand = sales.reduce((s,r)=>s+r.total,0);
      const itemLines = sales.slice(0,40).map(s=>padLine(`${s.ts.slice(0,16)} ${s.branch} ${s.method}`, `${currency}${s.total.toFixed(2)}`));
      shareWhatsApp(receiptText(`Sales Report (${b||"All branches"})`, itemLines, [padLine("TOTAL", `${currency}${grand.toFixed(2)}`)]));
    };

    document.getElementById("genInventory").onclick=()=>{
      const b = branchFilter("invBranch");
      const products = b? all("SELECT * FROM products WHERE branch=? ORDER BY name",[b]) : all("SELECT * FROM products ORDER BY branch,name");
      const rows = products.map(p=> b? [skuNameCell(p.sku,p.name), p.stock] : [skuNameCell(p.sku,p.name), escapeHtml(p.branch), p.stock]);
      const headers = b? ["Item","Qty"] : ["Item","Branch","Qty"];
      printReport("Inventory Report", `${b||"All branches"}`, headers, rows, "");
    };

    document.getElementById("genStock").onclick=()=>{
      const {fromTs,toTs} = dateRangeSQL("stockFrom","stockTo");
      const b = branchFilter("stockBranch");
      const recs = b? all("SELECT * FROM stock_received WHERE branch=? AND ts>=? AND ts<=? ORDER BY ts",[b,fromTs,toTs])
                     : all("SELECT * FROM stock_received WHERE ts>=? AND ts<=? ORDER BY ts",[fromTs,toTs]);
      const rows = recs.map(r=> b? [new Date(r.ts).toLocaleString(), escapeHtml(r.name), r.qty, escapeHtml(r.note||"")]
                                  : [new Date(r.ts).toLocaleString(), escapeHtml(r.branch), escapeHtml(r.name), r.qty, escapeHtml(r.note||"")]);
      const headers = b? ["Date/Time","Product","Qty","Note"] : ["Date/Time","Branch","Product","Qty","Note"];
      const totalQty = recs.reduce((s,r)=>s+r.qty,0);
      printReport("Stock Received Report", `${b||"All branches"} · ${fromTs.slice(0,10)} to ${toTs.slice(0,10)}`, headers, rows, `<p><b>Total units received: ${totalQty}</b></p>`);
    };

    document.getElementById("genLowStock").onclick=()=>{
      const b = branchFilter("lowBranch");
      const lowStock = b? all("SELECT * FROM products WHERE branch=? AND stock<=low_threshold ORDER BY stock",[b])
                         : all("SELECT * FROM products WHERE stock<=low_threshold ORDER BY branch,stock");
      const rows = lowStock.map(p=> b? [skuNameCell(p.sku,p.name), p.stock, p.low_threshold] : [skuNameCell(p.sku,p.name), escapeHtml(p.branch), p.stock, p.low_threshold]);
      const headers = b? ["Item","Current Stock","Alert Level"] : ["Item","Branch","Current Stock","Alert Level"];
      printReport("Low Stock Report", `${b||"All branches"} · ${new Date().toLocaleDateString()}`, headers, rows, "");
    };

    document.getElementById("genCredit").onclick=()=>{
      const {fromTs,toTs} = dateRangeSQL("creditFrom","creditTo");
      const b = branchFilter("creditBranch");
      const customers = all("SELECT * FROM customers ORDER BY name");
      const rows = [];
      let totalDebt=0, totalPaid=0;
      customers.forEach(c=>{
        // Credit portion only (sale_payments), not the whole sale total —
        // a Cash+Credit split sale must only count what was actually put
        // on account, same fix as customerBalance() in pos.js.
        const debt = b? one("SELECT COALESCE(SUM(sp.amount),0) as t FROM sale_payments sp JOIN sales s ON s.id=sp.sale_id WHERE s.customer_id=? AND sp.method='Credit' AND s.branch=? AND s.ts>=? AND s.ts<=?",[c.id,b,fromTs,toTs]).t
                       : one("SELECT COALESCE(SUM(sp.amount),0) as t FROM sale_payments sp JOIN sales s ON s.id=sp.sale_id WHERE s.customer_id=? AND sp.method='Credit' AND s.ts>=? AND s.ts<=?",[c.id,fromTs,toTs]).t;
        const paid = b? one("SELECT COALESCE(SUM(amount),0) as t FROM credit_payments WHERE customer_id=? AND branch=? AND ts>=? AND ts<=?",[c.id,b,fromTs,toTs]).t
                       : one("SELECT COALESCE(SUM(amount),0) as t FROM credit_payments WHERE customer_id=? AND ts>=? AND ts<=?",[c.id,fromTs,toTs]).t;
        const balance = customerBalance(c.id);
        if(debt>0 || paid>0){
          rows.push([escapeHtml(c.name), currency+debt.toFixed(2), currency+paid.toFixed(2), currency+balance.toFixed(2)]);
          totalDebt+=debt; totalPaid+=paid;
        }
      });
      printReport("Credit Sales Report", `${b||"All branches"} · ${fromTs.slice(0,10)} to ${toTs.slice(0,10)}`,
        ["Customer","Credit Given","Payments","Current Balance"], rows,
        `<p><b>Period totals — Credit: ${currency}${totalDebt.toFixed(2)} | Payments: ${currency}${totalPaid.toFixed(2)}</b></p>`);
    };

    document.getElementById("genDiscount").onclick=()=>{
      const {fromTs,toTs} = dateRangeSQL("discFrom","discTo");
      const b = branchFilter("discBranch");
      const sales = (b? all("SELECT * FROM sales WHERE branch=? AND discount>0 AND ts>=? AND ts<=? ORDER BY ts",[b,fromTs,toTs])
                      : all("SELECT * FROM sales WHERE discount>0 AND ts>=? AND ts<=? ORDER BY ts",[fromTs,toTs]));
      const rows = sales.map(s=>{
        const cust = s.customer_id? one("SELECT name FROM customers WHERE id=?",[s.customer_id]) : null;
        return [new Date(s.ts).toLocaleString(), escapeHtml(String(s.receipt_no||s.id)), escapeHtml(cust?cust.name:"—"), currency+s.subtotal.toFixed(2),
          currency+s.discount.toFixed(2), currency+s.total.toFixed(2), escapeHtml(s.discount_reason||""),
          escapeHtml(s.discount_status||"")];
      });
      const totalDisc = sales.reduce((s,r)=>s+r.discount,0);
      printReport("Discount Report", `${b||"All branches"} · ${fromTs.slice(0,10)} to ${toTs.slice(0,10)}`,
        ["Date","Receipt#","Customer","Amount","Discount","Cash Paid","Reason","Status"], rows,
        `<p><b>Total discounts given: ${currency}${totalDisc.toFixed(2)}</b></p>`);
    };

    const marginBtn = document.getElementById("genMargin");
    if(marginBtn) marginBtn.onclick=()=>{
      const {fromTs,toTs} = dateRangeSQL("marginFrom","marginTo");
      const b = branchFilter("marginBranch");
      const items = b? all(`SELECT si.* FROM sale_items si JOIN sales s ON s.id=si.sale_id WHERE s.branch=? AND s.ts>=? AND s.ts<=?`,[b,fromTs,toTs])
                      : all(`SELECT si.* FROM sale_items si JOIN sales s ON s.id=si.sale_id WHERE s.ts>=? AND s.ts<=?`,[fromTs,toTs]);
      const byName = {};
      items.forEach(i=>{
        if(!byName[i.name]) byName[i.name]={qty:0,revenue:0,cost:0};
        byName[i.name].qty += i.qty;
        byName[i.name].revenue += i.price*i.qty;
        byName[i.name].cost += (i.cost||0)*i.qty;
      });
      let totalRev=0, totalCost=0;
      const rows = Object.keys(byName).sort().map(name=>{
        const r = byName[name]; const margin = r.revenue-r.cost;
        const pct = r.revenue>0? (margin/r.revenue*100).toFixed(1)+"%" : "—";
        totalRev+=r.revenue; totalCost+=r.cost;
        return [escapeHtml(name), r.qty, currency+r.revenue.toFixed(2), currency+r.cost.toFixed(2), currency+margin.toFixed(2), pct];
      });
      const totalMargin = totalRev-totalCost;
      const totalPct = totalRev>0? (totalMargin/totalRev*100).toFixed(1)+"%" : "—";
      printReport("Margin Report", `${b||"All branches"} · ${fromTs.slice(0,10)} to ${toTs.slice(0,10)}`,
        ["Item","Qty Sold","Revenue","Cost","Margin","Margin %"], rows,
        `<p><b>Total — Revenue: ${currency}${totalRev.toFixed(2)} | Cost: ${currency}${totalCost.toFixed(2)} | Margin: ${currency}${totalMargin.toFixed(2)} (${totalPct})</b></p>`);
    };

    document.getElementById("genAging").onclick=()=>{
      const b = branchFilter("agingBranch");
      const products = b? all("SELECT * FROM products WHERE branch=? ORDER BY name",[b]) : all("SELECT * FROM products ORDER BY branch,name");
      const rows = products.map(p=>{
        const days = productAgeDays(p);
        return b? [skuNameCell(p.sku,p.name), p.stock, days, agingBucket(days)]
                : [skuNameCell(p.sku,p.name), escapeHtml(p.branch), p.stock, days, agingBucket(days)];
      });
      const headers = b? ["Item","Stock","Days","Bucket"] : ["Item","Branch","Stock","Days","Bucket"];
      printReport("Aging Inventory", `${b||"All branches"} · as of ${new Date().toLocaleDateString()}`, headers, rows, "");
    };

    document.getElementById("genFast").onclick=()=>{
      const {fromTs,toTs} = dateRangeSQL("fastFrom","fastTo");
      const b = branchFilter("fastBranch");
      const items = b? all(`SELECT si.name, si.qty, si.price FROM sale_items si JOIN sales s ON s.id=si.sale_id WHERE s.branch=? AND s.ts>=? AND s.ts<=?`,[b,fromTs,toTs])
                      : all(`SELECT si.name, si.qty, si.price FROM sale_items si JOIN sales s ON s.id=si.sale_id WHERE s.ts>=? AND s.ts<=?`,[fromTs,toTs]);
      const byName = {};
      items.forEach(i=>{ if(!byName[i.name]) byName[i.name]={qty:0,revenue:0}; byName[i.name].qty+=i.qty; byName[i.name].revenue+=i.price*i.qty; });

  // ---------------- Stocktake ----------------
  // One open stocktake per branch at a time. Counting is deliberately blind
  // (system_qty is never shown while counting, same principle as the EOD
  // cash count) so staff aren't biased toward matching what the system
  // expects. Cutting off closes the count and produces a variance report;
  // applying the counts to live stock is a separate, explicitly-confirmed step.
  function renderStocktake(main){
    if(stocktakeReportId) return renderStocktakeReport(main, stocktakeReportId);
    // Stocktakes are per-branch, and a device can have more than one open at
    // once (e.g. for two branches whose data has been merged onto it). Only
    // auto-jump into counting when there's exactly one open take — otherwise
    // show the list so the user picks which one to continue.
    const openTakes = all("SELECT * FROM stocktakes WHERE status='Open' ORDER BY created_ts");
    if(openTakes.length===1) return renderStocktakeCounting(main, openTakes[0]);
    renderStocktakeList(main);
  }
  function renderStocktakeList(main){
    const openTakes = all("SELECT * FROM stocktakes WHERE status='Open' ORDER BY created_ts");
    const past = all("SELECT * FROM stocktakes WHERE status='Closed' ORDER BY cutoff_ts DESC");

      <h3>Past Stocktakes</h3>

          <div>
            <div style="font-weight:700">${escapeHtml(s.branch)}</div>
            <div class="muted">${escapeHtml(s.start_date)}${s.end_date?` – ${escapeHtml(s.end_date)}`:""} · Team: ${escapeHtml(s.team_names||"—")} · Closed ${s.cutoff_ts? new Date(s.cutoff_ts).toLocaleDateString() : "—"}</div>

    document.getElementById("startStocktake").onclick=()=>startStocktakeModal();
    main.querySelectorAll("[data-continue-take]").forEach(b=>{
      b.onclick=()=>{ const take = one("SELECT * FROM stocktakes WHERE id=?",[+b.dataset.continueTake]); renderStocktakeCounting(main, take); };

    main.querySelectorAll("[data-view-take]").forEach(b=>{
      b.onclick=()=>{ stocktakeReportId = +b.dataset.viewTake; render(); };

  function startStocktakeModal(){
    const today = new Date().toISOString().slice(0,10);
    const wrap = openModal("Start Stocktake", `
      <label>Branch</label>${branchSelectHtml("stBranch", currentBranch())}
      <label>Team names</label>
      <input class="field" id="stTeam" placeholder="e.g. Tapiwa, Rudo">
      <label>Start date</label>
      <input class="field" id="stStart" type="date" value="${today}">
      <label>End date (optional estimate)</label>
      <input class="field" id="stEnd" type="date">
      <p class="muted" id="stWarning" style="color:var(--danger)"></p>
      <button class="btn btn-primary" id="stConfirm" style="margin-top:12px">Start</button>
    `);
    const branchSel = wrap.querySelector("#stBranch");
    const warningEl = wrap.querySelector("#stWarning");
    function updateWarning(){
      const b = branchSel.value;
      if(!b){ warningEl.textContent = `Pick a specific branch — a stocktake can't target "All branches".`; return; }
      const existing = one("SELECT * FROM stocktakes WHERE branch=? AND status='Open'",[b]);
      warningEl.textContent = existing? `${b} already has an open stocktake — cut it off before starting another.` : "";
    }
    branchSel.onchange = updateWarning;
    updateWarning();
    wrap.querySelector("#stConfirm").onclick=()=>{
      const branch = branchSel.value;
      if(!branch) return alert(`Pick a specific branch for this stocktake — it can't target "All branches".`);
      if(one("SELECT * FROM stocktakes WHERE branch=? AND status='Open'",[branch])){
        alert(`${branch} already has an open stocktake. Cut it off before starting another.`);
        return;
      }
      const team = wrap.querySelector("#stTeam").value.trim();
      const start = wrap.querySelector("#stStart").value || today;
      const end = wrap.querySelector("#stEnd").value || "";
      run("INSERT INTO stocktakes(branch,team_names,start_date,end_date,status,created_by,created_ts) VALUES(?,?,?,?,'Open',?,?)",
        [branch, team, start, end, sessionUser||"", new Date().toISOString()]);
      persist(); wrap.remove(); render();
    };
  }
  // Multi-Token Search Engine: the table body only (no header/search box),
  // reused by both the initial full render below and
  // renderStocktakeCountingListOnly() (called on every search keystroke,
  // patching only this table rather than rebuilding the whole screen — the
  // same targeted-re-render idiom renderProductsTableOnly() (products.js)
  // already uses for the Products tab's own search box, kept here instead
  // of full innerHTML rebuilds specifically so the search <input> itself is
  // never touched/recreated and never loses focus mid-keystroke).
  function stocktakeCountingTableHtml(products, countMap){
    if(products.length===0) return `<p class="muted" style="padding:10px 4px">No products match.</p>`;
    return `
      <table class="simple">
        <tr><th>Item</th><th>Shelf</th><th>Counted Qty</th></tr>
        ${products.map(p=>{
          const c = countMap[p.id];
          return `<tr>
            <td>${skuNameCellScreen(p.sku,p.name)}</td>
            <td>${escapeHtml(p.shelf||"—")}</td>
            <td><input class="field" data-count="${p.id}" type="number" min="0" style="max-width:90px" value="${c?c.counted_qty:""}" placeholder="—"></td>
          </tr>`;
        }).join("")}
      </table>`;
  }
  function wireStocktakeCountInputs(scope, take){
    scope.querySelectorAll("[data-count]").forEach(inp=>{
      inp.onchange=(e)=>{
        const pid = +inp.dataset.count;
        const val = e.target.value;
        if(val==="") return;
        const qty = parseInt(val)||0;
        const p = one("SELECT * FROM products WHERE id=?",[pid]);
        const existingCount = one("SELECT * FROM stocktake_counts WHERE stocktake_id=? AND product_id=?",[take.id,pid]);
        if(existingCount){
          run("UPDATE stocktake_counts SET counted_qty=?, system_qty=?, counted_ts=?, counted_by=? WHERE id=?",
            [qty, p.stock, new Date().toISOString(), sessionUser||"", existingCount.id]);
        } else {
          run("INSERT INTO stocktake_counts(stocktake_id,product_id,product_name,sku,system_qty,counted_qty,counted_ts,counted_by) VALUES(?,?,?,?,?,?,?,?)",
            [take.id, pid, p.name, p.sku||"", p.stock, qty, new Date().toISOString(), sessionUser||""]);
        }
        persist();
      };
    });
  }
  // Re-fetches products/counts fresh (a count just typed into another row
  // must still be reflected) and re-renders ONLY #stCountTable — see the
  // comment on stocktakeCountingTableHtml above for why not a full rebuild.
  function renderStocktakeCountingListOnly(take){
    const target = document.getElementById("stCountTable");
    if(!target) return;
    const products = all("SELECT * FROM products WHERE branch=? ORDER BY name",[take.branch]);
    const counted = all("SELECT * FROM stocktake_counts WHERE stocktake_id=?",[take.id]);
    const countMap = {}; counted.forEach(c=> countMap[c.product_id]=c);
    const results = rankProductsBySearch(products, stocktakeQuery);
    target.innerHTML = stocktakeCountingTableHtml(results, countMap);
    wireStocktakeCountInputs(target, take);
  }
  function renderStocktakeCounting(main, take){
    const branch = take.branch;
    const products = all("SELECT * FROM products WHERE branch=? ORDER BY name",[branch]);
    const counted = all("SELECT * FROM stocktake_counts WHERE stocktake_id=?",[take.id]);
    const countMap = {}; counted.forEach(c=> countMap[c.product_id]=c);
    const results = rankProductsBySearch(products, stocktakeQuery);
    main.innerHTML = `
      <h3>Stocktake — ${escapeHtml(take.branch)} — ${escapeHtml(take.start_date)}${take.end_date?` to ${escapeHtml(take.end_date)}`:""}</h3>
      <p class="muted">Team: ${escapeHtml(take.team_names||"—")} · Counted ${counted.length} of ${products.length}</p>
      <p class="muted">Count what's physically on the shelf — the system's expected quantity is hidden while you count, so it doesn't bias you.</p>
      <div class="search-wrap">
        <span class="ic">🔎</span>
        <input class="field" id="stCountSearch" placeholder="Search products, SKU, description…" value="${escapeHtml(stocktakeQuery)}">
      </div>
      <div id="stCountTable">${stocktakeCountingTableHtml(results, countMap)}</div>
      <button class="btn btn-danger" id="cutoffStocktake" style="margin-top:14px">Cut Off & Generate Report</button>
    `;
    document.getElementById("stCountSearch").oninput=(e)=>{ stocktakeQuery = e.target.value; renderStocktakeCountingListOnly(take); };
    wireStocktakeCountInputs(document.getElementById("stCountTable"), take);
    document.getElementById("cutoffStocktake").onclick=()=>{
      if(!confirm("Cut off this stocktake? Any products not yet counted will be marked 'Not counted' in the report.")) return;
      run("UPDATE stocktakes SET status='Closed', cutoff_ts=? WHERE id=?",[new Date().toISOString(), take.id]);
      persist();
      stocktakeReportId = take.id;
      render();
    };
  }
  function computeStocktakeVariance(takeId){
    const take = one("SELECT * FROM stocktakes WHERE id=?",[takeId]);
    if(!take) return { take:null, rows:[] };
    const products = all("SELECT * FROM products WHERE branch=? ORDER BY name",[take.branch]);
    const counts = all("SELECT * FROM stocktake_counts WHERE stocktake_id=?",[takeId]);
    const countMap = {}; counts.forEach(c=> countMap[c.product_id]=c);
    const rows = products.map(p=>{
      const c = countMap[p.id];
      const counted = c? c.counted_qty : null;
      const variance = counted===null? null : counted - c.system_qty;
      return { product:p, count:c, counted, variance };
    });
    return { take, rows };
  }
  function renderStocktakeReport(main, takeId){
    const { take, rows } = computeStocktakeVariance(takeId);
    if(!take){ stocktakeReportId=null; return renderStocktakeList(main); }
    main.innerHTML = `
      <h3>Stocktake Report — ${escapeHtml(take.branch)} — ${escapeHtml(take.start_date)}${take.end_date?` to ${escapeHtml(take.end_date)}`:""}</h3>
      <p class="muted">Team: ${escapeHtml(take.team_names||"—")} · Cut off ${take.cutoff_ts? new Date(take.cutoff_ts).toLocaleString() : "—"}</p>
      <div class="card" style="overflow-x:auto">
        <table class="simple">
          <tr><th>Item</th><th>Shelf</th><th>System Qty</th><th>Counted Qty</th><th>Variance</th></tr>
          ${rows.map(r=>`<tr>
            <td>${skuNameCellScreen(r.product.sku,r.product.name)}</td>
            <td>${escapeHtml(r.product.shelf||"—")}</td>
            <td>${r.count? r.count.system_qty : r.product.stock}</td>
            <td>${r.counted===null? "Not counted" : r.counted}</td>
            <td>${r.variance===null? "—" : (r.variance>0?`+${r.variance}`:r.variance)}</td>
          </tr>`).join("")}
        </table>
      </div>
      <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
        <button class="btn btn-outline" id="printStocktake">🖨️ Print/PDF</button>
        <button class="btn btn-outline" id="backToStocktakes">Back to Stocktakes</button>
      </div>
      ${take.status==="Closed"? `<button class="btn btn-danger" id="applyStocktake" style="margin-top:10px">Apply counts to inventory</button>` : ""}
    `;
    document.getElementById("printStocktake").onclick=()=>{
      const headers = ["Item","Shelf","System Qty","Counted Qty","Variance"];
      const printRows = rows.map(r=>[skuNameCell(r.product.sku,r.product.name), escapeHtml(r.product.shelf||"—"), r.count?r.count.system_qty:r.product.stock, r.counted===null?"Not counted":r.counted, r.variance===null?"—":(r.variance>0?`+${r.variance}`:r.variance)]);
      printReport("Stocktake Report", `${take.branch} · ${take.start_date}${take.end_date?` to ${take.end_date}`:""}`, headers, printRows, "");
    };
    document.getElementById("backToStocktakes").onclick=()=>{ stocktakeReportId=null; render(); };
    const applyBtn = document.getElementById("applyStocktake");
    if(applyBtn) applyBtn.onclick=async ()=>{
      // Multi-terminal Phase 3b (owner Q4): at a shared-stock branch every
      // counted product is posted to the server, which sets the branch total;
      // refused while another till still holds stock to sell offline.
      let pre = null;
      if(typeof sharedStockTill==="function" && sharedStockTill()){
        const counted = rows.filter(r=>r.counted!==null);
        if(counted.length===0){ alert("Nothing has been counted yet."); return; }
        if(!confirm(`Post ${counted.length} counted quantities as the branch's stock? This can't be undone.`)) return;
        pre = await sharedStockStocktake(counted);
        if(!pre.ok){ alert(pre.message); return; }
        counted.forEach(r=>{
          const ts = new Date().toISOString();
          moveStock({ productId:r.product.id, setTo:r.counted, kind:"stocktake", docType:"stocktake", docUid:take.uid||null, docNo:"Stocktake #"+take.id, ts, note:"Stocktake (branch stock)" });
          run("INSERT INTO stock_received(ts,product_id,name,qty,note,branch,user) VALUES(?,?,?,?,?,?,?)",
            [ts, r.product.id, r.product.name, r.variance, "Stocktake adjustment (branch stock)", take.branch, sessionUser||""]);
        });
        sharedStockDone(pre);
        logAudit("Apply Stocktake", "", `${counted.length} products posted as branch stock (stocktake #${take.id})`);
        persist(); alert("Branch stock updated."); render();
        return;
      }
      const toApply = rows.filter(r=>r.counted!==null && r.variance!==0);
      if(toApply.length===0){ alert("No counted items differ from system stock — nothing to apply."); return; }
      if(!confirm(`Apply ${toApply.length} counted quantities to live stock? This can't be undone.`)) return;
      toApply.forEach(r=>{
        const ts = new Date().toISOString();
        // The movement records the real change (counted − stock now), which can
        // differ from the count-time variance if sales happened since counting.
        moveStock({ productId:r.product.id, setTo:r.counted, kind:"stocktake", docType:"stocktake", docUid:take.uid||null, docNo:"Stocktake #"+take.id, ts, note:"Stocktake adjustment" });
        run("INSERT INTO stock_received(ts,product_id,name,qty,note,branch,user) VALUES(?,?,?,?,?,?,?)",
          [ts, r.product.id, r.product.name, r.variance, "Stocktake adjustment", take.branch, sessionUser||""]);
      });
      logAudit("Apply Stocktake", "", `${toApply.length} products adjusted (stocktake #${take.id})`);
      persist();
      alert("Inventory updated.");
      render();
    };
  }


  // Requests / market intelligence notepad — logs stock a customer asked for

  function newReqLine(){ return { id: reqLineSeq++, item:"", qty:"" }; }

  function renderRequestsDrawer(){

    function renderReqLines(){

  // ---------------- Purchasing & Receiving + COGS Recovery (Main branch only) ----------------
  // Cost/financial data, same precedent as the Margin Report — this whole
  // module is hidden for Remote branches, not just gated at the action level.
  // Cart-style line items, each with a live search-as-you-type product
  // picker (reusing searchProducts exactly as the Sell screen does) so
  // staff tap a match instead of retyping a name that has to align exactly
  // with what's already in the database. Typing something with no match
  // is still allowed to stand as a brand-new product, same find-or-create
  // fallback the single-item version used.
  function recordPurchaseModal(){
    const branch = currentBranch();
    let lineSeq = 0;
    const newLine = ()=>({ id: lineSeq++, query:"", product:null, qty:"", unitCost:"" });
    let lines = [ newLine() ];

    const wrap = openModal("Record Purchase", `
      <label>Supplier</label>
      <input class="field" id="puSupplier" placeholder="e.g. Metro Wholesalers">
      <label>Note (optional)</label>
      <input class="field" id="puNote" placeholder="e.g. invoice #1234">
      <div class="hr"></div>
      <div id="puLines"></div>
      <button class="btn btn-outline btn-sm" id="puAddLine" style="margin-top:4px">+ Add Line</button>
      <button class="btn btn-primary" id="puConfirm" style="margin-top:14px">Record Purchase</button>
    `);
    const linesEl = wrap.querySelector("#puLines");

    function dropdownHtml(line){
      if(line.product || !line.query.trim()) return "";
      const matches = searchProducts(line.query, branch).slice(0,6);
      return `<div class="card" style="padding:4px;margin-top:4px;max-height:150px;overflow-y:auto">
        ${matches.length? matches.map(m=>`<button type="button" data-pick="${line.id}:${m.id}" style="display:block;width:100%;text-align:left;background:none;border:none;padding:8px;font-size:13px;border-bottom:1px solid var(--border)">${escapeHtml(m.sku?m.sku+" — ":"")}${escapeHtml(m.name)}</button>`).join("")
                  : `<div class="muted" style="padding:6px;font-size:12.5px">No match — "${escapeHtml(line.query.trim())}" will be added as a new product</div>`}
      </div>`;
    }
    function wireDropdown(line){
      const dd = linesEl.querySelector(`[data-dropdown="${line.id}"]`);
      if(!dd) return;
      dd.querySelectorAll("[data-pick]").forEach(btn=>{
        btn.onclick=()=>{
          const [,pid] = btn.dataset.pick.split(":");
          line.product = one("SELECT * FROM products WHERE id=?",[+pid]);
          line.query = line.product.name;
          renderLines();
        };
      });
    }
    function lineRowHtml(line, idx){
      return `
        <div class="card" style="padding:10px;margin-bottom:8px">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
            <span class="muted" style="font-size:11.5px;font-weight:700">LINE ${idx+1}</span>
            <button type="button" class="close-x" data-remove-line="${line.id}" title="Remove line" style="font-size:15px;padding:2px 6px">✕</button>
          </div>
          <label style="margin-top:0">Product</label>
          ${line.product
            ? `<p class="muted" style="margin:0 0 4px">Matched: <b>${escapeHtml(line.product.sku?line.product.sku+" — ":"")}${escapeHtml(line.product.name)}</b> <button type="button" data-clear-match="${line.id}" style="background:none;border:none;color:var(--orange);text-decoration:underline;padding:0;font-size:12px;margin-left:4px">change</button></p>`
            : `<input class="field" data-product-input="${line.id}" placeholder="Search by name or SKU, or type a new item" value="${escapeHtml(line.query)}" autocomplete="off">
               <div data-dropdown="${line.id}">${dropdownHtml(line)}</div>`}
          <div class="row" style="margin-top:8px">
            <div><label>Qty</label><input class="field" data-qty="${line.id}" type="number" min="1" value="${escapeHtml(String(line.qty))}" placeholder="0"></div>
            <div><label>Unit Cost (${currency})</label><input class="field" data-unitcost="${line.id}" type="number" step="0.01" value="${escapeHtml(String(line.unitCost))}" placeholder="0.00"></div>
          </div>
        </div>`;
    }
    function renderLines(){
      linesEl.innerHTML = lines.map((l,i)=>lineRowHtml(l,i)).join("");
      lines.forEach(line=>{
        const input = linesEl.querySelector(`[data-product-input="${line.id}"]`);
        if(input) input.oninput=(e)=>{
          line.query = e.target.value;
          line.product = null;
          const dd = linesEl.querySelector(`[data-dropdown="${line.id}"]`);
          if(dd){ dd.innerHTML = dropdownHtml(line); wireDropdown(line); }
        };
        wireDropdown(line);
        const clearBtn = linesEl.querySelector(`[data-clear-match="${line.id}"]`);
        if(clearBtn) clearBtn.onclick=()=>{ line.product=null; renderLines(); };
        const qtyInput = linesEl.querySelector(`[data-qty="${line.id}"]`);
        if(qtyInput) qtyInput.oninput=(e)=>{ line.qty = e.target.value; };
        const costInput = linesEl.querySelector(`[data-unitcost="${line.id}"]`);
        if(costInput) costInput.oninput=(e)=>{ line.unitCost = e.target.value; };
        const removeBtn = linesEl.querySelector(`[data-remove-line="${line.id}"]`);
        if(removeBtn) removeBtn.onclick=()=>{
          if(lines.length===1) lines[0] = newLine();
          else lines = lines.filter(x=>x.id!==line.id);
          renderLines();
        };
      });
    }
    renderLines();
    wrap.querySelector("#puAddLine").onclick=()=>{ lines.push(newLine()); renderLines(); };

    wrap.querySelector("#puConfirm").onclick=()=>{
      const supplier = wrap.querySelector("#puSupplier").value.trim();
      const note = wrap.querySelector("#puNote").value.trim();
      if(!supplier) return alert("Enter the supplier");
      for(let i=0;i<lines.length;i++){
        const l = lines[i];
        const typed = l.product? l.product.name : l.query.trim();
        const qty = parseInt(l.qty)||0;
        const unitCost = parseFloat(l.unitCost);
        if(!typed) return alert(`Line ${i+1}: enter or select a product`);
        if(qty<1) return alert(`Line ${i+1}: enter a quantity of at least 1`);
        if(isNaN(unitCost) || unitCost<0) return alert(`Line ${i+1}: enter a valid unit cost`);
      }
      const ts = new Date().toISOString();
      const newProductNames = [];
      lines.forEach(l=>{
        const typed = l.product? l.product.name : l.query.trim();
        const qty = parseInt(l.qty)||0;
        const unitCost = parseFloat(l.unitCost)||0;
        const totalCost = qty*unitCost;
        let prod = l.product;
        if(!prod){
          prod = one("SELECT * FROM products WHERE branch=? AND lower(sku)=lower(?)",[branch,typed])
               || one("SELECT * FROM products WHERE branch=? AND lower(name)=lower(?)",[branch,typed]);
        }
        const existed = !!prod;
        if(prod){
          run("UPDATE products SET cost=? WHERE id=?",[unitCost,prod.id]);
        } else {
          run("INSERT INTO products(name,price,stock,low_threshold,sku,branch,image,cost,created_ts,description) VALUES(?,?,?,?,?,?,?,?,?,?)",
            [typed,0,qty,5,"",branch,"",unitCost,ts,""]);
          prod = { id: one("SELECT last_insert_rowid() as id").id, name: typed, sku:"" };
          newProductNames.push(typed);
        }
        run("INSERT INTO purchases(ts,branch,user,supplier,product_id,product_name,sku,qty,unit_cost,total_cost,note) VALUES(?,?,?,?,?,?,?,?,?,?,?)",
          [ts,branch,sessionUser||"",supplier,prod.id,prod.name,prod.sku||"",qty,unitCost,totalCost,note]);
        const pu = one("SELECT uid FROM purchases WHERE id=last_insert_rowid()");
        const mv = { kind:"purchase", docType:"purchase", docUid:pu? pu.uid : null, docNo:supplier, ts, note:"Purchased from "+supplier };
        if(existed) moveStock(Object.assign({ productId:prod.id, delta:qty }, mv));
        else recordStockMovement(prod.id, qty, mv);
        run("INSERT INTO stock_received(ts,product_id,name,qty,note,branch,user) VALUES(?,?,?,?,?,?,?)",
          [ts,prod.id,prod.name,qty,`Purchased from ${supplier}`,branch,sessionUser||""]);
      });
      logAudit("Record Purchase", "", `${lines.length} item${lines.length===1?"":"s"} from ${supplier}`);
      persist(); wrap.remove(); render();
      if(newProductNames.length) alert(`${newProductNames.join(", ")} ${newProductNames.length===1?"was":"were"} created with no selling price — set ${newProductNames.length===1?"it":"them"} via Edit on the Products page.`);
    };
  }
  function renderPurchasing(main){
    const branch = currentBranch();
    const seedMoney = parseFloat(getSetting("seed_money","0"))||0;
    const cogsRecovered = one(`SELECT COALESCE(SUM(si.cost*si.qty),0) as t FROM sale_items si JOIN sales s ON s.id=si.sale_id WHERE s.branch=?`,[branch]).t;
    const pctRecovered = seedMoney>0? (cogsRecovered/seedMoney*100) : null;
    const fullyRecovered = seedMoney>0 && cogsRecovered>=seedMoney;
    const purchases = all("SELECT * FROM purchases WHERE branch=? ORDER BY ts DESC LIMIT 200",[branch]);
    const groups = groupPurchases(purchases);
    main.innerHTML = `
      <div class="card">
        <h3>Capital Recovery</h3>
        <div class="subline"><span>Seed Money / Starting Capital</span><span>${currency}${seedMoney.toFixed(2)}</span></div>
        <div class="subline"><span>Total COGS Recovered</span><span>${currency}${cogsRecovered.toFixed(2)}</span></div>
        <div class="subline"><span>% Recovered</span><span>${pctRecovered===null? "—" : pctRecovered.toFixed(1)+"%"}</span></div>
        ${fullyRecovered
          ? `<div class="subline"><span>Status</span><span style="color:var(--success);font-weight:700">Fully recovered — ${currency}${(cogsRecovered-seedMoney).toFixed(2)} surplus</span></div>`
          : `<div class="subline"><span>Remaining to Recover</span><span>${currency}${Math.max(0,seedMoney-cogsRecovered).toFixed(2)}</span></div>`}
        <button class="btn btn-outline btn-sm" id="editSeedMoney" style="margin-top:8px">Edit Seed Money in Settings</button>
      </div>
      <button class="btn btn-primary" id="openRecordPurchase" style="margin-bottom:12px">+ Record Purchase</button>
      <h3>Recent Purchases</h3>
      ${groups.length===0? `<p class="muted">No purchases recorded yet.</p>` : groups.map(g=>{
        const groupTotal = g.items.reduce((s,it)=>s+it.total_cost,0);
        return `<div class="card">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
            <div>
              <div style="font-weight:700">${escapeHtml(g.supplier)}</div>
              <div class="muted">${new Date(g.ts).toLocaleString()}${g.note? ` · ${escapeHtml(g.note)}` : ""}</div>
            </div>
            <div style="font-weight:700;flex:none">${currency}${groupTotal.toFixed(2)}</div>
          </div>
          <div class="hr" style="margin:8px 0"></div>
          ${g.items.map(it=>`
            <div class="product-row" style="padding:6px 0">
              <div>
                <div class="pname">${escapeHtml(it.product_name)}</div>
                <div class="pmeta">Qty ${it.qty} @ ${currency}${it.unit_cost.toFixed(2)}</div>
              </div>
              <div>${currency}${it.total_cost.toFixed(2)}</div>
            </div>`).join("")}
        </div>`;
      }).join("")}
    `;
    document.getElementById("editSeedMoney").onclick=()=>{ moreTab="settings"; render(); };
    document.getElementById("openRecordPurchase").onclick=()=>recordPurchaseModal();
  }
  // Lines recorded together via recordPurchaseModal() share one ts+supplier,
  // which is the only signal we have to regroup them for display — there's
  // no separate "purchase batch" id in the schema.
  function groupPurchases(purchases){
    const groups = {}; const order = [];
    purchases.forEach(p=>{
      const key = p.ts+"|"+p.supplier;
      if(!groups[key]){ groups[key] = { ts:p.ts, supplier:p.supplier, note:p.note, items:[] }; order.push(key); }
      groups[key].items.push(p);
    });
    return order.map(k=>groups[k]);
  }


  // ---------------- Report Writer (view reports on screen, not just print) ----------------
  // Each config's fetch() returns {headers, rows, footer} using the exact
  // same queries as the matching card in the Reports tab, so the on-screen
  // view and the printed PDF are always guaranteed to agree.
  // Multi-terminal Phase 3b: on a shared-stock till a product's stock is the
  // branch's (last-known, from the server); products.stock is only this till's allowance.
  const rptStock = (p)=> (typeof sharedStockTill==="function" && sharedStockTill() && p.cat_uid && p.branch_total!=null)? p.branch_total : p.stock;
  const REPORT_CONFIGS = [
    { id:"sales", label:"Sales Report", hasDate:true,
      fetch(b,fromTs,toTs){
        const sales = b? all("SELECT * FROM sales WHERE branch=? AND ts>=? AND ts<=? ORDER BY ts",[b,fromTs,toTs])
                        : all("SELECT * FROM sales WHERE ts>=? AND ts<=? ORDER BY ts",[fromTs,toTs]);

    { id:"transfers", label:"Stock Dispatched", hasDate:true,
      fetch(b,fromTs,toTs){
        const transfers = b? all("SELECT * FROM stock_transfers WHERE (from_branch=? OR to_branch=?) AND ts>=? AND ts<=? ORDER BY ts",[b,b,fromTs,toTs])
                            : all("SELECT * FROM stock_transfers WHERE ts>=? AND ts<=? ORDER BY ts",[fromTs,toTs]);
        // DN lines show the DN's real status (joined on dispatching branch id + dn_no);
        // older transfers keep their own line status.
        const mv = dnStatusMap(), byName = new Map();
        mv.forEach(r=>byName.set(String(r.from).toLowerCase()+"|"+r.dnNo, r));
        const statusOf = (t)=>{
          if(t.dn_no==null) return t.status;
          const r = (t.dn_branch_id && mv.get(t.dn_branch_id+"|"+t.dn_no)) || byName.get(String(t.from_branch).toLowerCase()+"|"+t.dn_no);

        const all_ = dnMovementRows();
        const rows = filterMovements(all_, { branch:b||"", status:status||"", fromMs:Date.parse(fromTs), toMs:Date.parse(toTs) });
        // loss written off on a DN (linked adjustments other than the restore), valued at MAIN's cost by product code
        const mainProducts = all("SELECT sku,cost FROM products WHERE branch=?",[currentBranch()]);
        const linked = adjustmentReportData(all("SELECT * FROM stock_adjustments WHERE dn_no IS NOT NULL AND reason<>'Dispatch cancelled' AND qty_delta<0"), mainProducts, {}).rows;
        const loss = new Map(); linked.forEach(a=>{ if(a.value==null) return; const k = a.dn_branch_id+"|"+a.dn_no; loss.set(k,(loss.get(k)||0)+(-a.value)); });
        const out = rows.map(r=>[escapeHtml(r.dnDisplay), escapeHtml(r.from), escapeHtml(r.to),

          loss.has(r.key)? currency+loss.get(r.key).toFixed(2) : ""]);
        const n = (st)=>rows.filter(r=>r.status===st).length;

    { id:"salestrend", label:"Sales Trend", hasDate:true, hasGranularity:true,
      fetch(b,fromTs,toTs,granularity){
        const sales = b? all("SELECT * FROM sales WHERE branch=? AND ts>=? AND ts<=? ORDER BY ts",[b,fromTs,toTs])
                        : all("SELECT * FROM sales WHERE ts>=? AND ts<=? ORDER BY ts",[fromTs,toTs]);
        function bucketKey(ts){
          if(granularity==="month") return ts.slice(0,7);
          if(granularity==="year") return ts.slice(0,4);
          if(granularity==="week"){
            // Simple Monday-start bucketing, computed off the date portion
            // only (as a local midnight) so it doesn't need to be strict
            // ISO-8601 or worry about UTC/local skew near midnight.
            const d = new Date(ts.slice(0,10)+"T00:00:00");
            const day = d.getDay();
            const diff = day===0? -6 : 1-day;
            d.setDate(d.getDate()+diff);
            const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), dd=String(d.getDate()).padStart(2,"0");
            return `${y}-${m}-${dd}`;
          }
          return ts.slice(0,10); // day (default)
        }
        const buckets = {};
        sales.forEach(s=>{ const key = bucketKey(s.ts); buckets[key] = (buckets[key]||0) + s.total; });
        const sortedKeys = Object.keys(buckets).sort();
        const chartData = sortedKeys.map(k=>({label:k, value:buckets[k]}));
        const rows = sortedKeys.map(k=>[k, currency+buckets[k].toFixed(2)]);
        const grand = sortedKeys.reduce((s,k)=>s+buckets[k],0);
        return { headers:["Period","Total Sales"], rows, footer:`Grand Total: ${currency}${grand.toFixed(2)}`, chartData };
      }
    },
  ];
  function adjustmentsTable(b,fromTs,toTs,reason){
    const d = adjustmentReport({ branch:b||"", reason:reason||"", fromMs:Date.parse(fromTs), toMs:Date.parse(toTs) });
    const money = (v)=> v==null? "" : (v<0? "-" : "")+currency+Math.abs(v).toFixed(2);
    const rows = d.rows.map(r=>[escapeHtml(new Date(r.ts).toLocaleDateString()), escapeHtml(r.branch), skuNameCell(r.product_code,r.product_name),
      (r.qty_delta>0?"+":"")+r.qty_delta, escapeHtml(r.reason), escapeHtml(r.note||""), escapeHtml(r.by_user||"")+" / "+escapeHtml(r.authorised_by||""), money(r.value)]);
    d.totals.forEach(t=>rows.push([`<b>Total</b>`,"","",`<b>${t.units>0?"+":""}${t.units}</b>`,`<b>${escapeHtml(t.reason)}</b> (${t.count})`,"","",`<b>${money(t.value)}</b>`]));
    const units = d.rows.reduce((s,r)=>s+r.qty_delta,0);
    return { headers:["Date","Branch","Item","Qty","Reason","Note","By / Admin","Value"], rows,
      footer:`${d.rows.length} adjustment${d.rows.length===1?"":"s"} · net ${units>0?"+":""}${units} units · values at main's cost by product code${d.unvalued? " ("+d.unvalued+" without a main cost, left blank)" : ""}` };
  }
  function reportWriterConfigs(){ return REPORT_CONFIGS.filter(c=> !((c.remoteHidden || c.mainOnly) && isRemote())); }
  function renderReportWriter(main){
    const configs = reportWriterConfigs();
    let selected = configs.find(c=>c.id===rwType) || configs[0];
    rwType = selected.id;
    const today = new Date().toISOString().slice(0,10);
    main.innerHTML = `
      <p class="muted">View most reports right here, with filters — no printing needed just to read the numbers.</p>
      <label>Report</label>
      <select class="field" id="rwTypeSel">
        ${configs.map(c=>`<option value="${c.id}" ${c.id===rwType?"selected":""}>${c.label}</option>`).join("")}
      </select>
      <label>Branch</label>${branchSelectHtml("rwBranchSel", rwBranch)}
      ${selected.hasDate? `<div class="row"><div><label>From</label><input class="field" id="rwFrom" type="date" value="${rwFrom||today}"></div><div><label>To</label><input class="field" id="rwTo" type="date" value="${rwTo||today}"></div></div>` : ""}
      ${selected.hasView? `<label>View</label>
        <select class="field" id="rwViewSel"><option value="dn" ${rwView!=="adjustments"?"selected":""}>Delivery Notes</option><option value="adjustments" ${rwView==="adjustments"?"selected":""}>Stock adjustments</option></select>` : ""}
      ${selected.hasReason && (!selected.hasView || rwView==="adjustments")? `<label>Reason</label>
        <select class="field" id="rwReasonSel"><option value="">All reasons</option>${ADJ_REASONS.concat(ADJ_SYSTEM_REASONS).map(r=>`<option value="${escapeHtml(r)}" ${rwReason===r?"selected":""}>${escapeHtml(r)}</option>`).join("")}</select>` : ""}
      ${selected.hasStatus && (!selected.hasView || rwView!=="adjustments")? `<label>Status</label>
        <select class="field" id="rwStatusSel">
          ${[["","All"],["attention","Needs attention"],["dispatched","Dispatched"],["awaiting","Awaiting"],["variance","Variance"],["cancel_pending","Cancel pending"],["received","Received"],["cancelled","Cancelled"],["superseded","Superseded"],["loss_closed","Closed as loss"],["conflict","Conflict"]].map(o=>`<option value="${o[0]}" ${rwStatus===o[0]?"selected":""}>${o[1]}</option>`).join("")}
        </select>` : ""}
      ${selected.hasGranularity? `<label>Group by</label>
        <select class="field" id="rwGranularitySel">
          <option value="day" ${rwGranularity==="day"?"selected":""}>Day</option>
          <option value="week" ${rwGranularity==="week"?"selected":""}>Week</option>
          <option value="month" ${rwGranularity==="month"?"selected":""}>Month</option>
          <option value="year" ${rwGranularity==="year"?"selected":""}>Year</option>
        </select>` : ""}
      <button class="btn btn-primary" id="rwView" style="margin-top:12px">View Report</button>
      <div id="rwResults" style="margin-top:14px"></div>
    `;
    document.getElementById("rwTypeSel").onchange=(e)=>{ rwType=e.target.value; render(); };
    document.getElementById("rwBranchSel").onchange=(e)=>{ rwBranch=e.target.value; };
    const viewSel = document.getElementById("rwViewSel");
    if(viewSel) viewSel.onchange=(e)=>{ rwView=e.target.value; render(); };
    const granSel = document.getElementById("rwGranularitySel");
    if(granSel) granSel.onchange=(e)=>{ rwGranularity=e.target.value; };
    document.getElementById("rwView").onclick=()=>runReportWriter();
