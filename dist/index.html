  function adjustmentsTable(b,fromTs,toTs,reason){
    const d = adjustmentReport({ branch:b||"", reason:reason||"", fromMs:Date.parse(fromTs), toMs:Date.parse(toTs) });
    const money = (v)=> v==null? "" : (v<0? "-" : "")+currency+Math.abs(v).toFixed(2);
    const rows = d.rows.map(r=>[escapeHtml(new Date(r.ts).toLocaleDateString()), escapeHtml(r.branch), skuNameCell(r.product_code,r.product_name),
      (r.qty_delta>0?"+":"")+r.qty_delta, escapeHtml(r.reason), escapeHtml(r.note||""), escapeHtml(r.by_user||"")+" / "+escapeHtml(r.authorised_by||""), money(r.value)]);
    d.totals.forEach(t=>rows.push([`<b>Total</b>`,"","",`<b>${t.units>0?"+":""}${t.units}</b>`,`<b>${escapeHtml(t.reason)}</b> (${t.count})`,"","",`<b>${money(t.value)}</b>`]));
    const units = d.rows.reduce((s,r)=>s+r.qty_delta,0);
    return { headers:["Date","Branch","Item","Qty","Reason","Note","By / Admin","Value"], rows,
      footer:`${d.rows.length} adjustment${d.rows.length===1?"":"s"} · net ${units>0?"+":""}${units} units · values at main's cost by product code${d.unvalued? " ("+d.unvalued+" without a main cost, left blank)" : ""}` };
  }
  function reportWriterConfigs(){ return REPORT_CONFIGS.filter(c=> !((c.remoteHidden || c.mainOnly) && isRemote())); }

  // Hand-built inline SVG bar chart — no charting library. Bars are scaled
  // to the tallest bucket, capped at a sensible max width and centered so a
  // 1-2 bucket range doesn't render as one giant blob, and labels rotate +
  // abbreviate past ~10 buckets so they stay legible instead of overlapping.
  function abbreviateChartLabel(label){
    return /^\d{4}-\d{2}-\d{2}$/.test(label)? label.slice(5) : label;
  }
  function renderBarChartSvg(chartData){
    if(!chartData || chartData.length===0) return `<p class="muted">No data to chart.</p>`;
    const w=600, h=200, padBottom=46, padTop=14;
    const maxVal = Math.max(...chartData.map(d=>d.value), 0.01);
    const n = chartData.length;
    const gap = 6;
    const idealWidth = (w - gap*(n+1)) / n;
    const barWidth = Math.max(4, Math.min(idealWidth, 56));
    const totalBarsWidth = n*barWidth + (n-1)*gap;
    const startX = Math.max(gap, (w-totalBarsWidth)/2);
    const manyBars = n > 10;
    const bars = chartData.map((d,i)=>{
      const x = startX + i*(barWidth+gap);
      const barH = Math.max(1, (d.value/maxVal) * (h-padTop-padBottom));
      const y = h - padBottom - barH;
      const cx = x + barWidth/2;
      const labelY = h - padBottom + (manyBars? 10 : 16);
      const label = manyBars? abbreviateChartLabel(d.label) : d.label;
      const textAttrs = manyBars
        ? `text-anchor="end" transform="rotate(-40 ${cx.toFixed(1)} ${labelY.toFixed(1)})"`
        : `text-anchor="middle"`;
      return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barWidth.toFixed(1)}" height="${barH.toFixed(1)}" rx="2" style="fill:var(--orange)"></rect>
        <text x="${cx.toFixed(1)}" y="${labelY.toFixed(1)}" font-size="${manyBars?8.5:11}" style="fill:var(--ink-soft)" ${textAttrs}>${escapeHtml(label)}</text>`;
    }).join("");
    return `<div class="card" style="overflow-x:auto;padding:10px 6px">
      <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:200px;display:block" preserveAspectRatio="xMidYMid meet">${bars}</svg>
    </div>`;
  }
  function runReportWriter(){
    const configs = reportWriterConfigs();
    const selected = configs.find(c=>c.id===rwType);
    if(!selected) return;
    const b = rwBranch || null;
    let fromTs, toTs;
    if(selected.hasDate){
      rwFrom = document.getElementById("rwFrom").value;
      rwTo = document.getElementById("rwTo").value;
      fromTs = rwFrom+"T00:00:00"; toTs = rwTo+"T23:59:59";
    }
    let granularity;
    if(selected.hasGranularity){
      granularity = document.getElementById("rwGranularitySel").value;
      rwGranularity = granularity;
    }
    let status;
    const opts = {};
    if(selected.hasView) opts.view = rwView;
    const stEl = document.getElementById("rwStatusSel"); if(stEl){ status = stEl.value; rwStatus = status; }
    const rsEl = document.getElementById("rwReasonSel"); if(rsEl){ opts.reason = rsEl.value; rwReason = opts.reason; }
    const data = selected.fetch(b, fromTs, toTs, granularity, status, opts);
    window._rwLastData = { title:selected.label, subtitle:`${b||"All branches"}${selected.hasDate? ` · ${rwFrom} to ${rwTo}`:""}`, headers:data.headers, rows:data.rows, footer:data.footer };
    const target = document.getElementById("rwResults");
    target.innerHTML = `
      ${data.chartData? renderBarChartSvg(data.chartData) : ""}
      <div class="card" style="overflow-x:auto">
        ${data.rows.length===0? `<p class="muted">No data for this filter.</p>` : `
        <table class="simple">
          <tr>${data.headers.map(h=>`<th>${escapeHtml(h)}</th>`).join("")}</tr>
          ${data.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}
        </table>`}
        ${data.footer? `<p style="margin-top:8px"><b>${escapeHtml(data.footer)}</b></p>` : ""}
      </div>
      ${data.rows.length>0? `<button class="btn btn-outline" id="rwPrint" style="margin-top:10px">🖨️ Print / PDF this view</button>` : ""}
    `;
    const printBtn = document.getElementById("rwPrint");
    if(printBtn) printBtn.onclick=()=>{
      const d = window._rwLastData;
      printReport(d.title, d.subtitle, d.headers, d.rows, d.footer? `<p><b>${escapeHtml(d.footer)}</b></p>`:"");
    };
    target.querySelectorAll("[data-view-sale]").forEach(b=>{
      b.onclick=()=> openSaleDetailModal(+b.dataset.viewSale);
    });
  }

  function wireBackupMergeSection(){
    const scopeSel = ()=> (exportScope = document.getElementById("exportScope").value);
    const dataName = (scope)=> docFilename({type:"DataExport", prefix:"EXP", ext:"sqlite", scope});
    document.getElementById("exportScope").onchange = scopeSel;
    document.getElementById("exportDb").onclick=()=>{ const s=scopeSel(); downloadDb(dataName(s), s); };
    document.getElementById("shareDb").onclick=()=>{ const s=scopeSel(); shareOrDownloadDb(dataName(s), s); };
    document.getElementById("exportItemsXlsx").onclick=()=> exportItemsExcel(scopeSel(), false);
    const logArgs = ()=> [scopeSel(), document.getElementById("logFrom").value, document.getElementById("logTo").value];
    document.getElementById("saveLog").onclick=()=> sendAppLog(...logArgs(), false);
    document.getElementById("shareLog").onclick=()=> sendAppLog(...logArgs(), true);
    const folderBtn = document.getElementById("chooseExportFolder");
    if(folderBtn) folderBtn.onclick=async ()=>{
      try{
        exportDirHandle = await window.showDirectoryPicker({mode:"readwrite", id:"seigen-export"});
        await saveExportDirHandle(exportDirHandle);
        render();
      }catch(e){ /* user cancelled the picker */ }
    };
    document.getElementById("mergeDb").onchange=(e)=>{
      const file = e.target.files[0];
      e.target.value = "";
      if(file) onMergePicked(file);
    };
    document.getElementById("replaceDb").onchange=(e)=>{
      const file = e.target.files[0];
      e.target.value = "";
      if(file) onReplacePicked(file);
    };
  }
  function readFileBytes(file){
    return new Promise((res,rej)=>{
      const reader = new FileReader();
      reader.onload = ()=>res(new Uint8Array(reader.result));
      reader.onerror = ()=>rej(reader.error);
      reader.readAsArrayBuffer(file);
    });
  }
  // A Delivery Note is not a data backup. Judged by CONTENT (not name or type),
  // and checked before anything else happens — no pre-merge backup download,
  // no merge, no database change. Receive stock (Phase 3) is offered when it
  // exists in this build; it is handed the same file so nothing is re-picked.
  function showDNInBackupGuard(file, format){
    const isCat = format===CAT_FORMAT, isAck = format===ACK_FORMAT, isCx = format===CANCEL_FORMAT, isGrv = format===GRV_FORMAT || isAck;
    if(isAck || isCx){                       // Phase 5: cancellation files are never data backups either
      const openIt = isAck? typeof openGrvImportWithFile==="function" : typeof openReceiveWithFile==="function";
      const w = openModal(isAck? "This is a cancellation confirmation" : "This is a cancellation notice", `
        <p style="margin:0 0 10px">${isAck? "This is a cancellation confirmation, not a data backup. Use Import in Dispatch history." : "This is a cancellation notice, not a data backup. Use Receive stock."}</p>
        ${openIt? `<button class="btn btn-primary" id="dnGuardReceive">${isAck? "Open Import" : "Open Receive stock"}</button>` : ""}`);
      const b2 = w.querySelector("#dnGuardReceive");
      if(b2) b2.onclick=()=>{ w.remove(); if(isAck) openGrvImportWithFile(file); else openReceiveWithFile(file); };
      return;
    }
    const canOpen = isGrv? typeof openGrvImportWithFile==="function" : isCat? typeof openCatalogueWithFile==="function" : typeof openReceiveWithFile==="function";
    const wrap = openModal(isGrv? "This is a Goods Received Voucher" : isCat? "This is a Catalogue" : "This is a Delivery Note", `
      <p style="margin:0 0 10px">${isGrv? "This is a Goods Received Voucher file, not a data backup. Use Import GRV in Dispatch history." : isCat? "This is a Catalogue, not a data backup. Use Get catalogue." : "This is a Delivery Note, not a data backup. Use Receive stock to receive it."}</p>
      ${canOpen? `<button class="btn btn-primary" id="dnGuardReceive">${isGrv? "Open Import GRV" : isCat? "Open Get catalogue" : "Open Receive stock"}</button>` : ""}`);
    const btn = wrap.querySelector("#dnGuardReceive");
    if(btn) btn.onclick=()=>{ wrap.remove(); if(isCat) openCatalogueWithFile(file); else if(isGrv) openGrvImportWithFile(file); else openReceiveWithFile(file); };
  }
  // Our own JSON formats are never data backups.
  function guardedFormat(bytes){
    const f = sniffJsonFormat(bytes);
    return (f===DN_FORMAT || f===CAT_FORMAT || f===GRV_FORMAT || f===CANCEL_FORMAT || f===ACK_FORMAT)? f : null;
  }
  // A remote branch never takes a data file from a main branch: it carries the
  // main's staff passcodes, costs and every other branch's records. A remote gets
  // its products from the catalogue and its stock from Delivery Notes. Only a
  // file that says it came from a remote is accepted; this also covers Replace,
  // which would otherwise turn the device into a main branch. "" = no problem.
  function mainFileProblem(bytes, what){
    if(!isRemote()) return "";
    let type;
    try{ const imp = new SQL.Database(bytes); type = getSettingX(imp,"branch_type",""); }
    catch(e){ return ""; }                       // not a database at all: the normal path reports that
    if(type==="remote") return "";
    return (type==="main"? "This data file was exported by a main branch." : "This data file doesn't say it came from a remote branch.")
      +" A remote branch can't "+(what||"merge")+" it, because it would copy the main branch's staff passcodes, costs and other branches' records onto this device."
      +" Get products with Get catalogue and stock with Receive stock instead.";
  }
  // Replace also refuses a file that belongs to a differently named branch: the name is locked
  // after setup, and the file's own rows are filed under ITS name. "" = fine.
  function replaceNameProblem(bytes){
    const own = String(getSetting("branch_name","")).trim();
    if(!own) return "";
    let imp;
    try{ const t = new SQL.Database(bytes); imp = getSettingX(t,"branch_name","") || getSettingX(t,"shop_name","") || "Main"; }
    catch(e){ return ""; }
    return imp===own? "" : "This data file belongs to \""+imp+"\", but this device is \""+own+"\". A branch's name is locked after setup, so its data can't be replaced with another branch's file.";
  }
  async function onMergePicked(file){
    let bytes;
    try{ bytes = await readFileBytes(file); }catch(err){ alert("Could not read that file."); return; }
    const gf = guardedFormat(bytes);
    if(gf){ showDNInBackupGuard(file, gf); return; }
    const refused = mainFileProblem(bytes, "merge");
    if(refused){ alert(refused); return; }
    downloadDb(`seigen-backup-before-merge-${new Date().toISOString().replace(/[:.]/g,"-")}.sqlite`);
    try{
      const res = await mergeDatabase(bytes);
      persist(); render();
      alert("Merge complete.");
      if(res && res.priceDiffs && res.priceDiffs.length) showBranchPriceDifferences(res.branch, res.priceDiffs);
    }catch(err){ alert("Could not merge that file. Make sure it's a valid seiGEN Commerce Lite export."); }
  }
  // Replace gets the same guard: handing it a DN would otherwise swap the live
  // database for a non-database before failing.
  async function onReplacePicked(file){
    let bytes;
    try{ bytes = await readFileBytes(file); }catch(err){ alert("Could not read that file."); return; }
    const gf = guardedFormat(bytes);
    if(gf){ showDNInBackupGuard(file, gf); return; }
    const refused = mainFileProblem(bytes, "replace this device's data with") || replaceNameProblem(bytes);
    if(refused){ alert(refused); return; }
    if(!confirm("This will replace ALL current data with the imported file. A backup of your current data downloads first. Continue?")) return;
    downloadDb(`seigen-backup-before-replace-${new Date().toISOString().replace(/[:.]/g,"-")}.sqlite`);
    const ownId = getSetting("branch_id",""), ownCounters = ownId? all("SELECT doc_type,last_no FROM doc_counters WHERE branch_id=?",[ownId]) : [];
    db = new SQL.Database(bytes);
    db.run(SCHEMA); migrate(db);
    keepDeviceIdentity(ownId, ownCounters);
    currency = getSetting("currency","$");
    backfillBranch(db, currentBranch());
    await persist();
    render();
    alert("Data imported.");
  }


  // branch_id is never copied from imported data. If the file carries this device's
  // own id it is kept; otherwise the device's own id is put back (or, if it had
  // none, a fresh one is made). The device's DN/GRV counters are carried over
  // (highest wins), so restoring an older backup can never reuse a number.
  function keepDeviceIdentity(ownId, ownCounters){
    if(ownId){
      if(getSetting("branch_id","")!==ownId) setSetting("branch_id", ownId);
      (ownCounters||[]).forEach(c=>run(`INSERT INTO doc_counters(branch_id,doc_type,last_no) VALUES(?,?,?)
        ON CONFLICT(branch_id,doc_type) DO UPDATE SET last_no=MAX(last_no,excluded.last_no)`,[ownId,c.doc_type,c.last_no]));
    } else resetBranchId();
  }

  const SQLITE_MIME = "application/x-sqlite3";
  function exportScopeOptions(){
    const cur = currentBranch();
    const others = listBranches().filter(b=>b!==cur);
    const opts = [{value:cur, label:`${cur} only (this branch)`}];
    others.forEach(b=> opts.push({value:b, label:`${b} only`}));
    if(others.length) opts.push({value:"*", label:"Both / all branches on this device"});
    return opts;
  }
  // Data file for export. scope: "*" (or omitted) = everything on this device,
  // otherwise a branch name — only that branch's rows are kept, in a throwaway
  // copy, so the live database is untouched.
  function exportBytes(scope){
    if(!scope || scope==="*") return db.export();
    const copy = new SQL.Database(db.export());
    try{
      const run2 = (sql,p=[])=>{ try{ copy.run(sql,p); }catch(e){} };
      ["products","sales","eod_sessions","payouts","credit_payments","stock_received","audit_log",
       "stock_requests","purchases","staff","vouchers","stocktakes","stock_adjustments"].forEach(t=>
        run2(`DELETE FROM ${t} WHERE branch<>?`,[scope]));
      run2("DELETE FROM stock_transfers WHERE from_branch<>? AND to_branch<>?",[scope,scope]);
      run2("DELETE FROM dispatch_docs WHERE dispatch_branch_name<>? AND receive_branch_name<>?",[scope,scope]);
      run2("DELETE FROM dn_events WHERE dn_from_name<>? AND dn_to_name<>?",[scope,scope]);
      run2("DELETE FROM branch_prices WHERE dest_branch_name<>?",[scope]);
      run2("DELETE FROM sale_items WHERE sale_id NOT IN (SELECT id FROM sales)");
      run2("DELETE FROM stocktake_counts WHERE stocktake_id NOT IN (SELECT id FROM stocktakes)");
      run2(`DELETE FROM customers WHERE id NOT IN (SELECT customer_id FROM sales WHERE customer_id IS NOT NULL)
              AND id NOT IN (SELECT customer_id FROM credit_payments WHERE customer_id IS NOT NULL)
              AND id NOT IN (SELECT customer_id FROM vouchers WHERE customer_id IS NOT NULL)`);
      return copy.export();
    } finally { copy.close(); }
  }
  function saveFile(bytes, filename, mime){
    const blob = new Blob([bytes], {type:mime});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    a.click();
    saveCopyToExportFolder(bytes, filename);
  }
  function downloadDb(filename, scope){
    saveFile(exportBytes(scope), filename, SQLITE_MIME);
  }
  // Best-effort mirror of an export into the folder chosen via
  // window.showDirectoryPicker() (Section 11) — a no-op when no folder has
  // been chosen, or when the handle's permission has lapsed since.
  async function saveCopyToExportFolder(bytes, filename){
    if(!exportDirHandle) return;
    try{
      // A restored handle needs its permission re-granted after a reload;
      // this runs inside the export click, so the prompt is allowed.
      const opts = {mode:"readwrite"};
      if(await exportDirHandle.queryPermission(opts) !== "granted" &&
         await exportDirHandle.requestPermission(opts) !== "granted") return;
      const fileHandle = await exportDirHandle.getFileHandle(filename, {create:true});
      const writable = await fileHandle.createWritable();
      await writable.write(bytes);
      await writable.close();
    }catch(e){ /* best-effort only */ }
  }
  // Shares the export directly into WhatsApp (or whatever the OS share
  // sheet offers) via the Web Share API when the browser supports sharing
  // files, falling back to the normal download otherwise.
  async function shareOrSaveFile(bytes, filename, mime){
    const file = new File([bytes], filename, {type:mime});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      try{
        await navigator.share({files:[file], title:filename});
        saveCopyToExportFolder(bytes, filename);
        return;
      }catch(e){
        if(e && e.name==="AbortError") return;
      }
    }
    saveFile(bytes, filename, mime);
    alert("Your browser doesn't support direct sharing — the file has been downloaded instead; attach it in WhatsApp manually.");
  }
  const shareOrDownloadDb = (filename, scope)=> shareOrSaveFile(exportBytes(scope), filename, SQLITE_MIME);

  // Items to Excel — same columns as the import template (plus Branch and
  // Shelf), so an exported list can be edited and imported back. Cost and
  // search keywords are left out on Remote branches, where they're hidden.
  const XLSX_MIME = "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";
  async function itemsExcelBytes(scope){
    await loadXLSX();
    const items = (!scope || scope==="*")? all("SELECT * FROM products ORDER BY branch,name")
                                        : all("SELECT * FROM products WHERE branch=? ORDER BY name",[scope]);
    const full = !isRemote();
    const data = items.map(p=>{
      const r = {"Branch":p.branch||"", "SKU":p.sku||"", "Item Name":p.name, "Shelf":p.shelf||""};
      if(full){ r["Search Keywords"]=p.description||""; r["Cost"]=p.cost||0; }
      r["Price"]=p.price; r["Qty"]=p.stock; r["Low Stock Alert Below"]=p.low_threshold;
      return r;
    });
    const ws = XLSX.utils.json_to_sheet(data);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Items");
    return XLSX.write(wb, {type:"array", bookType:"xlsx"});
  }
  async function exportItemsExcel(scope, share){
    try{
      const bytes = new Uint8Array(await itemsExcelBytes(scope));
      const name = docFilename({type:"ItemList", prefix:"ITM", ext:"xlsx", scope});
      if(share) await shareOrSaveFile(bytes, name, XLSX_MIME); else saveFile(bytes, name, XLSX_MIME);
    }catch(e){
      alert("Couldn't export the item list: " + (e.message||e));
    }
  }

  // App log for audit — the activity log as CSV (opens in Excel) for a date
  // range and branch scope, to send to whoever requested it.
  function appLogCsvBytes(scope, fromTs, toTs){
    const logs = (!scope || scope==="*")
      ? all("SELECT * FROM audit_log WHERE ts>=? AND ts<=? ORDER BY ts",[fromTs,toTs])
      : all("SELECT * FROM audit_log WHERE branch=? AND ts>=? AND ts<=? ORDER BY ts",[scope,fromTs,toTs]);
    const q = (v)=> `"${String(v==null?"":v).replace(/"/g,'""')}"`;
    const lines = [["Date/Time","Branch","User","Action","Item","Details"].map(q).join(",")];
    logs.forEach(a=> lines.push([a.ts,a.branch,a.user,a.action,a.product_name,a.details].map(q).join(",")));
    return { bytes:new TextEncoder().encode("﻿"+lines.join("\r\n")), count:logs.length };
  }
  async function sendAppLog(scope, from, to, share){
    if(!from || !to) return alert("Choose the From and To dates.");
    const {bytes, count} = appLogCsvBytes(scope, from+"T00:00:00", to+"T23:59:59");
    if(count===0) return alert("No activity was logged in that date range.");
    logAudit("Export App Log", "", `${count} entries, ${from} to ${to}, ${scopeLabel(scope)}${share?" (shared)":""}`);
    persist();
    const fd = (iso)=> fileDatePart(new Date(iso+"T00:00:00"));
    const name = docFilename({type:"AppLog", prefix:"LOG", ext:"csv", scope, period:`${fd(from)}-to-${fd(to)}`});
    if(share) await shareOrSaveFile(bytes, name, "text/csv"); else saveFile(bytes, name, "text/csv");
  }

  // ---------------- merge ----------------
  async function mergeDatabase(bytes){
    const refused = mainFileProblem(bytes, "merge");
    if(refused) throw Object.assign(new Error(refused), { code:"MAIN_FILE_REFUSED" });
    const impDb = new SQL.Database(bytes);
    impDb.run(SCHEMA); migrate(impDb);
    const impBranch = getSettingX(impDb,"branch_name","") || getSettingX(impDb,"shop_name","") || "Imported Branch";
    backfillBranch(impDb, impBranch);

    const prodMap = {};
    allX(impDb,"SELECT * FROM products").forEach(p=>{
      const existing = one("SELECT * FROM products WHERE name=? AND branch=?",[p.name,p.branch]);
      if(existing){ prodMap[p.id]=existing.id; }
      else{
        run("INSERT INTO products(name,price,stock,low_threshold,sku,branch,image,cost,created_ts,description) VALUES(?,?,?,?,?,?,?,?,?,?)",
          [p.name,p.price,p.stock,p.low_threshold,p.sku||"",p.branch,p.image||"",p.cost||0,p.created_ts||new Date().toISOString(),p.description||""]);
        prodMap[p.id] = one("SELECT last_insert_rowid() as id").id;
      }
    });

    const custMap = {};
    allX(impDb,"SELECT * FROM customers").forEach(c=>{
      const existing = one("SELECT * FROM customers WHERE lower(name)=lower(?) AND COALESCE(phone,'')=COALESCE(?,'')",[c.name,c.phone]);
      if(existing){ custMap[c.id]=existing.id; }
      else{
        run("INSERT INTO customers(name,phone,branch) VALUES(?,?,?)",[c.name,c.phone,c.branch]);
        custMap[c.id]=one("SELECT last_insert_rowid() as id").id;
      }
    });

    const saleMap = {}; const newSaleImpIds = new Set();
    allX(impDb,"SELECT * FROM sales").forEach(s=>{
      const dup = one("SELECT id FROM sales WHERE branch=? AND ts=?",[s.branch,s.ts]);
      if(dup){ saleMap[s.id]=dup.id; return; }
      const newCustId = s.customer_id? (custMap[s.customer_id]||null) : null;
      run(`INSERT INTO sales(ts,subtotal,discount,total,method,customer_id,branch,discount_reason,discount_approved_by,discount_status,markup,markup_reason,payment_ref,user,voucher_amount)
           VALUES(?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)`,
        [s.ts,s.subtotal||0,s.discount||0,s.total,s.method,newCustId,s.branch,s.discount_reason||"",s.discount_approved_by||"",s.discount_status||"",s.markup||0,s.markup_reason||"",s.payment_ref||"",s.user||"",s.voucher_amount||0]);
      saleMap[s.id]=one("SELECT last_insert_rowid() as id").id;
      newSaleImpIds.add(s.id);
    });
    allX(impDb,"SELECT * FROM sale_items").forEach(it=>{
      if(!newSaleImpIds.has(it.sale_id)) return;
      const newProdId = prodMap[it.product_id]||null;
      run("INSERT INTO sale_items(sale_id,product_id,name,price,qty,cost) VALUES(?,?,?,?,?,?)",
        [saleMap[it.sale_id], newProdId, it.name, it.price, it.qty, it.cost||0]);
    });

    allX(impDb,"SELECT * FROM payouts").forEach(p=>{
      const dup = one("SELECT id FROM payouts WHERE branch=? AND ts=?",[p.branch,p.ts]);
      if(dup) return;
      run("INSERT INTO payouts(ts,amount,reason,branch,user) VALUES(?,?,?,?,?)",[p.ts,p.amount,p.reason,p.branch,p.user||""]);
    });

    allX(impDb,"SELECT * FROM stock_received").forEach(r=>{
      // Rows linked to a DN/GRV (dispatch and receipt lines) share one timestamp per
      // document, so the old (branch, ts) key would keep only the first line. They
      // are de-duplicated per line instead; every other row keeps the old rule.
      // Stock adjustment ledger rows (Phase 4b) are keyed by (adj_branch_id, adj_no).
      const isAdj = r.adj_no!=null && r.adj_branch_id;
      const linked = r.dn_no!=null;
      const dup = isAdj
        ? one("SELECT id FROM stock_received WHERE adj_branch_id=? AND adj_no=?",[r.adj_branch_id,r.adj_no])
        : linked
        ? one("SELECT id FROM stock_received WHERE branch=? AND dn_branch_id=? AND dn_no=? AND name=? AND qty=?",[r.branch,r.dn_branch_id,r.dn_no,r.name,r.qty])
        : one("SELECT id FROM stock_received WHERE branch=? AND ts=?",[r.branch,r.ts]);
      if(dup) return;
      const newProdId = prodMap[r.product_id]||null;
      run("INSERT INTO stock_received(ts,product_id,name,qty,note,branch,user,dn_branch_id,dn_no,grv_no,adj_branch_id,adj_no) VALUES(?,?,?,?,?,?,?,?,?,?,?,?)",
        [r.ts,newProdId,r.name,r.qty,r.note,r.branch,r.user||"",linked?r.dn_branch_id:null,linked?r.dn_no:null,r.grv_no==null?null:r.grv_no,
         isAdj?r.adj_branch_id:null,isAdj?r.adj_no:null]);
    });

    // Stock adjustments (Phase 4b): additive, one row per (branch_id, adj_no), never updated.
    // products.stock is never touched by the merge, so nothing is counted twice.
    allX(impDb,"SELECT * FROM stock_adjustments").forEach(a=>{
      if(!a.branch_id || a.adj_no==null) return;
      if(one("SELECT id FROM stock_adjustments WHERE branch_id=? AND adj_no=?",[a.branch_id,a.adj_no])) return;
      run(`INSERT INTO stock_adjustments(branch,branch_id,adj_no,product_code,product_name,qty_delta,reason,note,by_user,authorised_by,ts,dn_branch_id,dn_no)
           VALUES(?,?,?,?,?,?,?,?,?,?,?,?,?)`,
        [a.branch||"",a.branch_id,a.adj_no,a.product_code||"",a.product_name||"",a.qty_delta,a.reason||"",a.note||"",a.by_user||"",a.authorised_by||"",a.ts,
         a.dn_branch_id||null,a.dn_no==null?null:a.dn_no]);
    });

    allX(impDb,"SELECT * FROM credit_payments").forEach(cp=>{
      const dup = one("SELECT id FROM credit_payments WHERE branch=? AND ts=?",[cp.branch,cp.ts]);
      if(dup) return;
      const newCustId = custMap[cp.customer_id]||null;
      if(!newCustId) return;
      run("INSERT INTO credit_payments(customer_id,ts,amount,note,branch,user) VALUES(?,?,?,?,?,?)",[newCustId,cp.ts,cp.amount,cp.note,cp.branch,cp.user||""]);
    });

    allX(impDb,"SELECT * FROM eod_sessions").forEach(e=>{
      const dup = one("SELECT id FROM eod_sessions WHERE branch=? AND date=? AND expected_cash=? AND counted_cash=?",[e.branch,e.date,e.expected_cash,e.counted_cash]);
      if(dup) return;
      run("INSERT INTO eod_sessions(date,expected_cash,counted_cash,variance,notes,branch,ts) VALUES(?,?,?,?,?,?,?)",
        [e.date,e.expected_cash,e.counted_cash,e.variance,e.notes||"",e.branch,e.ts||""]);
    });

    allX(impDb,"SELECT * FROM audit_log").forEach(a=>{
      const dup = one("SELECT id FROM audit_log WHERE branch=? AND ts=?",[a.branch,a.ts]);
      if(dup) return;
      run("INSERT INTO audit_log(ts,branch,user,action,product_name,details) VALUES(?,?,?,?,?,?)",[a.ts,a.branch,a.user||"",a.action,a.product_name,a.details]);
    });

    allX(impDb,"SELECT * FROM stock_requests").forEach(r=>{
      const dup = one("SELECT id FROM stock_requests WHERE branch=? AND ts=?",[r.branch,r.ts]);
      if(dup) return;
      run("INSERT INTO stock_requests(ts,branch,user,item_requested,customer_name,customer_phone,qty_wanted,notes,fulfilled) VALUES(?,?,?,?,?,?,?,?,?)",
        [r.ts,r.branch,r.user||"",r.item_requested,r.customer_name||"",r.customer_phone||"",r.qty_wanted||null,r.notes||"",r.fulfilled||0]);
    });

    allX(impDb,"SELECT * FROM stock_transfers").forEach(t=>{
      // Lines that belong to a Delivery Note merge as records only (dn_no is
      // kept, and every pending-receipt query excludes dn_no rows). They are
      // de-duplicated per DN line, because all lines of one DN share a ts.
      const dup = t.dn_no!=null
        ? one("SELECT id FROM stock_transfers WHERE from_branch=? AND dn_no=? AND sku=? AND product_name=?",[t.from_branch,t.dn_no,t.sku||"",t.product_name])
        : one("SELECT id FROM stock_transfers WHERE from_branch=? AND ts=?",[t.from_branch,t.ts]);
      if(dup){
        if(t.dn_branch_id) run("UPDATE stock_transfers SET dn_branch_id=? WHERE id=? AND (dn_branch_id IS NULL OR dn_branch_id='')",[t.dn_branch_id,dup.id]);
        return;
      }
      run(`INSERT INTO stock_transfers(ts,from_branch,to_branch,product_name,sku,qty,note,user,status,received_ts,received_user,dn_no,dn_branch_id)
           VALUES(?,?,?,?,?,?,?,?,?,?,?,?,?)`,
        [t.ts,t.from_branch,t.to_branch,t.product_name,t.sku||"",t.qty,t.note||"",t.user||"",t.status||"Dispatched",t.received_ts||"",t.received_user||"",t.dn_no==null?null:t.dn_no,t.dn_branch_id||null]);
    });

    // DN events (Phase 4): additive, one row per fact. dispatch_docs itself is
    // NOT merged (its key would clash between the dispatcher's and receiver's rows).
    // event_key de-duplicates: the same fact reaching main from two devices is one row.
    allX(impDb,"SELECT * FROM dn_events").forEach(e=>{
      recordDnEvent({ dnBranchId:e.dn_branch_id, dnNo:e.dn_no, type:e.event_type, actorBranchId:e.actor_branch_id, actorName:e.actor_branch_name,
        fromName:e.dn_from_name, toName:e.dn_to_name, ts:e.event_ts, grvNo:e.grv_no, detail:e.detail_json||"" });
    });

    // Destination register: main's list of branches (and WhatsApp numbers)
    // reaches Remote devices through this merge. Only ever adds; a number is
    // filled in only where the local entry has none.
    allX(impDb,"SELECT * FROM branch_register").forEach(b=>{
      const ex = one("SELECT * FROM branch_register WHERE name=?",[b.name]);
      if(!ex) run("INSERT INTO branch_register(name,whatsapp) VALUES(?,?)",[b.name,b.whatsapp||""]);
      else if(!ex.whatsapp && b.whatsapp) run("UPDATE branch_register SET whatsapp=? WHERE id=?",[b.whatsapp,ex.id]);
    });

    allX(impDb,"SELECT * FROM staff").forEach(s=>{
      const existing = one("SELECT * FROM staff WHERE branch=? AND name=?",[s.branch,s.name]);
      if(existing) return;
      run("INSERT INTO staff(name,role,passcode,branch,active,created_ts) VALUES(?,?,?,?,?,?)",
        [s.name,s.role||"Cashier",s.passcode||"",s.branch,s.active!==undefined?s.active:1,s.created_ts||new Date().toISOString()]);
    });

    allX(impDb,"SELECT * FROM vouchers").forEach(v=>{
      const newCustId = custMap[v.customer_id]||null;
      if(!newCustId) return;
      const dup = one("SELECT id FROM vouchers WHERE customer_id=? AND earned_ts=?",[newCustId,v.earned_ts]);
      if(dup) return;
      const newSaleId = v.redeemed_sale_id? (saleMap[v.redeemed_sale_id]||null) : null;
      run("INSERT INTO vouchers(customer_id,amount,branch,earned_ts,status,redeemed_ts,redeemed_sale_id) VALUES(?,?,?,?,?,?,?)",
        [newCustId,v.amount,v.branch,v.earned_ts,v.status||"Available",v.redeemed_ts||"",newSaleId]);
    });

    // Information for main only: where the branch's prices differ from main's,
    // read straight from the imported file (the merge itself never overwrites
    // an existing product). Nothing here changes any data.
    let priceDiffs = [];
    if(!isRemote()){
      priceDiffs = priceDifferences(
        all("SELECT sku,name,price FROM products WHERE branch=?",[currentBranch()]),
        allX(impDb,"SELECT sku,name,price FROM products WHERE branch=?",[impBranch]));
    }
    return { branch: impBranch, priceDiffs };
  }

      <label>Role</label>
      <select class="field" id="stRole">
        <option value="Cashier" ${(!existing||existing.role==="Cashier")?"selected":""}>Cashier</option>
        <option value="Admin" ${(existing&&existing.role==="Admin")?"selected":""}>Admin</option>
      </select>
      <label>Passcode</label>
      <input class="field" id="stPasscode" value="${escapeHtml(existing? (existing.passcode||"") : "")}" placeholder="Numeric or text code">
      ${isEdit? `<label style="display:flex;align-items:center;gap:8px;margin-top:14px"><input type="checkbox" id="stActive" ${existing.active? "checked":""} style="width:auto;margin:0"> Active</label>` : ""}
      <button class="btn btn-primary" id="stConfirm" style="margin-top:14px">${isEdit? "Save Changes" : "Add Staff"}</button>
    `);
    wrap.querySelector("#stConfirm").onclick=()=>{
      const name = wrap.querySelector("#stName").value.trim();
      if(!name) return alert("Enter the staff member's name");
      const role = wrap.querySelector("#stRole").value;
      const passcode = wrap.querySelector("#stPasscode").value.trim();
      if(isEdit){
        const active = wrap.querySelector("#stActive").checked?1:0;
        run("UPDATE staff SET name=?, role=?, passcode=?, active=? WHERE id=?",[name,role,passcode,active,existing.id]);
      } else {
        run("INSERT INTO staff(name,role,passcode,branch,active,created_ts) VALUES(?,?,?,?,1,?)",
          [name,role,passcode,currentBranch(),new Date().toISOString()]);
      }
      persist(); wrap.remove(); render();
    };
  }
  function wireStaffSection(){
    document.getElementById("openAddStaff").onclick=()=>staffModal(null);
    document.querySelectorAll("[data-edit-staff]").forEach(b=>{
      b.onclick=()=>{
        const s = one("SELECT * FROM staff WHERE id=?",[+b.dataset.editStaff]);
        staffModal(s);
      };
    });
  }


  function renderWhoAmI(){
    route="whoami";
    const last = getSetting("last_user","");
    $app.innerHTML = `<div class="center-screen"><div class="setup-card center">
      <h2>Who's working today?</h2>
      <p class="muted">Your name is recorded against sales, stock changes, and discount approvals for this session.</p>
      <input class="field" id="whoName" placeholder="Your name" value="${escapeHtml(last)}" style="text-align:center;font-weight:700">
      <button class="btn btn-primary" id="whoContinue" style="margin-top:14px">Continue</button>
    </div></div>`;
    const input = document.getElementById("whoName");
    input.focus();
    document.getElementById("whoContinue").onclick=()=>{
      const name = input.value.trim();
      if(!name) return alert("Enter your name to continue");
      sessionUser = name;
      setSetting("last_user", name); persist();
      route="pos"; render();
    };
  }
  function changeSessionUser(){
    const name = prompt("Who's working now?", sessionUser||"");
    if(name && name.trim()){ sessionUser = name.trim(); setSetting("last_user", sessionUser); persist(); render(); }
  }


  // ---- device Admin passcode (Phase 4) ----
  // A remote branch creates its OWN first Admin passcode, at Setup or on the locked
  // Settings screen while it has none. It no longer depends on merging a main
  // branch's data file to receive one.
  const ADMIN_PASSCODE_MIN = 4;
  // "" = fine, otherwise the plain reason.
  function adminPasscodeProblem(passcode, confirmText){
    const p = String(passcode==null?"":passcode).trim();
    if(p.length<ADMIN_PASSCODE_MIN) return "The Admin passcode must be at least "+ADMIN_PASSCODE_MIN+" characters.";
    if(p!==String(confirmText==null?"":confirmText).trim()) return "The two passcodes don't match.";
    return "";
  }
  function createDeviceAdmin(passcode, confirmText){
    const bad = adminPasscodeProblem(passcode, confirmText);
    if(bad) throw new Error(bad);
    const branch = currentBranch();
    let name = "Admin", n = 1;
    while(one("SELECT 1 AS x FROM staff WHERE branch=? AND name=?",[branch,name])){ n++; name = "Admin "+n; }
    run("INSERT INTO staff(name,role,passcode,branch,active,created_ts) VALUES(?,?,?,?,1,?)",
      [name,"Admin",String(passcode).trim(),branch,new Date().toISOString()]);
    return name;
  }

  // The Admin unlock shared by price edits and stock adjustments: an active Admin whose
  // (non-empty) passcode matches. There is no session unlock - it is typed each time.
  function findAdmin(passcode){
    const code = String(passcode==null?"":passcode);
    return code.trim()? (one("SELECT * FROM staff WHERE role='Admin' AND passcode=? AND passcode<>'' AND active=1",[code]) || null) : null;
  }

  function renderSettings(main){
    // Remote branches must unlock with the device's Admin passcode before seeing
    // anything but the Backup section. A remote with no Admin passcode yet creates
    // its own here (Setup asks for one on new remotes) - no main-branch file needed.
    if(isRemote() && !settingsUnlocked){
      const hasCode = hasAdminPasscode();
      main.innerHTML = `
        <div class="card">
          <h3>Settings Locked</h3>
          ${hasCode
            ? `<p class="muted">Enter the Admin passcode to unlock Settings.</p>
               <label>Admin passcode</label>
               <input class="field" id="settingsPasscode" type="password" placeholder="Enter passcode">
               <button class="btn btn-primary" id="unlockSettings" style="margin-top:10px">Unlock</button>`
            : `<p class="muted">This device has no Admin passcode yet. Create one now - it protects Settings and price changes on this branch.</p>
               <label>New Admin passcode (at least ${ADMIN_PASSCODE_MIN} characters)</label>
               <input class="field" id="newAdminPass" type="password" placeholder="Choose a passcode">
               <label>Repeat the passcode</label>
               <input class="field" id="newAdminPass2" type="password" placeholder="Repeat it">
               <button class="btn btn-primary" id="createAdmin" style="margin-top:10px">Create Admin passcode</button>`}
        </div>
        ${backupMergeSectionHtml()}
      `;
      const unlock = document.getElementById("unlockSettings");
      if(unlock) unlock.onclick=()=>{
        const code = document.getElementById("settingsPasscode").value;
        const match = code && one("SELECT * FROM staff WHERE role='Admin' AND passcode=? AND passcode<>'' AND active=1",[code]);
        if(match){ settingsUnlocked=true; render(); }
        else alert("Incorrect passcode.");
      };
      const create = document.getElementById("createAdmin");
      if(create) create.onclick=()=>{
        try{ createDeviceAdmin(document.getElementById("newAdminPass").value, document.getElementById("newAdminPass2").value); }
        catch(e){ return alert(e.message||String(e)); }
        persist(); settingsUnlocked=true; render();
      };
      wireBackupMergeSection();
      return;
    }
    main.innerHTML = `
      <div class="card">
        <h3>Shop details</h3>
        <p class="muted" style="font-size:11.5px;margin-top:-4px">Version ${escapeHtml(APP_VERSION)}</p>
        <label>Shop name</label><input class="field" id="sName" value="${escapeHtml(getSetting("shop_name",""))}">
        <label>Branch name</label><input class="field" id="sBranch" value="${escapeHtml(getSetting("branch_name",""))}" ${branchNameLocked()? "readonly" : ""}>
        ${branchNameLocked()? `<p class="muted" style="font-size:12px;margin-top:4px">🔒 The branch name is locked after setup, because Delivery Notes, catalogues and the branch register all carry it.</p>` : ""}
        <label>Branch type</label>
        <select class="field" id="sBranchType">
          <option value="main" ${!isRemote()?"selected":""}>Main Branch</option>
          <option value="remote" ${isRemote()?"selected":""}>Remote Branch</option>
        </select>
        <p class="muted">Remote branches can sell, but can't add or edit items, change stock quantities directly, or see item costs.</p>
        <label>Contact number</label><input class="field" id="sContact" value="${escapeHtml(getSetting("contact_phone",""))}">
        <label>Management WhatsApp number</label><input class="field" id="sMgmt" inputmode="tel" value="${escapeHtml(getSetting("management_whatsapp",""))}" placeholder="e.g. 0771234567">
        <p class="muted">Where variance reports on received stock are sent. On a remote branch this is filled in from the catalogue if left blank.</p>
        <label style="display:flex;gap:8px;align-items:flex-start;margin-top:14px"><input type="checkbox" id="sCancelOn" ${cancelEnabled()? "checked" : ""} style="width:auto;margin-top:3px"><span>Enable cancel and reissue of Delivery Notes on this device</span></label>
        <p class="muted">Turn this on only after <b>every</b> branch, main and remotes, has updated to this version. A branch on an older version can't read a cancellation or a reissued Delivery Note. It only sees "update the app".</p>
        <label>Mark a dispatch "Awaiting" after (days)</label>
        <input class="field" id="sAwait" type="number" min="1" max="365" step="1" value="${awaitingDays()}">
        <p class="muted">A Delivery Note with no Goods Received Voucher after this many days shows as Awaiting in Dispatch history and the Stock Movements report.</p>
        <label>Currency symbol</label><input class="field" id="sCurrency" value="${escapeHtml(currency)}">
        <label>Seed Money / Starting Capital</label>
        <input class="field" id="sSeedMoney" type="number" step="0.01" value="${escapeHtml(getSetting("seed_money","0"))}">
        <p class="muted">Used on More → Purchasing to track how much of your starting capital has been recovered from sales.</p>
        <label>Print width (mm)</label>
        <input class="field" id="sPaper" type="number" min="32" max="80" step="1" value="${paperWidth()}">
        <p class="muted">An estimate, not exact — use Print test line below to calibrate: if the digit/dash line wraps to a second row, lower this number and try again.</p>
        <button class="btn btn-outline" id="printTestLine" style="margin-bottom:12px">🖨️ Print test line</button>
        <button class="btn btn-primary" id="saveSettings" style="margin-top:12px">Save</button>
      </div>
      <div class="card">
        <h3>Activation secret phrase</h3>
        <input class="field" id="sSecret" value="${escapeHtml(getSetting("secret_phrase",""))}">
        <button class="btn btn-outline" id="saveSecret" style="margin-top:10px">Save phrase</button>
      </div>
      <div class="card">
        <h3>USB thermal printer</h3>
        ${hasUSBPrint()
          ? `<p class="muted">Available in this browser. Connect a printer via USB (or OTG cable on Android) and the 🔌 button next to Print will use it directly — no printer driver needed.</p>
             <button class="btn btn-outline" id="connectUsbBtn">🔌 Connect / test USB printer</button>`
          : `<p class="muted">Not available here — USB printing needs Chrome, and the app served via a local server (not opened as a plain file). A printer already installed as a normal Windows printer still works fine through the regular Print / PDF button.</p>`}
        ${hasBTPrint()? `
          <div class="hr"></div>
          <p class="muted">Connect a Bluetooth (BLE) thermal printer and the 🔵 button next to Print will use it directly. Not every printer's Bluetooth mode is compatible — Connect / Test will tell you honestly if it isn't. Since this shows every nearby Bluetooth device, not just printers, check the name below after connecting.</p>
          <button class="btn btn-outline" id="connectBtBtn">🔵 Connect / test Bluetooth printer</button>
          <div id="btStatus" class="muted" style="margin-top:6px"></div>
        ` : ""}
      </div>
      ${isRemote()? "" : `
      <div class="card">
        <h3>Frequent Customer Vouchers</h3>
        <p class="muted">Automatically issues a voucher to a customer once they've made enough purchases within a time window. Leave the voucher amount at 0 to keep this switched off.</p>
        <label style="margin-top:0">Purchases needed</label>
        <input class="field" id="sFreqCount" type="number" min="1" step="1" value="${escapeHtml(getSetting("freq_purchases_needed","5"))}">
        <label>...within how many days</label>
        <input class="field" id="sFreqDays" type="number" min="1" step="1" value="${escapeHtml(getSetting("freq_within_days","30"))}">
        <label>Voucher amount (${currency})</label>
        <input class="field" id="sFreqAmount" type="number" min="0" step="0.01" value="${escapeHtml(getSetting("freq_voucher_amount","0"))}">
        <button class="btn btn-primary" id="saveFreqSettings" style="margin-top:12px">Save</button>
      </div>`}
      ${isRemote()? "" : staffSectionHtml()}
      ${isRemote()? "" : branchRegisterCardHtml()}
      ${backupMergeSectionHtml()}
    `;
    document.getElementById("printTestLine").onclick=()=>printTestLine();
    document.getElementById("saveSettings").onclick=()=>{
      setSetting("shop_name", document.getElementById("sName").value.trim());
      setSetting("branch_name", branchNameToSave(document.getElementById("sBranch").value));
      setSetting("awaiting_days", String(awaitingDaysFrom(document.getElementById("sAwait").value)));
      { // switching cancel/reissue on or off needs an Admin
        const want = document.getElementById("sCancelOn").checked;
        if(want!==cancelEnabled()){
          if(!hasAdminPasscode()) alert(NO_ADMIN_PASSCODE_MSG+" before this can be changed.");
          else if(!findAdmin(prompt("Admin passcode to "+(want? "switch on" : "switch off")+" cancel and reissue:")||"")) alert("Incorrect Admin passcode. Cancel and reissue was not changed.");
          else { setSetting("cancel_enabled", want? "1" : ""); logAudit("Cancel and reissue", "", want? "switched on" : "switched off"); }
        }
      }
      setSetting("branch_type", document.getElementById("sBranchType").value);
      setSetting("contact_phone", document.getElementById("sContact").value.trim());
      setSetting("management_whatsapp", document.getElementById("sMgmt").value.trim());
      currency = document.getElementById("sCurrency").value.trim()||"$";
      setSetting("currency", currency);
      setSetting("seed_money", parseFloat(document.getElementById("sSeedMoney").value)||0);
      setSetting("paper_width", document.getElementById("sPaper").value);
      persist(); render();
    };
    const saveFreqBtn = document.getElementById("saveFreqSettings");
    if(saveFreqBtn) saveFreqBtn.onclick=()=>{
      setSetting("freq_purchases_needed", parseInt(document.getElementById("sFreqCount").value)||5);
      setSetting("freq_within_days", parseInt(document.getElementById("sFreqDays").value)||30);
      setSetting("freq_voucher_amount", parseFloat(document.getElementById("sFreqAmount").value)||0);
      persist(); alert("Voucher settings saved.");
    };
    document.getElementById("saveSecret").onclick=()=>{
      setSetting("secret_phrase", document.getElementById("sSecret").value.trim());
      persist(); alert("Secret phrase saved.");
    };
    const connectUsbBtn = document.getElementById("connectUsbBtn");
    if(connectUsbBtn) connectUsbBtn.onclick=async ()=>{
      const ok = await connectUSBPrinter();
      if(ok) alert("Connected. The 🔌 button next to Print will now use this printer.");
    };
    const connectBtBtn = document.getElementById("connectBtBtn");
    if(connectBtBtn) connectBtBtn.onclick=async ()=>{
      const ok = await connectBTPrinter();
      const statusEl = document.getElementById("btStatus");
      if(ok && statusEl){
        const name = window._btPrinter.device.name || "an unnamed device";
        statusEl.textContent = `Connected to "${name}". The 🔵 button next to Print will now use this printer.`;
      }
    };
    if(!isRemote()) wireStaffSection();
    if(!isRemote()) wireBranchRegisterCard();
    wireBackupMergeSection();
  }

  // ================== SETUP FLOW ==================
  let setupStep = 1;
  let setupData = {shop_name:"",branch_name:"",contact_phone:"",banner_image:"",currency:"$",branch_type:"main",admin_pass:"",admin_pass2:""};

  function renderSetup(){
    $app.innerHTML = `
      <div class="center-screen">
        <div class="setup-card">
          <div class="step-dots">${[1,2,3].map(n=>`<span class="${n<=setupStep?'on':''}"></span>`).join("")}</div>
          ${setupStep===1? `
            <h2>Welcome</h2>
            <p class="muted">Let's set up seiGEN Commerce Lite for your shop.</p>
            <label>Shop name</label>
            <input class="field" id="setShop" value="${escapeHtml(setupData.shop_name)}" placeholder="e.g. Gentronix">
            <label>Branch name (optional)</label>
            <input class="field" id="setBranch" value="${escapeHtml(setupData.branch_name)}" placeholder="e.g. Harare CBD">
            <label>Branch type</label>
            <div class="row">
              <button type="button" class="btn ${setupData.branch_type==='main'?'btn-primary':'btn-outline'}" id="setMainBtn">Main Branch</button>
              <button type="button" class="btn ${setupData.branch_type==='remote'?'btn-primary':'btn-outline'}" id="setRemoteBtn">Remote Branch</button>
            </div>
            <p class="muted" style="margin-top:8px">Remote branches can sell, but can't add or edit items, change stock quantities directly, or see item costs.</p>
            <button class="btn btn-primary" id="setupNext" style="margin-top:16px">Continue</button>
          ` : setupStep===2? `
            <h2>Contact & branding</h2>
            <label>Contact / WhatsApp number</label>
            <input class="field" id="setContact" value="${escapeHtml(setupData.contact_phone)}" placeholder="e.g. +263...">
            <label>Currency symbol</label>
            <input class="field" id="setCurrency" value="${escapeHtml(setupData.currency)}" placeholder="$">
            <label>Shop banner / logo image (optional)</label>
            <input class="field" id="setBanner" type="file" accept="image/*">
            ${setupData.banner_image? `<img class="banner-img" src="${setupData.banner_image}">`:""}
            ${setupData.branch_type==='remote'? `
              <div class="hr"></div>
              <label>Admin passcode for this branch (at least ${ADMIN_PASSCODE_MIN} characters)</label>
              <input class="field" id="setAdminPass" type="password" value="${escapeHtml(setupData.admin_pass)}" placeholder="Choose a passcode">
              <label>Repeat the passcode</label>
              <input class="field" id="setAdminPass2" type="password" value="${escapeHtml(setupData.admin_pass2)}" placeholder="Repeat it">
              <p class="muted">It unlocks Settings and price changes on this remote branch. You create it here; it does not come from the main branch.</p>` : ""}
            <div class="row" style="margin-top:16px">
              <button class="btn btn-outline" id="setupBack">Back</button>
              <button class="btn btn-primary" id="setupNext2">Continue</button>
            </div>
          ` : `
            <h2>Confirm</h2>
            ${setupData.banner_image? `<img class="banner-img" src="${setupData.banner_image}">`:""}
            <table class="simple">
              <tr><td class="muted">Shop</td><td>${escapeHtml(setupData.shop_name)}</td></tr>
              <tr><td class="muted">Branch</td><td>${escapeHtml(setupData.branch_name)||"—"}</td></tr>
              <tr><td class="muted">Branch type</td><td>${setupData.branch_type==='main'?'Main Branch':'Remote Branch'}</td></tr>
              ${setupData.branch_type==='remote'? `<tr><td class="muted">Admin passcode</td><td>Set</td></tr>` : ""}
              <tr><td class="muted">Contact</td><td>${escapeHtml(setupData.contact_phone)||"—"}</td></tr>
              <tr><td class="muted">Currency</td><td>${escapeHtml(setupData.currency)}</td></tr>
            </table>
            <p class="muted">You get 30 days free use from today. After that, this screen will ask for an activation code — call or WhatsApp +263774479121.</p>
            <div class="row" style="margin-top:10px">
              <button class="btn btn-outline" id="setupBack2">Back</button>
              <button class="btn btn-primary" id="setupFinish">Finish setup</button>
            </div>
          `}
        </div>
      </div>
    `;
    if(setupStep===1){
      document.getElementById("setMainBtn").onclick=()=>{ setupData.branch_type="main"; renderSetup(); };
      document.getElementById("setRemoteBtn").onclick=()=>{ setupData.branch_type="remote"; renderSetup(); };
      document.getElementById("setupNext").onclick=()=>{
        setupData.shop_name = document.getElementById("setShop").value.trim();
        setupData.branch_name = document.getElementById("setBranch").value.trim();
        if(!setupData.shop_name) return alert("Enter your shop name");
        setupStep=2; renderSetup();
      };
    } else if(setupStep===2){
      document.getElementById("setupBack").onclick=()=>{setupStep=1;renderSetup();};
      document.getElementById("setBanner").onchange=(e)=>{
        setupData.contact_phone = document.getElementById("setContact").value.trim();
        setupData.currency = document.getElementById("setCurrency").value.trim()||"$";
        const pa = document.getElementById("setAdminPass"); if(pa){ setupData.admin_pass = pa.value; setupData.admin_pass2 = document.getElementById("setAdminPass2").value; }
        const f = e.target.files[0];
        if(!f) return;
        const reader = new FileReader();
        reader.onload = ()=>{ setupData.banner_image = reader.result; renderSetup(); };
        reader.readAsDataURL(f);
      };
      document.getElementById("setupNext2").onclick=()=>{
        setupData.contact_phone = document.getElementById("setContact").value.trim();
        setupData.currency = document.getElementById("setCurrency").value.trim()||"$";
        if(setupData.branch_type==='remote'){
          setupData.admin_pass = document.getElementById("setAdminPass").value;
          setupData.admin_pass2 = document.getElementById("setAdminPass2").value;
          const bad = adminPasscodeProblem(setupData.admin_pass, setupData.admin_pass2);
          if(bad) return alert(bad);
        }
        setupStep=3; renderSetup();
      };
    } else {
      document.getElementById("setupBack2").onclick=()=>{setupStep=2;renderSetup();};
      document.getElementById("setupFinish").onclick=async ()=>{
        setSetting("shop_name", setupData.shop_name);
        setSetting("branch_name", setupData.branch_name);
        setSetting("branch_type", setupData.branch_type);
        setSetting("contact_phone", setupData.contact_phone);
        setSetting("currency", setupData.currency);
        setSetting("banner_image", setupData.banner_image);
        setSetting("paper_width","80");
        setSetting("install_id", uid4());
        resetBranchId();                       // a new branch always gets a fresh identity
        const now = new Date();
        setSetting("install_date", now.toISOString());
        const until = new Date(now.getTime()+30*86400000);
        setSetting("activated_until", until.toISOString());
        setSetting("setup_complete","1");
        currency = setupData.currency;
        backfillBranch(db, currentBranch());
        if(setupData.branch_type==='remote') createDeviceAdmin(setupData.admin_pass, setupData.admin_pass2);
        setupData.admin_pass = setupData.admin_pass2 = "";
        await persist();
        route="pos"; render();
      };
    }
  }


  // ================== BOOT ==================
  function renderLoading(){
    $app.innerHTML = `<div class="center-screen"><div class="setup-card center">
      <h2>Starting…</h2>
      <p class="muted">Loading seiGEN Commerce Lite.</p>
    </div></div>`;
  }
  function renderBootError(){
    $app.innerHTML = `<div class="center-screen"><div class="setup-card center">
      <h2>Couldn't start</h2>
      <p class="muted">This needs an internet connection the first time it opens on a device (to load its database engine) — after that it works offline.</p>
      <p class="muted">Also make sure it's opened in a real browser (Chrome), not a preview screen inside WhatsApp or a file manager — tap "Open with" and choose Chrome if unsure.</p>
      <button class="btn btn-primary" id="retryBoot">Retry</button>
    </div></div>`;
    document.getElementById("retryBoot").onclick=boot;
  }
  async function boot(){
    renderLoading();
    try{
      await initDB();
    }catch(e){ renderBootError(); return; }
    const status = activationStatus();
    if(status==="no_setup"){ route="setup"; renderSetup(); return; }
    if(status==="locked"){ route="lock"; renderLock(); return; }
    renderWhoAmI();
  }
  // Only registers when actually served over http(s)/localhost — this
  // silently does nothing when the file is just double-clicked (file://),
  // so it's safe to leave in either way. When it IS registered (device
  // running a local server, or hosted), it's what makes "Install app"
  // available and caches the app + the sql.js library for full offline use.
  if("serviceWorker" in navigator && location.protocol !== "file:"){
    window.addEventListener("load", ()=>{
      navigator.serviceWorker.register("sw.js").catch(()=>{});
    });
  }
  boot();
})();
</script>
</body>
</html>
