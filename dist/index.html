  // ================== Shared branch stock (multi-terminal Phase 3b) ==================
  // Branches with more than one till can hold ONE stock count on Digital
  // Commerce. Design: docs/multi-terminal/phase3b-design.md (owner's answers §11).
  // Server: supabase/migrations/20261007120000_shared_stock.sql.
  //
  //   * Never below zero: the server checks the whole cart at once (from the
  //     branch's available pool first, then this till's own allowance) and
  //     refuses anything that would go below zero.
  //   * Offline: a till sells only from its OFFLINE ALLOWANCE, which expires
  //     on the till 72 h after it was last granted (trusted clock, eod.js).
  //     Offline sales are reported on reconnect with their sale uid, so a sale
  //     that actually went through before a timeout is never counted twice.
  //   * On a shared-stock till products.stock IS this till's allowance; the
  //     last-known branch figures are products.branch_avail / branch_total.
  //   * moveStock (db.js) stays the one choke point: on a shared-stock till,
  //     increases are queued to the branch (sellable after sync, owner Q3);
  //     decreases that can't wait take this till's allowance and the rest is
  //     settled by the server. Dispatch, manual adjustments and stocktakes ask
  //     the server first (sharedStockPreApply).
  // Single-till branches that never start shared stock, and unregistered
  // shops: nothing here runs.

  const STOCK_SALE_TIMEOUT_MS = 4000;                  // owner, Q5
  const STOCK_ALLOW_TTL_MS = 72*3600*1000;             // owner, Q2
  const SS_LOCAL_KINDS = ["sale","allowance","shared_opening","merge_out"];
  let _ssBusy = false, _ssRunning = null;
  let _ssPreApplied = null;                            // productId -> { delta } | { setTo }, set by sharedStockPreApply

  function ssRegistered(){ return !!getSetting("terminal_id",""); }
  // This till sells from shared branch stock (the branch is shared and this
  // till has joined it: any own stock it had was merged or it had none).
  function sharedStockTill(){ return ssRegistered() && getSetting("stock_mode","")==="shared" && getSetting("stock_init","")==="1"; }
  function ssNowMs(){
    try{ if(typeof evaluateTrustedTime==="function") return evaluateTrustedTime(new Date()).time.getTime(); }catch(e){}
    return Date.now();
  }
  function ssNowIso(){ return new Date(ssNowMs()).toISOString(); }
  function allowanceValidUntil(){
    const ts = getSetting("stock_allow_local_ts","");
    return ts? Date.parse(ts) + STOCK_ALLOW_TTL_MS : 0;
  }
  function allowanceValid(){ return ssNowMs() < allowanceValidUntil(); }
  function stockReachable(){ return isOnline() && getSetting("stock_reach","")!=="fail"; }
  // What the till may sell of a product right now.
  function sellableNow(p){
    if(!p) return 0;
    if(!sharedStockTill() || !p.cat_uid) return p.stock;
    const own = allowanceValid()? Math.max(0, p.stock) : 0;
    return stockReachable()? Math.max(0, p.stock) + Math.max(0, p.branch_avail||0) : own;
  }
  // "12 in branch · 3 on this till" (online) / "3 on this till (offline)".
  function stockLineText(p){
    if(!sharedStockTill() || !p.cat_uid) return null;
    const pend = p.stock_pending_in>0? " · +"+p.stock_pending_in+" pending" : "";
    if(stockReachable()) return (p.branch_total||0)+" in branch · "+Math.max(0,p.stock)+" on this till"+pend;
    return allowanceValid()? Math.max(0,p.stock)+" on this till (offline)"+pend : "Offline · allowance expired"+pend;
  }
  function ssUid(){ return typeof catNewOp==="function"? catNewOp() : Array.from(crypto.getRandomValues(new Uint8Array(16)), x=>x.toString(16).padStart(2,"0")).join(""); }
  function ssRpc(name, extra, opts){ return terminalRpc(name, Object.assign(terminalAuth(), extra||{}), opts); }
  function ssProduct(catUid){ return one("SELECT * FROM products WHERE cat_uid=? AND branch=?",[catUid, currentBranch()]); }
  function ssNote(r){
    if(!r) return;
    if(r.ok) setSetting("stock_reach","ok");
    else if(r.reason==="offline" || r.reason==="network") setSetting("stock_reach","fail");
  }
  function ssProblemText(r){
    if(r && r.code==="TERMINAL_INACTIVE") return TERMINAL_INACTIVE_TEXT;
    if(r && r.code==="NOT_SHARED") return "This branch isn't using shared stock.";
    if(typeof catProblemText==="function") return catProblemText(r).replace("sync the catalogue","update shared stock");
    return "Couldn't reach Digital Commerce.";
  }

  // ---- outbox: what this till did offline, reported on reconnect ----
  function ssQueue(kind, payload, uid){
    run("INSERT OR IGNORE INTO stock_outbox(uid,kind,payload_json,created_ts) VALUES(?,?,?,?)",[uid||ssUid(), kind, JSON.stringify(payload), new Date().toISOString()]);
  }
  function ssPending(){ return all("SELECT * FROM stock_outbox WHERE COALESCE(sent_ts,'')='' ORDER BY created_ts, uid"); }
  // Allowance this till has used locally but not yet reported, per catalogue product.
  function ssPendingTakes(){
    const m = new Map(), add = (k,v)=>m.set(k,(m.get(k)||0)+v);
    ssPending().forEach(r=>{
      const p = JSON.parse(r.payload_json);
      if(r.kind==="sale") (p.lines||[]).forEach(l=>add(l.product_uid, l.qty));
      else if(r.kind==="move" && p.delta<0) add(p.product_uid, p.from_allowance_local||0);
    });
    return m;
  }

  // ---- moveStock hook (db.js): movements other than sales on a shared-stock till ----
  // Returns undefined to let moveStock work as before, or the local delta applied.
  function sharedStockIntercept(o){
    if(o.ssLocal || SS_LOCAL_KINDS.includes(o.kind) || !sharedStockTill()) return undefined;
    const p = one("SELECT * FROM products WHERE id=?",[o.productId]);
    if(!p || !p.cat_uid) return undefined;                          // branch-only products keep local stock (owner, Q8)
    const local = (d)=> d? moveStock(Object.assign({}, o, { delta:d, setTo:undefined, ssLocal:true })) : 0;
    if(_ssPreApplied && _ssPreApplied.has(p.id)){                    // the server already did it (dispatch, adjustment, stocktake)
      const pre = _ssPreApplied.get(p.id); _ssPreApplied.delete(p.id);
      if(pre.setTo!==undefined) return moveStock(Object.assign({}, o, { delta:undefined, setTo:pre.setTo, ssLocal:true }));
      return local(pre.delta||0);
    }
    const delta = (o.setTo!==undefined && o.setTo!==null)? o.setTo - p.stock : o.delta;
    if(!delta) return 0;
    const uid = ssUid();
    if(delta>0){                                                    // owner Q3: sellable once the branch has it
      ssQueue("move", { uid, product_uid:p.cat_uid, delta, kind:o.kind||"move" }, uid);
      run("UPDATE products SET stock_pending_in=COALESCE(stock_pending_in,0)+? WHERE id=?",[delta, p.id]);
      return 0;
    }
    const takeLocal = Math.min(Math.max(0, p.stock), -delta);
    ssQueue("move", { uid, product_uid:p.cat_uid, delta, kind:o.kind||"move", from_allowance_local:takeLocal }, uid);
    return local(-takeLocal);
  }

  // ---- the server first: dispatch, manual adjustment (decreases) ----
  // lines: [{ product, delta, kind }] -> { ok, message? }. On ok the local
  // commit must follow (sharedStockCommit), or sharedStockUndo on failure.
  async function sharedStockPreApply(lines){
    const linked = lines.filter(l=>l.product && l.product.cat_uid);
    if(!sharedStockTill() || !linked.length) return { ok:true, moves:[] };
    const moves = linked.map(l=>({ uid:ssUid(), product_uid:l.product.cat_uid, delta:l.delta, kind:l.kind, productId:l.product.id }));
    const r = await ssRpc("cl_stock_move", { p_moves: moves.map(m=>({ uid:m.uid, product_uid:m.product_uid, delta:m.delta, kind:m.kind })) });
    ssNote(r);
    if(!r.ok) return { ok:false, message: (r.reason==="offline"||r.reason==="network")? "This needs a connection at a shared-stock branch. Nothing was changed." : ssProblemText(r) };
    if(!r.data.ok){
      const bad = (r.data.refused||[])[0]||{}, prod = ssProduct(bad.product_uid);
      return { ok:false, message: bad.reason==="NOT_ENOUGH"? "Only "+bad.left+" "+(prod? prod.name : "of that product")+" left in the branch. Nothing was changed." : "Digital Commerce refused this ("+(bad.reason||"unknown")+"). Nothing was changed." };
    }
    _ssPreApplied = new Map();
    (r.data.moves||[]).forEach((res,i)=>{ const m = moves[i]; if(m) _ssPreApplied.set(m.productId, { delta:-(res.from_allowance||0) }); });
    return { ok:true, moves, rows:r.data.stock||[] };
  }
  // After the local commit: the server's new figures (allowance, branch stock).
  function sharedStockDone(pre){
    _ssPreApplied = null;
    if(pre && pre.rows && pre.rows.length) ssApplyRows(pre.rows);
  }
  // The local write failed after the server took the stock: give it back.
  async function sharedStockUndo(moves){
    _ssPreApplied = null;
    if(!moves || !moves.length) return;
    const back = moves.map(m=>({ uid:ssUid(), product_uid:m.product_uid, delta:-m.delta, kind:m.kind+"_undo" }));
    const r = await ssRpc("cl_stock_move", { p_moves:back });
    if(!r.ok || !r.data.ok) back.forEach(b=>ssQueue("move", b, b.uid));            // try again with the next report
  }

  // A refusal the cashier must read: an in-app message (alert() where there's no page).
  function ssShowMessage(title, text){
    if(typeof document!=="undefined" && document.body && typeof document.createElement==="function" && typeof openModal==="function"){
      const wrap = openModal(title, `<p class="ss-refusal" style="margin:0 0 12px;white-space:pre-line;font-weight:600;color:#b42318">${escapeHtml(text)}</p><button class="btn btn-primary" id="ssOk">OK</button>`);
      wrap.querySelector("#ssOk").onclick = ()=>wrap.remove();
    } else alert(text);
  }
  // ---- checkout (pos.js completeSale) ----
  // items: [{ product_id, qty }]; commit(plan) re-enters completeSale.
  async function sharedStockCheckout(items, commit, inputs){
    if(_ssBusy) return { ok:false };
    _ssBusy = true;
    if(typeof window!=="undefined") window._stockChecking = true;
    try{
      const saleUid = ssUid();
      const byPid = new Map();
      items.forEach(i=>byPid.set(i.product_id, (byPid.get(i.product_id)||0)+i.qty));
      const linked = [...byPid.entries()].map(([pid,qty])=>({ product: one("SELECT * FROM products WHERE id=?",[pid]), qty })).filter(l=>l.product && l.product.cat_uid);
      if(!linked.length){ commit({ saleUid, alloc:{}, mode:"local", inputs }); return { ok:true }; }
      const lines = linked.map(l=>({ product_uid:l.product.cat_uid, qty:l.qty }));
      const r = await ssRpc("cl_stock_sale", { p_sale_uid:saleUid, p_lines:lines }, { timeoutMs:STOCK_SALE_TIMEOUT_MS });
      ssNote(r);
      if(r.ok && r.data.ok){
        const alloc = {};
        (r.data.lines||[]).forEach(x=>{ const l = linked.find(y=>y.product.cat_uid===x.product_uid); if(l) alloc[l.product.id] = x.from_allowance||0; });
        commit({ saleUid, alloc, mode:"online", inputs });
        ssApplyRows(r.data.stock||[]);
        await persist();
        return { ok:true };
      }
      if(r.ok && r.data.ok===false){
        const msgs = (r.data.refused||[]).map(x=>{
          const p = ssProduct(x.product_uid);
          if(p) run("UPDATE products SET branch_avail=? WHERE id=?",[Math.max(0,(x.left||0)-Math.max(0,p.stock)), p.id]);
          return x.left>0? "Only "+x.left+" "+(p? p.name : "of a product")+" left in the branch." : (p? p.name : "A product")+" is sold out at this branch.";
        });
        ssShowMessage("Not enough stock", msgs.join("\n")+"\nNothing was sold. Change the quantity and try again.");
        return { ok:false, refused:r.data.refused };
      }
      if(r.code==="TERMINAL_INACTIVE"){
        setSetting("terminal_inactive","1");
        ssShowMessage("This till is deactivated", TERMINAL_INACTIVE_TEXT+" Branch stock can't be sold from this till.");
        return { ok:false };
      }
      // Slow, unreachable or a server error: this till's own allowance only.
      setSetting("stock_reach","fail");
      if(!allowanceValid()){
        ssShowMessage("Can't sell offline", "Can't reach the server, and this till's offline allowance has expired. Connect to get a fresh allowance, then try again.");
        return { ok:false };
      }
      const short = linked.find(l=>l.qty > Math.max(0, l.product.stock));
      if(short){
        ssShowMessage("Can't sell that many offline", "Can't reach the server and this till can sell only "+Math.max(0, short.product.stock)+" "+short.product.name+" while offline. Sell fewer, or try again when connected.");
        return { ok:false };
      }
      const alloc = {};
      linked.forEach(l=>{ alloc[l.product.id] = l.qty; });
      commit({ saleUid, alloc, mode:"offline", inputs });
      ssQueue("sale", { sale_uid:saleUid, lines }, saleUid);
      await persist();
      return { ok:true, offline:true };
    } finally {
      _ssBusy = false;
      if(typeof window!=="undefined") window._stockChecking = false;
    }
  }

  // ---- applying the server's figures ----
  // rows: [{ product_uid, total, available, allowance }]. The till's own stock
  // becomes its allowance minus what it has used locally but not yet reported.
  function ssApplyRows(rows, opts){
    if(!rows || !rows.length) return 0;
    const takes = ssPendingTakes();
    let changed = 0;
    rows.forEach(r=>{
      const p = ssProduct(r.product_uid);
      if(!p) return;
      run("UPDATE products SET branch_avail=?, branch_total=? WHERE id=?",[r.available, r.total, p.id]);
      const target = Math.max(0, (r.allowance||0) - (takes.get(r.product_uid)||0));
      if(p.stock!==target){ moveStock({ productId:p.id, setTo:target, kind:"allowance", note:"This till's allowance from branch stock", ssLocal:true }); changed++; }
    });
    setSetting("stock_allow_local_ts", ssNowIso());
    return changed;
  }

  // ---- one stock sync: report what happened offline, then refresh ----
  async function stockSyncNow(opts){
    opts = opts||{};
    if(!ssRegistered()) return { ok:false, message:"Register this device first." };
    if(_ssRunning) return _ssRunning;
    _ssRunning = (async()=>{
      try{
        await ssReportLocalProducts();
        if(sharedStockTill()){
          const rep = await ssReportOutbox();
          if(!rep.ok){ setSetting("stock_last_error", ssProblemText(rep)); return { ok:false, message:ssProblemText(rep) }; }
        }
        const full = getSetting("stock_mode","")!=="shared" || getSetting("stock_init","")!=="1";
        const r = await ssRpc("cl_stock_sync", { p_cursor: full? 0 : Number(getSetting("stock_cursor","0"))||0 });
        ssNote(r);
        if(!r.ok){
          if(r.code==="TERMINAL_INACTIVE") setSetting("terminal_inactive","1");
          setSetting("stock_last_error", ssProblemText(r)); return { ok:false, message:ssProblemText(r) };
        }
        const d = r.data;
        setSetting("stock_mode", d.stock_mode); setSetting("stock_holder", d.is_holder? "1" : ""); setSetting("stock_active_tills", String(d.active_tills||0));
        setSetting("stock_last_error","");
        if(d.stock_mode!=="shared"){ await persist(); return { ok:true, mode:"local" }; }
        if(getSetting("stock_init","")!=="1"){
          const own = all("SELECT * FROM products WHERE branch=? AND cat_uid IS NOT NULL AND stock>0",[currentBranch()]);
          if(own.length){ await persist(); return { ok:true, mode:"shared", needsMerge:true, rows:own }; }
          setSetting("stock_init","1");
        }
        db.run("BEGIN");
        try{
          ssApplyRows(d.stock||[]);
          setSetting("stock_allow_local_ts", ssNowIso());              // the server has just (re)granted this till's allowance
          setSetting("stock_cursor", String(d.cursor||0)); setSetting("stock_last_sync_ts", new Date().toISOString());
          db.run("COMMIT");
        }
        catch(e){ try{ db.run("ROLLBACK"); }catch(_){} throw e; }
        await persist();
        return { ok:true, mode:"shared", rows:(d.stock||[]).length };
      }catch(e){
        setSetting("stock_last_error","Shared stock update stopped: "+(e.message||e)+". It will try again.");
        return { ok:false, message:String(e.message||e) };
      }finally{ _ssRunning = null; }
    })();
    return _ssRunning;
  }
  async function ssReportOutbox(){
    const rows = ssPending();
    if(!rows.length) return { ok:true, sent:0 };
    const sales = rows.filter(r=>r.kind==="sale").map(r=>JSON.parse(r.payload_json));
    const moves = rows.filter(r=>r.kind==="move").map(r=>JSON.parse(r.payload_json)).map(m=>({ uid:m.uid, product_uid:m.product_uid, delta:m.delta, kind:m.kind }));
    const r = await ssRpc("cl_stock_report", { p_sales:sales, p_moves:moves });
    ssNote(r);
    if(!r.ok) return r;
    const now = new Date().toISOString();
    db.run("BEGIN");
    try{
      rows.forEach(row=>{
        run("UPDATE stock_outbox SET sent_ts=?, result_json=? WHERE uid=?",[now, JSON.stringify(r.data.shortfall||0), row.uid]);
        if(row.kind==="move"){
          const m = JSON.parse(row.payload_json);
          if(m.delta>0){ const p = ssProduct(m.product_uid); if(p) run("UPDATE products SET stock_pending_in=MAX(0,COALESCE(stock_pending_in,0)-?) WHERE id=?",[m.delta, p.id]); }
        }
      });
      db.run("COMMIT");
    }catch(e){ try{ db.run("ROLLBACK"); }catch(_){} throw e; }
    if(r.data.shortfall>0) logAudit("Shared stock shortfall","",r.data.shortfall+" unit(s) sold or moved offline could not be covered by branch stock; recorded for the manager.");
    return { ok:true, sent:rows.length, shortfall:r.data.shortfall||0 };
  }
  // Owner Q8: products this till sells that aren't in main's catalogue.
  async function ssReportLocalProducts(){
    if(getSetting("terminal_is_main","")==="1") return;
    const list = all("SELECT sku, name FROM products WHERE branch=? AND cat_uid IS NULL AND COALESCE(active,1)=1 ORDER BY name",[currentBranch()])
      .map(p=>({ code:p.sku||"", name:p.name }));
    const fp = JSON.stringify(list);
    if(fp===getSetting("stock_local_report_fp","")) return;
    const r = await ssRpc("cl_stock_local_products_report", { p_rows:list });
    if(r.ok && r.data.ok) setSetting("stock_local_report_fp", fp);
  }

  // ---- starting shared stock (stock holder, Admin) and the merge on other tills ----
  function sharedStockStartPlan(){
    const own = all("SELECT * FROM products WHERE branch=? AND COALESCE(active,1)=1 ORDER BY name",[currentBranch()]);
    return { linked: own.filter(p=>p.cat_uid && p.cat_seq!=null), unlinked: own.filter(p=>!(p.cat_uid && p.cat_seq!=null)) };
  }
  // Server build guard: every other active till must report build v7+ first.
  function ssTillNeedsUpdateText(d){
    d = d || {};
    const till = (d.till_code||"another till") + (d.label? " ("+d.label+")" : "");
    return "Till "+till+" must update the app first: shared stock needs build v"+(d.min_build||7)+" or later on every till, and it "
      + (d.app_build? "runs build v"+d.app_build : "hasn't reported its build yet") + ". Open the app on that till while online (it updates and checks in), then try again.";
  }
  async function sharedStockStart(passcode){
    if(!findAdmin(passcode)) throw new Error("Incorrect Admin passcode.");
    if(typeof catalogueSyncNow==="function"){ const c = await catalogueSyncNow({}); if(c && c.needsReport) throw new Error("Finish the first catalogue sync first (Settings → Business & Terminals)."); }
    const plan = sharedStockStartPlan();
    const op = ssUid();
    const r = await ssRpc("cl_stock_start_shared", { p_op_id:op, p_rows: plan.linked.map(p=>({ product_uid:p.cat_uid, qty:Math.max(0,p.stock) })) });
    ssNote(r);
    if(!r.ok) throw new Error(r.code==="NOT_HOLDER"? "Only the till that holds the branch's stock can start shared stock."
      : r.code==="SINGLE_TILL"? "Shared stock needs at least two active tills in the branch." : r.code==="ALREADY_SHARED"? "This branch already uses shared stock."
      : r.code==="TILL_NEEDS_UPDATE"? ssTillNeedsUpdateText(r.data) : ssProblemText(r));
    db.run("BEGIN");
    try{
      plan.linked.forEach(p=>{ if(p.stock) moveStock({ productId:p.id, setTo:0, kind:"shared_opening", note:"Stock handed to the branch (shared stock)", ssLocal:true }); });
      setSetting("stock_mode","shared"); setSetting("stock_init","1"); setSetting("stock_cursor","0");
      logAudit("Shared stock started","",plan.linked.length+" products handed to the branch, "+plan.unlinked.length+" stay on this till");
      db.run("COMMIT");
    }catch(e){ try{ db.run("ROLLBACK"); }catch(_){} throw e; }
    await persist();
    return await stockSyncNow({});
  }
  async function sharedStockMerge(passcode){
    if(!findAdmin(passcode)) throw new Error("Incorrect Admin passcode.");
    const own = all("SELECT * FROM products WHERE branch=? AND cat_uid IS NOT NULL AND stock>0",[currentBranch()]);
    if(own.length){
      const moves = own.map(p=>({ uid:ssUid(), product_uid:p.cat_uid, delta:p.stock, kind:"merge" }));
      const r = await ssRpc("cl_stock_move", { p_moves:moves });
      ssNote(r);
      if(!r.ok || !r.data.ok) throw new Error(r.ok? "Digital Commerce refused the merge." : ssProblemText(r));
      db.run("BEGIN");
      try{
        own.forEach(p=>moveStock({ productId:p.id, setTo:0, kind:"merge_out", note:"Added to branch stock (shared stock)", ssLocal:true }));
        logAudit("Shared stock: own stock added","",own.length+" products, "+own.reduce((s,p)=>s+p.stock,0)+" units added to branch stock");
        db.run("COMMIT");
      }catch(e){ try{ db.run("ROLLBACK"); }catch(_){} throw e; }
    }
    setSetting("stock_init","1"); setSetting("stock_cursor","0");
    await persist();
    return await stockSyncNow({});
  }

  // ---- stocktake at a shared branch (owner Q4) ----
  async function sharedStockStocktake(rows){
    const linked = rows.filter(r=>r.product.cat_uid);
    const op = ssUid();
    const r = await ssRpc("cl_stock_stocktake", { p_op_id:op, p_counts: linked.map(x=>({ product_uid:x.product.cat_uid, counted:x.counted })) });
    ssNote(r);
    if(!r.ok) return { ok:false, message: r.code==="ALLOWANCE_HELD"? ("Till "+(r.data.tills||[]).join(", ")+" still holds stock to sell offline. Connect "+((r.data.tills||[]).length===1?"it":"them")+" (or wait 72 hours), then post the count.")
                                       : (r.reason==="offline"||r.reason==="network")? "A stocktake needs a connection at a shared-stock branch." : ssProblemText(r) };
    _ssPreApplied = new Map();
    linked.forEach(x=>_ssPreApplied.set(x.product.id, { setTo:0 }));                 // the server took this till's allowance back
    return { ok:true, rows:r.data.stock||[] };
  }

  // ---- branch balance (Diagnostics) and branch-only products (main) ----
  async function sharedStockBalance(){ const r = await ssRpc("cl_stock_balance", {}); ssNote(r); return r; }
  async function branchOnlyProducts(){ return await ssRpc("cl_stock_local_products_list", {}); }

  // ---- screens ----
  function sharedStockStatusHtml(){
    if(!ssRegistered()) return "";
    const mode = getSetting("stock_mode",""), holder = getSetting("stock_holder","")==="1", active = Number(getSetting("stock_active_tills","0"))||0;
    const err = getSetting("stock_last_error","");
    let body = "";
    if(mode==="shared" && getSetting("stock_init","")!=="1"){
      body = `<p style="margin:0 0 6px;color:#b54708;font-weight:600">Your branch uses shared stock. This till still holds stock of its own.</p>
        <button class="btn btn-sm btn-primary" id="ssMergeBtn">Add this till's stock to the branch…</button>`;
    } else if(mode==="shared"){
      const pend = ssPending().length;
      const held = (one("SELECT COALESCE(SUM(stock),0) s FROM products WHERE branch=? AND cat_uid IS NOT NULL",[currentBranch()])||{}).s||0;
      const until = allowanceValidUntil();
      body = `<p class="muted" id="ssStatus" style="margin:0 0 6px">Shared branch stock · ${stockReachable()? "online" : "offline"} · this till holds ${held} item${held===1?"":"s"} to sell offline${until? ", valid until "+escapeHtml(new Date(until).toLocaleString()) : ""}${pend? " · "+pend+" offline record"+(pend===1?"":"s")+" to report" : ""}</p>`;
    } else if(holder && active>=2){

  // ================== RPN linkage + Support handoff ==================
  // The first real feature built on the sync.js foundation (sync_queue /
  // registerSyncType / enqueueSync / runSyncWorker) — see sync.js's own
  // header comment for the general pattern this follows. No parallel queue,
  // no parallel connectivity check: every "sync" action below is just an
  // enqueueSync() call, and status is read back through pendingSyncCount()
  // the same way the Cloud sync Settings card already does.
  //
  // Local storage reuses the existing `settings` key-value table — the same
  // place shop_name/contact_phone/management_whatsapp/etc.
  // already live — rather than a new table: RPN linkage is exactly the same
  // shape of thing (a handful of single-value fields describing this
  // device/tenant), so there was nothing to add to db.js's schema.
  // Paused (multi-terminal Phase 1, approved 2026-10-04): neither table
  // exists on Digital Commerce's project and nothing there reads them, so
  // every queued row failed forever. The RPN details are still saved in
  // settings and Support still opens WhatsApp; nothing is queued. See
  // docs/multi-terminal/phase1-plan.md §1E.
  registerSyncType("rpn_link", { table:"rpn_link", paused:true });
  registerSyncType("support_task", { table:"support_task", paused:true });

  function getRpnLink(){
    return {
      rpn_name: getSetting("rpn_name",""),
      rpn_code: getSetting("rpn_code",""),
      rpn_whatsapp: getSetting("rpn_whatsapp",""),
      city_area: getSetting("rpn_city_area",""),
    };
  }
  function hasRpnLink(){
    const r = getRpnLink();
    return !!(r.rpn_name || r.rpn_code || r.rpn_whatsapp || r.city_area);
  }
  // Writes the local record and enqueues a fresh sync every time it's
  // called — covers both "first captured at onboarding" and "edited later
  // from Settings" (Part A.4/A.5) with the one function. No validation
  // against any central registry (foundation data only) — stored as typed.
  function saveRpnLink(fields){
    fields = fields||{};
    const rpn_name = String(fields.rpn_name||"").trim();
    const rpn_code = String(fields.rpn_code||"").trim();
    const rpn_whatsapp = String(fields.rpn_whatsapp||"").trim();
    const city_area = String(fields.city_area||"").trim();
    setSetting("rpn_name", rpn_name);
    setSetting("rpn_code", rpn_code);
    setSetting("rpn_whatsapp", rpn_whatsapp);
    setSetting("rpn_city_area", city_area);
    const updated_ts = new Date().toISOString();
    setSetting("rpn_updated_ts", updated_ts);
    enqueueSync("rpn_link", { rpn_name, rpn_code, rpn_whatsapp, city_area, updated_ts });
    return getRpnLink();
  }

  // ---------------- Marketing tab (iTred Market Place export) ----------------
  // The tab itself is always in the nav, in every build. What powers it is a
  // separate, optional layer — dist-market/market.html (build.js --market) —
  // that a shop only has once it's been placed in the SAME folder as this
  // app's index.html. This file hosts that layer and answers its requests.
  // The layer does the screens and the photo resizing; the export file
  // itself is assembled here, from this device's own data.
  //
  // How the layer is loaded and talked to:
  //   * a sandboxed iframe (allow-scripts only), so market.html runs in an
  //     opaque origin: no access to this app's IndexedDB/SQLite, cookies or
  //     DOM, even when both are served from the same host. Everything it
  //     gets comes through the bridge below. Over http(s) its text is
  //     fetched here and set as srcdoc, so it works offline from the
  //     service worker cache; on file:// the frame loads it by src (see
  //     loadMarketText).
  //   * postMessage, checked by SOURCE WINDOW (not origin — file:// and
  //     sandboxed frames both report "null"), on one channel name.
  //   * "present" means market.html answered a hello within the handshake
  //     window. A missing file (404 page, file-not-found page) never
  //     answers, so it reads as not installed.
  //
  // The layer is stateless on purpose: render() rebuilds $app on every
  // re-render (cart open, nav tap...), which reloads the iframe, so anything
  // worth keeping (selection, city/currency, export status) is saved on
  // this side, in the shop's SQLite.
  //
  // Nothing in this tab or the layer talks to Supabase: the export is a
  // local file the shop sends to Digital Commerce itself.
  const MARKET_FILE = "market.html";
  const MARKET_CHANNEL = "seigen-market";
  const MARKET_BRIDGE_VERSION = 1;
  const MARKET_MAX_PRODUCTS = 200;
  const MARKET_HANDSHAKE_MS = 6000;    // hard cap from iframe creation
  const MARKET_AFTER_LOAD_MS = 1500;   // grace after the frame's load event

  let marketLayerState = "unknown";    // "unknown" | "ready" | "missing" (remembered for the session)
  let marketFrame = null;              // the live <iframe>, while the Marketing route is showing

  function marketingNotInstalledHtml(){
    return `
      <div class="card">
        <p style="margin-top:0"><b>Marketing isn't installed on this device.</b></p>
        <p class="muted">Marketing lets you choose up to ${MARKET_MAX_PRODUCTS} of your products, with photos,
          prices and stock, and prepare them as one file to send to Digital Commerce on WhatsApp.
          Digital Commerce reviews it and lists those products on the iTred Market Place, where customers
          can find your shop and send you orders.</p>
        <p class="muted">Nothing is uploaded automatically. You choose the products, you send the file.</p>
        <div class="hr"></div>
        <p class="muted" style="margin-bottom:0">To turn it on, ask Digital Commerce for the Marketing add-on
          (<b>${MARKET_FILE}</b>) and put it in the same folder as this app, then tap Check again.</p>
      </div>
      <button class="btn btn-outline" id="marketRecheck">Check again</button>`;
  }

  // ---- is this device registered with Digital Commerce? ----
  // The publish portal only lists products for a registered device (its
  // install ID in cl_vendors — see devicecheckin.js). Shown above the
  // add-on, and preparing a file is blocked until it's true, so a shop
  // never sends a file Digital Commerce can't publish.
  function marketRegistrationAdvice(){
    const reg = dcRegistration();
    if(!reg.hasPhrase) return dcCheckinProblemText({ reason:"no_phrase" });
    if(reg.lastError) return dcCheckinProblemText({ reason:"rejected", message:reg.lastError });
    return "Make sure you're connected to the internet, then tap Check again.";
  }
  function marketRegistrationHtml(checking){
    if(dcIsRegistered())
      return `<p class="muted" id="marketReg" data-registered="1" style="margin-top:0">✓ This device is registered with Digital Commerce.</p>`;
    return `
      <div class="card" id="marketReg" data-registered="0" style="border-color:#e0a100">
        <p style="margin-top:0"><b>This device isn't registered with Digital Commerce yet.</b></p>
        <p class="muted">Digital Commerce can only list products from registered devices, so you can choose products but can't prepare the file until it is.</p>
        <p class="muted" id="marketRegAdvice">${escapeHtml(marketRegistrationAdvice())}</p>
        <button class="btn btn-outline" id="marketRegCheck" ${checking? "disabled" : ""}>${checking? "Checking…" : "Check again"}</button>
      </div>`;
  }
  let marketAutoChecked = false;   // one automatic try per session; Check again is always there
  function wireMarketRegistration(){
    const btn = document.getElementById("marketRegCheck");
    if(btn) btn.onclick = ()=> marketCheckRegistration();
  }
  // Updates only the banner, so the add-on frame (and any ticking in it) isn't reloaded.
  async function marketCheckRegistration(){
    const box = document.getElementById("marketReg");
    if(box) box.outerHTML = marketRegistrationHtml(true);
    await deviceCheckin();
    const now = document.getElementById("marketReg");
    if(now && route==="marketing"){ now.outerHTML = marketRegistrationHtml(false); wireMarketRegistration(); }
  }

  function renderMarketing(main){
    main.innerHTML = `
      <h2>Marketing</h2>
      ${marketRegistrationHtml(false)}
      <div id="marketStatus"></div>
      <iframe id="marketFrame" title="Marketing" sandbox="allow-scripts"
        style="display:block;width:100%;height:0;border:0;background:transparent"></iframe>`;
    wireMarketRegistration();
    // Not registered but ready to be (phrase saved)? Try now, quietly —
    // e.g. a device that got its phrase after its last launch.
    if(!dcIsRegistered() && dcRegistration().hasPhrase && isOnline() && !marketAutoChecked){ marketAutoChecked = true; marketCheckRegistration(); }
    const status = document.getElementById("marketStatus");
    if(marketLayerState==="missing"){
      document.getElementById("marketFrame").remove();
      marketFrame = null;
      status.innerHTML = marketingNotInstalledHtml();
      document.getElementById("marketRecheck").onclick = ()=>{ marketLayerState="unknown"; render(); };
      return;
    }
    status.innerHTML = `<p class="muted">Loading Marketing…</p>`;
    marketFrame = document.getElementById("marketFrame");
    const frame = marketFrame;
    let answered = false;
    const giveUp = ()=>{
      if(answered || marketFrame!==frame || !frame.isConnected) return; // answered, or the user has already moved on
      marketLayerState = "missing";
      if(route==="marketing") render();
    };
    const hardTimer = setTimeout(giveUp, MARKET_HANDSHAKE_MS);
    frame._marketReady = ()=>{
      answered = true; clearTimeout(hardTimer);
      marketLayerState = "ready";
      status.innerHTML = "";
    };
    // Listen for load only once the real content is set: the empty frame's
    // own about:blank load would otherwise start the grace timer early.
    const load = (how)=>{
      if(marketFrame!==frame || !frame.isConnected) return;
      frame.addEventListener("load", ()=> setTimeout(giveUp, MARKET_AFTER_LOAD_MS));
      how();
    };
    loadMarketText().then(
      (text)=>{
        if(text===null){ clearTimeout(hardTimer); giveUp(); } // definitely not deployed (404): no need to wait
        else load(()=>{ frame.srcdoc = text; });
      },
      ()=> load(()=>{ frame.src = MARKET_FILE; })
    );
  }
  // Served over http(s) (hosted PWA, Tauri's local server), the add-on is
  // fetched here and handed to the sandboxed frame as srcdoc. This fetch
  // goes through the service worker, so an installed app finds
  // market.html in its offline cache; a sandboxed frame's own src load
  // doesn't go through the worker, which is why it isn't used here. srcdoc
  // keeps the same sandbox, so the add-on is exactly as isolated either way.
  // Resolves to the text, or null for a definite 404. Rejects when fetch
  // can't be used (file://, where browsers block it, or no network and no
  // cached copy) — the caller then falls back to a plain src load, which
  // is how the forwarded single file always works.
  async function loadMarketText(){
    if(location.protocol==="file:" || typeof fetch!=="function") throw new Error("no fetch here");
    const res = await fetch(MARKET_FILE, { cache:"no-cache" });
    if(res.status===404) return null;
    if(!res.ok) throw new Error("HTTP "+res.status);
    return await res.text();
  }

  // ---- the bridge: the ONLY things market.html can ask this app for ----
  function marketProductRows(){
    return all(`SELECT id, name, sku, price, stock, category,
                       CASE WHEN image IS NOT NULL AND image<>'' THEN 1 ELSE 0 END AS has_image
                  FROM products WHERE branch=? AND COALESCE(active,1)=1 ORDER BY name COLLATE NOCASE`,[currentBranch()])
      .map(r=>({ id:r.id, name:r.name||"", sku:r.sku||"", price:Number(r.price)||0, stock:Number(r.stock)||0,
                 category:r.category||"", hasImage:!!r.has_image }));
  }
  // Keeps only ids that are real products at this branch, de-duplicated, in
  // the order given, and never more than the cap — whatever the layer sends.
  function marketCleanSelection(ids){
    if(!Array.isArray(ids)) throw new Error("Selection must be a list of product ids.");
    const valid = new Set(marketProductRows().map(p=>p.id));
    const out = [];
    for(const x of ids){
      const id = Number(x);
      if(Number.isInteger(id) && valid.has(id) && !out.includes(id)) out.push(id);
      if(out.length>=MARKET_MAX_PRODUCTS) break;
    }
    return out;
  }
  // Saved as a setting (per device, like the rest of Settings) so a re-send
  // a week later starts from the same products.
  function marketSavedSelection(){
    try{ return marketCleanSelection(JSON.parse(getSetting("market_selection","[]"))); }catch(e){ return []; }
  }
  // Products → "Add to Marketing": the products checked there join the
  // Marketing selection (kept after what's already chosen), so the picker
  // opens with them ticked. Nothing else changes — the shop still picks
  // photos, prepares the file and sends it from the Marketing screen.
  // Returns how many were newly added and which didn't fit under the cap.
  async function marketAddToSelection(ids){
    const before = marketSavedSelection();
    const wanted = marketCleanSelection((Array.isArray(ids)? ids : []).map(Number)); // this branch's real products only
    const merged = marketCleanSelection(before.concat(wanted));
    setSetting("market_selection", JSON.stringify(merged));
    await persist();
    return { selection: merged,
      added: wanted.filter(id=> !before.includes(id) && merged.includes(id)).length,
      notAdded: wanted.filter(id=> !merged.includes(id)) };
  }
  function openMarketingWith(ids){
    const go = ()=>{ route = "marketing"; render(); };
    if(!ids || !ids.length){ go(); return Promise.resolve(); }
    return marketAddToSelection(ids).then(r=>{
      if(r.notAdded.length) alert(`Marketing holds up to ${MARKET_MAX_PRODUCTS} products, so ${r.notAdded.length} of the ones you checked weren't added. Untick some in Marketing to make room.`);
      go();
    });
  }

  // ---- export file (.scl) ----
  // First data-pack type on the .scl extension (the others move over in a
  // later phase). The content is JSON, like the DN/GRV/catalogue files, and
  // it is shaped for Digital Commerce's manual load into Supabase:
  //   vendor   -> public.vendors      (install_id, business_name, whatsapp_number, city)
  //   listings -> public.vendor_listings, one object per row, same column
  //               names. Columns Digital Commerce sets on review
  //               (vendor_id, published_at, expires_at, status) aren't here.
  //               image_url isn't either: the file carries the photo itself
  //               as image_webp (200x200 WebP data URI, or null) and Digital
  //               Commerce fills image_url once it has hosted it.
  // Values always come from this device's database at build time — the
  // layer only supplies which products, the photos it optimised, and the
  // two one-time settings (city, currency).
  const MARKET_FILE_FORMAT = "seigen.market_export";
  const MARKET_FILE_VERSION = 1;
  const MARKET_FILE_EXT = ".scl";
  const MARKET_WHATSAPP = "+263789487287"; // Digital Commerce marketing line (same number as Help → About)
  const MARKET_LISTING_DAYS = 7;           // vendor_listings expiry: published_at + 7 days
  const MARKET_MAX_IMAGE_CHARS = 150000;   // a 200x200 WebP is ~5-30 KB; anything far bigger isn't one
  const MARKET_IMAGE_PREFIX = "data:image/webp;base64,";

  function marketFileName(exportNo, shopName, date){
    return formatDocNo("MKT",exportNo)+"-"+sanitizeBranchName(shopName)+"-"+fileDatePart(date)+"-"+fileTimePart(date)+MARKET_FILE_EXT;
  }
  function marketNormalizeCurrency(v){
    const c = String(v==null?"":v).trim().toUpperCase();
    if(!/^[A-Z]{3}$/.test(c)) throw new Error("Currency must be a 3-letter code, e.g. USD or ZWG.");
    return c;
  }
  function marketNormalizeCity(v){
    const c = String(v==null?"":v).trim().replace(/\s+/g," ");
    if(!c) throw new Error("Enter the city or town your shop is in.");
    if(c.length>60) throw new Error("City is too long (60 characters at most).");
    return c;
  }
  function marketValidImage(v){
    return typeof v==="string" && v.indexOf(MARKET_IMAGE_PREFIX)===0 && v.length<=MARKET_MAX_IMAGE_CHARS
      && /^[A-Za-z0-9+/=]+$/.test(v.slice(MARKET_IMAGE_PREFIX.length));
  }
  function marketVendorIdentity(){
    return {
      install_id: getSetting("install_id",""),
      business_name: getSetting("shop_name","").trim(),
      whatsapp_number: getSetting("contact_phone","").trim(), // same value cl_device_checkin sends as p_phone
      city: getSetting("market_city",""),
    };
  }
  // Pure: rows + inputs -> file object (without checksum). Rounds to the
  // vendor_listings column scales and clamps what its CHECKs would reject.
  function marketBuildDoc(o){
    const r2 = (n)=> Math.round((Number(n)||0)*100)/100;
    const r3 = (n)=> Math.round((Number(n)||0)*1000)/1000;
    const listings = o.products.map(p=>{
      const name = String(p.name||"").trim();
      if(!name) throw new Error("A selected product has no name. Give it a name in Products first.");
      return {
        source_product_id: String(p.id),
        product_name: name,
        price: Math.max(0, r2(p.price)),
        currency: o.currency,
        category: String(p.category||"").trim() || null,
        stock_quantity: Math.max(0, r3(p.stock)),
        exported_at: o.exportedAt,
        image_webp: o.images[p.id] || null,
      };
    });
    return {
      format: MARKET_FILE_FORMAT, format_version: MARKET_FILE_VERSION,
      export_no: formatDocNo("MKT", o.exportNo),
      created_iso: o.createdIso,
      exported_at: o.exportedAt,
      vendor: o.vendor,
      listings,
      totals: { listings: listings.length, with_image: listings.filter(l=>l.image_webp).length },
    };
  }
  async function marketChecksum(doc){ return sha256Hex(JSON.stringify(doc)); }

  // The finished file text lives in its own IndexedDB store (latest one per
  // branch only), not in the SQLite blob that gets backed up and merged —
  // same reason the DN file store is separate: photos would bloat it.
  const MKF_DB = "seigen_market_files", MKF_STORE = "files";
  function mkfOpen(){
    return new Promise((res,rej)=>{
      const r = indexedDB.open(MKF_DB, 1);
      r.onupgradeneeded = ()=> r.result.createObjectStore(MKF_STORE);
      r.onsuccess = ()=> res(r.result);
      r.onerror = ()=> rej(r.error);
    });
  }
  async function mkfPut(key, rec){
    const conn = await mkfOpen();
    return new Promise((res,rej)=>{
      const tx = conn.transaction(MKF_STORE,"readwrite");
      tx.objectStore(MKF_STORE).put(rec, key);
      tx.oncomplete = ()=>{ conn.close(); res(true); };
      tx.onerror = ()=>{ conn.close(); rej(tx.error); };
    });
  }
  async function mkfGet(key){
    try{
      const conn = await mkfOpen();
      return await new Promise((res,rej)=>{
        const rq = conn.transaction(MKF_STORE,"readonly").objectStore(MKF_STORE).get(key);
        rq.onsuccess = ()=>{ conn.close(); res(rq.result||null); };
        rq.onerror = ()=>{ conn.close(); rej(rq.error); };
      });
    }catch(e){ return null; }
  }

  async function marketBuildExport(args){
    args = args||{};
    const vendor = marketVendorIdentity();
    if(!vendor.install_id) throw new Error("This device has no install ID yet. Finish Setup first.");
    // Checked before a number is reserved; see marketRegistrationHtml.
    if(!dcIsRegistered()) throw new Error("This device isn't registered with Digital Commerce yet, so it can't list these products. " + marketRegistrationAdvice());
    if(!vendor.business_name) throw new Error("Set your shop name in More → Settings first.");
    const city = marketNormalizeCity(args.city);
    const cur = marketNormalizeCurrency(args.currency);
    const ids = marketSavedSelection();
    if(!ids.length) throw new Error("Choose at least one product first.");
    const byId = new Map(all(`SELECT id, name, price, stock, category FROM products WHERE branch=?`,[currentBranch()]).map(p=>[p.id,p]));
    const products = ids.map(id=>byId.get(id)).filter(Boolean);
    // Checked before a number is reserved, so a bad product doesn't burn one.
    if(products.some(p=>!String(p.name||"").trim())) throw new Error("A selected product has no name. Give it a name in Products first.");
    const images = {};
    const sent = (args.images && typeof args.images==="object")? args.images : {};
    for(const p of products){ if(marketValidImage(sent[p.id])) images[p.id] = sent[p.id]; }

    setSetting("market_city", city);
    setSetting("market_currency", cur);
    vendor.city = city;
    const now = new Date();
    const { n } = reserveDocNumber("MKT");
    const doc = marketBuildDoc({ products, images, currency:cur, vendor, exportNo:n,
      createdIso: localIso(now), exportedAt: now.toISOString() });
    doc.checksum = await marketChecksum(doc);
    const text = JSON.stringify(doc);
    const fileName = marketFileName(n, vendor.business_name, now);
    const branch = currentBranch();
    run(`INSERT INTO market_exports(branch,export_no,file_name,product_count,image_count,bytes,checksum,status,exported_ts,sent_ts)
         VALUES(?,?,?,?,?,?,?,'exported',?,'')`,
      [branch, doc.export_no, fileName, doc.totals.listings, doc.totals.with_image, text.length, doc.checksum, now.toISOString()]);
    await persist();
    await mkfPut(branch, { exportNo:doc.export_no, fileName, text });
    return marketStatus();
  }

  // not_exported -> exported (file built, timestamp) -> sent (the shop says
  // so: nothing can see a WhatsApp send succeed). A new export starts over
  // at exported. "expiring" = MARKET_LISTING_DAYS after it was marked sent.
  function marketStatus(){
    const row = one("SELECT * FROM market_exports WHERE branch=? ORDER BY id DESC LIMIT 1",[currentBranch()]);
    if(!row) return { state:"not_exported" };
    const out = { state:row.status, exportNo:row.export_no, fileName:row.file_name, productCount:row.product_count,
      imageCount:row.image_count, exportedTs:row.exported_ts, sentTs:row.sent_ts||"", expiresTs:"", expiring:false };
    if(row.status==="sent" && row.sent_ts){
      const exp = new Date(new Date(row.sent_ts).getTime() + MARKET_LISTING_DAYS*86400000);
      out.expiresTs = exp.toISOString();
      out.expiring = Date.now() >= exp.getTime();
    }
    return out;
  }
  async function marketMarkSent(){
    const row = one("SELECT * FROM market_exports WHERE branch=? ORDER BY id DESC LIMIT 1",[currentBranch()]);
    if(!row) throw new Error("There's no exported file to mark as sent.");
    if(row.status!=="sent"){
      run("UPDATE market_exports SET status='sent', sent_ts=? WHERE id=?",[new Date().toISOString(), row.id]);
      await persist();
    }
    return marketStatus();
  }
  function marketWhatsAppText(){
    const s = marketStatus();
    return "iTred Market Place listing "+(s.exportNo||"")+" from "+getSetting("shop_name","")+" ("+getSetting("install_id","")+").";
  }
  // Same helper every other file handoff uses: share sheet on a phone,
  // Documents/seiGEN/Marketing + folder + WhatsApp chat on desktop (Tauri),
  // plain download otherwise. Returns { method, path? } for the layer to explain.
  async function marketShareExport(){
    const s = marketStatus();
    if(s.state==="not_exported") throw new Error("Prepare the file first.");
    const rec = await mkfGet(currentBranch());
    if(!rec || rec.exportNo!==s.exportNo) throw new Error("The file for "+s.exportNo+" isn't on this device any more. Prepare a fresh file.");
    const msg = marketWhatsAppText();
    const r = await shareDocFile({ fileName:rec.fileName, text:rec.text, folder:"Marketing", title:rec.exportNo,
      phone:MARKET_WHATSAPP, shareText:msg, whatsappText:msg+" (Attach the file from the folder that just opened.)" });
    return { method:r.method, path:r.path||"" };
  }

  const MARKET_OPS = {
    context: ()=>({
      bridgeVersion: MARKET_BRIDGE_VERSION, appVersion: APP_VERSION,
      maxProducts: MARKET_MAX_PRODUCTS, currencySymbol: currency,
      branch: currentBranch(), shopName: getSetting("shop_name",""), isRemote: isRemote(),
    }),
    listProducts: ()=> marketProductRows(),
    getSelection: ()=> marketSavedSelection(),
    setSelection: async (args)=>{
      const ids = marketCleanSelection(args && args.ids);
      setSetting("market_selection", JSON.stringify(ids));
      await persist();
      return ids;
    },
    // Only for a product in the saved selection — the layer can't page
    // through every photo on the device.
    getProductImage: (args)=>{
      const id = Number(args && args.id);
      if(!marketSavedSelection().includes(id)) throw new Error("That product isn't selected.");
      const r = one("SELECT image FROM products WHERE id=? AND branch=?",[id, currentBranch()]);
      return (r && typeof r.image==="string" && r.image.indexOf("data:image/")===0)? r.image : "";
    },
    getExportSetup: ()=>{
      const v = marketVendorIdentity();
      return { installId:v.install_id, businessName:v.business_name, whatsappNumber:v.whatsapp_number,
        city:v.city, currency:getSetting("market_currency","") || "USD", currencySet:!!getSetting("market_currency",""),
        marketWhatsApp:MARKET_WHATSAPP };
    },
    buildExport: (args)=> marketBuildExport(args),
    getStatus: ()=> marketStatus(),
    shareExport: ()=> marketShareExport(),
    openWhatsAppChat: ()=>{ openExternalUrl(waLink(MARKET_WHATSAPP, marketWhatsAppText())); return true; },
    markSent: ()=> marketMarkSent(),
  };

  window.addEventListener("message", (e)=>{
    const frame = marketFrame;
    if(!frame || !frame.contentWindow || e.source!==frame.contentWindow) return;
    const m = e.data;
    if(!m || typeof m!=="object" || m.ch!==MARKET_CHANNEL) return;
    // The frame can be gone by the time an async op finishes (user moved on).
    const reply = (msg)=>{ if(frame.contentWindow) frame.contentWindow.postMessage(Object.assign({ ch:MARKET_CHANNEL }, msg), "*"); };
    if(m.type==="hello"){
      if(typeof frame._marketReady==="function") frame._marketReady();
      reply({ type:"welcome", bridgeVersion:MARKET_BRIDGE_VERSION });
    } else if(m.type==="resize"){
      const h = Math.max(0, Math.min(200000, Math.round(Number(m.height)||0)));
      frame.style.height = h+"px";
    } else if(m.type==="req"){
      const op = Object.prototype.hasOwnProperty.call(MARKET_OPS, m.op)? MARKET_OPS[m.op] : null;
      // shareExport/openWhatsAppChat need a user gesture (share sheet,
      // window.open). A tap inside the layer counts here too: Chrome passes a
      // frame's user activation up to its parent, and it lasts a few seconds.
      Promise.resolve().then(()=>{
        if(!op) throw new Error("Unknown request: "+String(m.op));
        return op(m.args);
      }).then(
        (result)=> reply({ type:"res", id:m.id, ok:true, result }),
        (err)=> reply({ type:"res", id:m.id, ok:false, error:String(err && err.message || err) })
      );
    }
  });

  // ---------------- Staff & Roles (Settings, Main branch only) ----------------
  // Staff Access List + PIN Login: the staff table already existed (for the
  // Admin `passcode` used by Settings/price/cancel-reissue unlocks). This adds
  // a separate 4-6 digit sign-in PIN per staff member, stored as a salted
  // SHA-256 (reusing sha256HexPure from dnfile.js) — never the PIN itself —
  // plus a per-staff attempt counter/lockout. "Tenant" here is this device's
  // `branch`, the same scope every other staff/product/customer row already
  // uses; PIN uniqueness is enforced within that scope.
  const PIN_MIN_LEN=4, PIN_MAX_LEN=6, PIN_MAX_ATTEMPTS=5, PIN_LOCKOUT_MINUTES=5;
  function pinProblem(pin){
    const p = String(pin==null?"":pin).trim();
    if(!p) return `Enter a ${PIN_MIN_LEN} to ${PIN_MAX_LEN} digit PIN.`;
    if(!/^\d+$/.test(p) || p.length<PIN_MIN_LEN || p.length>PIN_MAX_LEN) return `PIN must be ${PIN_MIN_LEN} to ${PIN_MAX_LEN} digits.`;
    return "";
  }
  function hashPinSync(pin, salt){ return sha256HexPure((salt||"")+":"+String(pin).trim()); }
  function pinTakenByOther(branch, pin, excludeId){
    const p = String(pin).trim();
    const rows = all("SELECT id,pin_hash,pin_salt FROM staff WHERE branch=? AND active=1 AND pin_hash<>'' AND id<>?",[branch, excludeId||0]);
    return rows.some(r=> hashPinSync(p, r.pin_salt)===r.pin_hash);
  }
  // On (the default) = today's free-text name entry, unchanged. Off = the
  // dropdown+PIN flow below. Defaults ON so every existing install, and every
  // fresh one until an owner opts in, behaves exactly as before.
  function singleOperatorMode(){ return getSetting("single_operator_mode","1")==="1"; }
  function activeStaffWithPin(branch){ return all("SELECT * FROM staff WHERE branch=? AND active=1 AND pin_hash<>'' ORDER BY name",[branch]); }
  // Queryable current operator (Part 6) — null in Single operator mode, where
  // there's no staff record behind the typed name, only sessionUser.
  function currentStaff(){ return sessionStaffId? one("SELECT * FROM staff WHERE id=?",[sessionStaffId]) : null; }

  // Pure add/edit (no DOM), so staffModal's Save button and the test suite
  // share one validated path. Throws a plain-text Error on any refusal.
  function saveStaffMember(o){
    o = o||{};
    const name = String(o.name||"").trim();
    if(!name) throw new Error("Enter the staff member's name");
    const role = o.role==="Admin"? "Admin" : "Cashier";
    const passcode = String(o.passcode||"").trim();
    const branch = currentBranch();
    const isEdit = !!o.id;
    const existing = isEdit? one("SELECT * FROM staff WHERE id=?",[o.id]) : null;
    if(isEdit && !existing) throw new Error("Staff member not found");
    const pinInput = String(o.pin||"").trim();
    let pin_hash = existing? (existing.pin_hash||"") : "";
    let pin_salt = existing? (existing.pin_salt||"") : "";
    if(pinInput){
      const bad = pinProblem(pinInput);
      if(bad) throw new Error(bad);
      if(pinTakenByOther(branch, pinInput, isEdit? o.id : 0)) throw new Error("That PIN is already used by another active staff member. Choose a different one.");
      pin_salt = uid4()+uid4();
      pin_hash = hashPinSync(pinInput, pin_salt);
    } else if(!isEdit){
      throw new Error(pinProblem(""));
    }
    if(isEdit){
      // active is optional on an edit — a caller updating just the PIN (or
      // name/role) shouldn't have to know or repeat the current active
      // status; only an explicit true/false changes it.
      const active = o.active===undefined ? existing.active : (o.active? 1 : 0);
      // Any Admin edit also clears a lockout — a deliberate, low-friction way
      // to unlock someone without a separate "unlock" button.
      run("UPDATE staff SET name=?, role=?, passcode=?, active=?, pin_hash=?, pin_salt=?, pin_fail_count=0, pin_locked_until='' WHERE id=?",
        [name,role,passcode,active,pin_hash,pin_salt,o.id]);
      return one("SELECT * FROM staff WHERE id=?",[o.id]);
    }
    run("INSERT INTO staff(name,role,passcode,branch,active,created_ts,pin_hash,pin_salt) VALUES(?,?,?,?,1,?,?,?)",
      [name,role,passcode,branch,new Date().toISOString(),pin_hash,pin_salt]);
    return one("SELECT * FROM staff WHERE branch=? ORDER BY id DESC LIMIT 1",[branch]);
  }

  function staffSectionHtml(){
    const branch = currentBranch();
    const staffList = all("SELECT * FROM staff WHERE branch=? ORDER BY active DESC, name",[branch]);
    const single = singleOperatorMode();
    return `
      <div class="card">
        <h3>Staff & Roles</h3>
        <label style="display:flex;gap:8px;align-items:flex-start;margin-top:0"><input type="checkbox" id="sSingleOperator" ${single? "checked" : ""} style="width:auto;margin-top:3px"><span>Single operator mode — skip staff sign-in, just type a name (today's behaviour)</span></label>
        <p class="muted" style="font-size:12px">Turn this off so everyone picks their name and enters a PIN on the "Who's working today?" screen instead. Needs at least one active staff member with a PIN set below.</p>
        <div class="hr"></div>
        <button class="btn btn-primary" id="openAddStaff" style="margin-bottom:10px">+ Add Staff</button>
        ${staffList.length===0? `<p class="muted">No staff added yet.</p>` : staffList.map(s=>{
          const locked = s.pin_locked_until && new Date(s.pin_locked_until) > new Date();
          return `
          <div class="product-row">
            <div>
              <div class="pname">${escapeHtml(s.name)}${s.active? "" : ` <span class="pill low">inactive</span>`}</div>
              <div class="pmeta">${escapeHtml(s.role)} · ${s.pin_hash? "PIN set" : "No PIN"}${locked? " · Locked out" : ""}</div>
            </div>
            <button class="btn btn-sm btn-outline" data-edit-staff="${s.id}" style="flex:none">Edit</button>
          </div>`;}).join("")}
      </div>`;
  }
  function staffModal(existing){
    const isEdit = !!existing;
    const wrap = openModal(isEdit? "Edit Staff" : "Add Staff", `
      <label style="margin-top:0">Name</label>
      <input class="field" id="stName" value="${escapeHtml(existing? existing.name : "")}">
      <label>Role</label>
      <select class="field" id="stRole">
        <option value="Cashier" ${(!existing||existing.role==="Cashier")?"selected":""}>Cashier</option>
        <option value="Admin" ${(existing&&existing.role==="Admin")?"selected":""}>Admin</option>
      </select>
      <label>Admin passcode</label>
      <input class="field" id="stPasscode" value="${escapeHtml(existing? (existing.passcode||"") : "")}" placeholder="Numeric or text code">
      <p class="muted" style="font-size:11px;margin-top:-4px">Unlocks Settings and price/stock approvals on this device. Only needed for Admins.</p>
      <label>Sign-in PIN (${PIN_MIN_LEN}-${PIN_MAX_LEN} digits)</label>
      <input class="field" id="stPin" type="password" inputmode="numeric" maxlength="${PIN_MAX_LEN}" placeholder="${existing && existing.pin_hash? "Leave blank to keep current PIN" : "e.g. 4821"}">
      <p class="muted" style="font-size:11px;margin-top:-4px">Used on the "Who's working today?" screen when Single operator mode is off.</p>
      ${isEdit? `<label style="display:flex;align-items:center;gap:8px;margin-top:14px"><input type="checkbox" id="stActive" ${existing.active? "checked":""} style="width:auto;margin:0"> Active</label>` : ""}
      <button class="btn btn-primary" id="stConfirm" style="margin-top:14px">${isEdit? "Save Changes" : "Add Staff"}</button>
    `);
    wrap.querySelector("#stConfirm").onclick=()=>{
      try{
        saveStaffMember({
          id: isEdit? existing.id : null,
          name: wrap.querySelector("#stName").value,
          role: wrap.querySelector("#stRole").value,
          passcode: wrap.querySelector("#stPasscode").value,
          pin: wrap.querySelector("#stPin").value,
          active: isEdit? wrap.querySelector("#stActive").checked : true,
        });
      }catch(e){ return alert(e.message||String(e)); }
      persist(); wrap.remove(); render();
    };
  }
  function wireStaffSection(){
    document.getElementById("openAddStaff").onclick=()=>staffModal(null);
    document.querySelectorAll("[data-edit-staff]").forEach(b=>{
      b.onclick=()=>{
        const s = one("SELECT * FROM staff WHERE id=?",[+b.dataset.editStaff]);
        staffModal(s);
      };
    });
    const soToggle = document.getElementById("sSingleOperator");
    if(soToggle) soToggle.onchange=()=>{
      const wantOn = soToggle.checked;
      if(!wantOn && activeStaffWithPin(currentBranch()).length===0){
        alert("Add at least one active staff member with a PIN before turning this off.");
        soToggle.checked = true;
        return;
      }
      if(!wantOn && !confirm("Everyone will need to pick their name and enter a PIN to use this device. Continue?")){
        soToggle.checked = true;
        return;
      }
      setSetting("single_operator_mode", wantOn? "1" : "0");
      persist(); render();
    };
  }


  // ---- Start screen + Log out ----
  // The first screen once setup and activation are out of the way (boot,
  // main.js), and where Log out returns to. One job: Sign in, which is the
  // unchanged "Who's working today?" flow below. Shows the brand globe
  // (globe-transparent-*.png, generated by tools/icons/build-icons.js and
  // copied next to index.html by build.js), the shop, branch, and the till
  // code once multi-terminal registration has given one. When the image
  // isn't there — the single-file dist/index.html forwarded on its own —
  // it falls back to the storefront mark drawn inline.
  function renderStart(){
    route="start";
    const shop = getSetting("shop_name","") || "seiGEN Commerce Lite";
    const place = [getSetting("branch_name",""), getSetting("till_code","")].filter(Boolean).join(" · ");
    const mark = ICON_STOREFRONT.replace('width="22" height="22"', 'width="52" height="52"');
    $app.innerHTML = `<div class="center-screen"><div class="setup-card center" id="startCard">
      <img class="start-globe" id="startGlobe" src="globe-transparent-512.png" srcset="globe-transparent-512.png 1x, globe-transparent-1024.png 2x" alt="" width="512" height="512">
      <div class="start-mark" id="startMark" aria-hidden="true" style="display:none">${mark}</div>
      <h2 id="startShop" style="margin:0 0 4px">${escapeHtml(shop)}</h2>
      ${place? `<p class="muted" id="startPlace" style="margin:0">${escapeHtml(place)}</p>` : ""}
      <button class="btn btn-primary" id="startSignIn" style="margin-top:20px">Sign in</button>
      <p class="muted" style="font-size:11.5px;margin:14px 0 0">seiGEN Commerce Lite</p>
    </div></div>`;
    const globe = document.getElementById("startGlobe");
    const showMark = ()=>{ globe.remove(); document.getElementById("startMark").style.display = ""; };
    globe.onerror = showMark;
    if(globe.complete && globe.naturalWidth===0 && globe.getAttribute("src")) showMark();   // already failed before the handler was set
    document.getElementById("startSignIn").onclick = ()=> renderWhoAmI();

  // Pure PIN check (no DOM): active only, throttled 5 wrong tries per staff
  // member -> 5 minute lockout, cleared on a correct PIN or an Admin edit.
  function attemptPinLogin(staffId, pin){
    const s = one("SELECT * FROM staff WHERE id=? AND active=1",[staffId]);
    if(!s) return { ok:false, message:"That staff member is no longer active." };
    if(s.pin_locked_until && new Date(s.pin_locked_until) > new Date()){
      const mins = Math.max(1, Math.ceil((new Date(s.pin_locked_until) - new Date())/60000));
      return { ok:false, locked:true, message:`Too many incorrect PIN attempts. Try again in ${mins} minute(s).` };
    }
    const bad = pinProblem(pin);
    if(bad) return { ok:false, message:bad };
    const hash = hashPinSync(pin, s.pin_salt);
    if(s.pin_hash && hash===s.pin_hash){
      run("UPDATE staff SET pin_fail_count=0, pin_locked_until='' WHERE id=?",[s.id]);
      persist();
      return { ok:true, staff: one("SELECT * FROM staff WHERE id=?",[s.id]) };
    }
    const fails = (s.pin_fail_count||0)+1;
    if(fails>=PIN_MAX_ATTEMPTS){
      const until = new Date(Date.now()+PIN_LOCKOUT_MINUTES*60000).toISOString();
      run("UPDATE staff SET pin_fail_count=0, pin_locked_until=? WHERE id=?",[until, s.id]);
      persist();
      return { ok:false, locked:true, message:`Too many incorrect PIN attempts. Try again in ${PIN_LOCKOUT_MINUTES} minutes.` };
    }
    run("UPDATE staff SET pin_fail_count=? WHERE id=?",[fails, s.id]);
    persist();
    return { ok:false, message:`Incorrect PIN. ${PIN_MAX_ATTEMPTS-fails} attempt(s) left.` };
  }

  // ---- device Admin passcode (Phase 4) ----
  // A remote branch creates its OWN first Admin passcode, at Setup or on the locked
  // Settings screen while it has none. It no longer depends on merging a main
  // branch's data file to receive one.
  const ADMIN_PASSCODE_MIN = 4;
  // "" = fine, otherwise the plain reason.
  function adminPasscodeProblem(passcode, confirmText){
    const p = String(passcode==null?"":passcode).trim();
    if(p.length<ADMIN_PASSCODE_MIN) return "The Admin passcode must be at least "+ADMIN_PASSCODE_MIN+" characters.";
    if(p!==String(confirmText==null?"":confirmText).trim()) return "The two passcodes don't match.";
    return "";
  }
  function createDeviceAdmin(passcode, confirmText){
    const bad = adminPasscodeProblem(passcode, confirmText);
    if(bad) throw new Error(bad);
    const branch = currentBranch();
    let name = "Admin", n = 1;
    while(one("SELECT 1 AS x FROM staff WHERE branch=? AND name=?",[branch,name])){ n++; name = "Admin "+n; }
    run("INSERT INTO staff(name,role,passcode,branch,active,created_ts) VALUES(?,?,?,?,1,?)",
      [name,"Admin",String(passcode).trim(),branch,new Date().toISOString()]);
    return name;
  }

  // ---------------- Device Setup: Cash Drawer (Web Serial) ----------------
  // Deliberately independent of printing.js: a kick drawer is its own
  // USB/serial device with its own connection object (window._drawer) and
  // its own explicit "open" action. NEVER wired into the printer's
  // connection object or triggered as a side effect of printing — no RJ11
  // kick-pulse-via-printer passthrough here. openCashDrawer() below is the
  // only thing that opens the drawer, and nothing in printing.js calls it.
  //
  // Connection type: Web Serial (navigator.serial) — same zero-native-
  // plugin approach printing.js already uses for WebUSB/WebBluetooth (see
  // its comments): this app has never routed peripheral access through a
  // Tauri Rust bridge, relying instead on the OS webview's own Chromium
  // engine exposing these Web APIs directly. Falls back to a clear
  // "not supported" message wherever navigator.serial doesn't exist,
  // without blocking anything else on the Settings screen from rendering.
  function hasSerialPort(){ return !!(navigator.serial); }
  // Standard ESC/POS drawer-kick pulse (ESC p m t1 t2) — what generic
  // USB/serial kick interfaces for RJ11 cash drawers almost universally
  // expect, even when the interface itself isn't a receipt printer.
  const DRAWER_KICK_BYTES = new Uint8Array([0x1B,0x70,0x00,0x19,0xFA]);

  async function connectCashDrawer(){
    if(!hasSerialPort()){ alert("Serial port access isn't available in this browser/build. Use Chrome or the desktop app, served via a local server (not a plain file)."); return false; }
    try{
      const port = await navigator.serial.requestPort();
      await port.open({ baudRate: 9600 });
      window._drawer = { port };
      setSetting("drawer_connection_type","serial"); persist();
      return true;
    }catch(e){
      if(e && e.name!=="NotFoundError") alert("Couldn't connect to the cash drawer: "+(e.message||e));
      return false;
    }
  }
  // Silent reconnect: navigator.serial.getPorts() only ever returns ports
  // this origin was already granted (no chooser, no new user gesture) —
  // same "reconnect on drop" pattern as printing.js's USB/Bluetooth helpers.
  async function reconnectCashDrawerSilently(){
    if(!hasSerialPort()) return false;
    try{
      const ports = await navigator.serial.getPorts();
      if(ports.length===0) return false;
      const port = ports[0];
      if(!port.writable) await port.open({ baudRate: 9600 });
      window._drawer = { port };
      return true;
    }catch(e){ return false; }
  }
  function drawerConnected(){ return !!(window._drawer && window._drawer.port && window._drawer.port.writable); }
  function drawerStatusHtml(){
    if(!hasSerialPort()) return "Not supported in this build — Web Serial needs Chrome/Edge or the desktop app, served via a local server (not a plain file).";
    return drawerConnected()? "Connected." : "Not connected.";
  }
  // The explicit, standalone "open drawer" action — Step 4's own device
  // entry, never called from printReceipt/printEOD/printSaleCopy/etc.
  async function openCashDrawer(){
    if(!drawerConnected() && !(await reconnectCashDrawerSilently())){
      alert("No cash drawer connected. Open Settings → Cash Drawer to connect one.");
      return false;
    }
    try{
      const writer = window._drawer.port.writable.getWriter();
      await writer.write(DRAWER_KICK_BYTES);
      writer.releaseLock();
      return true;
    }catch(e){
      alert("Couldn't open the cash drawer — check the connection and try again: "+(e.message||e));
      window._drawer = null;
      return false;
    }
  }
  function cashDrawerSectionHtml(){
    return `
      <div class="card">
        <h3>Cash Drawer</h3>
        <p class="muted">A standalone USB/serial kick drawer — separate from the receipt printer. Opening it is always an explicit action, never automatic when a receipt prints.</p>
