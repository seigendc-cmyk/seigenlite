<style>
  :root{
    --orange:#E8590C;
    --orange-dark:#B8430A;
    --orange-light:#FFF1E6;
    --ink:#241C15;
    --ink-soft:#6B5D4F;
    --paper:#FFFFFF;
    --surface:#FFFAF6;
    --border:#EFDFCF;
    --success:#2E7D32;
    --success-bg:#EAF6EA;
    --danger:#C62828;
    --danger-bg:#FCEAEA;
    --warn:#8A6D00;
    --warn-bg:#FEF9E6;
    --radius:10px;
    --modal-radius:4px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--surface);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  #app{min-height:100vh;display:flex;flex-direction:column;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}

  .topbar{
    background:var(--paper);
    border-bottom:1px solid var(--border);
    padding:10px 14px;
    display:flex;align-items:center;gap:10px;
    position:sticky;top:0;z-index:20;
  }
  .topbar .brand-mark{width:34px;height:34px;border-radius:8px;object-fit:cover;flex:none;background:var(--orange-light);}
  .topbar .brand-mark.placeholder{display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--orange);border:1px solid var(--border);}
  .topbar .names{flex:1;min-width:0;}
  .topbar .shop{font-weight:700;font-size:15px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .topbar .branch{font-size:12px;color:var(--ink-soft);}
  .topbar .cart-btn{
    position:relative;background:var(--orange);color:#fff;border:none;
    width:42px;height:42px;border-radius:50%;font-size:19px;
    display:flex;align-items:center;justify-content:center;flex:none;
  }
  .cart-badge{
    position:absolute;top:-4px;right:-4px;background:var(--ink);color:#fff;
    font-size:10px;font-weight:700;min-width:17px;height:17px;border-radius:9px;
    display:flex;align-items:center;justify-content:center;padding:0 4px;
  }
  .dots-btn{padding:6px 12px;font-size:20px;line-height:1;font-weight:700;letter-spacing:1px;}
  .popmenu{
    position:fixed;z-index:200;background:var(--paper);border:1px solid var(--border);
    border-radius:10px;box-shadow:0 6px 22px rgba(36,28,21,.22);min-width:170px;padding:4px;
  }
  .popmenu button{
    display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:none;
    padding:11px 12px;font-size:14px;color:var(--ink);border-radius:7px;
  }
  .popmenu button:hover,.popmenu button:active{background:var(--surface);}
  .icon-badge-wrap{position:relative;display:inline-block;}
  .icon-badge{
    position:absolute;top:-6px;right:-6px;background:var(--ink);color:#fff;
    font-size:9.5px;font-weight:700;min-width:15px;height:15px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;padding:0 3px;
  }

  .navbar{
    background:var(--paper);border-radius:16px;
    box-shadow:0 -2px 14px rgba(36,28,21,.14);
    display:flex;position:sticky;bottom:8px;z-index:20;
  }
  .navbar button{
    flex:1;background:none;border:none;padding:9px 2px 8px;
    display:flex;flex-direction:column;align-items:center;gap:2px;
    color:var(--ink-soft);font-size:10px;
  }
  .navbar button .ic{font-size:17px;}
  .navbar button.active{color:var(--orange);}
  @media (min-width:768px){
    .navbar button .ic{font-size:68px;}
    .navbar button{padding:16px 4px 14px;}
    .navbar button{font-size:13px;}
  }

  main{flex:1;padding:14px;padding-bottom:20px;max-width:640px;margin:0 auto;width:100%;}

  h1,h2,h3{margin:0 0 10px;}
  h1{font-size:20px;} h2{font-size:17px;} h3{font-size:14px;color:var(--ink-soft);font-weight:600;}
  p{line-height:1.5;}
  label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin:12px 0 4px;}
  .field{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--paper);font-size:15px;color:var(--ink);}
  .field:focus{outline:2px solid var(--orange);outline-offset:1px;}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    padding:12px 18px;border-radius:var(--radius);border:none;font-size:14.5px;font-weight:700;
    width:100%;
  }
  .btn-primary{background:var(--orange);color:#fff;}
  .btn-primary:active{background:var(--orange-dark);}
  .btn-outline{background:transparent;color:var(--orange);border:1.5px solid var(--orange);}
  .btn-ghost{background:var(--orange-light);color:var(--orange-dark);}
  .btn-danger{background:var(--danger-bg);color:var(--danger);}
  .btn-sm{width:auto;padding:8px 12px;font-size:13px;}
  .row{display:flex;gap:10px;}
  .row>*{flex:1;}
  .card{background:var(--paper);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px;}
  .muted{color:var(--ink-soft);font-size:13px;}
  .hr{border:none;border-top:1px solid var(--border);margin:14px 0;}
  .pill{display:inline-block;background:var(--orange-light);color:var(--orange-dark);font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:20px;}
  .pill.low{background:var(--danger-bg);color:var(--danger);}
  .pill.ok{background:var(--success-bg);color:var(--success);}
  .center{text-align:center;}
  .banner-img{width:100%;max-height:120px;object-fit:cover;border-radius:var(--radius);margin-bottom:12px;border:1px solid var(--border);}

  .search-wrap{position:relative;margin-bottom:12px;}
  .search-wrap input{padding-left:36px;}
  .search-wrap .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-soft);}
  .product-row{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:12px 4px;border-bottom:1px solid var(--border);
  }
  .product-row:last-child{border-bottom:none;}
  .product-row .pname{font-weight:600;font-size:14.5px;}
  .psku{font-size:10.5px;font-weight:700;color:var(--orange-dark);}
  .product-row .pmeta{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .prod-thumb{width:46px;height:46px;border-radius:8px;object-fit:cover;flex:none;background:var(--orange-light);border:1px solid var(--border);}
  .prod-thumb-placeholder{width:46px;height:46px;border-radius:8px;flex:none;background:var(--orange-light);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--orange);opacity:.45;}
  .add-chip{background:var(--orange);color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:700;flex:none;}
  .add-chip:disabled{background:var(--border);color:var(--ink-soft);}

  .overlay{position:fixed;inset:0;background:rgba(36,28,21,.42);z-index:40;display:none;}
  .overlay.show{display:block;}
  .drawer{
    position:fixed;right:0;top:0;bottom:0;width:92%;max-width:400px;background:var(--paper);
    z-index:50;transform:translateX(100%);transition:transform .22s ease;
    display:flex;flex-direction:column;box-shadow:-4px 0 18px rgba(0,0,0,.15);
  }
  .drawer.show{transform:translateX(0);}
  .drawer-head{padding:14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
  .drawer-body{flex:1;overflow-y:auto;padding:10px 14px;}
  .drawer-foot{padding:14px;border-top:1px solid var(--border);max-height:60vh;overflow-y:auto;}
  .cart-item{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--border);}
  .cart-item .ci-name{flex:1;font-size:13.5px;font-weight:600;}
  .cart-item .ci-price{font-size:12px;color:var(--ink-soft);}
  .qty-ctl{display:flex;align-items:center;gap:6px;}
  .qty-ctl button{width:26px;height:26px;border-radius:6px;border:1px solid var(--border);background:var(--surface);font-size:14px;}
  .qty-ctl span{min-width:18px;text-align:center;font-weight:700;font-size:13.5px;}
  .total-line{display:flex;justify-content:space-between;font-size:16px;font-weight:800;margin-bottom:6px;}
  .subline{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-soft);margin-bottom:4px;}
  .close-x{background:none;border:none;font-size:20px;color:var(--ink-soft);padding:4px;}

  .center-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .setup-card{max-width:420px;width:100%;background:var(--paper);border:1px solid var(--border);border-radius:14px;padding:22px;}
  .step-dots{display:flex;gap:6px;justify-content:center;margin-bottom:16px;}
  .step-dots span{width:7px;height:7px;border-radius:50%;background:var(--border);}
  .step-dots span.on{background:var(--orange);}
  .device-code{font-size:22px;font-weight:800;letter-spacing:2px;text-align:center;background:var(--orange-light);color:var(--orange-dark);padding:14px;border-radius:var(--radius);margin:14px 0;}

  table.simple{width:100%;border-collapse:collapse;font-size:13.5px;}
  table.simple th{text-align:left;color:var(--ink-soft);font-size:11.5px;padding:6px 4px;border-bottom:1px solid var(--border);}
  table.simple td{padding:8px 4px;border-bottom:1px solid var(--border);}
  table.simple tr.stock-out{background:var(--danger-bg);}
  table.simple tr.stock-low{background:var(--warn-bg);}

  .subtabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;}

<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>
<script>
const APP_VERSION = "1.09.01";
/* =========================================================================
   seiGEN Commerce Lite — single-file offline POS
   Storage: SQLite via sql.js (WASM), persisted to IndexedDB as a blob.
   No install/Bluetooth. Runs as a plain local file; WhatsApp image/PDF
   attachments additionally need the file served via http://localhost
   (a local-server app) — text sharing always works from a plain file.

   ACTIVATION CODE FORMULA (also shown on the Help page in-app):
     function computeActivationCode(deviceCode, secretPhrase) {
       const combined = deviceCode.toUpperCase() + '|' + secretPhrase.toUpperCase();
       let hash = 0;
       for (let i = 0; i < combined.length; i++) {
         hash = ((hash << 5) - hash + combined.charCodeAt(i)) | 0;
       }
       hash = Math.abs(hash);
       return hash.toString(36).toUpperCase().padStart(6, '0').slice(-6);
     }
   Give this + the device code shown on the lock screen + the shop's secret
   phrase to any Claude chat to get the 6-character unlock code.
   ========================================================================= */

(function(){
  "use strict";

  let SQL=null, db=null;
  let cart=[];
  let appliedVoucher=null;
  let exportDirHandle=null;
  let exportScope=null; // "*" = all branches on this device, else a branch name; null = this branch
  // The chosen export folder is kept in IndexedDB (directory handles are
  // structured-cloneable) so it survives reloads — held only in memory it was
  // forgotten every time the app restarted.
  function exportDirStore(mode, fn){
    return new Promise((resolve)=>{
      try{
        const req = indexedDB.open("seigen-export-dir", 1);
        req.onupgradeneeded = ()=> req.result.createObjectStore("kv");
        req.onerror = ()=> resolve(null);
        req.onsuccess = ()=>{
          try{
            const tx = req.result.transaction("kv", mode);
            const r = fn(tx.objectStore("kv"));
            tx.oncomplete = ()=>{ resolve(r && r.result!==undefined ? r.result : null); req.result.close(); };
            tx.onerror = tx.onabort = ()=> resolve(null);
          }catch(e){ resolve(null); }
        };
      }catch(e){ resolve(null); }
    });
  }
  const saveExportDirHandle = (h)=> exportDirStore("readwrite", s=> h? s.put(h,"handle") : s.delete("handle"));
  if(window.showDirectoryPicker){
    exportDirStore("readonly", s=> s.get("handle")).then(h=>{
      if(h && !exportDirHandle){
        exportDirHandle = h;
        if(route==="more") render();
      }
    });
  }
  let route="loading";
  let moreTab="help";
  let plistQuery="";
  let plistBranch="";
  let reqBranch="";
  let reqDrawerOpen=false;
  let reqExpandedId=null;
  let reqLineSeq=0;
  let reqLines=[{id:reqLineSeq++, item:"", qty:""}];
  let settingsUnlocked=false;
  let stocktakeReportId=null;
  let rwType="sales";
  let rwBranch="";
  let rwStatus="";
  let rwReason="";
  let rwView="dn";
  let rwFrom="";
  let rwTo="";
  let rwGranularity="day";
  let drawerOpen=false;
  let searchQuery="";
  let productsQuery="";
  let creditQuery="";
  let directoryQuery="";
  let helpQuery="";
  let reportsQuery="";
  let currency="$";
  let sessionUser="";

  const $app = document.getElementById("app");
  const IDB_NAME="seigen_lite_db", IDB_STORE="kv", IDB_KEY="dbfile";


  function idbOpen(){
    return new Promise((res,rej)=>{
      const r = indexedDB.open(IDB_NAME, 1);
      r.onupgradeneeded = ()=> r.result.createObjectStore(IDB_STORE);
      r.onsuccess = ()=> res(r.result);
      r.onerror = ()=> rej(r.error);
    });
  }
  async function idbGet(){
    const conn = await idbOpen();
    return new Promise((res,rej)=>{
      const tx = conn.transaction(IDB_STORE,"readonly");
      const rq = tx.objectStore(IDB_STORE).get(IDB_KEY);
      rq.onsuccess=()=>res(rq.result||null);
      rq.onerror=()=>rej(rq.error);
    });
  }
  async function idbSet(bytes){
    const conn = await idbOpen();
    return new Promise((res,rej)=>{
      const tx = conn.transaction(IDB_STORE,"readwrite");
      tx.objectStore(IDB_STORE).put(bytes, IDB_KEY);
      tx.oncomplete=()=>res(true);
      tx.onerror=()=>rej(tx.error);
    });
  }
  async function persist(){ await idbSet(db.export()); }

  // ---- generic (multi-db-capable) helpers ----
  function allX(t, sql, params=[]){
    const stmt = t.prepare(sql);
    stmt.bind(params);
    const out=[];
    while(stmt.step()) out.push(stmt.getAsObject());
    stmt.free();
    return out;
  }
  function oneX(t, sql, params=[]){ const r = allX(t, sql, params); return r.length? r[0]: null; }
  function runX(t, sql, params=[]){ t.run(sql, params); }
  function all(sql, params=[]){ return allX(db, sql, params); }
  function one(sql, params=[]){ return oneX(db, sql, params); }
  function run(sql, params=[]){ return runX(db, sql, params); }

  function getSettingX(t, key, fallback=""){ const r = oneX(t,"SELECT value FROM settings WHERE key=?",[key]); return r? r.value: fallback; }
  function setSetting(key, value){
    run("INSERT INTO settings(key,value) VALUES(?,?) ON CONFLICT(key) DO UPDATE SET value=excluded.value",[key,String(value)]);
  }
  function getSetting(key, fallback=""){ return getSettingX(db, key, fallback); }
  function currentBranch(){ return getSetting("branch_name","") || getSetting("shop_name","") || "Main"; }
  function isRemote(){ return getSetting("branch_type","main")==="remote"; }
  function logAudit(action, productName, details){
    run("INSERT INTO audit_log(ts,branch,user,action,product_name,details) VALUES(?,?,?,?,?,?)",
      [new Date().toISOString(), currentBranch(), sessionUser||"Unknown", action, productName||"", details||""]);
  }

  const SCHEMA = `
    CREATE TABLE IF NOT EXISTS settings(key TEXT PRIMARY KEY, value TEXT);
    CREATE TABLE IF NOT EXISTS products(
      id INTEGER PRIMARY KEY AUTOINCREMENT, name TEXT NOT NULL,
      price REAL NOT NULL DEFAULT 0, stock INTEGER NOT NULL DEFAULT 0,
      low_threshold INTEGER NOT NULL DEFAULT 5
    );
    CREATE TABLE IF NOT EXISTS sales(
      id INTEGER PRIMARY KEY AUTOINCREMENT, ts TEXT, subtotal REAL DEFAULT 0,
      discount REAL DEFAULT 0, total REAL, method TEXT, customer_id INTEGER
    );
    CREATE TABLE IF NOT EXISTS sale_items(
      id INTEGER PRIMARY KEY AUTOINCREMENT, sale_id INTEGER,
      product_id INTEGER, name TEXT, price REAL, qty INTEGER
    );
    CREATE TABLE IF NOT EXISTS eod_sessions(
      id INTEGER PRIMARY KEY AUTOINCREMENT, date TEXT,
      expected_cash REAL, counted_cash REAL, variance REAL, notes TEXT
    );
    CREATE TABLE IF NOT EXISTS customers(
      id INTEGER PRIMARY KEY AUTOINCREMENT, name TEXT NOT NULL, phone TEXT
    );
    CREATE TABLE IF NOT EXISTS payouts(
      id INTEGER PRIMARY KEY AUTOINCREMENT, ts TEXT, amount REAL, reason TEXT
    );
    CREATE TABLE IF NOT EXISTS credit_payments(
      id INTEGER PRIMARY KEY AUTOINCREMENT, customer_id INTEGER, ts TEXT, amount REAL, note TEXT
    );
    CREATE TABLE IF NOT EXISTS stock_received(
      id INTEGER PRIMARY KEY AUTOINCREMENT, ts TEXT, product_id INTEGER, name TEXT, qty INTEGER, note TEXT
    );
    CREATE TABLE IF NOT EXISTS audit_log(
      id INTEGER PRIMARY KEY AUTOINCREMENT, ts TEXT, branch TEXT, user TEXT, action TEXT, product_name TEXT, details TEXT
    );
    CREATE TABLE IF NOT EXISTS stock_requests(
      id INTEGER PRIMARY KEY AUTOINCREMENT, ts TEXT, branch TEXT, user TEXT,
      item_requested TEXT, customer_name TEXT, customer_phone TEXT, qty_wanted INTEGER, notes TEXT, fulfilled INTEGER DEFAULT 0
    );
    CREATE TABLE IF NOT EXISTS stock_transfers(
      id INTEGER PRIMARY KEY AUTOINCREMENT, ts TEXT, from_branch TEXT, to_branch TEXT,
      product_name TEXT, sku TEXT, qty INTEGER, note TEXT, user TEXT,
      status TEXT DEFAULT 'Dispatched', received_ts TEXT, received_user TEXT
    );
    CREATE TABLE IF NOT EXISTS stocktakes(
      id INTEGER PRIMARY KEY AUTOINCREMENT, branch TEXT, team_names TEXT,
      start_date TEXT, end_date TEXT, status TEXT DEFAULT 'Open',
      cutoff_ts TEXT, created_by TEXT, created_ts TEXT
    );
    CREATE TABLE IF NOT EXISTS stocktake_counts(
      id INTEGER PRIMARY KEY AUTOINCREMENT, stocktake_id INTEGER, product_id INTEGER,
      product_name TEXT, sku TEXT, system_qty INTEGER, counted_qty INTEGER,
      counted_ts TEXT, counted_by TEXT
    );
    CREATE TABLE IF NOT EXISTS purchases(
      id INTEGER PRIMARY KEY AUTOINCREMENT, ts TEXT, branch TEXT, user TEXT,
      supplier TEXT, product_id INTEGER, product_name TEXT, sku TEXT,
      qty INTEGER, unit_cost REAL, total_cost REAL, note TEXT
    );
    CREATE TABLE IF NOT EXISTS staff(
      id INTEGER PRIMARY KEY AUTOINCREMENT, name TEXT, role TEXT DEFAULT 'Cashier',
      passcode TEXT, branch TEXT, active INTEGER DEFAULT 1, created_ts TEXT
    );
    CREATE TABLE IF NOT EXISTS vouchers(
      id INTEGER PRIMARY KEY AUTOINCREMENT, customer_id INTEGER, amount REAL,
      branch TEXT, earned_ts TEXT, status TEXT DEFAULT 'Available',
      redeemed_ts TEXT, redeemed_sale_id INTEGER
    );
    CREATE TABLE IF NOT EXISTS doc_counters(
      branch_id TEXT, doc_type TEXT, last_no INTEGER DEFAULT 0, PRIMARY KEY(branch_id, doc_type)
    );
    CREATE TABLE IF NOT EXISTS dispatch_docs(
      dispatch_branch_id TEXT, dn_no INTEGER, dispatch_branch_name TEXT, receive_branch_name TEXT,
      direction TEXT, grv_no INTEGER, created_ts TEXT, PRIMARY KEY(dispatch_branch_id, dn_no)
    );
    CREATE TABLE IF NOT EXISTS dn_events(
      id INTEGER PRIMARY KEY AUTOINCREMENT, event_key TEXT NOT NULL UNIQUE,
      dn_branch_id TEXT NOT NULL, dn_no INTEGER NOT NULL, event_type TEXT NOT NULL,
      actor_branch_id TEXT DEFAULT '', actor_branch_name TEXT DEFAULT '', dn_from_name TEXT DEFAULT '', dn_to_name TEXT DEFAULT '',
      event_ts TEXT NOT NULL, grv_no INTEGER, detail_json TEXT DEFAULT ''
    );
    CREATE TABLE IF NOT EXISTS stock_adjustments(
      id INTEGER PRIMARY KEY AUTOINCREMENT, branch TEXT, branch_id TEXT, adj_no INTEGER,
      product_code TEXT DEFAULT '', product_name TEXT, qty_delta INTEGER, reason TEXT, note TEXT,
      by_user TEXT, authorised_by TEXT, ts TEXT, dn_branch_id TEXT, dn_no INTEGER
    );
    CREATE UNIQUE INDEX IF NOT EXISTS ux_stock_adjustments ON stock_adjustments(branch_id, adj_no);
    CREATE TABLE IF NOT EXISTS dn_cases(
      id INTEGER PRIMARY KEY AUTOINCREMENT, case_no INTEGER, dn_branch_id TEXT, dn_no INTEGER,
      kind TEXT, state TEXT DEFAULT 'pending', nonce TEXT, plan_json TEXT, replaced_by INTEGER,
      override INTEGER DEFAULT 0, note TEXT, started_ts TEXT, started_by TEXT, authorised_by TEXT,
      posted_ts TEXT, posted_via TEXT, acked_ts TEXT
    );
    CREATE UNIQUE INDEX IF NOT EXISTS ux_dn_cases ON dn_cases(dn_branch_id, case_no);
    CREATE TABLE IF NOT EXISTS branch_register(
      id INTEGER PRIMARY KEY AUTOINCREMENT, name TEXT NOT NULL COLLATE NOCASE UNIQUE, whatsapp TEXT DEFAULT ''
    );
    CREATE TABLE IF NOT EXISTS branch_prices(
      dest_branch_name TEXT NOT NULL COLLATE NOCASE, code TEXT NOT NULL COLLATE NOCASE, price REAL NOT NULL, updated_ts TEXT,
      PRIMARY KEY(dest_branch_name, code)
    );
  `;
  function migrate(t){
    const alters = [
      "ALTER TABLE sales ADD COLUMN subtotal REAL DEFAULT 0",
      "ALTER TABLE sales ADD COLUMN discount REAL DEFAULT 0",
      "ALTER TABLE sales ADD COLUMN customer_id INTEGER",
      "ALTER TABLE sales ADD COLUMN branch TEXT DEFAULT ''",
      "ALTER TABLE sales ADD COLUMN discount_reason TEXT DEFAULT ''",
      "ALTER TABLE sales ADD COLUMN discount_approved_by TEXT DEFAULT ''",
      "ALTER TABLE sales ADD COLUMN discount_status TEXT DEFAULT ''",
      "ALTER TABLE sales ADD COLUMN markup REAL DEFAULT 0",
      "ALTER TABLE sales ADD COLUMN markup_reason TEXT DEFAULT ''",
      "ALTER TABLE sales ADD COLUMN voucher_amount REAL DEFAULT 0",
      "ALTER TABLE sales ADD COLUMN payment_ref TEXT DEFAULT ''",
      "ALTER TABLE sales ADD COLUMN user TEXT DEFAULT ''",
      "ALTER TABLE sale_items ADD COLUMN cost REAL DEFAULT 0",
      "ALTER TABLE products ADD COLUMN sku TEXT DEFAULT ''",
      "ALTER TABLE products ADD COLUMN image TEXT DEFAULT ''",
      "ALTER TABLE products ADD COLUMN branch TEXT DEFAULT ''",
      "ALTER TABLE products ADD COLUMN cost REAL DEFAULT 0",
      "ALTER TABLE products ADD COLUMN description TEXT DEFAULT ''",
      "ALTER TABLE products ADD COLUMN created_ts TEXT DEFAULT ''",
      "ALTER TABLE products ADD COLUMN shelf TEXT DEFAULT ''",
      "ALTER TABLE products ADD COLUMN category TEXT DEFAULT ''",
      "ALTER TABLE payouts ADD COLUMN branch TEXT DEFAULT ''",
      "ALTER TABLE payouts ADD COLUMN user TEXT DEFAULT ''",
      "ALTER TABLE stock_received ADD COLUMN branch TEXT DEFAULT ''",
      "ALTER TABLE stock_received ADD COLUMN user TEXT DEFAULT ''",
      "ALTER TABLE eod_sessions ADD COLUMN branch TEXT DEFAULT ''",
      "ALTER TABLE eod_sessions ADD COLUMN ts TEXT DEFAULT ''",
      "ALTER TABLE credit_payments ADD COLUMN branch TEXT DEFAULT ''",
      "ALTER TABLE credit_payments ADD COLUMN user TEXT DEFAULT ''",
      "ALTER TABLE customers ADD COLUMN branch TEXT DEFAULT ''",
      "ALTER TABLE customers ADD COLUMN address TEXT DEFAULT ''",
      "ALTER TABLE customers ADD COLUMN town_city TEXT DEFAULT ''",
      "ALTER TABLE customers ADD COLUMN suburb TEXT DEFAULT ''",
      "ALTER TABLE stock_transfers ADD COLUMN dn_no INTEGER",
      "ALTER TABLE stock_received ADD COLUMN dn_branch_id TEXT",
      "ALTER TABLE stock_received ADD COLUMN dn_no INTEGER",
      "ALTER TABLE stock_received ADD COLUMN grv_no INTEGER",
      "ALTER TABLE dispatch_docs ADD COLUMN imported_ts TEXT DEFAULT ''",
      "ALTER TABLE dispatch_docs ADD COLUMN received_ts TEXT DEFAULT ''",
      "ALTER TABLE dispatch_docs ADD COLUMN received_iso TEXT DEFAULT ''",
      "ALTER TABLE dispatch_docs ADD COLUMN received_by TEXT DEFAULT ''",
      "ALTER TABLE dispatch_docs ADD COLUMN variance_json TEXT DEFAULT ''",
      "ALTER TABLE dispatch_docs ADD COLUMN variance_ts TEXT DEFAULT ''",
      "ALTER TABLE branch_register ADD COLUMN price_mode TEXT DEFAULT 'follow_main'",
      "ALTER TABLE branch_register ADD COLUMN catalogue_ts TEXT DEFAULT ''",
      "ALTER TABLE branch_register ADD COLUMN catalogue_fp TEXT DEFAULT ''",
      "ALTER TABLE branch_register ADD COLUMN catalogue_mode TEXT DEFAULT ''",
      "ALTER TABLE dispatch_docs ADD COLUMN status TEXT DEFAULT 'dispatched'",
      "ALTER TABLE dispatch_docs ADD COLUMN file_name TEXT DEFAULT ''",
      "ALTER TABLE dispatch_docs ADD COLUMN line_count INTEGER DEFAULT 0",
      "ALTER TABLE dispatch_docs ADD COLUMN unit_total INTEGER DEFAULT 0",
      "ALTER TABLE dispatch_docs ADD COLUMN created_iso TEXT DEFAULT ''",
      "ALTER TABLE products ADD COLUMN price_ts TEXT DEFAULT ''",
      "ALTER TABLE branch_register ADD COLUMN prices_ts TEXT DEFAULT ''",
      "ALTER TABLE stock_transfers ADD COLUMN dn_branch_id TEXT",
      "ALTER TABLE stock_received ADD COLUMN adj_branch_id TEXT",
      "ALTER TABLE stock_received ADD COLUMN adj_no INTEGER",
      "ALTER TABLE branch_register ADD COLUMN catalogue_first_ts TEXT DEFAULT ''",
      "ALTER TABLE dispatch_docs ADD COLUMN cancel_no INTEGER",
      "ALTER TABLE dispatch_docs ADD COLUMN cancelled_ts TEXT DEFAULT ''",
      "ALTER TABLE dispatch_docs ADD COLUMN replaces_dn_no INTEGER",
      "ALTER TABLE dispatch_docs ADD COLUMN replaced_by INTEGER",
      "ALTER TABLE dispatch_docs ADD COLUMN cancel_kind TEXT DEFAULT ''",
      "ALTER TABLE dispatch_docs ADD COLUMN stock_posted INTEGER DEFAULT 1",
      "ALTER TABLE dispatch_docs ADD COLUMN cancel_nonce TEXT DEFAULT ''"
    ];
    alters.forEach(sql=>{ try{ t.run(sql); }catch(e){} });
    try{ t.run("UPDATE products SET created_ts=? WHERE created_ts IS NULL OR created_ts=''", [new Date().toISOString()]); }catch(e){}
    // products.price_ts = when the selling price last changed. Triggers (rather than
    // edits at every price-changing screen) so no path can forget: manual edit,
    // Excel import, catalogue import and the remote price edit all set it.
    // Created here, after the column exists, and only ever set from real changes.
    try{ t.run("UPDATE products SET price_ts=COALESCE(NULLIF(created_ts,''),?) WHERE price_ts IS NULL OR price_ts=''", [new Date().toISOString()]); }catch(e){}
    try{ t.run(`CREATE TRIGGER IF NOT EXISTS products_price_ts_upd AFTER UPDATE OF price ON products
      WHEN NEW.price IS NOT OLD.price
      BEGIN UPDATE products SET price_ts=strftime('%Y-%m-%dT%H:%M:%fZ','now') WHERE id=NEW.id; END`); }catch(e){}
    try{ t.run(`CREATE TRIGGER IF NOT EXISTS products_price_ts_ins AFTER INSERT ON products
      WHEN NEW.price_ts IS NULL OR NEW.price_ts=''
      BEGIN UPDATE products SET price_ts=strftime('%Y-%m-%dT%H:%M:%fZ','now') WHERE id=NEW.id; END`); }catch(e){}
    backfillDnLinks(t);
    // When the FIRST catalogue was generated for a destination (locks its name). Existing rows only
    // know their latest build, which is the best available stand-in.
    try{ t.run("UPDATE branch_register SET catalogue_first_ts=catalogue_ts WHERE (catalogue_first_ts IS NULL OR catalogue_first_ts='') AND catalogue_ts IS NOT NULL AND catalogue_ts<>''"); }catch(e){}
  }
  // Phase 4: DN lines learn which branch id issued them (so a status can be joined
  // on (branch id, dn_no) instead of a name), and dn_events is filled in for
  // dispatches made before it existed. Additive and safe to repeat.
  function backfillDnLinks(t){
    try{ t.run(`UPDATE stock_transfers SET dn_branch_id=(SELECT d.dispatch_branch_id FROM dispatch_docs d
        WHERE d.dn_no=stock_transfers.dn_no AND d.dispatch_branch_name=stock_transfers.from_branch AND d.direction='out')
        WHERE dn_no IS NOT NULL AND (dn_branch_id IS NULL OR dn_branch_id='')`); }catch(e){}
    const ins = `INSERT OR IGNORE INTO dn_events(event_key,dn_branch_id,dn_no,event_type,actor_branch_id,actor_branch_name,dn_from_name,dn_to_name,event_ts,grv_no,detail_json) `;
    const own = `COALESCE((SELECT value FROM settings WHERE key='branch_id'),'')`;
    try{ t.run(ins+`SELECT dispatch_branch_id||'|'||dn_no||'|dispatched', dispatch_branch_id, dn_no, 'dispatched', dispatch_branch_id, dispatch_branch_name,
        dispatch_branch_name, receive_branch_name, created_ts, NULL, '' FROM dispatch_docs WHERE direction='out' AND created_ts IS NOT NULL AND created_ts<>''`); }catch(e){}
    try{ t.run(ins+`SELECT dispatch_branch_id||'|'||dn_no||'|received', dispatch_branch_id, dn_no, 'received', ${own}, receive_branch_name,
        dispatch_branch_name, receive_branch_name, COALESCE(NULLIF(received_iso,''),received_ts), grv_no, '' FROM dispatch_docs
        WHERE status='received' AND COALESCE(NULLIF(received_iso,''),received_ts) IS NOT NULL AND COALESCE(NULLIF(received_iso,''),received_ts)<>''`); }catch(e){}

  function uid4(){
    const chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let s="";

  function computeActivationCode(deviceCode, secretPhrase){
    const combined = deviceCode.toUpperCase()+"|"+secretPhrase.toUpperCase();
    let hash=0;
    for(let i=0;i<combined.length;i++){ hash = ((hash<<5)-hash+combined.charCodeAt(i))|0; }
    hash = Math.abs(hash);
    return hash.toString(36).toUpperCase().padStart(6,"0").slice(-6);
  }

  function currentVoucherAmount(){ return appliedVoucher? appliedVoucher.amount : 0; }
  // Single source of truth for the sale math: discount is capped at the
  // subtotal and voucher is capped at what's left after discount+markup, so
  // the amounts we store and print always add up to the printed total —
  // rather than being floored to 0 while the itemized lines above it still
  // show the uncapped amount the customer/staff typed or that a voucher
  // happened to be worth.
  function cartTotals(){
    const subtotal = cartSubtotal();
    const discount = Math.min(Math.max(0,currentDiscount()), subtotal);
    const markup = Math.max(0,currentMarkup());
    const base = (subtotal - discount) + markup;
    const voucher = Math.min(Math.max(0,currentVoucherAmount()), base);
    const total = base - voucher;
    return { subtotal, discount, markup, voucher, total };
  }
  function cartTotal(){ return cartTotals().total; }

  function findOrCreateCustomer(name, phone, address, townCity, suburb){
    name = (name||"").trim(); phone=(phone||"").trim();

  // Frequent-customer vouchers: after a sale, check whether this customer
  // has now hit the configured purchase count within the configured window

  // voucher, issue one. The voucher amount comes from Settings — left at 0

  function maybeIssueFrequentCustomerVoucher(customerId, branch, ts){
    if(!customerId) return;
    const voucherAmt = parseFloat(getSetting("freq_voucher_amount","0"))||0;
    if(voucherAmt<=0) return;
    const purchasesNeeded = parseInt(getSetting("freq_purchases_needed","5"))||5;
    const withinDays = parseInt(getSetting("freq_within_days","30"))||30;
    const sinceTs = new Date(Date.now() - withinDays*86400000).toISOString();
    const recentCount = one("SELECT COUNT(*) as c FROM sales WHERE customer_id=? AND branch=? AND ts>=?",[customerId,branch,sinceTs]).c;
    if(recentCount < purchasesNeeded) return;
    const existingVoucher = one("SELECT * FROM vouchers WHERE customer_id=? AND status='Available'",[customerId]);
    if(existingVoucher) return;
    run("INSERT INTO vouchers(customer_id,amount,branch,earned_ts,status) VALUES(?,?,?,?,'Available')",[customerId,voucherAmt,branch,ts]);
  }

  function completeSale(method){
    if(cart.length===0) return;
    const nameEl = document.getElementById("custName");
    const phoneEl = document.getElementById("custPhone");
    const custName = nameEl? nameEl.value.trim() : "";
    const custPhone = phoneEl? phoneEl.value.trim() : "";
    if(method==="Credit" && !custName){ alert("Enter the customer's name for a credit sale"); return; }

    const reasonEl = document.getElementById("discountReason");
    const approvedEl = document.getElementById("discountApprovedBy");
    const discountReason = reasonEl? reasonEl.value.trim() : "";
    const discountApprovedBy = approvedEl? approvedEl.value.trim() : "";
    if(currentDiscount()>0 && !discountReason){ alert("Enter a reason for the discount"); return; }

    const markupReasonEl = document.getElementById("markupReason");
    const markupReason = markupReasonEl? markupReasonEl.value.trim() : "";

    const refEl = document.getElementById("paymentRef");
    const paymentRef = refEl? refEl.value.trim() : "";
    if((method==="EcoCash"||method==="Bank") && !paymentRef){ alert("Enter the payment reference number"); return; }

    const customerId = custName? findOrCreateCustomer(custName, custPhone) : null;
    const voucherToRedeem = appliedVoucher;
    const ts = new Date().toISOString();

    // Clamped here (rather than trusting the raw inputs) so discount/voucher
    // never exceed what the sale can actually absorb — otherwise the
    // subtotal/discount/markup/voucher lines printed on the receipt and
    // summed in EOD/Discount reports wouldn't add up to the total, which
    // was floored at 0 instead of reflecting what was really given away.
    const { subtotal, discount, markup, voucher: voucherAmount, total } = cartTotals();
    const discountStatus = discount>0? (discountApprovedBy? "Approved":"Pending") : "";
    const branch = currentBranch();
    run(`INSERT INTO sales(ts,subtotal,discount,total,method,customer_id,branch,discount_reason,discount_approved_by,discount_status,markup,markup_reason,payment_ref,user,voucher_amount)
         VALUES(?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)`,
      [ts,subtotal,discount,total,method,customerId,branch,discountReason,discountApprovedBy,discountStatus,markup,markupReason,paymentRef,sessionUser||"",voucherAmount]);
    const saleId = one("SELECT last_insert_rowid() as id").id;
    cart.forEach(c=>{
      const prod = one("SELECT cost FROM products WHERE id=?",[c.product_id]);
      run("INSERT INTO sale_items(sale_id,product_id,name,price,qty,cost) VALUES(?,?,?,?,?,?)",
        [saleId,c.product_id,c.name,c.price,c.qty,prod?prod.cost:0]);
      run("UPDATE products SET stock = stock - ? WHERE id=?",[c.qty,c.product_id]);
    });
    if(voucherToRedeem){
      run("UPDATE vouchers SET status='Redeemed', redeemed_ts=?, redeemed_sale_id=? WHERE id=?",[ts,saleId,voucherToRedeem.id]);
    }
    const itemNames = cart.map(c=>c.name);
    const itemsSummary = itemNames.length<=3? itemNames.join(", ") : `${itemNames[0]} +${itemNames.length-1} more`;
    logAudit("Sale", itemsSummary, `Receipt #${saleId} · ${currency}${total.toFixed(2)} · ${method}`);
    maybeIssueFrequentCustomerVoucher(customerId, branch, ts);
    persist();
    window._lastReceipt = {saleId,ts,subtotal,discount,markup,voucherAmount,total,method,items:cart.slice()};
    printReceipt(saleId, ts, subtotal, discount, markup, voucherAmount, total, method, cart.slice());
    cart = []; drawerOpen=false; appliedVoucher=null;
    render();
  }

  function paperWidth(){ return parseFloat(getSetting("paper_width","58")) || 58; }
  // Estimated character columns for a given paper width in mm, now that
  // every print job forces condensed Font B (0.75 replaces the old 0.6
  // used for the default wider font). Still just an estimate — the "Print
  // test line" tool in Settings is the real calibration step.
  function paperColumns(mm){ return Math.max(16, Math.round(mm * 0.75)); }

  // ---------------- USB (WebUSB) thermal printing ----------------
  // Works only in Chrome/Edge (desktop or Android with an OTG-connected
  // printer), and only when served via http(s)/localhost — never from a
  // plain double-clicked file. Talks directly to the printer over USB
  // using raw ESC/POS commands, so no OS print driver is needed.
  function hasUSBPrint(){ return !!(navigator.usb); }
  function escposColWidth(){ return paperColumns(paperWidth()); }
  function concatBytes(arrays){
    const total = arrays.reduce((s,a)=>s+a.length,0);
    const out = new Uint8Array(total);
    let offset=0;
    arrays.forEach(a=>{ out.set(a,offset); offset+=a.length; });
    return out;
  }
  function escposTextBytes(str){ return new TextEncoder().encode(str); }
  const ESC=0x1B, GS=0x1D;
  const escposInit = ()=> new Uint8Array([ESC,0x40]);
  const escposBold = on => new Uint8Array([ESC,0x45,on?1:0]);
  const escposAlign = a => new Uint8Array([ESC,0x61, a==="center"?1:a==="right"?2:0]);
  const escposCut = ()=> new Uint8Array([0x0A,0x0A,0x0A,GS,0x56,0x00]);
  const escposLine = (width)=> escposTextBytes("-".repeat(width)+"\n");
  // Forced at the start of every print job (right after escposInit()) so
  // lines stop wrapping regardless of whatever font/width state the
  // printer powered on in: condensed Font B fits more characters per mm
  // than the default Font A, and the explicit 1x1 size reset undoes any
  // double-width/double-height mode that might still be active.
  const escposFontB = ()=> new Uint8Array([ESC, 0x4D, 0x01]); // ESC M 1 — condensed Font B
  const escposNormalSize = ()=> new Uint8Array([GS, 0x21, 0x00]); // GS ! 0x00 — 1x1 character size

  async function connectUSBPrinter(){
    if(!hasUSBPrint()){ alert("USB printing isn't available in this browser. Use Chrome, with the app served via a local server (not opened as a plain file)."); return false; }
    try{
      const device = await navigator.usb.requestDevice({ filters: [] });
      await device.open();
      if(device.configuration===null) await device.selectConfiguration(1);
      let interfaceNumber, endpointNumber;
      for(const iface of device.configuration.interfaces){
        for(const alt of iface.alternates){
          const outEp = alt.endpoints.find(e=>e.direction==="out");
          if(outEp){ interfaceNumber=iface.interfaceNumber; endpointNumber=outEp.endpointNumber; break; }
        }
        if(interfaceNumber!==undefined) break;
      }
      if(endpointNumber===undefined){ alert("That USB device doesn't look like a printer (no usable data channel found)."); return false; }
      await device.claimInterface(interfaceNumber);
      window._usbPrinter = {device, endpointNumber};
      return true;
    }catch(e){
      if(e && e.name!=="NotFoundError") alert("Couldn't connect to a USB printer: "+(e.message||e));
      return false;
    }
  }
  async function usbPrintBytes(bytes){
    if(!window._usbPrinter){ const ok = await connectUSBPrinter(); if(!ok) return false; }
    try{
      await window._usbPrinter.device.transferOut(window._usbPrinter.endpointNumber, bytes);
      return true;
    }catch(e){
      alert("USB print failed — check the printer is still connected and try again: "+(e.message||e));
      window._usbPrinter = null;
      return false;
    }
  }
  function usbPrintButtonHtml(id){
    return hasUSBPrint()? `<button class="btn btn-outline" id="${id}" style="flex:none;width:auto;padding:12px">🔌</button>` : "";
  }

  // ---------------- Bluetooth (Web Bluetooth/BLE) ESC/POS printing ----------------
  // Parallel to the USB path above, same escpos* byte builders, just a
  // different transport underneath. Many cheap BLE thermal printers expose
  // a plain "serial over BLE" characteristic under one of a couple of very
  // common vendor UUIDs — since we can't know the exact printer's service
  // ahead of time, we declare both as optionalServices (GATT requires the
  // service UUID to be pre-declared to access it after connecting) and
  // discover the actual writable characteristic at connect time instead of
  // assuming one.
  const BT_SERIAL_SERVICE_UUIDS = [
    "49535343-fe7d-4ae5-8fa9-9fafd205e455", // ISSC/Microchip transparent UART
    "6e400001-b5a3-f393-e0a9-e50e24dcca9e", // Nordic UART Service
  ];
  function hasBTPrint(){ return !!(navigator.bluetooth); }
  async function connectBTPrinter(){
    if(!hasBTPrint()){ alert("Bluetooth printing isn't available in this browser. Use Chrome, with the app served via a local server (not opened as a plain file)."); return false; }
    try{
      const device = await navigator.bluetooth.requestDevice({
        acceptAllDevices: true,
        optionalServices: BT_SERIAL_SERVICE_UUIDS
      });
      const server = await device.gatt.connect();
      const services = await server.getPrimaryServices();
      let writable = null;
      for(const service of services){
        const chars = await service.getCharacteristics();
        writable = chars.find(c=> c.properties.write || c.properties.writeWithoutResponse);
        if(writable) break;
      }
      if(!writable){
        alert("Connected, but couldn't find a way to send data to it — this printer's Bluetooth mode may not be compatible with this app.");
        return false;
      }
      window._btPrinter = {device, characteristic: writable};
      return true;
    }catch(e){
      if(e && e.name!=="NotFoundError") alert("Couldn't connect to a Bluetooth printer: "+(e.message||e));
      return false;
    }
  }
  async function btPrintBytes(bytes){
    if(!window._btPrinter){ const ok = await connectBTPrinter(); if(!ok) return false; }
    try{
      const ch = window._btPrinter.characteristic;
      const canWriteWithResponse = !!ch.properties.write;
      const CHUNK = 20; // GATT writes are typically capped around 20 bytes without a negotiated MTU
      for(let i=0;i<bytes.length;i+=CHUNK){
        const chunk = bytes.slice(i, i+CHUNK);
        if(canWriteWithResponse) await ch.writeValueWithResponse(chunk);
        else await ch.writeValueWithoutResponse(chunk);
      }
      return true;
    }catch(e){
      alert("Bluetooth print failed — check the printer is still connected and try again: "+(e.message||e));
      window._btPrinter = null;
      return false;
    }
  }

  // Sends straight to whichever direct printer is already connected, with
  // no OS dialog. Bluetooth wins if both happen to be connected at once —
  // an arbitrary but reasonable tie-break, not meant to be configurable.
  // Returns false when nothing is connected, so callers can fall back to
  // the normal #printArea/printNow() dialog path.
  async function sendDirect(bytes){
    if(window._btPrinter){ await btPrintBytes(bytes); return true; }
    if(window._usbPrinter){ await usbPrintBytes(bytes); return true; }
    return false;
  }

    parts.push(escposTextBytes(new Date(ts).toLocaleString()+"\n"));

    items.forEach(i=> parts.push(escposTextBytes(padLine(`${i.qty} x ${i.name}`, `${currency}${(i.price*i.qty).toFixed(2)}`, w)+"\n")));

    if(markup>0) parts.push(escposTextBytes(padLine("Markup", `+${currency}${markup.toFixed(2)}`, w)+"\n"));
    if(voucherAmount>0) parts.push(escposTextBytes(padLine("Voucher", `-${currency}${voucherAmount.toFixed(2)}`, w)+"\n"));

  // Calibration tool: a fixed-length known string is a far more reliable
  // wrap test than any receipt's real content. Accepts an explicit column
  // count so the Settings button can test the live (unsaved) mm value
  // instead of whatever's already persisted.
  function buildTestLineBytes(w){
    w = w || escposColWidth();
    let digits = "";
    for(let i=0;i<w;i++) digits += (i%2===0? "1":"9");
    const parts = [ escposInit(), escposFontB(), escposNormalSize() ];
    parts.push(escposTextBytes(digits+"\n"));
    parts.push(escposLine(w));
    parts.push(escposTextBytes("If this line wrapped, lower the mm value above.\n"));
    parts.push(escposCut());
    return concatBytes(parts);
  }

  function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

  // Shared "any-order" search match: every whitespace-separated token in
  // the query must appear somewhere in the combined searchable text,
  // regardless of what order they were typed in — so "small metal" and
  // "metal small" match the same item. Originally lived only inside
  // pos.js's searchProducts(); factored out here so every search box in
  // the app (product search, and the five list-filter search boxes) shares
  // exactly one implementation of this rule instead of each reimplementing it.
  function matchesAnyOrder(query, searchableText){
    const q = (query||"").trim().toLowerCase();
    if(!q) return true;
    const hay = (searchableText||"").toLowerCase();
    return q.split(/\s+/).every(t=> hay.includes(t));
  }

  // Formats a receipt-style message as 80-column monospace text, wrapped in
  // WhatsApp's ``` monospace markers so item names and amounts line up.
  function padLine(left, right, width){
    width = width||80;
    left=String(left); right=String(right);
    const gap = Math.max(1, width-left.length-right.length);
    return left + " ".repeat(gap) + right;
  }
  function receiptText(title, itemLines, totalLines){
    const bar = "-".repeat(80);
    let out = title+"\n"+bar+"\n";
    itemLines.forEach(l=> out+=l+"\n");
    out += bar+"\n";
    totalLines.forEach(l=> out+=l+"\n");
    return "```\n"+out+"```";
  }

  function sanitizeFilenamePart(s){ return String(s).replace(/[\\/:*?"<>|]/g,"-"); }
  // Shared filename convention for every exported .sqlite file — Settings
  // Export, the WhatsApp share button, and the dispatch auto-export all
  // use this so a file's origin and moment are unambiguous at a glance.
  function exportFilename(baseName, branch){
    const date = new Date();
    const d = date.toISOString().slice(0,10);
    const t = date.toTimeString().slice(0,8).replace(/:/g,'-');
    return `${baseName}-${sanitizeFilenamePart(branch)}-${d}-${t}.sqlite`;
  }

  // Filename convention for exported data files, Excel item lists and app
  // logs, so whoever receives one can tell what it is, its document number,
  // where it was saved from, what it covers, and when:
  //   EXP0007_DataExport_From-Main_For-IVO_19Sep26-0341PM.sqlite
  // Numbers come from the same per-branch counters as DN/GRV (docnum.js), so
  // they survive a Replace and never repeat on a device.
  const scopeLabel = (scope)=> (!scope || scope==="*")? "AllBranches" : scope;
  function docFilename({type, prefix, ext, scope, period}){
    const d = new Date();
    const no = reserveDocNumber(prefix).text;
    persist();
    const parts = [no, type, "From-"+sanitizeBranchName(currentBranch())];
    if(scope!==undefined) parts.push("For-"+sanitizeBranchName(scopeLabel(scope)));
    if(period) parts.push(period);
    parts.push(fileDatePart(d)+"-"+fileTimePart(d));
    return parts.join("_")+"."+ext;
  }

  // Small anchored pop-up menu (the ⋮ buttons). items: [{label, fn}].
  function showMenu(anchor, items){
    document.querySelectorAll(".popmenu").forEach(m=>m.remove());
    const m = document.createElement("div");
    m.className = "popmenu";
    m.innerHTML = items.map((it,i)=>`<button data-mi="${i}">${it.label}</button>`).join("");
    document.body.appendChild(m);
    const r = anchor.getBoundingClientRect();
    m.style.top = Math.max(8, Math.min(r.bottom+4, window.innerHeight-m.offsetHeight-8))+"px";
    m.style.left = Math.max(8, Math.min(r.right-m.offsetWidth, window.innerWidth-m.offsetWidth-8))+"px";
    const close = ()=>{ m.remove(); document.removeEventListener("click", outside, true); };
    const outside = (e)=>{ if(!m.contains(e.target)){ close(); if(anchor.contains(e.target)) e.stopPropagation(); } };
    setTimeout(()=>document.addEventListener("click", outside, true), 0);
    m.querySelectorAll("[data-mi]").forEach(b=> b.onclick=()=>{ close(); items[+b.dataset.mi].fn(); });
  }

  // Shows a "voucher available" badge + Apply button once the typed
  // customer name matches an existing customer with an Available voucher;
  // switches to a "voucher applied" pill (with a way to remove it) once
  // applied. Auto-clears if the name is edited to no longer match the
  // customer the voucher was applied for.
  function renderVoucherBox(){
    const box = document.getElementById("voucherBox");
    if(!box) return;
    const nameEl = document.getElementById("custName");
    const name = nameEl? nameEl.value.trim() : "";
    const cust = findMatchingCustomer(name);
    const totalEl = document.getElementById("drawerTotal");
    if(appliedVoucher && (!cust || cust.id!==appliedVoucher.customerId)){
      appliedVoucher = null;
      if(totalEl) totalEl.textContent = currency+cartTotal().toFixed(2);
    }
    if(!cust){ box.innerHTML=""; return; }
    if(appliedVoucher && appliedVoucher.customerId===cust.id){
      box.innerHTML = `<div class="pill ok" style="display:inline-flex;align-items:center;gap:6px;margin:6px 0">Voucher applied: -${currency}${appliedVoucher.amount.toFixed(2)} <button type="button" data-remove-voucher style="background:none;border:none;color:inherit;font-weight:700;padding:0 2px;cursor:pointer">✕</button></div>`;
      box.querySelector("[data-remove-voucher]").onclick=()=>{
        appliedVoucher = null;
        if(totalEl) totalEl.textContent = currency+cartTotal().toFixed(2);
        renderVoucherBox();
      };
      return;
    }
    const voucher = one("SELECT * FROM vouchers WHERE customer_id=? AND status='Available'",[cust.id]);
    if(!voucher){ box.innerHTML=""; return; }
    box.innerHTML = `<div class="card" style="padding:8px 10px;margin:6px 0;display:flex;justify-content:space-between;align-items:center">
      <span>🎁 Voucher available: ${currency}${voucher.amount.toFixed(2)}</span>

    </div>`;
    box.querySelector("[data-apply-voucher]").onclick=()=>{
      appliedVoucher = { id:voucher.id, amount:voucher.amount, customerId:cust.id };
      if(totalEl) totalEl.textContent = currency+cartTotal().toFixed(2);
      renderVoucherBox();
    };
  }

      if(b.dataset.tab==="settings" && moreTab!=="settings") settingsUnlocked=false;
      moreTab=b.dataset.tab;
      document.getElementById("menu-moretab").style.display="none";
      render();
    });
    const body = document.getElementById("moreBody");
    if(moreTab==="help") renderHelp(body);
    else if(moreTab==="about") renderAbout(body);
    else if(moreTab==="directory") renderDirectory(body);
    else if(moreTab==="productlist") renderProductList(body);
    else if(moreTab==="stocktake"){ if(isRemote()){ moreTab="help"; renderHelp(body); } else renderStocktake(body); }
    else if(moreTab==="requests") renderStockRequests(body);
    else if(moreTab==="purchasing"){ if(isRemote()){ moreTab="help"; renderHelp(body); } else renderPurchasing(body); }
    else if(moreTab==="reportwriter"){ if(isRemote()){ moreTab="help"; renderHelp(body); } else renderReportWriter(body); }
    else if(moreTab==="settings") renderSettings(body);
  }


  // Reads an image file, crops it to a square, and re-encodes as WebP.
  function handleImageFile(file, cb){
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        const size=300;
        const canvas=document.createElement("canvas");
        canvas.width=size; canvas.height=size;
        const ctx=canvas.getContext("2d");
        const side = Math.min(img.width,img.height);
        const sx=(img.width-side)/2, sy=(img.height-side)/2;
        ctx.drawImage(img, sx,sy,side,side, 0,0,size,size);
        canvas.toBlob(blob=>{
          const r2 = new FileReader();
          r2.onload=()=> cb(r2.result);
          r2.readAsDataURL(blob);
        }, "image/webp", 0.85);
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  }

    `);
    let newImage = null;
    wrap.querySelector("#pImage").onchange=(e)=>{
      const f = e.target.files[0];
      if(!f) return;
      handleImageFile(f, dataUrl=>{
        newImage = dataUrl;
        wrap.querySelector("#pImgPreview").innerHTML = `<img src="${dataUrl}" style="width:100%;height:100%;object-fit:cover">`;
      });
    };
    wrap.querySelector("#pConfirm").onclick=()=>{
      const name = wrap.querySelector("#pName").value.trim();
      const sku = wrap.querySelector("#pSku").value.trim();
      const shelf = wrap.querySelector("#pShelf").value.trim();
      const description = wrap.querySelector("#pDescription").value.trim();
      const price = parseFloat(wrap.querySelector("#pPrice").value)||0;
      const cost = parseFloat(wrap.querySelector("#pCost").value)||0;
      const low = parseInt(wrap.querySelector("#pLow").value)||5;
      if(!name) return alert("Enter a product name");
      const image = newImage!==null? newImage : (existing? existing.image||"" : "");
      if(isEdit){
        run("UPDATE products SET name=?,sku=?,shelf=?,price=?,cost=?,low_threshold=?,image=?,description=? WHERE id=?",[name,sku,shelf,price,cost,low,image,description,existing.id]);
        logAudit("Edit Product", name, `Price: ${currency}${price.toFixed(2)}, Cost: ${currency}${cost.toFixed(2)}, Low alert: ${low}`);
      } else {
        const stock = parseInt(wrap.querySelector("#pStock").value)||0;
        const branch = currentBranch();
        run("INSERT INTO products(name,price,stock,low_threshold,sku,branch,image,cost,created_ts,description,shelf) VALUES(?,?,?,?,?,?,?,?,?,?,?)",
          [name,price,stock,low,sku,branch,image,cost,new Date().toISOString(),description,shelf]);
        const pid = one("SELECT last_insert_rowid() as id").id;
        if(stock>0) run("INSERT INTO stock_received(ts,product_id,name,qty,note,branch,user) VALUES(?,?,?,?,?,?,?)",
          [new Date().toISOString(), pid, name, stock, "Initial stock", branch, sessionUser||""]);
        logAudit("Add Product", name, `Price: ${currency}${price.toFixed(2)}, Cost: ${currency}${cost.toFixed(2)}, Starting stock: ${stock}`);
      }
      persist(); wrap.remove(); render();
    };
    if(isEdit){
      wrap.querySelector("#pDelete").onclick=()=>{
        if(!confirm(`Delete ${existing.name}? This can't be undone.`)) return;
        run("DELETE FROM products WHERE id=?",[existing.id]);
        logAudit("Delete Product", existing.name, "");
        persist(); wrap.remove(); render();

      wrap.querySelector("#pCard").onclick=()=>{
        const latest = { ...existing, name: wrap.querySelector("#pName").value.trim()||existing.name,
          sku: wrap.querySelector("#pSku").value.trim(), price: parseFloat(wrap.querySelector("#pPrice").value)||existing.price,
          image: newImage!==null? newImage : existing.image };
        printMarketingCard(latest);
      };
    }
  }
